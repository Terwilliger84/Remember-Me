<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wichteln" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>🎄 Wichteln – Dein geheimes Los & Wunschzettel</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-soft: #27354d;
      --border: #3b4c66;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --gold: #fbbf24;
      --green: #10b981;
      --green-dark: #059669;
      --red: #ef4444;
      --blue: #38bdf8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 12px 48px;
      font-size: 16px;
      line-height: 1.45;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .hero {
      background: linear-gradient(135deg, rgba(239,68,68,0.20), rgba(16,185,129,0.18));
      border: 1.5px solid rgba(251,191,36,0.45);
      border-radius: 16px;
      padding: 15px 16px;
    }
    .hero-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.25;
      margin: 0;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }
    .chip {
      font-size: 13px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(15,23,42,0.75);
      border: 1px solid var(--border);
      color: #f1f5f9;
    }
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
    }
    .card.highlight-alert {
      border: 2px solid var(--gold);
      background: linear-gradient(180deg, rgba(251,191,36,0.16) 0%, #1e293b 100%);
    }
    .card.push-card {
      border: 2px solid var(--green);
      background: linear-gradient(180deg, rgba(16,185,129,0.18) 0%, #1e293b 100%);
    }
    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 6px;
      color: #fff;
    }
    .btn {
      border: 1.5px solid var(--border);
      background: var(--card-soft);
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      padding: 13px 16px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      transition: transform 0.08s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      border-color: var(--green);
      color: #fff;
    }
    .btn.gold {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-color: #fbbf24;
      color: #fff;
    }
    .btn.small {
      width: auto;
      font-size: 13px;
      padding: 7px 12px;
      font-weight: 700;
    }
    .member-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 12px;
    }
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 15px;
      border-radius: 12px;
      background: var(--card-soft);
      border: 1.5px solid var(--border);
      cursor: pointer;
      font-size: 16px;
    }
    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 6px;
    }
    .input, .textarea {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
    }
    .textarea { min-height: 92px; resize: vertical; }
    .input:focus, .textarea:focus { outline: none; border-color: var(--blue); }
    .pin-input {
      font-size: 26px;
      letter-spacing: 10px;
      text-align: center;
      font-weight: 800;
    }
    .gift-banner {
      text-align: center;
      padding: 18px 14px;
      border-radius: 14px;
      background: radial-gradient(circle, rgba(251,191,36,0.20) 0%, rgba(15,23,42,0.85) 80%);
      border: 2px dashed rgba(251,191,36,0.65);
    }
    .target-name {
      font-size: 28px;
      font-weight: 900;
      color: var(--gold);
      margin: 6px 0 4px;
      line-height: 1.2;
    }
    .wish-box {
      background: rgba(15,23,42,0.75);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      margin-top: 12px;
      text-align: left;
      font-size: 16px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }
    .bubble {
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 15.5px;
      line-height: 1.42;
      word-break: break-word;
    }
    .bubble.me {
      background: rgba(16,185,129,0.22);
      border: 1.5px solid rgba(16,185,129,0.55);
      margin-left: 18px;
    }
    .bubble.them {
      background: var(--card-soft);
      border: 1.5px solid var(--gold);
      margin-right: 18px;
    }
    .bubble-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      z-index: 999;
      text-align: center;
      max-width: 92vw;
    }
    details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 0;
    }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="card" style="text-align:center; padding:32px 16px;">
      <div style="font-size:38px; margin-bottom:8px;">🎄</div>
      <div style="font-weight:800; font-size:18px;">Wichtel-Seite wird geöffnet…</div>
    </div>
  </div>
  <div id="toast-root"></div>

  <script>
    // =========================================================================
    // Pure-JS SHA-256 + Symmetrische Los-Versiegelung
    // =========================================================================
    function utf8ToBytes(str) {
      return new TextEncoder().encode(String(str || ""));
    }
    function bytesToUtf8(bytes) {
      return new TextDecoder().decode(bytes);
    }
    function sha256Bytes(asciiBytes) {
      const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      const l = asciiBytes.length;
      const bitLenHi = Math.floor((l * 8) / 0x100000000);
      const bitLenLo = (l * 8) >>> 0;
      const padLen = ((l + 9 + 63) >> 6) << 6;
      const m = new Uint8Array(padLen);
      m.set(asciiBytes);
      m[l] = 0x80;
      const dv = new DataView(m.buffer);
      dv.setUint32(padLen - 8, bitLenHi, false);
      dv.setUint32(padLen - 4, bitLenLo, false);
      const W = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let i = 0; i < padLen; i += 64) {
        for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4, false);
        for (let t = 16; t < 64; t++) {
          const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
          const s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
          const ch = (e & f) ^ (~e & g);
          const temp1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
          const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + temp1) >>> 0;
          d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
        }
        H = [(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
      }
      const out = new Uint8Array(32);
      const outDv = new DataView(out.buffer);
      for (let i = 0; i < 8; i++) outDv.setUint32(i * 4, H[i], false);
      return out;
    }
    function sha256Hex(str) {
      return Array.from(sha256Bytes(utf8ToBytes(str))).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    function unsealWichtelBox(cipherB64, roundId, pid) {
      const binStr = atob(String(cipherB64 || "").trim());
      const cipher = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) cipher[i] = binStr.charCodeAt(i);
      const plain = new Uint8Array(cipher.length);
      let blockIdx = 0;
      for (let offset = 0; offset < cipher.length; offset += 32) {
        const keyBlock = sha256Bytes(utf8ToBytes(`RM_WICHTEL_V1:${roundId}:${pid}:${blockIdx++}`));
        const chunk = Math.min(32, cipher.length - offset);
        for (let j = 0; j < chunk; j++) plain[offset + j] = cipher[offset + j] ^ keyBlock[j];
      }
      return JSON.parse(bytesToUtf8(plain));
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    // =========================================================================
    // Server & Appwrite Verbindung
    // =========================================================================
    const PORTAL_ORIGIN = location.hostname.endsWith(".workers.dev")
      ? location.origin
      : "https://wichteln.kirchnerapp.workers.dev";
    const WORKER_PROXY_BASE = `${PORTAL_ORIGIN}/v1`;
    const FALLBACK_APPWRITE_BASE = "https://fra.cloud.appwrite.io/v1";
    const PROJECT_ID = "6981eb5a00304f3ed7a3";
    const DB_ID = "remember_me_db";
    const COL_ID = "wichteln";
    const DEFAULT_VAPID_PUBLIC_KEY = "BPSNSFGH96cugWU6gCB6-I9XR255jVK_Of4sjgOzFB6BltxySWnic1wvU6xQmhHwPZjZ8_EdILafRwnIs0bhjFE";

    async function apiCall(method, path, body) {
      const bases = [WORKER_PROXY_BASE, FALLBACK_APPWRITE_BASE];
      let lastErr = null;
      for (const base of bases) {
        try {
          const res = await fetch(base + path, {
            method,
            headers: {
              "Content-Type": "application/json",
              "x-appwrite-project": PROJECT_ID
            },
            body: body ? JSON.stringify(body) : undefined
          });
          if (res.status === 204) return null;
          const json = await res.json();
          if (!res.ok) throw new Error(json.message || `HTTP ${res.status}`);
          return json;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("Netzwerkfehler");
    }

    async function triggerServerPushEvent(payload) {
      try {
        await fetch(`${PORTAL_ORIGIN}/api/push-event`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (_) {}
    }

    function qEqual(attr, val) {
      return encodeURIComponent(JSON.stringify({ method: "equal", attribute: attr, values: [val] }));
    }
    function qLimit(n) {
      return encodeURIComponent(JSON.stringify({ method: "limit", values: [n] }));
    }
    function qOrderDesc(attr) {
      return encodeURIComponent(JSON.stringify({ method: "orderDesc", attribute: attr }));
    }
    function qSelect(attrs) {
      return encodeURIComponent(JSON.stringify({ method: "select", values: attrs }));
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDeDate(iso) {
      if (!iso || iso.length < 10) return iso || "";
      return `${iso.slice(8, 10)}.${iso.slice(5, 7)}.${iso.slice(0, 4)}`;
    }

    function showToast(msg) {
      const root = document.getElementById("toast-root");
      root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
      setTimeout(() => { root.innerHTML = ""; }, 3200);
    }

    // =========================================================================
    // Portal State (1-Seiten-Ansicht ohne Tabs!)
    // =========================================================================
    const params = new URLSearchParams(location.search);
    const state = {
      roundId: (params.get("r") || "").trim(),
      urlPid: parseInt(params.get("p") || "0", 10) || 0,
      urlToken: (params.get("k") || "").trim(),
      openedViaDirectLink: Boolean((parseInt(params.get("p") || "0", 10) || 0) > 0 && (params.get("k") || "").trim()),
      authToken: (params.get("k") || "").trim(),
      authPinHash: "",
      roundMeta: null,
      partsByPid: new Map(),
      unlockedPid: 0,
      selectedLoginPid: 0,
      assignment: null,
      outMessages: [],
      inMessages: [],
      wishDraft: null,
      pushStatus: "checking", // "checking" | "prompt" | "active" | "denied" | "ios-homescreen" | "unsupported"
      pushBusy: false,
      swReg: null,
      lastCloudSig: "",
      lastPollTs: 0,
      errorMsg: ""
    };

    function storageKeyForRound(rid) {
      return `rm_wichtel_auth_${rid}`;
    }

    function buildPersonalOpenPath() {
      if (state.roundId && state.unlockedPid && state.authToken) {
        return `/?r=${encodeURIComponent(state.roundId)}&p=${state.unlockedPid}&k=${encodeURIComponent(state.authToken)}`;
      }
      return `/?r=${encodeURIComponent(state.roundId)}`;
    }

    // =========================================================================
    // Web-Push (Handy-Meldungen) Initialisierung & Aktivierung
    // =========================================================================
    function isIosBrowserWithoutStandalone() {
      const ua = navigator.userAgent || "";
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      return isIOS && !isStandalone;
    }

    async function initServiceWorkerAndPushState() {
      if (!("serviceWorker" in navigator)) {
        state.pushStatus = isIosBrowserWithoutStandalone() ? "ios-homescreen" : "unsupported";
        return;
      }
      try {
        const reg = await navigator.serviceWorker.register("/sw.js");
        state.swReg = reg;
        navigator.serviceWorker.addEventListener("message", (ev) => {
          if (ev.data && ev.data.type === "WICHTEL_PUSH_RECEIVED") {
            loadRoundData(true, true);
          }
        });
        if (!("PushManager" in window) || !("Notification" in window)) {
          state.pushStatus = isIosBrowserWithoutStandalone() ? "ios-homescreen" : "unsupported";
          renderPreservingInputs();
          return;
        }
        if (Notification.permission === "denied") {
          state.pushStatus = "denied";
          renderPreservingInputs();
          return;
        }
        const existingSub = await reg.pushManager.getSubscription();
        if (existingSub && Notification.permission === "granted") {
          state.pushStatus = "active";
          renderPreservingInputs();
          if (state.unlockedPid) {
            syncPushSubscriptionToServer(existingSub, false);
          }
        } else {
          state.pushStatus = "prompt";
          renderPreservingInputs();
        }
      } catch (_) {
        state.pushStatus = isIosBrowserWithoutStandalone() ? "ios-homescreen" : "unsupported";
        renderPreservingInputs();
      }
    }

    async function syncPushSubscriptionToServer(subObj, sendWelcome) {
      if (!subObj || !state.roundId || !state.unlockedPid) return false;
      try {
        const subJson = subObj.toJSON();
        const res = await fetch(`${PORTAL_ORIGIN}/api/push-subscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            roundId: state.roundId,
            pid: state.unlockedPid,
            authToken: state.authToken || "",
            pinHash: state.authPinHash || "",
            subscription: subJson,
            openPath: buildPersonalOpenPath(),
            sendWelcome: Boolean(sendWelcome)
          })
        });
        const data = await res.json().catch(() => ({}));
        return Boolean(res.ok && data && data.ok);
      } catch (_) {
        return false;
      }
    }

    async function enableHandyNotifications() {
      if (state.pushBusy) return;
      if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
        state.pushStatus = isIosBrowserWithoutStandalone() ? "ios-homescreen" : "unsupported";
        renderPreservingInputs();
        return;
      }
      state.pushBusy = true;
      renderPreservingInputs();
      try {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          state.pushStatus = perm === "denied" ? "denied" : "prompt";
          state.pushBusy = false;
          renderPreservingInputs();
          showToast("Bitte im Handy-Fenster auf „Zulassen“ tippen!");
          return;
        }
        const reg = state.swReg || (await navigator.serviceWorker.register("/sw.js"));
        state.swReg = reg;
        await navigator.serviceWorker.ready;

        let vapidKey = DEFAULT_VAPID_PUBLIC_KEY;
        try {
          const cfgRes = await fetch(`${PORTAL_ORIGIN}/api/push-config`);
          const cfg = await cfgRes.json();
          if (cfg && cfg.publicKey) vapidKey = cfg.publicKey;
        } catch (_) {}

        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidKey)
          });
        }
        const ok = await syncPushSubscriptionToServer(sub, true);
        state.pushStatus = ok ? "active" : "prompt";
        state.pushBusy = false;
        renderPreservingInputs();
        if (ok) {
          showToast("✅ Super! Handy-Meldungen sind jetzt eingeschaltet!");
        } else {
          showToast("⚠️ Konnte Meldung gerade nicht speichern – bitte nochmal tippen.");
        }
      } catch (e) {
        state.pushBusy = false;
        state.pushStatus = Notification.permission === "denied" ? "denied" : "prompt";
        renderPreservingInputs();
        showToast("⚠️ Aktivierung nicht möglich: " + (e.message || e));
      }
    }

    async function sendTestHandyNotification() {
      if (!state.roundId || !state.unlockedPid) return;
      showToast("🔔 Test-Meldung wird an dein Handy gesendet…");
      await triggerServerPushEvent({
        roundId: state.roundId,
        eventType: "TEST_SELF",
        fromPid: state.unlockedPid
      });
    }

    // =========================================================================
    // Daten laden & speichern
    // =========================================================================
    async function loadRoundData(silent = false, forceFull = false) {
      if (!state.roundId) {
        state.errorMsg = "Kein Runden-Code im Link gefunden. Bitte tippe auf den vollständigen Link aus deiner Einladung!";
        render();
        return;
      }
      try {
        if (silent && !forceFull && state.roundMeta && state.lastCloudSig) {
          try {
            const headRes = await apiCall(
              "GET",
              `/databases/${DB_ID}/collections/${COL_ID}/documents?queries[]=${qEqual("roundId", state.roundId)}&queries[]=${qOrderDesc("$updatedAt")}&queries[]=${qLimit(1)}&queries[]=${qSelect(["$id", "$updatedAt"])}`
            );
            const liveTotal = typeof headRes?.total === "number" ? headRes.total : -1;
            const liveUp = headRes?.documents?.[0]?.$updatedAt || "";
            const liveSig = `${liveTotal}|${liveUp}`;
            if (liveTotal >= 0 && liveSig === state.lastCloudSig) {
              state.lastPollTs = Date.now();
              return;
            }
          } catch (_) {}
        }

        const docsRes = await apiCall(
          "GET",
          `/databases/${DB_ID}/collections/${COL_ID}/documents?queries[]=${qEqual("roundId", state.roundId)}&queries[]=${qLimit(250)}`
        );
        const docs = docsRes.documents || [];
        let maxUpdatedAt = "";
        for (const d of docs) {
          if (d && d.$updatedAt && d.$updatedAt > maxUpdatedAt) maxUpdatedAt = d.$updatedAt;
        }
        const repTotal = typeof docsRes.total === "number" ? docsRes.total : docs.length;
        state.lastCloudSig = `${repTotal}|${maxUpdatedAt}`;
        state.lastPollTs = Date.now();

        const roundDoc = docs.find(d => d.docType === "ROUND");
        if (!roundDoc) {
          state.errorMsg = "Diese Wichtelrunde wurde nicht gefunden oder wurde bereits beendet.";
          render();
          return;
        }
        state.roundMeta = JSON.parse(roundDoc.payload);
        state.partsByPid.clear();
        const allMsgs = [];
        for (const d of docs) {
          if (d.docType === "PART") {
            const pObj = JSON.parse(d.payload);
            pObj._docId = d.$id;
            state.partsByPid.set(Number(pObj.pid), pObj);
          } else if (d.docType === "MSG") {
            const mObj = JSON.parse(d.payload);
            mObj._docId = d.$id;
            mObj._slotKey = d.slotKey;
            allMsgs.push(mObj);
          }
        }

        if (!state.unlockedPid) {
          if (state.urlPid > 0 && state.urlToken) {
            const cand = state.partsByPid.get(state.urlPid);
            if (cand && cand.tokenHash && sha256Hex(state.urlToken) === cand.tokenHash) {
              state.authToken = state.urlToken;
              completeUnlock(cand);
              localStorage.setItem(storageKeyForRound(state.roundId), JSON.stringify({ pid: cand.pid, token: state.urlToken }));
            }
          }
          if (!state.unlockedPid) {
            try {
              const saved = JSON.parse(localStorage.getItem(storageKeyForRound(state.roundId)) || "null");
              if (saved && saved.pid) {
                const cand = state.partsByPid.get(Number(saved.pid));
                if (cand) {
                  const okToken = saved.token && cand.tokenHash && sha256Hex(saved.token) === cand.tokenHash;
                  const okPin = saved.pinHash && cand.pinHash && saved.pinHash === cand.pinHash;
                  if (okToken || okPin) {
                    state.authToken = okToken ? saved.token : "";
                    state.authPinHash = okPin ? saved.pinHash : "";
                    if (okToken) state.openedViaDirectLink = true;
                    completeUnlock(cand);
                  }
                }
              }
            } catch (_) {}
          }
        } else {
          const refreshedMe = state.partsByPid.get(state.unlockedPid);
          if (refreshedMe) {
            state.assignment = unsealWichtelBox(refreshedMe.sealedBox, state.roundId, refreshedMe.pid);
            // Aktualisiere Wunsch-Entwurf nur, wenn Nutzer gerade nicht tippt
            const wEl = document.getElementById("w-text");
            if (!wEl || document.activeElement !== wEl) {
              state.wishDraft = {
                wishText: refreshedMe.wishText || "",
                noGos: refreshedMe.noGos || "",
                address: refreshedMe.address || "",
                wishlistUrl: refreshedMe.wishlistUrl || "",
                extraWishUrls: Array.isArray(refreshedMe.extraWishUrls) ? [...refreshedMe.extraWishUrls] : []
              };
            }
          }
        }

        if (state.unlockedPid && state.assignment) {
          state.outMessages = allMsgs
            .filter(m => m._slotKey === state.assignment.outThreadId)
            .sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));
          state.inMessages = allMsgs
            .filter(m => m._slotKey === state.assignment.inThreadId)
            .sort((a, b) => String(a.ts || "").localeCompare(String(b.ts || "")));

          markIncomingMessagesReadInBackground();

          if (state.swReg && state.pushStatus === "active") {
            state.swReg.pushManager.getSubscription().then(sub => {
              if (sub) syncPushSubscriptionToServer(sub, false);
            }).catch(() => {});
          }
        }

        if (!silent) render();
        else renderPreservingInputs();
      } catch (e) {
        if (!silent) {
          state.errorMsg = "Verbindungsfehler: " + (e.message || e);
          render();
        }
      }
    }

    function completeUnlock(partObj) {
      state.unlockedPid = Number(partObj.pid);
      state.assignment = unsealWichtelBox(partObj.sealedBox, state.roundId, partObj.pid);
      if (!partObj.openedAt) {
        partObj.openedAt = new Date().toISOString();
        saveParticipantDoc(partObj).catch(() => {});
      }
      state.wishDraft = {
        wishText: partObj.wishText || "",
        noGos: partObj.noGos || "",
        address: partObj.address || "",
        wishlistUrl: partObj.wishlistUrl || "",
        extraWishUrls: Array.isArray(partObj.extraWishUrls) ? [...partObj.extraWishUrls] : []
      };
    }

    async function saveParticipantDoc(partObj) {
      const copy = { ...partObj };
      const docId = copy._docId || `p_${state.roundId}_${copy.pid}`;
      delete copy._docId;
      const savedDoc = await apiCall("PATCH", `/databases/${DB_ID}/collections/${COL_ID}/documents/${docId}`, {
        data: {
          roundId: state.roundId,
          docType: "PART",
          slotKey: `P_${copy.pid}`,
          payload: JSON.stringify(copy)
        }
      });
      if (savedDoc && savedDoc.$updatedAt && state.lastCloudSig) {
        state.lastCloudSig = `${state.lastCloudSig.split("|")[0]}|${savedDoc.$updatedAt}`;
      }
      partObj._docId = docId;
      state.partsByPid.set(Number(partObj.pid), partObj);
    }

    async function submitMemberPin() {
      const part = state.partsByPid.get(state.selectedLoginPid);
      if (!part) return;
      const p1El = document.getElementById("pin-1");
      const p2El = document.getElementById("pin-2");
      const pin1 = (p1El ? p1El.value : "").trim();
      if (pin1.length < 4) {
        showToast("Bitte mindestens 4 Ziffern eingeben!");
        return;
      }
      const hash = sha256Hex(`PIN:${state.roundId}:${part.pid}:${pin1}`);
      if (!part.pinHash) {
        const pin2 = (p2El ? p2El.value : "").trim();
        if (pin1 !== pin2) {
          showToast("Die beiden Eingaben stimmen nicht überein!");
          return;
        }
        part.pinHash = hash;
        if (!part.openedAt) part.openedAt = new Date().toISOString();
        await saveParticipantDoc(part);
        state.authPinHash = hash;
        localStorage.setItem(storageKeyForRound(state.roundId), JSON.stringify({ pid: part.pid, pinHash: hash }));
        completeUnlock(part);
        await loadRoundData(false);
      } else {
        if (hash !== part.pinHash) {
          showToast("❌ Falsche PIN! (Der Gruppenleiter kann sie bei Bedarf zurücksetzen)");
          return;
        }
        state.authPinHash = hash;
        localStorage.setItem(storageKeyForRound(state.roundId), JSON.stringify({ pid: part.pid, pinHash: hash }));
        completeUnlock(part);
        await loadRoundData(false);
      }
    }

    function syncWishDraftFromInputs() {
      if (!state.wishDraft) return;
      const wEl = document.getElementById("w-text");
      const nEl = document.getElementById("w-nogos");
      const aEl = document.getElementById("w-addr");
      const uEl = document.getElementById("w-url");
      if (wEl) state.wishDraft.wishText = wEl.value;
      if (nEl) state.wishDraft.noGos = nEl.value;
      if (aEl) state.wishDraft.address = aEl.value;
      if (uEl) state.wishDraft.wishlistUrl = uEl.value;
    }

    async function saveMyWishlist() {
      syncWishDraftFromInputs();
      const me = state.partsByPid.get(state.unlockedPid);
      if (!me || !state.wishDraft) return;
      me.wishText = state.wishDraft.wishText.trim();
      me.noGos = state.wishDraft.noGos.trim();
      me.address = state.wishDraft.address.trim();
      me.wishlistUrl = state.wishDraft.wishlistUrl.trim();
      me.wishUpdatedAt = new Date().toISOString();
      await saveParticipantDoc(me);
      showToast("✅ Dein Wunschzettel wurde gespeichert!");
      renderPreservingInputs();

      // Automatische Handy-Meldung an den geheimen Wichtel schicken!
      await triggerServerPushEvent({
        roundId: state.roundId,
        eventType: "WISH_UPDATED",
        fromPid: me.pid
      });
    }

    async function sendChatMessage(direction) {
      // direction: "toTarget" (ich als Wichtel an meine gezogene Person) | "toSanta" (ich an meinen geheimen Wichtel)
      const isToTarget = direction === "toTarget";
      const inpId = isToTarget ? "msg-to-target" : "msg-to-santa";
      const inp = document.getElementById(inpId);
      if (!inp || !state.assignment) return;
      const text = inp.value.trim();
      if (!text) {
        showToast("Bitte zuerst eine Nachricht eintippen!");
        inp.focus();
        return;
      }
      inp.value = "";

      const slotKey = isToTarget ? state.assignment.outThreadId : state.assignment.inThreadId;
      const fromRole = isToTarget ? "SANTA" : "TARGET";
      const msgPayload = {
        fromRole,
        text,
        ts: new Date().toISOString(),
        readByTarget: !isToTarget,
        readBySanta: isToTarget
      };
      const docId = `m_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      await apiCall("POST", `/databases/${DB_ID}/collections/${COL_ID}/documents`, {
        documentId: docId,
        data: {
          roundId: state.roundId,
          docType: "MSG",
          slotKey,
          payload: JSON.stringify(msgPayload)
        }
      });

      showToast("📨 Nachricht wurde anonym gesendet!");
      await loadRoundData(true, true);

      // Automatische Handy-Meldung direkt an das Handy des Empfängers!
      await triggerServerPushEvent({
        roundId: state.roundId,
        eventType: "NEW_MESSAGE",
        slotKey,
        fromRole
      });
    }

    function markIncomingMessagesReadInBackground() {
      if (!state.assignment) return;
      for (const m of state.outMessages) {
        if (m.fromRole === "TARGET" && !m.readBySanta && m._docId) {
          m.readBySanta = true;
          const clean = { fromRole: m.fromRole, text: m.text, ts: m.ts, readByTarget: m.readByTarget, readBySanta: true };
          apiCall("PATCH", `/databases/${DB_ID}/collections/${COL_ID}/documents/${m._docId}`, {
            data: { roundId: state.roundId, docType: "MSG", slotKey: m._slotKey, payload: JSON.stringify(clean) }
          }).catch(() => {});
        }
      }
      for (const m of state.inMessages) {
        if (m.fromRole === "SANTA" && !m.readByTarget && m._docId) {
          m.readByTarget = true;
          const clean = { fromRole: m.fromRole, text: m.text, ts: m.ts, readByTarget: true, readBySanta: m.readBySanta };
          apiCall("PATCH", `/databases/${DB_ID}/collections/${COL_ID}/documents/${m._docId}`, {
            data: { roundId: state.roundId, docType: "MSG", slotKey: m._slotKey, payload: JSON.stringify(clean) }
          }).catch(() => {});
        }
      }
    }

    function logoutSwitchPerson() {
      localStorage.removeItem(storageKeyForRound(state.roundId));
      state.urlPid = 0;
      state.urlToken = "";
      state.authToken = "";
      state.authPinHash = "";
      state.openedViaDirectLink = false;
      state.unlockedPid = 0;
      state.selectedLoginPid = 0;
      state.assignment = null;
      render();
    }

    function isRoundRevealedForAll() {
      if (!state.roundMeta) return false;
      if (state.roundMeta.forceRevealed) return true;
      const rev = (state.roundMeta.revealDateIso || "").trim();
      if (!rev || rev.length < 10) return false;
      const today = new Date().toISOString().slice(0, 10);
      return today >= rev;
    }

    function renderPreservingInputs() {
      const ids = ["w-text", "w-url", "w-nogos", "w-addr", "msg-to-target", "msg-to-santa"];
      const savedVals = {};
      const activeId = document.activeElement ? document.activeElement.id : "";
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el) savedVals[id] = el.value;
      }
      syncWishDraftFromInputs();
      render();
      for (const [id, val] of Object.entries(savedVals)) {
        const nextEl = document.getElementById(id);
        if (nextEl && val !== undefined && (id.startsWith("msg-") || activeId === id)) {
          nextEl.value = val;
        }
      }
      if (activeId) {
        const focusEl = document.getElementById(activeId);
        if (focusEl) focusEl.focus();
      }
    }

          <div class="card" style="padding:12px 15px; border-color:rgba(16,185,129,0.6); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">

              ✅ Handy-Meldungen sind eingeschaltet
            </div>
            <button class="btn small" onclick="sendTestHandyNotification()">🔔 Testen</button>
          </div>

          <div class="card push-card">
            <div class="section-title">🔔 Automatische Handy-Meldungen (iPhone)</div>
            <div style="font-size:15px; color:#e2e8f0;">
              Damit dein iPhone bei neuen Nachrichten klingelt, tippe einmal unten im Browser auf <b>Teilen ⬆️</b> und wähle <b>„Zum Home-Bildschirm“</b>. Öffne danach das 🎄-Symbol auf deinem Bildschirm.

            Tippe einmal auf den grünen Knopf und wähle <b>„Zulassen“</b> – dann meldet sich dein Handy automatisch mit Ton, sobald eine Frage oder ein Wunsch reinkommt (auch wenn diese Seite geschlossen ist).

    function renderMessagesBubbles(msgs, perspective) {
      // perspective: "asSanta" (ich schreibe mit meiner gezogenen Person) | "asTarget" (mein geheimer Wichtel schreibt mir)
      if (!msgs || msgs.length === 0) return "";
      const target = state.assignment ? state.partsByPid.get(Number(state.assignment.targetPid)) : null;
      const targetFirst = (target ? target.name : (state.assignment ? state.assignment.targetName : "")).split(" ")[0] || "Wichtelkind";

      return `
        <div class="msg-list">
          ${msgs.map(m => {
            const mine = perspective === "asSanta" ? (m.fromRole === "SANTA") : (m.fromRole === "TARGET");
            const sender = mine
              ? "Ich"
              : (perspective === "asSanta" ? esc(targetFirst) : "🎅 Dein geheimer Wichtel");
            const timeStr = m.ts
              ? new Date(m.ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
              : "";
            return `
              <div class="bubble ${mine ? "me" : "them"}">
                <div>${esc(m.text).replace(/\n/g, "<br/>")}</div>
                <div class="bubble-meta"><b>${sender}</b> • ${esc(timeStr)}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

        if (state.selectedLoginPid) {

                  <div style="margin-top:6px;">
                    <a href="${esc(u.startsWith("http") ? u : "https://" + u)}" target="_blank" rel="noopener" style="font-weight:800; font-size:15.5px;">
                      🛒 ${allTargetUrls.length === 1 ? "Wunschlisten-Link öffnen ↗" : `Wunsch-Link ${i + 1} öffnen ↗`}
                    </a>
                  </div>
                `).join("")}
                ${target.noGos ? `<div style="margin-top:8px; color:#fde68a;"><b>🚫 Bitte NICHT:</b> ${esc(target.noGos)}</div>` : ""}
                ${target.address ? `<div style="margin-top:6px; color:var(--muted);"><b>📦 Größe / Adresse:</b> ${esc(target.address)}</div>` : ""}
              ` : `
                <div style="color:var(--muted);">
                  <b>${esc(targetFirstName)}</b> hat bisher noch keinen Wunsch eingetragen.<br/>
                  <span style="font-size:14px;">Sobald ${esc(targetFirstName)} etwas einträgt, erscheint es automatisch hier!</span>
                </div>
              `}
            </div>
          </div>

          <div style="border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:9px;">
            <div style="font-size:16.5px; font-weight:800; color:#fff;">
              💬 Anonyme Frage an ${esc(targetFirstName)}
            </div>
            <div style="font-size:14px; color:var(--muted);">
              Du möchtest ${esc(targetFirstName)} etwas fragen (z. B. Größe, Farbe oder Geschmack)? Dein Name bleibt dabei 100 % geheim:
            </div>
            ${renderMessagesBubbles(state.outMessages, "asSanta")}
            <textarea id="msg-to-target" class="textarea" style="min-height:70px;" placeholder="Frage an ${esc(targetFirstName)} hier eintippen…"></textarea>
            <button class="btn" onclick="sendChatMessage('toTarget')">
              📨 Frage anonym an ${esc(targetFirstName)} senden
            </button>
          </div>
        </div>
      `;

      // Kasten 2: Eigener Wunschzettel (nur 1 klares Hauptfeld + Speichern!)
      const myOwnWishHtml = `
        <div class="card" style="display:flex; flex-direction:column; gap:11px;">
          <div class="section-title">📝 Dein eigener Wunschzettel</div>
          <div style="font-size:14.5px; color:var(--muted);">
            Schreib hier einfach rein, worüber du dich selbst freuen würdest. Nur die Person, die dich gezogen hat, kann das lesen:
          </div>
          <textarea id="w-text" class="textarea" placeholder="z. B. Spannendes Buch, dunkle Schokolade, warme Socken Gr. 42…">${esc(wd.wishText)}</textarea>
          <details ${hasExtraFieldsFilled ? "open" : ""}>
            <summary>Optional: Internet-Link oder Adresse ergänzen</summary>
            <div style="display:flex; flex-direction:column; gap:9px; margin-top:8px;">
              <div>
                <label class="field-label">Link zu einem Wunsch / Amazon-Liste (optional)</label>
                <input id="w-url" class="input" placeholder="https://..." value="${esc(wd.wishlistUrl)}" />
              </div>
              <div>
                <label class="field-label">Bitte NICHT schenken / Allergien (optional)</label>
                <input id="w-nogos" class="input" placeholder="z. B. Keine Nüsse…" value="${esc(wd.noGos)}" />
              </div>
              <div>
                <label class="field-label">Größe oder Postadresse (optional)</label>
                <input id="w-addr" class="input" placeholder="z. B. Größe L / Musterstr. 1…" value="${esc(wd.address)}" />
              </div>
            </div>
          </details>
          <button class="btn primary" onclick="saveMyWishlist()">
            ✓ Meinen Wunsch speichern
          </button>
        </div>
      `;

      // Offizielle Auflösung (falls freigegeben)
      let revealAllHtml = "";
      if (isRoundRevealedForAll()) {
        const allPairs = [...state.partsByPid.values()].map(p => {
          try {
            const b = unsealWichtelBox(p.sealedBox, state.roundId, p.pid);
            return { giver: p.name, receiver: b.targetName };
          } catch {
            return null;
          }
        }).filter(Boolean);
        revealAllHtml = `
          <div class="card highlight-alert">
            <div class="section-title" style="color:var(--gold);">🎉 Offizielle Wichtel-Auflösung</div>
            <div style="display:flex; flex-direction:column; gap:7px; margin-top:8px;">
              ${allPairs.map(pr => `
                <div style="background:var(--card-soft); padding:10px 12px; border-radius:10px; font-size:15.5px;">
                  🎅 <b>${esc(pr.giver)}</b> ➔ 🎁 <b>${esc(pr.receiver)}</b>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      const switchFooterHtml = !state.openedViaDirectLink
        ? `<div style="text-align:center; margin-top:4px;"><button class="btn small" style="background:transparent; color:var(--muted); border:none;" onclick="logoutSwitchPerson()">Nicht ${esc(me.name)}? Namen wechseln</button></div>`
        : "";

      app.innerHTML =
        headerHtml +
        renderPushNotificationBox() +
        (hasSantaConversation ? santaBoxHtml : "") +
        drawnAndTargetWishHtml +
        myOwnWishHtml +
        (!hasSantaConversation ? santaBoxHtml : "") +
        revealAllHtml +
        switchFooterHtml;
    }

    initServiceWorkerAndPushState();
    loadRoundData(false, true);

    // Sparsamer 1-Read-Hintergrundcheck alle 45s falls Seite offen ist
    setInterval(() => {
      if (document.visibilityState !== "visible" || !state.roundId || !state.unlockedPid) return;
      if (Date.now() - (state.lastPollTs || 0) >= 45000) {
        loadRoundData(true, false);
      }
    }, 20000);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.roundId && state.unlockedPid) {
        loadRoundData(true, false);
      }
    });
  </script>
</body>
</html>
