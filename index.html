<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remember Me v1.0.2 – Interaktiver Testserver</title>
  <style>
    :root {
      --bg-slate: #0F172A;
      --card-slate: #1E293B;
      --border-slate: #334155;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent-steel: #38BDF8;
      --warn-amber: #F59E0B;
      --warn-bg: #3B2F1E;
      --warn-text: #FDE68A;
      --danger: #EF4444;
      --success: #22C55E;
      --partner-rose: #F43F5E;
      --tree-green: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070B14;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .testbench-header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
    }

    .testbench-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .testbench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .testbench-layout {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .testbench-layout {
        grid-template-columns: 1fr;
      }
    }

    .phone-frame {
      background: var(--bg-slate);
      border: 2px solid var(--border-slate);
      border-radius: 18px;
      padding: 14px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .compact-btn {
      background: #334155;
      color: var(--text-primary);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .compact-btn:hover {
      background: #475569;
      border-color: var(--accent-steel);
    }

    .compact-btn.primary {
      background: #0284C7;
      border-color: var(--accent-steel);
    }

    .compact-btn.danger {
      background: #7F1D1D;
      border-color: var(--danger);
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .nav-tab {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-tab.active {
      background: #334155;
      color: var(--text-primary);
      border-color: var(--accent-steel);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 12px;
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .person-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .person-name-link {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-steel);
      cursor: pointer;
    }

    .person-name-link:hover {
      text-decoration: underline;
    }

    .badge-app {
      font-size: 11px;
      color: var(--accent-steel);
      background: rgba(56, 189, 248, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .badge-nophone {
      font-size: 11px;
      color: var(--warn-amber);
      background: rgba(245, 158, 11, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .person-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .person-meta {
      font-size: 11px;
      margin-top: 4px;
    }

    .meta-muted { color: var(--text-muted); }
    .meta-accent { color: var(--accent-steel); }
    .meta-secondary { color: var(--text-secondary); }

    /* Stammbaum Styles */
    .tree-container {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 100%;
      overflow-x: auto;
      padding: 2px 0;
    }

    .tree-node {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 5px 8px;
      min-width: 72px;
      max-width: 118px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s, border-color 0.12s;
    }

    .tree-node:hover {
      transform: translateY(-1px);
      border-color: var(--accent-steel);
    }

    .tree-node.root {
      background: #1E3A5F;
      border: 1.5px solid var(--accent-steel);
    }

    .tree-node.partner {
      border-color: var(--partner-rose);
    }

    .tree-line-vertical {
      width: 2px;
      height: 14px;
      background: var(--accent-steel);
      margin: 2px 0;
    }

    .tree-branch-bar {
      height: 2px;
      background: var(--accent-steel);
      min-width: 90px;
      margin-bottom: 2px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-box {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .widget-tag {
      font-size: 10px;
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .widget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .widget-row:hover {
      background: var(--card-slate);
    }

    .widget-row-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .widget-row-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .widget-row-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      background: #1E293B;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border-slate);
    }

    .log-box {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
    }

    .log-list {
      margin-top: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }

    .log-item {
      padding: 6px 8px;
      background: var(--bg-slate);
      border-left: 3px solid var(--accent-steel);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    .modal {
      width: 100%;
      max-width: 358px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 82vh;
      max-height: 82dvh;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .field-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .field-input, .field-select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--accent-steel);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .warning-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-amber);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--warn-text);
      font-size: 12px;
      line-height: 1.4;
    }

    .modal-footer {
      position: sticky;
      bottom: -12px;
      background: var(--card-slate);
      border-top: 1px solid var(--border-slate);
      padding: 8px 0 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      z-index: 5;
    }

    .rel-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="testbench-header">
    <div class="testbench-title">
      <span class="status-dot"></span>
      <div>
        <div style="font-size: 14px; font-weight: 700;">Remember Me – Interaktiver Web-Testserver</div>
        <div style="font-size: 11px; color: var(--text-muted);">Mit automatischem Stammbaum, Beziehungs-Verwaltung, Namen-Antippen für Details & Erinnerungen</div>
      </div>
    </div>
    <div class="testbench-controls">
      <button class="compact-btn" onclick="runDailyReminderWorker()">🔔 DailyReminderWorker prüfen</button>
      <button class="compact-btn" onclick="seedSampleData()">🌱 Beispieldaten mit Stammbaum laden</button>
      <button class="compact-btn danger" onclick="resetDatabase()">🗑️ DB zurücksetzen</button>
    </div>
  </div>

  <div class="testbench-layout">
    <div class="phone-frame" id="app-root"></div>

    <div class="side-panel">
      <div class="widget-box">
        <div class="widget-header">
          <span class="widget-title">Anstehende Erinnerungen</span>
          <span class="widget-tag">Glance Homescreen-Widget</span>
        </div>
        <div id="widget-rows"></div>
      </div>

      <div class="log-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size: 13px; font-weight: 700;">System- & Intent-Protokoll</span>
          <button class="compact-btn" style="padding:2px 6px; font-size:10px;" onclick="clearLogs()">Leeren</button>
        </div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script>
    const RELATION_PRESETS = [
      "Kind von",
      "Ehe-Partner von",
      "Partner von",
      "Bruder von",
      "Schwester von",
      "Mutter von",
      "Vater von",
      "Elternteil von",
      "Oma/Opa von",
      "Enkelkind von",
      "Onkel/Tante von",
      "Cousin/Cousine von"
    ];

    function inverseRelationLabel(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return "Elternteil von";
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return "Kind von";
      if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner von";
      if (l.startsWith("partner")) return "Partner von";
      if (l.startsWith("bruder") || l.startsWith("schwester") || l.startsWith("geschwister")) return "Geschwister von";
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Enkelkind von";
      if (l.startsWith("enkel")) return "Oma/Opa von";
      if (l.startsWith("onkel") || l.startsWith("tante")) return "Neffe/Nichte von";
      if (l.startsWith("neffe") || l.startsWith("nichte")) return "Onkel/Tante von";
      if (l.startsWith("cousin")) return "Cousin/Cousine von";
      return "Verknüpft mit";
    }

    function relationGenerationStep(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return -1;
      if (l.startsWith("enkel")) return -2;
      if (l.startsWith("neffe") || l.startsWith("nichte")) return -1;
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return 1;
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return 2;
      if (l.startsWith("onkel") || l.startsWith("tante")) return 1;
      return 0;
    }

    function isPartnerRelation(label) {
      const l = (label || "").toLowerCase();
      return l.includes("partner") || l.includes("ehe");
    }

    function isSiblingRelation(label) {
      const l = (label || "").toLowerCase();
      return l.includes("bruder") || l.includes("schwester") || l.includes("geschwister");
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    function addDaysIso(baseIso, days) {
      const d = new Date(baseIso + "T00:00:00");
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function withYearIso(baseIso, year) {
      return year + baseIso.slice(4);
    }

    function daysBetween(date1Iso, date2Iso) {
      const d1 = new Date(date1Iso + "T00:00:00");
      const d2 = new Date(date2Iso + "T00:00:00");
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    const STORAGE_KEY = "rememberme_test_db_v2";
    let state = loadState();
    let activeTab = "Übersicht";
    let selectedTreeRootId = null;
    let syncStatus = `App-Code: ${state.ownPairingCode}`;
    let logs = [];

    let showCreateDialog = false;
    let detailPersonId = null;
    let popupState = null;

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      const code = "KC-ME-" + Math.floor(1000 + Math.random() * 9000);
      return {
        ownPairingCode: code,
        nextId: 10,
        persons: [],
        relations: [],
        specialEvents: [],
        directMessages: []
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString("de-DE");
      logs.unshift(`[${time}] ${msg}`);
      renderLogs();
    }

    function clearLogs() {
      logs = [];
      renderLogs();
    }

    function addBidirectionalRelation(fromId, toId, label) {
      if (!fromId || !toId || fromId === toId) return;
      const clean = label.trim();
      const existsFwd = state.relations.some(r => r.fromPersonId === fromId && r.toPersonId === toId && r.relationLabel.toLowerCase() === clean.toLowerCase());
      if (!existsFwd) {
        state.relations.push({ id: state.nextId++, fromPersonId: fromId, toPersonId: toId, relationLabel: clean, isFallbackContact: true });
      }
      const rev = inverseRelationLabel(clean);
      const existsRev = state.relations.some(r => r.fromPersonId === toId && r.toPersonId === fromId);
      if (!existsRev) {
        state.relations.push({ id: state.nextId++, fromPersonId: toId, toPersonId: fromId, relationLabel: rev, isFallbackContact: isPartnerRelation(clean) });
      }
    }

    const ContactResolver = {
      resolveTarget(person, relationsForPerson) {
        const ownPhone = (person.phone || "").trim();
        const ownEmail = (person.email || "").trim();
        const ownPeerId = (person.appPeerId || "").trim();

        if ((!person.hasNoOwnPhone && (ownPhone !== "" || ownEmail !== "")) || ownPeerId !== "") {
          const noPhoneButAppNotice = (person.hasNoOwnPhone && ownPhone === "" && ownPeerId !== "")
            ? `Hinweis: ${person.name} hat keine Handynummer, ist aber direkt per App-Code (${ownPeerId}) gekoppelt.`
            : null;
          return {
            targetPersonName: person.name,
            phone: ownPhone,
            email: ownEmail,
            appPeerId: ownPeerId,
            hasAppDirect: ownPeerId !== "",
            isRedirectedToRelative: false,
            relationDescription: null,
            warningNotice: noPhoneButAppNotice
          };
        }

        const fallbackPair = relationsForPerson.find(({ rel, target }) =>
          rel.isFallbackContact && ((target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim())
        ) || relationsForPerson.find(({ target }) =>
          (target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim()
        );

        if (fallbackPair) {
          const { rel, target: relative } = fallbackPair;
          return {
            targetPersonName: relative.name,
            phone: (relative.phone || "").trim(),
            email: (relative.email || "").trim(),
            appPeerId: "",
            hasAppDirect: false,
            isRedirectedToRelative: true,
            relationDescription: `${rel.relationLabel} ${relative.name}`,
            warningNotice: `Hinweis: ${person.name} hat keine eigene Nummer. Nachricht wird an ${relative.name} (${rel.relationLabel}) gerichtet.`
          };
        }

        return {
          targetPersonName: person.name,
          phone: "",
          email: ownEmail,
          appPeerId: "",
          hasAppDirect: false,
          isRedirectedToRelative: false,
          relationDescription: null,
          warningNotice: "Hinweis: Keine eigene Telefonnummer/E-Mail und kein erreichbarer verknüpfter Kontakt hinterlegt."
        };
      },

      daysUntilNextBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let nextBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (nextBday < today) nextBday = `${tYear + 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, nextBday);
        } catch (e) { return null; }
      },

      negativeDaysSinceLastBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let lastBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (lastBday > today) lastBday = `${tYear - 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, lastBday);
        } catch (e) { return null; }
      },

      formatPassedAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "hatte Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "hatte Geburtstag";
          const pad = n => String(n).padStart(2, "0");
          let lastYear = tParts[0];
          const thisYearBday = `${tParts[0]}-${pad(bParts[1])}-${pad(bParts[2])}`;
          if (thisYearBday > today) lastYear -= 1;
          const passedAge = Math.max(0, lastYear - bParts[0]);
          return `wurde ${passedAge}`;
        } catch (e) { return "hatte Geburtstag"; }
      },

      formatUpcomingAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "Geburtstag";
          const totalMonths = (tParts[0] - bParts[0]) * 12 + (tParts[1] - bParts[1]);
          const thisYearBday = `${tParts[0]}-${String(bParts[1]).padStart(2, "0")}-${String(bParts[2]).padStart(2, "0")}`;
          const nextYearAge = tParts[0] - bParts[0] + (thisYearBday < today ? 1 : 0);
          if (totalMonths >= 0 && totalMonths <= 23) return `${totalMonths} Mon. (wird ${nextYearAge})`;
          return `wird ${nextYearAge}`;
        } catch (e) { return "Geburtstag"; }
      },

      nextTimerDate(person, today = todayIso()) {
        if (!person.timerEnabled || person.timerInterval <= 0) return null;
        const base = person.lastContactedIso || today;
        const d = new Date(base + "T00:00:00");
        const interval = Number(person.timerInterval) || 14;
        switch (person.timerUnit) {
          case "WEEKS": d.setDate(d.getDate() + interval * 7); break;
          case "MONTHS": d.setMonth(d.getMonth() + interval); break;
          case "YEARS": d.setFullYear(d.getFullYear() + interval); break;
          default: d.setDate(d.getDate() + interval); break;
        }
        return d.toISOString().slice(0, 10);
      }
    };

          return target ? { rel, target } : null;

    function formatIsoToDdMmYyyy(iso) {
      if (!iso || !iso.trim()) return "";
      const clean = iso.trim();
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(clean)) return clean;
      if (clean.startsWith("--")) {
        const parts = clean.slice(2).split("-");
        if (parts.length === 2) return `${parts[1].padStart(2, "0")}.${parts[0].padStart(2, "0")}.`;
      }
      const parts = clean.split("-");
      return parts.length === 3 ? `${parts[2].padStart(2, "0")}.${parts[1].padStart(2, "0")}.${parts[0]}` : clean;
    }

    function normalizeDateInputToIso(input) {
      const clean = (input || "").trim();
      if (!clean) return "";
      const dotParts = clean.split(".");
      if (dotParts.length === 3 && dotParts[2].length === 4) {
        return `${dotParts[2]}-${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      if (dotParts.length >= 2 && (!dotParts[2] || dotParts[2] === "")) {
        return `--${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      const slashParts = clean.split("/");
      if (slashParts.length === 3 && slashParts[2].length === 4) {
        return `${slashParts[2]}-${slashParts[1].padStart(2, "0")}-${slashParts[0].padStart(2, "0")}`;
      }
      return clean;
    }

    function formatCompactBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const ageStr = ContactResolver.formatUpcomingAge(birthdayIso);
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      const whenStr = days === null ? "" : (days === 0 ? "heute" : (days === 1 ? "in 1 Tag" : `in ${days} Tagen`));
      return [dateStr, `${ageStr} ${whenStr}`.trim()].filter(Boolean).join("  •  ");
    }

      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const passedAgeStr = ContactResolver.formatPassedAge(birthdayIso);
      const negDays = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
      if (negDays === null) return dateStr;
      const negLabel = negDays === 0 ? "0 Tage (heute)" : (negDays === -1 ? "-1 Tag" : `${negDays} Tage`);

    function renderFamilyTreeTab() {
      if (state.persons.length === 0) return "";
      const rootPerson = state.persons.find(p => p.id === selectedTreeRootId) || state.persons[0];
      const personMap = new Map(state.persons.map(p => [p.id, p]));

      // BFS generation calculation
      const genMap = new Map();
      const queue = [rootPerson.id];
      genMap.set(rootPerson.id, 0);

      while (queue.length > 0) {
        const currId = queue.shift();
        const currGen = genMap.get(currId) || 0;

        state.relations.filter(r => r.fromPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.toPersonId) && personMap.has(rel.toPersonId)) {
            genMap.set(rel.toPersonId, currGen + relationGenerationStep(rel.relationLabel));
            queue.push(rel.toPersonId);
          }
        });
        state.relations.filter(r => r.toPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.fromPersonId) && personMap.has(rel.fromPersonId)) {
            genMap.set(rel.fromPersonId, currGen - relationGenerationStep(rel.relationLabel));
            queue.push(rel.fromPersonId);
          }
        });
      }

      function shortRelationName(rawLabel) {
        const l = (rawLabel || "").trim().toLowerCase();
        if (l.startsWith("mutter")) return "Mutter";
        if (l.startsWith("vater")) return "Vater";
        if (l.startsWith("elternteil") || l.startsWith("eltern")) return "Eltern";
        if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner";
        if (l.startsWith("partner")) return "Partner";
        if (l.startsWith("bruder")) return "Bruder";
        if (l.startsWith("schwester")) return "Schwester";
        if (l.startsWith("geschwister")) return "Geschwister";
        if (l.startsWith("kind")) return "Kind";
        if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Oma/Opa";
        if (l.startsWith("enkel")) return "Enkelkind";
        if (l.startsWith("onkel") || l.startsWith("tante")) return "Onkel/Tante";
        if (l.startsWith("neffe") || l.startsWith("nichte")) return "Neffe/Nichte";
        if (l.startsWith("cousin")) return "Cousin/Cousine";
        return rawLabel.replace(/\s+von$/i, "").trim() || "Familie";
      }

      function roleRelativeToRoot(p, genLevel) {
        if (p.id === rootPerson.id) return "Fokus";
        const directOut = state.relations.find(r => r.fromPersonId === p.id && r.toPersonId === rootPerson.id);
        if (directOut) return shortRelationName(directOut.relationLabel);
        const directIn = state.relations.find(r => r.fromPersonId === rootPerson.id && r.toPersonId === p.id);
        if (directIn) return shortRelationName(inverseRelationLabel(directIn.relationLabel));

        if (genLevel <= -2) return "Oma/Opa";
        if (genLevel >= 2) return "Enkelkind";
        if (genLevel === -1) {
          // Check if partner of a parent -> Eltern, or sibling of a parent -> Onkel/Tante
          const relToParent = state.relations.find(r =>
            r.fromPersonId === p.id && genMap.get(r.toPersonId) === -1 &&
            state.relations.some(pr =>
              (pr.fromPersonId === r.toPersonId && pr.toPersonId === rootPerson.id && relationGenerationStep(pr.relationLabel) === 1) ||
              (pr.fromPersonId === rootPerson.id && pr.toPersonId === r.toPersonId && relationGenerationStep(pr.relationLabel) === -1)
            )
          );
          if (relToParent && isPartnerRelation(relToParent.relationLabel)) return "Eltern";
          if (relToParent && isSiblingRelation(relToParent.relationLabel)) return "Onkel/Tante";
          return "Eltern";
        }
        if (genLevel === 1) {
          const isChildOfPartner = state.relations.some(r =>
            r.fromPersonId === p.id && isPartnerRelation(
              (state.relations.find(pr => pr.fromPersonId === r.toPersonId && pr.toPersonId === rootPerson.id) || {}).relationLabel || ""
            ) && relationGenerationStep(r.relationLabel) === -1
          );
          if (isChildOfPartner) return "Kind";
          return "Kind";
        }
        const anyRel = state.relations.find(r => r.fromPersonId === p.id);
        if (anyRel) return shortRelationName(anyRel.relationLabel);
        return "Familie";
      }

      function arePartnersOrCoParents(idA, idB) {
        const directRel = state.relations.find(r =>
          (r.fromPersonId === idA && r.toPersonId === idB) ||
          (r.fromPersonId === idB && r.toPersonId === idA)
        );
        if (directRel && isPartnerRelation(directRel.relationLabel)) return true;
        // Check if they share a common child
        const childrenOfA = state.relations
          .filter(r => r.toPersonId === idA && relationGenerationStep(r.relationLabel) === -1)
          .map(r => r.fromPersonId);
        return childrenOfA.some(cid =>
          state.relations.some(r => r.fromPersonId === cid && r.toPersonId === idB && relationGenerationStep(r.relationLabel) === -1)
        );
      }

      // Order members in a generation so parents / partners sit directly side-by-side (nebeneinander)
      function orderRowMembers(members, genLevel) {
        const visited = new Set();
        const ordered = [];
        const sortedSeed = [...members].sort((a, b) => {
          if (a.id === rootPerson.id) return -1;
          if (b.id === rootPerson.id) return 1;
          const aRole = roleRelativeToRoot(a, genLevel);
          const bRole = roleRelativeToRoot(b, genLevel);
          const aIsParent = aRole === "Eltern" || aRole === "Mutter" || aRole === "Vater";
          const bIsParent = bRole === "Eltern" || bRole === "Mutter" || bRole === "Vater";
          if (aIsParent && !bIsParent) return -1;
          if (!aIsParent && bIsParent) return 1;
          return a.name.localeCompare(b.name);
        });

        for (const m of sortedSeed) {
          if (visited.has(m.id)) continue;
          visited.add(m.id);
          ordered.push(m);
          // Immediately place partner / co-parent next to this person
          for (const candidate of members) {
            if (!visited.has(candidate.id) && arePartnersOrCoParents(m.id, candidate.id)) {
              visited.add(candidate.id);
              ordered.push(candidate);
            }
          }
        }
        return ordered;
      }

      const levelsMap = new Map();
      for (const [pid, gen] of genMap.entries()) {
        if (!levelsMap.has(gen)) levelsMap.set(gen, []);
        levelsMap.get(gen).push(personMap.get(pid));
      }
      const sortedLevels = [...levelsMap.keys()].sort((a, b) => a - b);

      const focusChips = state.persons.map(p => `
        <button class="compact-btn ${p.id === rootPerson.id ? 'primary' : ''}" style="padding:3px 7px; font-size:11px;" onclick="selectedTreeRootId=${p.id}; renderPhoneApp();">
          ${escapeHtml(p.name)}
        </button>
      `).join("");

      const levelsHtml = sortedLevels.map((lvl, idx) => {
        const members = orderRowMembers(levelsMap.get(lvl) || [], lvl);
        const nodesHtml = members.map((m, mIdx) => {
          const isRoot = m.id === rootPerson.id;
          const role = roleRelativeToRoot(m, lvl);
          const isPartner = isPartnerRelation(role);
          let connector = "";
          if (mIdx < members.length - 1) {
            const nextM = members[mIdx + 1];
            const coupled = arePartnersOrCoParents(m.id, nextM.id);
            connector = coupled
              ? `<span style="color:var(--partner-rose); font-size:12px; font-weight:700; padding:0 1px;">──</span>`
              : `<span style="width:4px; display:inline-block;"></span>`;
          }
          return `
            <div class="tree-node ${isRoot ? 'root' : ''} ${isPartner ? 'partner' : ''}" onclick="openDetailModal(${m.id})">
              <div style="font-size:11.5px; font-weight:700; color:var(--text-primary); line-height:1.2;">${escapeHtml(m.name)}</div>
              <div style="font-size:10px; color:${isRoot ? 'var(--accent-steel)' : (isPartner ? 'var(--partner-rose)' : 'var(--tree-green)')}; margin-top:2px; line-height:1.1;">
                ${escapeHtml(role)}
              </div>
            </div>
            ${connector}
          `;
        }).join("");

        const nextMembers = idx < sortedLevels.length - 1 ? (levelsMap.get(sortedLevels[idx + 1]) || []) : [];
        const connectorDown = idx < sortedLevels.length - 1 ? `
          <div class="tree-line-vertical"></div>
          ${nextMembers.length > 1 ? `<div class="tree-branch-bar"></div>` : ""}
        ` : "";

        return `
          <div class="tree-row">${nodesHtml}</div>
          ${connectorDown}
        `;
      }).join("");

      return `
        <div class="card" style="padding:8px 10px;">
          <div class="btn-row" style="gap:4px;">${focusChips}</div>
        </div>
        <div class="tree-container">
          ${levelsHtml}
        </div>
      `;
    }

          items.push({ sortKey: bdayDays, personId: p.id, name: p.name, subtitle: `Geburtstag (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`, badge: bdayDays === 0 ? "Heute" : `in ${bdayDays}T` });

      for (const ev of state.specialEvents) {

        }

      items.sort((a, b) => a.sortKey - b.sortKey);
      container.innerHTML = items.slice(0, 5).map(item => `

        const pickerHtml = popupState.showAddMessenger ? `
          <div style="background:var(--bg-slate); border:1px solid var(--border-slate); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:6px;">
            <div style="font-size:11px; color:var(--text-secondary); font-weight:600;">Weitere Messenger ein-/ausblenden:</div>
            <div class="btn-row">
              ${AVAILABLE_EXTRA_MESSENGERS.map(m => {
                const active = enabledExtras.includes(m);
                return `
                  <button class="compact-btn ${active ? 'primary' : ''}" style="display:inline-flex; align-items:center; gap:5px;" onclick="toggleExtraMessenger('${m}')">
                    ${CHANNEL_ICONS[m] || ""} <span>${active ? '✓ ' : '+ '}${m}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        ` : "";

        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">
            <div class="modal" onclick="event.stopPropagation()">
              <div>
                <div class="modal-title" style="font-size:17px;">Nachricht an ${escapeHtml(p.name)}</div>
                <div style="font-size:13px; color:var(--accent-steel); margin-top:2px;">${escapeHtml(popupState.reason)}</div>
              </div>
              ${resolved.warningNotice ? `<div class="warning-box">${escapeHtml(resolved.warningNotice)}</div>` : ""}
              <div class="field-group">
                <label class="field-label">Nachricht / Gruß</label>
                <input id="p-msg" class="field-input" value="${escapeHtml(popupState.quickMessageText)}" oninput="popupState.quickMessageText = this.value" />
              </div>
              <div class="btn-row">
                <button class="compact-btn primary" style="display:inline-flex; align-items:center; gap:6px;" onclick="dispatchChannel('WhatsApp')">
                  ${CHANNEL_ICONS.WhatsApp} <span>WhatsApp</span>
                </button>
                <button class="compact-btn" style="display:inline-flex; align-items:center; gap:6px;" onclick="dispatchChannel('SMS')">
                  ${CHANNEL_ICONS.SMS} <span>SMS</span>
                </button>
                <button class="compact-btn" style="display:inline-flex; align-items:center; gap:6px;" onclick="dispatchChannel('Anruf')">
                  ${CHANNEL_ICONS.Anruf} <span>Anruf</span>
                </button>
                ${resolved.email ? `
                  <button class="compact-btn" style="display:inline-flex; align-items:center; gap:6px;" onclick="dispatchChannel('Mail')">
                    ${CHANNEL_ICONS.Mail} <span>Mail</span>
                  </button>
                ` : ""}
                ${extraButtonsHtml}
                <button class="compact-btn" style="display:inline-flex; align-items:center; gap:5px; border-style:dashed;" onclick="popupState.showAddMessenger = !popupState.showAddMessenger; renderModals();">
                  <span>＋ Hinzufügen</span>
                </button>
              </div>
              ${pickerHtml}
              <div class="modal-footer">
                <button class="compact-btn" onclick="markPersonContacted(${p.id})">Kontaktiert</button>
                <button class="compact-btn" onclick="popupState=null; renderModals();">Schließen</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      modalRoot.innerHTML = "";
    }

    function renderLogs() {
      const el = document.getElementById("log-list");
      if (!el) return;
      el.innerHTML = logs.map(l => `<div class="log-item">${escapeHtml(l)}</div>`).join("");
    }

    function setTab(tab) {
      activeTab = tab;
      renderPhoneApp();
    }

    let createExtraInfos = [];
    let detailExtraInfos = [];

    function openCreateModal() {
      showCreateDialog = true;
      createExtraInfos = [];
      renderModals();
    }

    function openDetailModal(id) {
      detailPersonId = id;
      const dp = state.persons.find(p => p.id === id);
      detailExtraInfos = dp && Array.isArray(dp.extraInfos)
        ? dp.extraInfos.map(x => ({ label: x.label || "", value: x.value || "" }))
        : [];
      renderModals();
    }

    function addCreateExtraInfoRow() {
      const nextLabel = createExtraInfos.length === 0 ? "2. Telefon" : "Weitere Info";
      createExtraInfos.push({ label: nextLabel, value: "" });
      renderModals();
    }

    function removeCreateExtraInfoRow(idx) {
      createExtraInfos.splice(idx, 1);
      renderModals();
    }

    function syncDetailDraftBeforeRerender() {
      if (detailPersonId === null) return;
      const dp = state.persons.find(p => p.id === detailPersonId);
      if (!dp) return;
      const nEl = document.getElementById("d-name");
      const bEl = document.getElementById("d-bday");
      const pEl = document.getElementById("d-phone");
      const eEl = document.getElementById("d-email");
      const noEl = document.getElementById("d-notes");
      if (nEl) dp.name = nEl.value;
      if (bEl) dp.birthdayIso = normalizeDateInputToIso(bEl.value);
      if (pEl) dp.phone = pEl.value;
      if (eEl) dp.email = eEl.value;
      if (noEl) dp.notes = noEl.value;
    }

    function addDetailExtraInfoRow() {
      syncDetailDraftBeforeRerender();
      const nextLabel = detailExtraInfos.length === 0 ? "2. Telefon" : "Weitere Info";
      detailExtraInfos.push({ label: nextLabel, value: "" });
      renderModals();
    }

    function removeDetailExtraInfoRow(idx) {
      syncDetailDraftBeforeRerender();
      detailExtraInfos.splice(idx, 1);
      renderModals();
    }

    function toggleExtraMessenger(name) {
      if (!state.enabledMessengers) state.enabledMessengers = [];
      const idx = state.enabledMessengers.indexOf(name);
      if (idx >= 0) {
        state.enabledMessengers.splice(idx, 1);
      } else {
        state.enabledMessengers.push(name);
      }
      saveState();
    }

    function closeModals(e) {
      if (e.target.classList.contains("modal-backdrop")) {
        showCreateDialog = false;
        detailPersonId = null;
        popupState = null;
        renderModals();
      }
    }

    function addRelationFromDetail(fromId) {
      const label = document.getElementById("d-rellabel").value;
      const targetId = parseInt(document.getElementById("d-reltarget").value, 10);
      addBidirectionalRelation(fromId, targetId, label);
      addLog(`Beziehung "${label}" gespeichert.`);
      saveState();
    }

    function removeRelation(relId) {
      state.relations = state.relations.filter(r => r.id !== relId);
      saveState();
    }

    function removeEvent(evId) {
      state.specialEvents = state.specialEvents.filter(e => e.id !== evId);
      saveState();
    }

    function saveNewPerson() {
      const name = document.getElementById("c-name").value.trim();
      if (!name) return;
      const bday = normalizeDateInputToIso(document.getElementById("c-bday").value.trim());
      const noPhone = document.getElementById("c-nophone").checked;
      const phone = document.getElementById("c-phone").value.trim();
      const email = document.getElementById("c-email").value.trim();
      const timerInterval = parseInt(document.getElementById("c-timer").value, 10) || 14;
      const notes = document.getElementById("c-notes").value.trim();

      const newId = state.nextId++;
      state.persons.push({
        id: newId,
        name,
        birthdayIso: bday,
        hasNoOwnPhone: noPhone,
        phone,
        email,
        appPeerId: "",
        notes,
        extraInfos: createExtraInfos.filter(x => (x.label && x.label.trim()) || (x.value && x.value.trim())),
        timerEnabled: true,
        timerInterval,
        timerUnit: "DAYS",
        lastContactedIso: todayIso()
      });

      const relTargetEl = document.getElementById("c-reltarget");
      const relLabelEl = document.getElementById("c-rellabel");
      if (relTargetEl && relLabelEl) {
        const targetId = parseInt(relTargetEl.value, 10);
        const relLabel = relLabelEl.value.trim();
        if (targetId > 0 && relLabel) {
          addBidirectionalRelation(newId, targetId, relLabel);
        }
      }

      selectedTreeRootId = newId;
      showCreateDialog = false;
      addLog(`Kontakt "${name}" angelegt.`);
      saveState();
    }

    function saveDetailPerson(id) {
      const dp = state.persons.find(p => p.id === id);
      if (!dp) return;
      dp.name = document.getElementById("d-name").value.trim() || dp.name;
      dp.birthdayIso = normalizeDateInputToIso(document.getElementById("d-bday").value.trim());
      dp.phone = document.getElementById("d-phone").value.trim();
      dp.email = document.getElementById("d-email").value.trim();
      dp.notes = document.getElementById("d-notes").value.trim();
      dp.extraInfos = detailExtraInfos.filter(x => (x.label && x.label.trim()) || (x.value && x.value.trim()));

      const evTitle = document.getElementById("d-evtitle").value.trim();
      const evDate = normalizeDateInputToIso(document.getElementById("d-evdate").value.trim());
      if (evTitle) {
        state.specialEvents.push({
          id: state.nextId++,
          personId: dp.id,
          title: evTitle,
          dateIso: evDate,
          leadDays: 1,
          note: ""
        });
        addLog(`Erinnerung "${evTitle}" am ${formatIsoToDdMmYyyy(evDate)} für ${dp.name} eingetragen.`);
      } else {
        addLog(`Details von ${dp.name} aktualisiert.`);
      }
      detailPersonId = null;
      saveState();
    }

    function deletePerson(id) {
      const dp = state.persons.find(p => p.id === id);
      state.persons = state.persons.filter(p => p.id !== id);
      state.relations = state.relations.filter(r => r.fromPersonId !== id && r.toPersonId !== id);
      state.specialEvents = state.specialEvents.filter(e => e.personId !== id);
      state.directMessages = state.directMessages.filter(m => m.personId !== id);
      detailPersonId = null;
      if (dp) addLog(`Kontakt "${dp.name}" gelöscht.`);
      saveState();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (state.persons.length === 0) {
      seedSampleData();
    } else {
      selectedTreeRootId = state.persons[0].id;
      addLog("Remember Me v1.0.2 gestartet.");
      renderAll();
    }
  </script>
</body>
</html>
