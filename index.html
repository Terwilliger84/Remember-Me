    function cycleContactSortMode() {
      if (contactSortMode === "lastname") contactSortMode = "birthday";
      else if (contactSortMode === "birthday") contactSortMode = "firstname";
      else contactSortMode = "lastname";
      renderPhoneApp();
    }

    function getSortModeButtonLabel() {
      if (contactSortMode === "firstname") return "⇅ Vorname";
      if (contactSortMode === "birthday") return "⇅ Geburtstag";
      return "⇅ Nachname";
    }

    function formatPassedBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const passedAgeStr = ContactResolver.formatPassedAge(birthdayIso);
      const negDays = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
      if (negDays === null) return dateStr;
      const negLabel = negDays === 0 ? "0 Tage (heute)" : (negDays === -1 ? "-1 Tag" : `${negDays} Tage`);
      return `${dateStr}  •  ${passedAgeStr} (${negLabel})`;
    }

    let allContactsFilter = "all"; // "all" | "hidden"
    let mergeContactsModalState = null;

    function cleanMergeWhitespace(raw) {
      return String(raw || "").trim().replace(/\s+/g, " ");
    }

    function canonicalPhoneKey(raw) {
      const trimmed = String(raw || "").trim();
      if (!trimmed) return "";
      let cleaned = "";
      for (let i = 0; i < trimmed.length; i++) {
        const ch = trimmed[i];
        if (ch >= "0" && ch <= "9") cleaned += ch;
        else if (ch === "+" && cleaned === "" && i === 0) cleaned += "+";
      }
      const digitsOnly = cleaned.replace(/[^0-9]/g, "");
      if (digitsOnly.length < 3) return "";
      const intl = (cleaned.startsWith("00") && digitsOnly.length >= 5)
        ? "+" + cleaned.slice(2)
        : cleaned;
      if (intl.startsWith("+49")) {
        const sub = intl.slice(3).replace(/^0+/, "");
        return sub ? `DE:${sub}` : "DE:0";
      }
      if (intl.startsWith("+43")) return `AT:${intl.slice(3).replace(/^0+/, "")}`;
      if (intl.startsWith("+41")) return `CH:${intl.slice(3).replace(/^0+/, "")}`;
      if (intl.startsWith("+")) return intl;
      if (intl.startsWith("0")) {
        const sub = intl.replace(/^0+/, "");
        return sub ? `DE:${sub}` : `RAW:${digitsOnly}`;
      }
      return `RAW:${digitsOnly}`;
    }

    function isPhoneLike(raw) {
      const t = String(raw || "").trim();
      if (!t || t.includes("@") || /\p{L}/u.test(t)) return false;
      if (/^\d{1,2}\.\d{1,2}\.(\d{2,4})?$/.test(t) || /^\d{4}-\d{2}-\d{2}$/.test(t)) return false;
      return (t.match(/\d/g) || []).length >= 4;
    }

    function canonicalEmailKey(raw) {
      const cleaned = String(raw || "")
        .trim()
        .replace(/^mailto:/i, "")
        .trim()
        .replace(/^<|>$/g, "")
        .replace(/\s+/g, "")
        .toLowerCase();
      return (cleaned.includes("@") && cleaned.split("@")[1].includes(".")) ? cleaned : "";
    }

    function isEmailLike(raw) {
      return Boolean(canonicalEmailKey(raw));
    }

    function isAddressLabel(label) {
      const l = String(label || "").trim().toLowerCase();
      return l.includes("adresse") || l.includes("anschrift") || l.includes("wohnort") || l.includes("straße") || l.includes("strasse") || l.includes("post");
    }

    function canonicalTextKey(raw) {
      return normalizeSearchKey(
        String(raw || "")
          .trim()
          .toLowerCase()
          .replace(/straße/g, "str ")
          .replace(/strasse/g, "str ")
          .replace(/str\./g, "str ")
      ).replace(/[\s,.;:/\-–_•|]+/g, " ").trim();
    }

    function canonicalPersonNameForMerge(fullName) {
      let clean = stripNameRoleSuffix(fullName).trim();
      clean = clean.replace(/\s*\((mobil|handy|privat|arbeit|festnetz|büro|buero|home|work|tel|telefon|alt|neu)\)\s*$/i, "").trim();
      const parts = clean.split(/\s+/).filter(Boolean);
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        parts.pop();
      }
      const reassembled = clean.includes(",") ? clean : parts.join(" ");
      return canonicalTextKey(formatLastNameFirst(reassembled));
    }

    function makeDismissedMergePairKey(idA, idB) {
      const a = Number(idA);
      const b = Number(idB);
      return a < b ? `${a}:${b}` : `${b}:${a}`;
    }

    function buildDismissedMergePairKeysForGroup(ids) {
      const distinct = [...new Set((ids || []).map(Number).filter(n => !Number.isNaN(n)))].sort((a, b) => a - b);
      const out = [];
      for (let i = 0; i < distinct.length; i++) {
        for (let j = i + 1; j < distinct.length; j++) {
          out.push(makeDismissedMergePairKey(distinct[i], distinct[j]));
        }
      }
      return out;
    }

    function getDismissedMergePairsSet() {
      return new Set(Array.isArray(state.dismissedMergePairs) ? state.dismissedMergePairs : []);
    }

    function dismissMergeCombinationByIds(ids) {
      const newPairs = buildDismissedMergePairKeysForGroup(ids);
      if (newPairs.length === 0) return;
      const set = getDismissedMergePairsSet();
      newPairs.forEach(p => set.add(p));
      state.dismissedMergePairs = [...set];
      addLog(`🚫 Kombination wird nicht mehr zum Zusammenführen vorgeschlagen.`);
      saveState();
    }

    function dismissDuplicateSuggestionGroup(groupKey) {
      const grp = findDuplicateSuggestionGroups(state.persons).find(g => g.key === groupKey);
      if (!grp) return;
      dismissMergeCombinationByIds(grp.members.map(m => m.id));
      if (mergeContactsModalState) {
        mergeContactsModalState.notice = "🚫 Kombination wird nicht mehr vorgeschlagen.";
      }
      renderPhoneApp();
      renderModals();
    }

    function dismissSelectedMergeContactsModal() {
      if (!mergeContactsModalState) return;
      const ids = mergeContactsModalState.selectedIds || [];
      if (ids.length < 2) return;
      dismissMergeCombinationByIds(ids);
      const remaining = findDuplicateSuggestionGroups(state.persons);
      if (remaining.length > 0) {
        mergeContactsModalState.selectedIds = [];
        mergeContactsModalState.primaryId = -1;
        mergeContactsModalState.tab = "suggestions";
        mergeContactsModalState.notice = "🚫 Kombination wird nicht mehr vorgeschlagen.";
      } else {
        mergeContactsModalState = null;
      }
      renderPhoneApp();
      renderModals();
    }

    function resetDismissedMergeCombinations() {
      state.dismissedMergePairs = [];
      if (mergeContactsModalState) {
        mergeContactsModalState.notice = "✓ Abgelehnte Vorschläge wurden wieder eingeblendet.";
      }
      addLog("✓ Abgelehnte Zusammenführungs-Vorschläge zurückgesetzt.");
      saveState();
      renderModals();
    }

    function splitCandidateBucketExcludingDismissedJs(rawGroup, dismissedSet) {
      const byId = new Map();
      (rawGroup || []).forEach(p => byId.set(p.id, p));
      const distinct = [...byId.values()];
      if (distinct.length < 2) return [];
      if (!dismissedSet || dismissedSet.size === 0) {
        return [sortPersonsByLastName(distinct)];
      }
      const remaining = distinct.filter(m =>
        distinct.some(o => o.id !== m.id && !dismissedSet.has(makeDismissedMergePairKey(m.id, o.id)))
      );
      if (remaining.length < 2) return [];
      const nameCounts = new Map();
      remaining.forEach(p => {
        const nk = canonicalPersonNameForMerge(p.name);
        nameCounts.set(nk, (nameCounts.get(nk) || 0) + 1);
      });
      const ordered = [...remaining].sort((a, b) => {
        const ca = nameCounts.get(canonicalPersonNameForMerge(a.name)) || 0;
        const cb = nameCounts.get(canonicalPersonNameForMerge(b.name)) || 0;
        if (cb !== ca) return cb - ca;
        return comparePersonsByLastName(a, b);
      });
      const clusters = [];
      for (const person of ordered) {
        const pnk = canonicalPersonNameForMerge(person.name);
        const compatible = clusters.filter(cl =>
          cl.every(ex => !dismissedSet.has(makeDismissedMergePairKey(ex.id, person.id)))
        );
        const best = compatible.find(cl => canonicalPersonNameForMerge(cl[0].name) === pnk) || compatible[0];
        if (best) best.push(person);
        else clusters.push([person]);
      }
      return clusters.filter(cl => cl.length >= 2).map(cl => sortPersonsByLastName(cl));
    }

    function findDuplicateSuggestionGroups(personsList) {
      const list = Array.isArray(personsList) ? personsList : [];
      if (list.length < 2) return [];
      const dismissedSet = getDismissedMergePairsSet();
      const result = [];
      const seenSets = new Set();

      const addGroup = (baseKey, reasonBadge, priority, members) => {
        const subGroups = splitCandidateBucketExcludingDismissedJs(members, dismissedSet);
        subGroups.forEach((sortedMembers, idx) => {
          const sig = sortedMembers.map(m => m.id).sort((a, b) => a - b).join(",");
          if (!seenSets.has(sig)) {
            seenSets.add(sig);
            result.push({ key: `${baseKey}:${idx}:${sig}`, reasonBadge, priority, members: sortedMembers });
          }
        });
      };

      const byName = new Map();
      list.forEach(p => {
        const nk = canonicalPersonNameForMerge(p.name);
        if (!nk) return;
        if (!byName.has(nk)) byName.set(nk, []);
        byName.get(nk).push(p);
      });
      byName.forEach((grp, nk) => {
        if (grp.length >= 2) addGroup(`name:${nk}`, "👤 Gleicher Name", 1, grp);
      });

      const byEmail = new Map();
      list.forEach(p => {
        const ek = canonicalEmailKey(p.email);
        if (!ek) return;
        if (!byEmail.has(ek)) byEmail.set(ek, []);
        byEmail.get(ek).push(p);
      });
      byEmail.forEach((grp, ek) => {
        if (grp.length >= 2) addGroup(`mail:${ek}`, "✉️ Gleiche E-Mail", 2, grp);
      });

      const byPhone = new Map();
      list.forEach(p => {
        const pk = canonicalPhoneKey(p.phone);
        if (!pk) return;
        if (!byPhone.has(pk)) byPhone.set(pk, []);
        byPhone.get(pk).push(p);
      });
      byPhone.forEach((grp, pk) => {
        if (grp.length >= 2) addGroup(`phone:${pk}`, "📞 Gleiche Nummer", 3, grp);
      });

      return result.sort((a, b) => a.priority !== b.priority ? a.priority - b.priority : comparePersonsByLastName(a.members[0], b.members[0]));
    }

    function buildMergedContactPreview(selectedPersons, primaryId, customName) {
      if (!Array.isArray(selectedPersons) || selectedPersons.length < 2) return null;
      const primary = selectedPersons.find(p => p.id === primaryId) || selectedPersons[0];
      const ordered = [primary, ...selectedPersons.filter(p => p.id !== primary.id)];
      let removedDuplicatesCount = 0;

      const seenPhones = new Set();
      const mergedPhones = [];
      const seenEmails = new Set();
      const mergedEmails = [];
      const seenTexts = new Set();
      const mergedOtherExtras = [];
      const rawNoteBlocks = [];

      ordered.forEach(p => {
        const extras = Array.isArray(p.extraInfos) ? p.extraInfos : [];

        const tryAddPhone = (lbl, val) => {
          const clean = cleanMergeWhitespace(val);
          if (!clean) return;
          const pk = canonicalPhoneKey(clean);
          if (!pk) return;
          if (!seenPhones.has(pk)) {
            seenPhones.add(pk);
            mergedPhones.push({ label: lbl || "Telefon", value: clean });
          } else {
            removedDuplicatesCount++;
          }
        };
        if (p.phone) tryAddPhone("Telefon", p.phone);
        extras.filter(x => isPhoneLike(x.value)).forEach(x => tryAddPhone(x.label, x.value));

        const tryAddEmail = (lbl, val) => {
          const clean = String(val || "").trim();
          const ek = canonicalEmailKey(clean);
          if (!ek) return;
          if (!seenEmails.has(ek)) {
            seenEmails.add(ek);
            mergedEmails.push({ label: lbl || "E-Mail", value: clean });
          } else {
            removedDuplicatesCount++;
          }
        };
        if (p.email) tryAddEmail("E-Mail", p.email);
        extras.filter(x => isEmailLike(x.value)).forEach(x => tryAddEmail(x.label, x.value));

        extras.filter(x => !isPhoneLike(x.value) && !isEmailLike(x.value)).forEach(x => {
          const clean = cleanMergeWhitespace(x.value);
          const tk = canonicalTextKey(clean);
          if (!tk) return;
          if (!seenTexts.has(tk)) {
            seenTexts.add(tk);
            mergedOtherExtras.push({ label: (x.label || "Info").trim() || "Info", value: clean });
          } else {
            removedDuplicatesCount++;
          }
        });

        if (p.notes && p.notes.trim()) rawNoteBlocks.push(p.notes);
      });

      const rawBirthdays = ordered.map(p => (p.birthdayIso || "").trim()).filter(Boolean);
      let mergedBirthdayIso = rawBirthdays[0] || "";
      if (mergedBirthdayIso.startsWith("--")) {
        const md = mergedBirthdayIso.slice(2);
        const fullMatch = rawBirthdays.find(b => !b.startsWith("--") && b.endsWith(`-${md}`));
        if (fullMatch) mergedBirthdayIso = fullMatch;
      }
      rawBirthdays.slice(1).forEach(otherB => {
        const mainMd = mergedBirthdayIso.replace(/^--/, "").slice(-5);
        const otherMd = otherB.replace(/^--/, "").slice(-5);
        if (otherB === mergedBirthdayIso || (mainMd && mainMd === otherMd)) {
          removedDuplicatesCount++;
        } else {
          const fmt = formatIsoToDdMmYyyy(otherB);
          const tk = canonicalTextKey(fmt);
          if (tk && !seenTexts.has(tk)) {
            seenTexts.add(tk);
            mergedOtherExtras.push({ label: "Weiteres Datum", value: fmt });
          }
        }
      });

      const seenNotes = new Set(seenTexts);
      const noteLines = [];
      rawNoteBlocks.forEach(block => {
        String(block).split(/\r?\n/).forEach(rawLine => {
          const line = cleanMergeWhitespace(rawLine);
          if (!line) return;
          if (isEmailLike(line) && seenEmails.has(canonicalEmailKey(line))) { removedDuplicatesCount++; return; }
          if (isPhoneLike(line) && seenPhones.has(canonicalPhoneKey(line))) { removedDuplicatesCount++; return; }
          const tk = canonicalTextKey(line);
          if (tk) {
            if (!seenNotes.has(tk)) {
              seenNotes.add(tk);
              noteLines.push(line);
            } else {
              removedDuplicatesCount++;
            }
          }
        });
      });

      const deduplicatedExtraInfos = [];
      mergedPhones.slice(1).forEach((item, idx) => {
        const lbl = (!item.label || item.label === "Telefon" || item.label === "2. Telefon") ? `${idx + 2}. Telefon` : item.label;
        deduplicatedExtraInfos.push({ label: lbl, value: item.value });
      });
      mergedEmails.slice(1).forEach((item, idx) => {
        const lbl = (!item.label || item.label === "E-Mail") ? `${idx + 2}. E-Mail` : item.label;
        deduplicatedExtraInfos.push({ label: lbl, value: item.value });
      });
      mergedOtherExtras.forEach(item => deduplicatedExtraInfos.push(item));

      const timerSource = primary.timerEnabled ? primary : (ordered.find(x => x.timerEnabled) || primary);
      const latestContact = ordered.map(x => x.lastContactedIso || "").filter(Boolean).sort().pop() || "";
      const primaryPhone = mergedPhones[0] ? mergedPhones[0].value : "";
      const primaryEmail = mergedEmails[0] ? mergedEmails[0].value : "";

      return {
        primaryPerson: primary,
        finalName: String(customName || "").trim() || primary.name,
        birthdayIso: mergedBirthdayIso,
        primaryPhone,
        primaryEmail,
        hasNoOwnPhone: !primaryPhone && ordered.every(x => x.hasNoOwnPhone),
        timerEnabled: ordered.some(x => x.timerEnabled),
        timerInterval: timerSource.timerInterval || 14,
        timerUnit: timerSource.timerUnit || "DAYS",
        lastContactedIso: latestContact,
        photoBase64: primary.photoBase64 || (ordered.find(x => x.photoBase64) || {}).photoBase64 || "",
        notes: noteLines.join("\n"),
        deduplicatedExtraInfos,
        removedDuplicatesCount
      };
    }

    function openMergeContactsModal(preselectedIds = []) {
      const groups = findDuplicateSuggestionGroups(state.persons);
      const initIds = Array.isArray(preselectedIds) ? [...preselectedIds] : [];
      const primId = initIds[0] || -1;
      const primObj = state.persons.find(p => p.id === primId);
      const splitPrim = splitFullNameIntoFirstAndLast(primObj ? primObj.name : "");
      mergeContactsModalState = {
        tab: (initIds.length === 0 && groups.length > 0) ? "suggestions" : "manual",
        selectedIds: initIds,
        primaryId: primId,
        customFirstName: splitPrim.firstName,
        customLastName: splitPrim.lastName,
        customName: primObj ? primObj.name : "",
        mergeInDeviceContacts: true,
        notice: ""
      };
      detailPersonId = null;
      showOptionsDialog = false;
      renderModals();
    }

    function toggleMergeSelectedPerson(personId) {
      if (!mergeContactsModalState) return;
      const set = new Set(mergeContactsModalState.selectedIds || []);
      if (set.has(personId)) set.delete(personId);
      else set.add(personId);
      mergeContactsModalState.selectedIds = [...set];
      if (!set.has(mergeContactsModalState.primaryId)) {
        const firstId = mergeContactsModalState.selectedIds[0] || -1;
        mergeContactsModalState.primaryId = firstId;
        const p = state.persons.find(x => x.id === firstId);
        const sp = splitFullNameIntoFirstAndLast(p ? p.name : "");
        mergeContactsModalState.customFirstName = sp.firstName;
        mergeContactsModalState.customLastName = sp.lastName;
        mergeContactsModalState.customName = combineFirstAndLastName(sp.firstName, sp.lastName);
      }
      renderModals();
    }

    function setMergePrimaryPerson(personId) {
      if (!mergeContactsModalState) return;
      mergeContactsModalState.primaryId = personId;
      const p = state.persons.find(x => x.id === personId);
      if (p) {
        const sp = splitFullNameIntoFirstAndLast(p.name);
        mergeContactsModalState.customFirstName = sp.firstName;
        mergeContactsModalState.customLastName = sp.lastName;
        mergeContactsModalState.customName = combineFirstAndLastName(sp.firstName, sp.lastName);
      }
      renderModals();
    }

    function selectDuplicateSuggestionGroup(groupKey) {
      if (!mergeContactsModalState) return;
      const grp = findDuplicateSuggestionGroups(state.persons).find(g => g.key === groupKey);
      if (!grp) return;
      const sp = splitFullNameIntoFirstAndLast(grp.members[0].name);
      mergeContactsModalState.selectedIds = grp.members.map(m => m.id);
      mergeContactsModalState.primaryId = grp.members[0].id;
      mergeContactsModalState.customFirstName = sp.firstName;
      mergeContactsModalState.customLastName = sp.lastName;
      mergeContactsModalState.customName = combineFirstAndLastName(sp.firstName, sp.lastName);
      mergeContactsModalState.tab = "manual";
      renderModals();
    }

    function executeMergeContactsModal() {
      if (!mergeContactsModalState) return;
      const selected = sortPersonsByLastName(
        state.persons.filter(p => (mergeContactsModalState.selectedIds || []).includes(p.id))
      );
      if (selected.length < 2) return;
      const preview = buildMergedContactPreview(
        selected,
        mergeContactsModalState.primaryId,
        mergeContactsModalState.customName
      );
      if (!preview) return;
      const target = preview.primaryPerson;
      const secondaryIds = new Set(selected.filter(p => p.id !== target.id).map(p => p.id));
      const allHidden = selected.every(p => p.isHidden);

      target.name = preview.finalName;
      target.birthdayIso = preview.birthdayIso;
      target.hasNoOwnPhone = preview.hasNoOwnPhone;
      target.phone = preview.primaryPhone;
      target.email = preview.primaryEmail;
      target.notes = preview.notes;
      target.extraInfos = preview.deduplicatedExtraInfos;
      target.timerEnabled = preview.timerEnabled;
      target.timerInterval = preview.timerInterval;
      target.timerUnit = preview.timerUnit;
      target.lastContactedIso = preview.lastContactedIso;
      target.photoBase64 = preview.photoBase64;
      target.isHidden = allHidden;

      // Beziehungen dedupliziert umhängen
      const seenRelKeys = new Set();
      const nextRels = [];
      (state.relations || []).forEach(r => {
        const nf = secondaryIds.has(r.fromPersonId) ? target.id : r.fromPersonId;
        const nt = secondaryIds.has(r.toPersonId) ? target.id : r.toPersonId;
        if (nf === nt) return;
        const rk = `${nf}:${nt}:${String(r.relationLabel || "").trim().toLowerCase()}`;
        if (!seenRelKeys.has(rk)) {
          seenRelKeys.add(rk);
          nextRels.push({ ...r, fromPersonId: nf, toPersonId: nt });
        }
      });
      state.relations = nextRels;

      // Erinnerungen dedupliziert umhängen
      const seenEvKeys = new Set();
      const nextEvs = [];
      (state.specialEvents || []).forEach(ev => {
        const np = secondaryIds.has(ev.personId) ? target.id : ev.personId;
        const ek = `${np}:${String(ev.title || "").trim().toLowerCase()}:${String(ev.dateIso || "").trim()}`;
        if (!seenEvKeys.has(ek)) {
          seenEvKeys.add(ek);
          nextEvs.push({ ...ev, personId: np });
        }
      });
      state.specialEvents = nextEvs;

      // Direktnachrichten & Wichteln umhängen
      (state.directMessages || []).forEach(dm => {
        if (secondaryIds.has(dm.personId)) dm.personId = target.id;
      });
      (state.wichtelGroups || []).forEach(g => {
        const seenPid = new Set();
        g.participants = (g.participants || []).filter(part => {
          if (part.personId && secondaryIds.has(part.personId)) {
            part.personId = target.id;
            part.name = target.name;
            if (!part.phone) part.phone = target.phone;
          }
          if (!g.isDrawn && part.personId) {
            if (seenPid.has(part.personId)) return false;
            seenPid.add(part.personId);
          }
          return true;
        });
      });

      if (Array.isArray(state.dismissedMergePairs) && state.dismissedMergePairs.length > 0) {
        const remappedDismissed = new Set();
        state.dismissedMergePairs.forEach(raw => {
          const [aStr, bStr] = String(raw || "").split(":");
          const a = Number(aStr);
          const b = Number(bStr);
          if (Number.isNaN(a) || Number.isNaN(b)) return;
          const na = secondaryIds.has(a) ? target.id : a;
          const nb = secondaryIds.has(b) ? target.id : b;
          if (na !== nb) remappedDismissed.add(makeDismissedMergePairKey(na, nb));
        });
        state.dismissedMergePairs = [...remappedDismissed];
      }

      state.persons = state.persons.filter(p => !secondaryIds.has(p.id));
      if (selectedTreeRootId && secondaryIds.has(selectedTreeRootId)) {
        selectedTreeRootId = target.id;
      }

      addLog(`🔗 ${selected.length} Kontakte intelligent zu "${target.name}" zusammengeführt (${preview.removedDuplicatesCount} doppelte Nummern/Mails/Einträge bereinigt).`);
      const remainingGroups = findDuplicateSuggestionGroups(state.persons);
      if (remainingGroups.length > 0) {
        mergeContactsModalState.selectedIds = [];
        mergeContactsModalState.primaryId = -1;
        mergeContactsModalState.tab = "suggestions";
        mergeContactsModalState.notice = `✓ ${selected.length} Kontakte erfolgreich zu „${target.name}“ zusammengeführt!`;
      } else {
        mergeContactsModalState = null;
      }
      saveState();
    }

    function sortPersonsArray(arr) {
      return [...arr].sort((a, b) => {
        if (contactSortMode === "firstname") {
          const cmp = extractFirstName(a.name).localeCompare(extractFirstName(b.name), "de", { sensitivity: "base" });
          return cmp !== 0 ? cmp : comparePersonsByLastName(a, b);
        }
        if (contactSortMode === "lastname") {
          return comparePersonsByLastName(a, b);
        }
        if (!showPastDates) {
          const da = ContactResolver.daysUntilNextBirthday(a.birthdayIso) ?? 999999;
          const db = ContactResolver.daysUntilNextBirthday(b.birthdayIso) ?? 999999;
          return da !== db ? da - db : comparePersonsByLastName(a, b);
        } else {
          const na = ContactResolver.negativeDaysSinceLastBirthday(a.birthdayIso) ?? -999999;
          const nb = ContactResolver.negativeDaysSinceLastBirthday(b.birthdayIso) ?? -999999;
          return na !== nb ? nb - na : comparePersonsByLastName(a, b);
        }
      });
    }

    function expandSpecialEventOccurrencesJs(ev, today = todayIso(), maxOccurrences = 6, maxHorizonDays = 365) {
      const clean = String(ev.dateIso || "").trim();
      if (!clean) return [];
      const results = [];
      if (isWeeklyDateSpec(clean)) {
        const wd = getWeeklyDayNumber(clean);
        if (!wd) return [];
        const dayName = WEEKDAY_NAMES_DE[wd] || "Wochentag";
        const firstDiff = daysUntilWeeklyDay(wd, today);
        for (let occ = 0; occ < maxOccurrences; occ++) {
          const days = firstDiff + occ * 7;
          if (days > maxHorizonDays) break;
          results.push({
            occIdx: occ,
            dateIso: addIntervalToIsoDate(today, days, "DAYS"),
            days,
            isRecurring: true,
            recurrenceNote: `🔁 Jeden ${dayName}`
          });
        }
        return results;
      }
      if (isRepeatDateSpec(clean)) {
        const rep = parseRepeatDateSpec(clean, today);
        if (!rep) return [];
        const rhythmStr = formatRhythmTextDe(rep.count, rep.unit);
        let curIso = rep.nextIso;
        for (let occ = 0; occ < maxOccurrences; occ++) {
          const days = daysBetween(today, curIso);
          if (days > maxHorizonDays) break;
          results.push({
            occIdx: occ,
            dateIso: curIso,
            days,
            isRecurring: true,
            recurrenceNote: `🔁 Alle ${rhythmStr}`
          });
          curIso = addIntervalToIsoDate(curIso, rep.count, rep.unit);
        }
        return results;
      }
      const diff = daysBetween(today, clean);
      if (diff !== null && !Number.isNaN(diff)) {
        results.push({
          occIdx: 0,
          dateIso: clean,
          days: diff,
          isRecurring: false,
          recurrenceNote: ""
        });
      }
      return results;
    }

    function expandTimerOccurrencesJs(person, today = todayIso(), maxOccurrences = 5, maxHorizonDays = 180) {
      if (!person.timerEnabled || (Number(person.timerInterval) || 0) <= 0) return [];
      const firstIso = ContactResolver.nextTimerDate(person, today);
      if (!firstIso) return [];
      const interval = Math.max(1, Number(person.timerInterval) || 14);
      const unit = (person.timerUnit || "DAYS").toUpperCase();
      const rhythmStr = formatRhythmTextDe(interval, unit);
      const results = [];
      let curIso = firstIso;
      for (let occ = 0; occ < maxOccurrences; occ++) {
        const rawDays = daysBetween(today, curIso);
        if (rawDays > maxHorizonDays) break;
        results.push({
          occIdx: occ,
          dateIso: curIso,
          rawDays,
          sortDays: Math.max(0, rawDays),
          rhythmStr
        });
        const stepBase = curIso < today ? today : curIso;
        curIso = addIntervalToIsoDate(stepBase, interval, unit);
      }
      return results;
    }

    function renderOverviewCountdownPillHtml(item, showPast) {
      if (item.kind === "REL_ONLY") return "";
      if (showPast) {
        const d = item.daysUntil;
        const label = d === 0 ? "Heute" : (d === -1 ? "Gestern" : `vor ${Math.abs(d)}T`);
        return `<span class="countdown-pill" style="background:var(--warn-bg); color:var(--warn-amber);">${escapeHtml(label)}</span>`;
      }
      if (item.rawDays !== undefined && item.rawDays < 0) {
        return `<span class="countdown-pill" style="background:var(--warn-bg); color:var(--warn-amber);">Überfällig (${Math.abs(item.rawDays)}T)</span>`;
      }
      const d = item.daysUntil;
      if (d <= 0) {
        const text = item.kind === "BIRTHDAY" ? "🎂 Heute!" : (item.kind === "TIMER" ? "⏳ Fällig!" : "🔔 Heute!");
        return `<span class="countdown-pill" style="background:var(--warn-bg); color:var(--warn-amber);">${escapeHtml(text)}</span>`;
      }
      if (d === 1) {
        return `<span class="countdown-pill" style="background:rgba(46, 125, 91, 0.16); color:var(--tree-green);">Morgen</span>`;
      }
      if (d <= 14) {
        return `<span class="countdown-pill" style="background:rgba(46, 125, 91, 0.14); color:var(--tree-green);">in ${d} Tagen</span>`;
      }
      return `<span class="countdown-pill">in ${d}T</span>`;
    }

    function buildOverviewTimelineEntries(persons, linkedPersonIds, showPast, sortMode, today = todayIso()) {
      const items = [];
      for (const person of persons) {
        const personEvents = (state.specialEvents || []).filter(e => e.personId === person.id);
        let hasAnyTimelineEntry = false;

        if (showPast) {
          if (person.birthdayIso && person.birthdayIso.trim()) {
            const negDays = ContactResolver.negativeDaysSinceLastBirthday(person.birthdayIso, today);
            if (negDays !== null) {
              hasAnyTimelineEntry = true;
              items.push({
                uniqueKey: `past_bday_${person.id}`,
                person,
                kind: "BIRTHDAY",
                daysUntil: negDays,
                priority: 0,
                headline: formatPassedBirthdayLine(person.birthdayIso),
                subline: "",
                greetingOccasion: "Nachträglich zum Geburtstag"
              });
            }
          }
          for (const ev of personEvents) {
            if (!isWeeklyDateSpec(ev.dateIso) && !isRepeatDateSpec(ev.dateIso)) {
              const diff = daysBetween(today, ev.dateIso);
              if (diff !== null && diff < 0) {
                hasAnyTimelineEntry = true;
                items.push({
                  uniqueKey: `past_ev_${ev.id}`,
                  person,
                  kind: "EVENT",
                  daysUntil: diff,
                  priority: 1,
                  headline: `🔔 ${ev.title} (${formatIsoToDdMmYyyy(ev.dateIso)})`,
                  subline: "",
                  greetingOccasion: ev.title
                });
              }
            }
          }
          continue;
        }

        // 1. Geburtstag (nächster anstehender Geburtstag)
        if (person.birthdayIso && person.birthdayIso.trim()) {
          const bdayDays = ContactResolver.daysUntilNextBirthday(person.birthdayIso, today);
          if (bdayDays !== null) {
            hasAnyTimelineEntry = true;
            items.push({
              uniqueKey: `bday_${person.id}`,
              person,
              kind: "BIRTHDAY",
              daysUntil: bdayDays,
              priority: 0,
              headline: `🎂 ${formatCompactBirthdayLine(person.birthdayIso)}`,
              subline: "",
              greetingOccasion: "Herzlichen Glückwunsch zum Geburtstag"
            });
          }
        }

        // 2. Einzelne & wiederkehrende Termine/Erinnerungen (mehrfache Vorkommen pro Kontakt erlaubt!)
        for (const ev of personEvents) {
          const occs = expandSpecialEventOccurrencesJs(ev, today, 6, 365);
          for (const occ of occs) {
            if (occ.days >= 0) {
              hasAnyTimelineEntry = true;
              const formattedDate = formatIsoToDdMmYyyy(occ.dateIso);
              items.push({
                uniqueKey: `ev_${ev.id}_${occ.occIdx}`,
                person,
                kind: "EVENT",
                daysUntil: occ.days,
                priority: 1,
                isRecurring: occ.isRecurring,
                headline: `🔔 ${ev.title} • ${formattedDate}`,
                subline: occ.recurrenceNote || "",
                greetingOccasion: ev.title
              });
            }
          }
        }

        // 3. Wiederkehrender Melde-Timer (mehrfache Vorkommen pro Kontakt erlaubt!)
        const timerOccs = expandTimerOccurrencesJs(person, today, 5, 180);
        for (const tOcc of timerOccs) {
          hasAnyTimelineEntry = true;
          const formattedDate = formatIsoToDdMmYyyy(tOcc.dateIso);
          items.push({
            uniqueKey: `timer_${person.id}_${tOcc.occIdx}`,
            person,
            kind: "TIMER",
            daysUntil: tOcc.sortDays,
            rawDays: tOcc.rawDays,
            priority: 2,
            isRecurring: true,
            headline: `⏳ Melde-Timer • ${formattedDate}`,
            subline: `🔁 Alle ${tOcc.rhythmStr}`,
            greetingOccasion: "Erinnerung"
          });
        }

        // 4. Kontakte ohne Datum/Termin, aber mit Verknüpfung (z. B. Kind von ...) am Ende ohne "Ohne Datum"
        if (!hasAnyTimelineEntry && linkedPersonIds.has(person.id)) {
          items.push({
            uniqueKey: `relonly_${person.id}`,
            person,
            kind: "REL_ONLY",
            daysUntil: Number.MAX_SAFE_INTEGER,
            priority: 9,
            headline: "",
            subline: "",
            greetingOccasion: "Erinnerung"
          });
        }
      }

      if (showPast) {
        items.sort((a, b) => (b.daysUntil - a.daysUntil) || (a.priority - b.priority) || formatLastNameFirst(a.person.name).localeCompare(formatLastNameFirst(b.person.name), "de"));
      } else if (sortMode === "lastname") {
        items.sort((a, b) => formatLastNameFirst(a.person.name).localeCompare(formatLastNameFirst(b.person.name), "de") || (a.daysUntil - b.daysUntil) || (a.priority - b.priority));
      } else {
        items.sort((a, b) => (a.daysUntil - b.daysUntil) || (a.priority - b.priority) || formatLastNameFirst(a.person.name).localeCompare(formatLastNameFirst(b.person.name), "de"));
      }
      return items;
    }

    function renderPersonsList() {
      const linkedPersonIds = new Set();
      (state.relations || []).forEach(r => {
        linkedPersonIds.add(r.fromPersonId);
        linkedPersonIds.add(r.toPersonId);

      const timelineItems = buildOverviewTimelineEntries(filteredVisible, linkedPersonIds, showPastDates, overviewSortMode, today);
      const matchingHiddenInOverview = (tabSearchQuery || tabSelectedLetter)
        ? hiddenPersons.filter(p => matchesPersonSearchAndLetter(p, tabSearchQuery, tabSelectedLetter)).length
        : 0;

      const searchDropdownHtml = renderContactSearchDropdownHtml({
        key: "tab_overview",
        persons: visiblePersons,
        selectedPersonId: null,
        placeholder: `🔎 Kontakt suchen / per Dropdown wählen (${filteredVisible.length}/${visiblePersons.length})...`,
        onSelectPersonJs: (pid) => `openDetailModal(${pid})`,
        showInlineAlphabet: true,
        inModal: false,
        syncWithTab: true,
        hiddenPersons,
        onShowHiddenJs: "allContactsFilter='hidden'; activeTab='Alle Kontakte'; renderPhoneApp();"
      });

      const hiddenBannerHtml = matchingHiddenInOverview > 0 ? `
        <div class="card" style="padding:7px 10px; border-color:var(--warn-amber); background:var(--warn-bg); display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <span style="font-size:11.5px; font-weight:700; color:var(--warn-amber);">👁 ${matchingHiddenInOverview} ausgeblendet für diesen Filter</span>
          <button class="compact-btn" onclick="allContactsFilter='hidden'; activeTab='Alle Kontakte'; renderPhoneApp();">Ausgeblendete zeigen</button>
        </div>
      ` : "";

      const sortLabel = overviewSortMode === "upcoming" ? "📅 Nächstes Ereignis" : "⇅ Nachname";
      const headerBar = `
        <div class="card" style="padding:8px 10px; display:flex; flex-direction:column; gap:6px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
            <button class="compact-btn ${overviewSortMode === 'upcoming' && !showPastDates ? 'primary' : ''}" onclick="toggleOverviewSortMode()" title="Sortierung umschalten: Nächstes anstehendes Ereignis vs. Nachname">
              ${sortLabel}
            </button>
            <button class="compact-btn ${showPastDates ? 'primary' : ''}" onclick="showPastDates=!showPastDates; renderPhoneApp();">
              ${showPastDates ? "Anstehende zeigen" : "Vergangene Termine"}
            </button>
          </div>
          ${searchDropdownHtml}
        </div>
        ${hiddenBannerHtml}
      `;

      if (timelineItems.length === 0) {
        return headerBar + `
          <div class="card" style="display:flex; flex-direction:column; gap:8px;">
            <div style="font-size:12px; color:var(--text-secondary);">
              ${visiblePersons.length === 0
                ? "Noch keine anstehenden Ereignisse oder verknüpften Kontakte vorhanden."
                : "Keine Ereignisse oder verknüpften Kontakte für diesen Filter gefunden."}
            </div>
            <div class="btn-row">
              <button class="compact-btn" onclick="allContactsFilter='all'; activeTab='Alle Kontakte'; renderPhoneApp();">👥 Alle Kontakte öffnen</button>
            </div>
          </div>
        `;
      }

      const firstUpcomingKey = (!showPastDates && overviewSortMode === "upcoming")
        ? (timelineItems.find(it => it.kind !== "REL_ONLY")?.uniqueKey || null)
        : null;

      const listHtml = timelineItems.map((item) => {
        const person = item.person;
        const isFirstNext = firstUpcomingKey && item.uniqueKey === firstUpcomingKey;
        const fwdRels = getRelationsForPerson(person.id);
        const fwdTargetIds = new Set(fwdRels.map(x => x.target.id));
        const incRels = (state.relations || [])
          .filter(r => r.toPersonId === person.id && !fwdTargetIds.has(r.fromPersonId))
          .map(r => {
            const target = state.persons.find(p => p.id === r.fromPersonId);
            return target ? `${inverseRelationLabel(r.relationLabel)} ${formatLastNameFirst(target.name)}` : null;
          })
          .filter(Boolean);
        const relationDescriptions = [
          ...fwdRels.map(x => `${x.rel.relationLabel} ${formatLastNameFirst(x.target.name)}`),
          ...incRels
        ];
        const pillHtml = renderOverviewCountdownPillHtml(item, showPastDates);
        const topHighlightHtml = isFirstNext
          ? `<div style="margin-bottom:5px;">
               <span style="font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:${item.daysUntil <= 0 ? 'var(--warn-bg)' : 'rgba(59,130,246,0.14)'}; color:${item.daysUntil <= 0 ? 'var(--warn-amber)' : 'var(--accent-steel)'};">
                 ${item.daysUntil <= 0 ? "🔥 Heute anstehend" : "⭐ Als Nächstes anstehend"}
               </span>
             </div>`
          : "";
        const borderStyle = isFirstNext
          ? `border: 1.5px solid ${item.daysUntil <= 0 ? 'var(--warn-amber)' : 'var(--accent-steel)'};`
          : "";

        return `
          <div class="card" style="padding: 10px 12px; ${borderStyle}">
            ${topHighlightHtml}
            <div class="person-header" style="align-items: center;">
              <div style="cursor:pointer;" onclick="openDetailModal(${person.id})">
                ${renderPersonAvatarHtml(person.name)}
              </div>
              <div style="flex:1; min-width:0; cursor:pointer;" onclick="openDetailModal(${person.id})" title="Antippen für Details">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;">
                  <span style="font-size:15px; font-weight:700; color:var(--text-primary); word-break:break-word;">${escapeHtml(formatLastNameFirst(person.name))}</span>
                  ${pillHtml}
                </div>
                ${item.headline
                  ? `<div class="person-sub" style="margin-top:2px; font-weight:600; color:${showPastDates ? 'var(--warn-amber)' : 'var(--text-primary)'};">${escapeHtml(item.headline)}</div>`
                  : ""}
                ${item.subline
                  ? `<div style="margin-top:3px;"><span style="font-size:10.5px; font-weight:600; padding:1.5px 7px; border-radius:999px; background:rgba(46, 125, 91, 0.14); color:var(--tree-green); display:inline-block;">${escapeHtml(item.subline)}</span></div>`
                  : ""}
                ${relationDescriptions.length > 0
                  ? `<div class="person-sub" style="margin-top:2px; color:var(--text-secondary);">🔗 ${escapeHtml(relationDescriptions.join(" • "))}</div>`
                  : ""}
              </div>
              <div class="btn-row">
                <button class="compact-btn primary" onclick="openPopupForPerson(${person.id}, '${escapeHtml(item.greetingOccasion || "Erinnerung")}')">💬 Gruß</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return headerBar + listHtml;
    }

    let treeZoom = 1.0;
    let treePanX = 0;
    let treePanY = 0;
    let isTreeDragging = false;
    let treeDragStartX = 0;
    let treeDragStartY = 0;
    let lastTreePinchDist = null;

    function setTreeZoom(val) {
      treeZoom = Math.min(2.2, Math.max(0.35, Math.round(val * 100) / 100));
      renderPhoneApp();
    }

    function zoomTreeBy(delta) {
      setTreeZoom(treeZoom + delta);
    }

    function resetTreeZoom() {
      treeZoom = 1.0;
      treePanX = 0;
      treePanY = 0;
      renderPhoneApp();
    }

    function fitTreeZoom(maxRowCount, levelCount) {
      const widthScale = maxRowCount > 2 ? (2.9 / maxRowCount) : 1.0;
      const heightScale = levelCount > 4 ? (4.0 / levelCount) : 1.0;
      const fit = Math.min(1.0, widthScale, heightScale);
      treePanX = 0;
      treePanY = 0;
      setTreeZoom(Math.max(0.4, fit));
    }

    function handleTreeMouseDown(e) {
      if (e.target.closest(".tree-node")) return;
      isTreeDragging = true;
      treeDragStartX = e.clientX - treePanX;
      treeDragStartY = e.clientY - treePanY;
    }

    function handleTreeMouseMove(e) {
      if (!isTreeDragging) return;
      treePanX = e.clientX - treeDragStartX;
      treePanY = e.clientY - treeDragStartY;
      const inner = document.getElementById("tree-pan-inner");
      if (inner) {
        inner.style.transform = `translate(${treePanX}px, ${treePanY}px)`;
      }
    }

    function handleTreeMouseUp() {
      isTreeDragging = false;
    }

    function handleTreeWheel(e) {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      zoomTreeBy(delta);
    }

    function handleTreeTouchStart(e) {
      if (e.touches && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTreePinchDist = Math.hypot(dx, dy);
      } else if (e.touches && e.touches.length === 1 && !e.target.closest(".tree-node")) {
        isTreeDragging = true;
        treeDragStartX = e.touches[0].clientX - treePanX;
        treeDragStartY = e.touches[0].clientY - treePanY;
      }
    }

    function handleTreeTouchMove(e) {
      if (e.touches && e.touches.length === 2 && lastTreePinchDist) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (dist > 5) {
          const ratio = dist / lastTreePinchDist;
          if (Math.abs(ratio - 1) > 0.04) {
            lastTreePinchDist = dist;
            setTreeZoom(treeZoom * ratio);
          }
        }
      } else if (e.touches && e.touches.length === 1 && isTreeDragging) {
        treePanX = e.touches[0].clientX - treeDragStartX;
        treePanY = e.touches[0].clientY - treeDragStartY;
        const inner = document.getElementById("tree-pan-inner");
        if (inner) {
          inner.style.transform = `translate(${treePanX}px, ${treePanY}px)`;
        }
      }
    }

    function handleTreeTouchEnd() {
      lastTreePinchDist = null;
      isTreeDragging = false;
    }

    function renderFamilyTreeTab() {
      const visiblePersons = sortPersonsByLastName(state.persons.filter(p => !p.isHidden));
      if (visiblePersons.length === 0) return "";
      const rootPerson = visiblePersons.find(p => p.id === selectedTreeRootId) || visiblePersons[0];
      const personMap = new Map(visiblePersons.map(p => [p.id, p]));

      // BFS generation calculation
      const genMap = new Map();
      const queue = [rootPerson.id];
      genMap.set(rootPerson.id, 0);

      while (queue.length > 0) {
        const currId = queue.shift();
        const currGen = genMap.get(currId) || 0;

        state.relations.filter(r => r.fromPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.toPersonId) && personMap.has(rel.toPersonId)) {
            genMap.set(rel.toPersonId, currGen + relationGenerationStep(rel.relationLabel));
            queue.push(rel.toPersonId);
          }
        });
        state.relations.filter(r => r.toPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.fromPersonId) && personMap.has(rel.fromPersonId)) {
            genMap.set(rel.fromPersonId, currGen - relationGenerationStep(rel.relationLabel));
            queue.push(rel.fromPersonId);
          }
        });
      }

      function shortRelationName(rawLabel) {
        const l = (rawLabel || "").trim().toLowerCase();
        if (l.startsWith("mutter")) return "Mutter";
        if (l.startsWith("vater")) return "Vater";
        if (l.startsWith("elternteil") || l.startsWith("eltern")) return "Eltern";
        if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner";
        if (l.startsWith("partner")) return "Partner";
        if (l.startsWith("bruder")) return "Bruder";
        if (l.startsWith("schwester")) return "Schwester";
        if (l.startsWith("geschwister")) return "Geschwister";
        if (l.startsWith("kind")) return "Kind";
        if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Oma/Opa";
        if (l.startsWith("enkel")) return "Enkelkind";
        if (l.startsWith("onkel") || l.startsWith("tante")) return "Onkel/Tante";
        if (l.startsWith("neffe") || l.startsWith("nichte")) return "Neffe/Nichte";
        if (l.startsWith("cousin")) return "Cousin/Cousine";
        return rawLabel.replace(/\s+von$/i, "").trim() || "Familie";
      }

      function roleRelativeToRoot(p, genLevel) {
        if (p.id === rootPerson.id) return "Fokus";
        const directOut = state.relations.find(r => r.fromPersonId === p.id && r.toPersonId === rootPerson.id);
        if (directOut) return shortRelationName(directOut.relationLabel);
        const directIn = state.relations.find(r => r.fromPersonId === rootPerson.id && r.toPersonId === p.id);
        if (directIn) return shortRelationName(inverseRelationLabel(directIn.relationLabel));

        if (genLevel <= -2) return "Oma/Opa";
        if (genLevel >= 2) return "Enkelkind";
        if (genLevel === -1) {
          const relToParent = state.relations.find(r =>
            r.fromPersonId === p.id && genMap.get(r.toPersonId) === -1 &&
            state.relations.some(pr =>
              (pr.fromPersonId === r.toPersonId && pr.toPersonId === rootPerson.id && relationGenerationStep(pr.relationLabel) === 1) ||
              (pr.fromPersonId === rootPerson.id && pr.toPersonId === r.toPersonId && relationGenerationStep(pr.relationLabel) === -1)
            )
          );
          if (relToParent && isPartnerRelation(relToParent.relationLabel)) return "Eltern";
          if (relToParent && isSiblingRelation(relToParent.relationLabel)) return "Onkel/Tante";
          return "Eltern";
        }
        if (genLevel === 1) {
          return "Kind";
        }
        const anyRel = state.relations.find(r => r.fromPersonId === p.id);
        if (anyRel) return shortRelationName(anyRel.relationLabel);
        return "Familie";
      }

      function arePartnersOrCoParents(idA, idB) {
        const directRel = state.relations.find(r =>
          (r.fromPersonId === idA && r.toPersonId === idB) ||
          (r.fromPersonId === idB && r.toPersonId === idA)
        );
        if (directRel && isPartnerRelation(directRel.relationLabel)) return true;
        const childrenOfA = state.relations
          .filter(r => r.toPersonId === idA && relationGenerationStep(r.relationLabel) === -1)
          .map(r => r.fromPersonId);
        return childrenOfA.some(cid =>
          state.relations.some(r => r.fromPersonId === cid && r.toPersonId === idB && relationGenerationStep(r.relationLabel) === -1)
        );
      }

      function orderRowMembers(members, genLevel) {
        if (genLevel === 0 && members.some(m => m.id === rootPerson.id)) {
          const others = members.filter(m => m.id !== rootPerson.id);
          const partners = others.filter(m => arePartnersOrCoParents(rootPerson.id, m.id));
          const nonPartners = others.filter(m => !arePartnersOrCoParents(rootPerson.id, m.id));
          if (partners.length > 0) {
            return [...nonPartners, rootPerson, ...partners];
          } else {
            const half = Math.ceil(nonPartners.length / 2);
            return [...nonPartners.slice(0, half), rootPerson, ...nonPartners.slice(half)];
          }
        }

        const visited = new Set();
        const ordered = [];
        const sortedSeed = [...members].sort((a, b) => {
          const aRole = roleRelativeToRoot(a, genLevel);
          const bRole = roleRelativeToRoot(b, genLevel);
          const aIsParent = aRole === "Eltern" || aRole === "Mutter" || aRole === "Vater";
          const bIsParent = bRole === "Eltern" || bRole === "Mutter" || bRole === "Vater";
          if (aIsParent && !bIsParent) return -1;
          if (!aIsParent && bIsParent) return 1;
          return comparePersonsByLastName(a, b);
        });

        for (const m of sortedSeed) {
          if (visited.has(m.id)) continue;
          visited.add(m.id);
          ordered.push(m);
          for (const candidate of members) {
            if (!visited.has(candidate.id) && arePartnersOrCoParents(m.id, candidate.id)) {
              visited.add(candidate.id);
              ordered.push(candidate);
            }
          }
        }
        return ordered;
      }

      const levelsMap = new Map();
      for (const [pid, gen] of genMap.entries()) {
        if (!levelsMap.has(gen)) levelsMap.set(gen, []);
        levelsMap.get(gen).push(personMap.get(pid));
      }
      const sortedLevels = [...levelsMap.keys()].sort((a, b) => a - b);
      let maxRowCount = 1;
      for (const lvl of sortedLevels) {
        const len = (levelsMap.get(lvl) || []).length;
        if (len > maxRowCount) maxRowCount = len;
      }

      const focusDropdownHtml = renderContactSearchDropdownHtml({
        key: "tab_family_tree_focus",
        persons: visiblePersons,
        selectedPersonId: rootPerson.id,
        placeholder: "🌳 Fokus-Kontakt (Nachname) wählen...",
        onSelectPersonJs: (pid) => `selectedTreeRootId=${pid}; renderPhoneApp()`,
        showInlineAlphabet: true,
        inModal: false
      });

      const unconnected = visiblePersons.filter(p => !genMap.has(p.id));
      const unconnectedHtml = unconnected.length > 0 ? `
        <div class="card" style="padding:8px 10px; display:flex; flex-direction:column; gap:6px;">
          <div style="font-size:12px; font-weight:600; color:var(--text-secondary);">
            Weitere Kontakte (${unconnected.length}, noch nicht mit ${escapeHtml(formatLastNameFirst(rootPerson.name))} verknüpft):
          </div>
          ${renderContactSearchDropdownHtml({
            key: "tab_family_tree_unconnected",
            persons: unconnected,
            selectedPersonId: null,
            placeholder: `🔎 Nicht verknüpften Kontakt auswählen (${unconnected.length})...`,
            onSelectPersonJs: (pid) => `openDetailModal(${pid})`,
            showInlineAlphabet: true,
            inModal: false
          })}
          <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:2px;">
            ${unconnected.map(up => `
              <button class="compact-btn" style="padding:4px 8px; font-size:11.5px;" onclick="openDetailModal(${up.id})">
                ${escapeHtml(formatLastNameFirst(up.name))}
              </button>
            `).join("")}
          </div>
        </div>
      ` : "";

      const z = treeZoom;
      const nodeMinW = Math.round(74 * z);
      const nodeMaxW = Math.round(122 * z);
      const nodePadV = Math.max(2, Math.round(6 * z));
      const nodePadH = Math.max(3, Math.round(9 * z));
      const nameFont = Math.max(6.5, +(11.5 * z).toFixed(1));
      const roleFont = Math.max(5.5, +(10 * z).toFixed(1));
      const connFont = Math.max(6, +(12 * z).toFixed(1));
      const vLineH = Math.max(6, Math.round(14 * z));
      const branchMinW = Math.max(40, Math.round(90 * z));
      const rowGap = Math.max(2, Math.round(4 * z));

      const levelsHtml = sortedLevels.map((lvl, idx) => {
        const members = orderRowMembers(levelsMap.get(lvl) || [], lvl);
        const nodesHtml = members.map((m, mIdx) => {
          const isRoot = m.id === rootPerson.id;
          const role = roleRelativeToRoot(m, lvl);
          const isPartner = isPartnerRelation(role);
          let connector = "";
          if (mIdx < members.length - 1) {
            const nextM = members[mIdx + 1];
            const coupled = arePartnersOrCoParents(m.id, nextM.id);
            connector = coupled
              ? `<span style="color:var(--partner-rose); font-size:${connFont}px; font-weight:700; padding:0 2px;">❤️</span>`
              : `<span style="width:${Math.max(2, Math.round(4 * z))}px; display:inline-block;"></span>`;
          }
          const avatarSize = Math.max(16, Math.round(24 * z));
          const photoHtml = m.photoBase64
            ? `<div style="display:flex; justify-content:center; margin-bottom:${Math.max(1, Math.round(2 * z))}px;">${renderPersonAvatarHtml(m.name, m.photoBase64, avatarSize)}</div>`
            : "";
          return `
            <div class="tree-node ${isRoot ? 'root' : ''} ${isPartner ? 'partner' : ''}"
                 style="min-width:${nodeMinW}px; max-width:${nodeMaxW}px; padding:${nodePadV}px ${nodePadH}px; border-radius:10px;"
                 onclick="openDetailModal(${m.id})">
              ${photoHtml}
              <div style="font-size:${nameFont}px; font-weight:700; color:var(--text-primary); line-height:1.2;">${escapeHtml(m.name)}</div>
              <div style="font-size:${roleFont}px; color:${isRoot ? 'var(--accent-steel)' : (isPartner ? 'var(--partner-rose)' : 'var(--tree-green)')}; margin-top:2px; line-height:1.1; font-weight:600;">
                ${escapeHtml(role)}
              </div>
            </div>
            ${connector}
          `;
        }).join("");

        const nextMembers = idx < sortedLevels.length - 1 ? (levelsMap.get(sortedLevels[idx + 1]) || []) : [];
        const connectorDown = idx < sortedLevels.length - 1 ? `
          <div class="tree-line-vertical" style="height:${vLineH}px;"></div>
          ${nextMembers.length > 1 ? `<div class="tree-branch-bar" style="min-width:${branchMinW}px;"></div>` : ""}
        ` : "";

        return `
          <div class="tree-row" style="gap:${rowGap}px; width:max-content; overflow:visible;">${nodesHtml}</div>
          ${connectorDown}
        `;
      }).join("");

      const zoomPct = Math.round(treeZoom * 100);

      return `
        <div class="card" style="padding:8px 10px; display:flex; flex-direction:column; gap:7px;">
          <div style="font-size:11.5px; font-weight:600; color:var(--text-secondary);">🌳 Fokus-Kontakt im Stammbaum (Nachname, Vorname):</div>
          ${focusDropdownHtml}
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
            <span style="font-size:11px; color:var(--text-muted);">✋ Ziehen & 🔍 Zoomen:</span>
            <div class="btn-row" style="gap:4px;">
              <button class="compact-btn" style="padding:3px 8px; font-weight:700;" onclick="zoomTreeBy(-0.15)" title="Rauszoomen">➖</button>
              <button class="compact-btn ${zoomPct === 100 && treePanX === 0 && treePanY === 0 ? 'primary' : ''}" style="padding:3px 8px; font-size:11px;" onclick="resetTreeZoom()" title="Auf 100% & Mitte zurücksetzen">${zoomPct}%</button>
              <button class="compact-btn" style="padding:3px 8px; font-weight:700;" onclick="zoomTreeBy(0.15)" title="Reinzoomen">➕</button>
              <button class="compact-btn" style="padding:3px 8px; font-size:11px;" onclick="fitTreeZoom(${maxRowCount}, ${sortedLevels.length})" title="Großen Stammbaum komplett einpassen">⛶ Passend</button>
            </div>
          </div>
        </div>
        <div class="tree-container"
             style="min-height:210px; overflow:hidden; align-items: stretch; cursor:grab; user-select:none;"
             onmousedown="handleTreeMouseDown(event)"
             onmousemove="handleTreeMouseMove(event)"
             onmouseup="handleTreeMouseUp()"
             onmouseleave="handleTreeMouseUp()"
             onwheel="handleTreeWheel(event)"
             ontouchstart="handleTreeTouchStart(event)"
             ontouchmove="handleTreeTouchMove(event)"
             ontouchend="handleTreeTouchEnd()">
          <div id="tree-pan-inner" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:max-content; margin:0 auto; padding:8px; transform:translate(${treePanX}px, ${treePanY}px);">
            ${levelsHtml}
          </div>
        </div>
        ${unconnectedHtml}
      `;
    }

    function renderDirectChatTab() {
      if (state.directMessages.length === 0) {
        return `<div class="card"><div style="font-size:12px; color:var(--text-secondary);">Noch keine Nachrichten vorhanden.</div></div>`;
      }
      return state.directMessages.map(m => {
        const person = state.persons.find(p => p.id === m.personId);
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
              <span>${escapeHtml(person ? person.name : m.senderDisplayName)} (${escapeHtml(m.targetPeerId)})</span>
              <span>${escapeHtml(m.timestampIso)}</span>
            </div>
            <div style="font-size:13px; margin-top:4px;"><b>${escapeHtml(m.senderDisplayName)}:</b> ${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join("");
    }

    function formatTimerUnitDe(unit) {
      switch ((unit || "").toUpperCase()) {
        case "DAYS": return "Tage";
        case "WEEKS": return "Wochen";
        case "MONTHS": return "Monate";
        case "YEARS": return "Jahre";
        default: return unit || "Tage";
      }
    }

    let timerEntryModalState = null; // { isEditing, personId, createNewContact, newName, newPhone, interval, unit, startDate, notes }

    function openTimerEntryModal(personId = null) {
      const visible = sortPersonsByLastName(state.persons.filter(p => !p.isHidden));
      const target = personId ? visible.find(p => p.id === personId) : visible[0];
      timerEntryModalState = {
        isEditing: !!personId && !!target,
        personId: target ? target.id : -1,
        createNewContact: !personId && visible.length === 0,
        newFirstName: "",
        newLastName: "",
        newPhone: "",
        interval: String((target && target.timerInterval > 0) ? target.timerInterval : 14),
        unit: (target && target.timerUnit) ? target.timerUnit : "DAYS",
        startDate: formatIsoToDdMmYyyy((target && target.lastContactedIso) ? target.lastContactedIso : todayIso()),
        notes: (target && target.notes) ? target.notes : ""
      };
      renderModals();
    }

    function selectContactForTimerModal(personId) {
      if (!timerEntryModalState) return;
      const p = state.persons.find(x => x.id === personId);
      if (!p) return;
      timerEntryModalState.personId = p.id;
      timerEntryModalState.interval = String(p.timerInterval > 0 ? p.timerInterval : 14);
      timerEntryModalState.unit = p.timerUnit || "DAYS";
      timerEntryModalState.startDate = formatIsoToDdMmYyyy(p.lastContactedIso || todayIso());
      timerEntryModalState.notes = p.notes || "";
      renderModals();
    }

    function saveTimerEntryModal() {
      if (!timerEntryModalState) return;
      const t = timerEntryModalState;
      const cleanInterval = Math.max(1, parseInt(t.interval, 10) || 14);
      const cleanUnit = t.unit || "DAYS";
      const cleanStartIso = normalizeDateInputToIso(t.startDate) || todayIso();

      if (t.createNewContact) {
        const cleanName = combineFirstAndLastName(t.newFirstName || "", t.newLastName || "");
        if (!cleanName) return;
        const newId = state.nextId++;
        state.persons.push({
          id: newId,
          name: cleanName,
          birthdayIso: "",
          hasNoOwnPhone: false,
          phone: (t.newPhone || "").trim(),
          email: "",
          appPeerId: "",
          notes: (t.notes || "").trim(),
          photoBase64: makeIllustratedPortraitDataUrl(cleanName),
          timerEnabled: true,
          timerInterval: cleanInterval,
          timerUnit: cleanUnit,
          lastContactedIso: cleanStartIso
        });
        addLog(`⏳ Neuer Kontakt "${cleanName}" mit Melde-Timer (alle ${cleanInterval} ${formatTimerUnitDe(cleanUnit)}) angelegt.`);
      } else {
        const person = state.persons.find(p => p.id === t.personId);
        if (!person) return;
        person.timerEnabled = true;
        person.timerInterval = cleanInterval;
        person.timerUnit = cleanUnit;
        person.lastContactedIso = cleanStartIso;
        if ((t.notes || "").trim()) {
          person.notes = t.notes.trim();
        }
        addLog(`⏳ Melde-Timer für "${person.name}" gespeichert (alle ${cleanInterval} ${formatTimerUnitDe(cleanUnit)}).`);
      }
      timerEntryModalState = null;
      saveState();
    }

    function disableTimerForPerson(personId) {
      const person = state.persons.find(p => p.id === personId);
      if (!person) return;
      askDeleteConfirm(`Melde-Timer für „${formatLastNameFirst(person.name)}“ deaktivieren?`, () => {
        person.timerEnabled = false;
        timerEntryModalState = null;
        addLog(`⏳ Melde-Timer für "${person.name}" deaktiviert.`);
        saveState();
      });
    }

      const today = todayIso();
      const allTimerPersons = sortPersonsByLastName(state.persons.filter(p => !p.isHidden && p.timerEnabled));
      const timerPersons = allTimerPersons.filter(p => matchesPersonSearchAndLetter(p, tabSearchQuery, tabSelectedLetter));

      const searchCard = `
        <div class="card" style="padding:8px 10px; display:flex; flex-direction:column; gap:6px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
            <span style="font-size:13.5px; font-weight:700; color:var(--text-primary);">⏳ Melde-Timer (${allTimerPersons.length})</span>
            <button class="compact-btn primary" onclick="openTimerEntryModal()">＋ Timer-Eintrag</button>
          </div>
          ${renderContactSearchDropdownHtml({
            key: "tab_timer",
            persons: allTimerPersons,
            selectedPersonId: null,
            placeholder: `🔎 Timer-Kontakt suchen / per Dropdown wählen (${timerPersons.length}/${allTimerPersons.length})...`,

          </div>
        </div>

      const listHtml = timerPersons.map(p => {
        const nextDate = ContactResolver.nextTimerDate(p, today);
        const diff = daysBetween(today, nextDate);
        const pillText = diff <= 0 ? "⏳ Fällig!" : `⏳ in ${diff}T`;
        return `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div style="cursor:pointer;" onclick="openTimerEntryModal(${p.id})">
              ${renderPersonAvatarHtml(p.name)}
            </div>
            <div style="flex:1; min-width:0; cursor:pointer;" onclick="openTimerEntryModal(${p.id})">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span class="person-name-link">${escapeHtml(formatLastNameFirst(p.name))}</span>
                <span class="countdown-pill ${diff <= 0 ? 'today' : (diff <= 3 ? 'soon' : '')}">${pillText}</span>
              </div>
              <div class="person-sub">Alle ${p.timerInterval} ${formatTimerUnitDe(p.timerUnit)} • Nächste: ${formatIsoToDdMmYyyy(nextDate)}</div>
            </div>
            <div class="btn-row">
              <button class="compact-btn" style="padding:5px 7px;" onclick="openTimerEntryModal(${p.id})" title="Timer bearbeiten">✏️</button>
              <button class="compact-btn primary" onclick="openPopupForPerson(${p.id}, 'Melde-Timer')">💬 Gruß</button>
              <span style="color:var(--warn-amber); cursor:pointer; font-weight:700; padding:0 4px;" onclick="disableTimerForPerson(${p.id})" title="Timer deaktivieren">✕</span>
            </div>
          </div>
        `;
      }).join("");
      return searchCard + emptyHtml + listHtml;
    }

    function renderEventsTab() {
      const today = todayIso();
      const visiblePersons = sortPersonsByLastName(state.persons.filter(p => !p.isHidden));
      const rows = [];
      state.specialEvents.forEach(ev => {
        const person = visiblePersons.find(p => p.id === ev.personId);
        if (!person) return;
        if (!matchesPersonSearchAndLetter(person, tabSearchQuery, tabSelectedLetter) &&
            !ev.title.toLowerCase().includes((tabSearchQuery || "").trim().toLowerCase())) {
          return;
        }
        const days = daysUntilEventSpec(ev.dateIso, today);
        const isWeekly = isWeeklyDateSpec(ev.dateIso) || isRepeatDateSpec(ev.dateIso);
        rows.push({
          days,
          person,
          personId: ev.personId,
          personName: person.name,
          title: `${isWeekly ? "🔁 " : "🔔 "}${ev.title} (${formatLastNameFirst(person.name)})`,
          sub: `${formatIsoToDdMmYyyy(ev.dateIso)}`,
          badge: days === 0 ? "Heute!" : `in ${days}T`
        });
      });
      visiblePersons.forEach(p => {
        if (p.birthdayIso && matchesPersonSearchAndLetter(p, tabSearchQuery, tabSelectedLetter)) {
          const days = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
          rows.push({
            days: days ?? 999,
            person: p,
            personId: p.id,
            personName: p.name,
            title: `🎂 ${formatLastNameFirst(p.name)}`,
            sub: `${formatIsoToDdMmYyyy(p.birthdayIso)} (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`,
            badge: days === 0 ? "Heute!" : `in ${days}T`
          });
        }
      });
      rows.sort((a, b) => {
        if (contactSortMode === "lastname") return comparePersonsByLastName(a.person, b.person);
        return a.days - b.days;
      });
      const searchCard = `
        <div class="card" style="padding:8px 10px;">
          ${renderContactSearchDropdownHtml({
            key: "tab_events",
            persons: visiblePersons,
            selectedPersonId: null,
            placeholder: `🔎 Erinnerung / Kontakt suchen (${rows.length})...`,
            onSelectPersonJs: (pid) => `openDetailModal(${pid})`,
            showInlineAlphabet: true,
            inModal: false,
            syncWithTab: true
          })}
        </div>
      `;
      const listHtml = rows.map(r => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div style="cursor:pointer;" onclick="openDetailModal(${r.personId})">
            ${renderPersonAvatarHtml(r.personName)}
          </div>
          <div style="flex:1; min-width:0; cursor:pointer;" onclick="openDetailModal(${r.personId})">
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span class="person-name-link" style="font-size:14px;">${escapeHtml(r.title)}</span>
              <span class="countdown-pill ${r.days === 0 ? 'today' : (r.days <= 7 ? 'soon' : '')}">${escapeHtml(r.badge)}</span>
            </div>
            <div class="person-sub">${escapeHtml(r.sub)}</div>
          </div>
          <button class="compact-btn primary" onclick="openPopupForPerson(${r.personId}, '${escapeHtml(r.title)}')">💬 Gruß</button>
        </div>
      `).join("");
      return searchCard + listHtml;

    let selectedWichtelGroupId = null;
    let wichtelGroupModalState = null; // { mode: 'create'|'edit'|'reuse', groupId, historyId, groupName, adminName, motto, budget, revealDate, reminderDaysBefore, excludeCouples, excludeLastYear, reusedParticipants }
    let wichtelParticipantModalState = null; // { mode: 'add'|'edit', groupId, participantId, checkedPersonIds, customName, customPhone, personId, name, phone, wishText, noGos, address, wishlistUrl, extraWishUrls }
    let wichtelSecretPeekState = null; // { groupId, participantId }
    let wichtelAnonQuestionState = null; // { groupId, targetParticipantId, questionText }
    let wichtelHistoryImportModalOpen = false;
    let wichtelHistoryShareState = null; // { historyId }

    const WICHTEL_MOTTOS = [
      "🎁 Klassisches Wichteln",
      "♻️ Schrottwichteln",
      "📖 Buch-Wichteln",
      "🛠️ Selbstgemachtes",
      "🎲 Würfel-/Räuberwichteln"
    ];

    function getCouplePartnerForPerson(personId) {
      if (!personId) return null;
      const directRel = state.relations.find(r =>
        (r.fromPersonId === personId || r.toPersonId === personId) &&
        isPartnerRelation(r.relationLabel)
      );
      if (directRel) {
        const partnerId = directRel.fromPersonId === personId ? directRel.toPersonId : directRel.fromPersonId;
        return state.persons.find(p => p.id === partnerId) || null;
      }
      // Auch gemeinsame Kinder (Co-Parents im Stammbaum) prüfen
      const childrenIds = state.relations
        .filter(r => r.toPersonId === personId && relationGenerationStep(r.relationLabel) === -1)
        .map(r => r.fromPersonId);
      for (const cid of childrenIds) {
        const otherParentRel = state.relations.find(r =>
          r.fromPersonId === cid && r.toPersonId !== personId && relationGenerationStep(r.relationLabel) === -1
        );
        if (otherParentRel) {
          return state.persons.find(p => p.id === otherParentRel.toPersonId) || null;
        }
      }
      return null;
    }

    function extractAddressFromPerson(person) {
      if (!person || !Array.isArray(person.extraInfos)) return "";
      const addrRow = person.extraInfos.find(x => (x.label || "").toLowerCase().includes("adresse") || (x.label || "").toLowerCase().includes("anschrift"));
      return addrRow ? (addrRow.value || "") : "";
    }

    function ensureWichtelGroups() {
      if (!Array.isArray(state.wichtelGroups)) {
        state.wichtelGroups = [];
      }
      if (!Array.isArray(state.wichtelHistory)) {
        state.wichtelHistory = [];
      }
      if (state.wichtelGroups.length === 0 && state.persons.length > 0) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 5);
        state.wichtelGroups.push({
          id: state.nextId++,
          groupName: `Familien-Wichteln ${xmasYear}`,
          adminName: adultPersons[1] ? adultPersons[1].name : (adultPersons[0] ? adultPersons[0].name : "Ich (Admin)"),
          motto: "🎁 Klassisches Wichteln",
          budget: "25 €",
          revealDateIso: `${xmasYear}-12-24`,
          reminderDaysBefore: 7,
          excludeCouples: true,
          excludeLastYear: true,
          forceRevealed: false,
          isDrawn: false,
          drawnAt: "",
          participants: adultPersons.map(p => ({
            id: state.nextId++,
            personId: p.id,
            name: p.name,
            phone: p.phone || "",
            appPeerId: p.appPeerId || "",
            wishText: p.notes || "Überraschung, Schokolade, Buch",
            noGos: "",
            address: extractAddressFromPerson(p),
            wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`,
            extraWishUrls: [],
            drawnTargetId: null,
            lastYearTargetId: null,
            notifiedVia: ""
          }))
        });
      }
      if (state.wichtelHistory.length === 0 && state.persons.length >= 2) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 4);
        if (adultPersons.length >= 2) {
          state.wichtelHistory.push({
            id: state.nextId++,
            year: xmasYear - 1,
            groupName: `Familien-Wichteln ${xmasYear - 1}`,
            adminName: adultPersons[0].name,
            motto: "🎁 Klassisches Wichteln",
            budget: "25 €",
            completedDateIso: `${xmasYear - 1}-12-24`,
            pairings: adultPersons.map((p, idx) => {
              const target = adultPersons[(idx + 1) % adultPersons.length];
              return {
                giverName: p.name,
                giverPersonId: p.id,
                giverPhone: p.phone || "",
                receiverName: target.name,
                receiverPersonId: target.id,
                wishText: p.notes || "",
                noGos: "",
                address: extractAddressFromPerson(p),
                wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`
              };
            })
          });
        }
      }
      if (selectedWichtelGroupId === null || !state.wichtelGroups.some(g => g.id === selectedWichtelGroupId)) {
        selectedWichtelGroupId = state.wichtelGroups[0] ? state.wichtelGroups[0].id : null;
      }
    }

    function getHistoricalTargetsForParticipant(part) {
      if (!part || !Array.isArray(state.wichtelHistory)) return [];
      const results = [];
      const pNameLower = (part.name || "").trim().toLowerCase();
      for (const h of state.wichtelHistory) {
        for (const pair of (h.pairings || [])) {
          const sameId = part.personId && pair.giverPersonId && part.personId === pair.giverPersonId;
          const sameName = (pair.giverName || "").trim().toLowerCase() === pNameLower;
          if (sameId || sameName) {
            results.push({
              year: h.year || (h.completedDateIso ? h.completedDateIso.slice(0, 4) : ""),
              groupName: h.groupName,
              receiverName: pair.receiverName,
              receiverPersonId: pair.receiverPersonId
            });
          }
        }
      }
      return results;
    }

    function hasDrawnTargetInHistory(giverPart, receiverPart) {
      if (!giverPart || !receiverPart) return false;
      const pastList = getHistoricalTargetsForParticipant(giverPart);
      const rNameLower = (receiverPart.name || "").trim().toLowerCase();
      return pastList.some(item =>
        (receiverPart.personId && item.receiverPersonId && receiverPart.personId === item.receiverPersonId) ||
        (item.receiverName || "").trim().toLowerCase() === rNameLower
      );
    }

    function isWichtelGroupRevealed(group) {
      if (!group) return false;
      if (group.forceRevealed) return true;
      const today = todayIso();
      return !!(group.revealDateIso && today >= group.revealDateIso);
    }
