      `;

      const participantsHtml = group.participants.map(part => {
        const target = group.participants.find(x => x.id === part.drawnTargetId);
        const lastYearTarget = group.participants.find(x => x.id === part.lastYearTargetId);
        const pastHistoryTargets = getHistoricalTargetsForParticipant(part);
        const partnerPerson = getCouplePartnerForPerson(part.personId);
        const partnerInGroup = partnerPerson ? group.participants.find(x => x.personId === partnerPerson.id) : null;
        const allUrls = [part.wishlistUrl, ...(Array.isArray(part.extraWishUrls) ? part.extraWishUrls : [])].filter(u => u && u.trim());

        const secretLine = !group.isDrawn
          ? `<span style="color:var(--text-muted);">Noch nicht ausgelost</span>`
          : (revealed && target
            ? `<span style="color:var(--warn-amber); font-weight:700;">🎁 Hat gezogen: ${escapeHtml(target.name)}</span>`
            : `<span style="color:var(--tree-green); font-weight:600;">🎲 Zugelost • 🔒 Geheim bis ${escapeHtml(revealDateFormatted)}</span>`);

        const historyExclusionBadges = [];
        if (lastYearTarget && !pastHistoryTargets.some(h => h.receiverName === lastYearTarget.name)) {
          historyExclusionBadges.push(`≠ ${lastYearTarget.name.split(" ")[0]}`);
        }
        pastHistoryTargets.forEach(h => {
          const shortR = (h.receiverName || "").split(" ")[0];
          const label = h.year ? `≠ ${shortR} (${h.year})` : `≠ ${shortR}`;
          if (!historyExclusionBadges.includes(label)) historyExclusionBadges.push(label);
        });

        return `
          <div class="card" style="padding:10px 12px; ${partnerInGroup && group.excludeCouples ? 'border-left: 3px solid var(--partner-rose);' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              ${renderPersonAvatarHtml(part.name)}
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span style="font-size:14px; font-weight:600; color:var(--text-primary);">${escapeHtml(part.name)}</span>
                  ${part.name === group.adminName ? `<span class="badge-app">👑 Admin</span>` : ""}
                  ${partnerInGroup && group.excludeCouples ? `<span style="font-size:10.5px; padding:1px 6px; border-radius:4px; background:rgba(244,63,94,0.16); color:var(--partner-rose); font-weight:700;">💑 Paar mit ${escapeHtml(partnerInGroup.name.split(" ")[0])} (gesperrt füreinander)</span>` : ""}
                  ${part.notifiedVia ? `<span style="font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(16,185,129,0.16); color:var(--tree-green); font-weight:600;">✓ ${escapeHtml(part.notifiedVia)}</span>` : ""}
                </div>
                <div style="font-size:11.5px; margin-top:3px;">
                  ${secretLine}
                </div>
                ${group.excludeLastYear !== false && historyExclusionBadges.length > 0 ? `
                  <div style="font-size:10.5px; color:var(--accent-steel); margin-top:2px;">
                    📜 <b>Keine Wiederholung (Historie):</b> ${escapeHtml(historyExclusionBadges.join(", "))}
                  </div>
                ` : ""}
                ${part.wishText ? `
                  <div style="font-size:11.5px; color:var(--text-secondary); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span>🎁 <b>Wunsch:</b> ${escapeHtml(part.wishText)}</span>
                    <a href="https://www.amazon.de/s?k=${encodeURIComponent(part.wishText)}" target="_blank" rel="noopener" style="font-size:10.5px; color:var(--accent-steel); text-decoration:none; background:rgba(56,189,248,0.12); padding:1px 6px; border-radius:4px; font-weight:600;">🔎 Amazon-Suche ↗</a>
                  </div>
                ` : ""}
                ${part.noGos ? `<div style="font-size:11px; color:var(--warn-amber); margin-top:3px;">🚫 <b>Bitte NICHT / Hinweis:</b> ${escapeHtml(part.noGos)}</div>` : ""}
                ${part.address ? `<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">📦 <b>Adresse:</b> ${escapeHtml(part.address)}</div>` : ""}
                ${allUrls.length > 0 ? `
                  <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
                    ${allUrls.map((u, idx) => `
                      <a href="${escapeHtml(u)}" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent-steel); text-decoration:none; font-weight:600;">
                        🛒 ${idx === 0 ? 'Amazon-Wunschliste' : `Wunsch-Link ${idx + 1}`} ↗
                      </a>
                    `).join(" • ")}
                  </div>
                ` : ""}
              </div>
              <div style="display:flex; gap:4px; align-items:center;">
                <button class="compact-btn" style="padding:4px 7px; font-size:11px;" onclick="openWichtelParticipantModal('edit', ${group.id}, ${part.id})" title="Wunschliste, No-Gos, Adresse & Links bearbeiten">🎁 Wunsch</button>
                <button class="compact-btn" style="padding:4px 7px; font-size:11px;" onclick="openWichtelAnonQuestionModal(${group.id}, ${part.id})" title="Anonyme Wichtel-Frage an ${escapeHtml(part.name)} senden">🕵️</button>
                <span style="color:var(--warn-amber); cursor:pointer; font-weight:700; padding:0 4px;" onclick="removeWichtelParticipant(${group.id}, ${part.id})" title="Teilnehmer entfernen">✕</span>
              </div>
            </div>

            ${group.isDrawn && target ? `
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-slate);">
                <button class="compact-btn primary" style="padding:4px 9px; font-size:11px;" onclick="notifyWichtelParticipant(${group.id}, ${part.id}, 'BlindWhatsApp')" title="Sendet einen verschlüsselten Los-Code per WhatsApp, sodass selbst der Gruppenadmin beim Absenden den Namen nicht im Klartext sieht!">
                  🔐 Blind-Code (WhatsApp)
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="notifyWichtelParticipant(${group.id}, ${part.id}, 'WhatsApp')">
                  📲 Klartext (WhatsApp)
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="notifyWichtelParticipant(${group.id}, ${part.id}, 'In-App')">
                  💬 In-App
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="openWichtelSecretPeek(${group.id}, ${part.id})" title="Nur für ${escapeHtml(part.name)} kurz aufdecken">
                  👁️ Geheimes Los
                </button>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      const historyHtml = renderWichtelHistorySection();
      return topBar + groupHeaderCard + participantsHtml + historyHtml;
    }

    function renderWichtelHistorySection() {
      const historyList = Array.isArray(state.wichtelHistory) ? state.wichtelHistory : [];
      const itemsHtml = historyList.length === 0
        ? `<div style="font-size:12px; color:var(--text-muted);">Noch keine abgeschlossenen Wichtelrunden in der Historie.</div>`
        : historyList.map(h => `
            <div style="background:var(--bg-slate); border:1px solid var(--border-slate); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:6px;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                <div>
                  <div style="font-size:13.5px; font-weight:700; color:var(--text-primary);">
                    📜 ${escapeHtml(h.groupName)} ${h.year ? `<span class="badge-app">${escapeHtml(String(h.year))}</span>` : ""}
                  </div>
                  <div style="font-size:11px; color:var(--text-secondary); margin-top:2px;">
                    👑 Admin: <b>${escapeHtml(h.adminName || "Admin")}</b> • ${escapeHtml(h.motto || "🎁 Klassisches Wichteln")} ${h.budget ? `• 💶 ${escapeHtml(h.budget)}` : ""}
                  </div>
                </div>
                <button class="compact-btn danger" style="padding:3px 7px; font-size:11px;" onclick="deleteWichtelHistoryEntry(${h.id})" title="Diesen Wichtel-Historie-Eintrag einzeln löschen">🗑️</button>
              </div>
              <div style="display:flex; flex-direction:column; gap:3px; padding:6px 8px; background:var(--card-slate); border-radius:6px; border:1px solid var(--border-slate);">
                ${(h.pairings || []).map((pair, pIdx) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--text-primary);">
                    <span>🎁 <b>${escapeHtml(pair.giverName)}</b> ➔ hat <b>${escapeHtml(pair.receiverName)}</b> gezogen</span>
                    <span style="color:var(--warn-amber); cursor:pointer; font-weight:700; padding:0 4px;" onclick="deleteSingleWichtelHistoryPairing(${h.id}, ${pIdx})" title="Einzelne Paarung aus Historie löschen">✕</span>
                  </div>
                `).join("")}
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;">
                <button class="compact-btn primary" style="padding:4px 9px; font-size:11px; font-weight:700;" onclick="reuseWichtelHistoryEntry(${h.id})" title="Altes Wichteln für neues Jahr als Admin wiederverwenden & vor Neustart bearbeiten">
                  ♻️ Wiederverwenden & Bearbeiten
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="shareWichtelHistoryToParticipants(${h.id}, 'WhatsApp')" title="Wichtel-Historie nach Abschluss an alle Teilnehmer per WhatsApp verteilen">
                  📲 Historie an Teilnehmer
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="shareWichtelHistoryToParticipants(${h.id}, 'In-App')" title="Wichtel-Historie In-App an alle Teilnehmer senden">
                  💬 In-App verteilen
                </button>
              </div>
            </div>
          `).join("");

      return `
        <div class="card" style="margin-top:8px; border-color:var(--border-slate); display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
            <div>
              <div style="font-size:14.5px; font-weight:700; color:var(--accent-steel);">📜 Wichtel-Historie (${historyList.length})</div>
              <div style="font-size:11px; color:var(--text-secondary);">
                Vergangene Jahre für „Keine Wiederholungen“ • Einzeln löschbar • Als Admin wiederverwendbar & vor Neustart bearbeitbar
              </div>
            </div>
            <button class="compact-btn" style="padding:4px 8px; font-size:11px;" onclick="wichtelHistoryImportModalOpen=true; renderModals();" title="Empfangene Wichtel-Historie von einem anderen Gruppenadmin importieren">
              📥 Historie importieren
            </button>
          </div>
          ${itemsHtml}
        </div>
      `;
    }

    function renderWidget() {
      const container = document.getElementById("widget-rows");
      const today = todayIso();
      const items = [];
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && bdayDays <= 60) {
          items.push({ sortKey: bdayDays, personId: p.id, name: p.name, subtitle: `Geburtstag (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`, badge: bdayDays === 0 ? "Heute" : `in ${bdayDays}T` });
        }
      }
      for (const ev of state.specialEvents) {
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff >= 0 && diff <= 45) {
          const person = state.persons.find(p => p.id === ev.personId && !p.isHidden);
          const isWeekly = isWeeklyDateSpec(ev.dateIso) || isRepeatDateSpec(ev.dateIso);
          if (person) items.push({ sortKey: diff, personId: person.id, name: person.name, subtitle: isWeekly ? `${formatIsoToDdMmYyyy(ev.dateIso)}: ${ev.title}` : `Erinnerung: ${ev.title}`, badge: diff === 0 ? "Heute" : `in ${diff}T` });
        }
      }
      items.sort((a, b) => a.sortKey - b.sortKey);
      container.innerHTML = items.slice(0, 5).map(item => `
        <div class="widget-row" onclick="openPopupForPerson(${item.personId}, '${escapeHtml(item.subtitle)}')">
          <div>
            <div class="widget-row-name">${escapeHtml(item.name)}</div>
            <div class="widget-row-sub">${escapeHtml(item.subtitle)}</div>
          </div>
          <div class="widget-row-badge">${escapeHtml(item.badge)}</div>
        </div>
      `).join("");
    }

    function renderModals() {
      const modalRoot = document.getElementById("modal-root");
      const relPresetOptions = RELATION_PRESETS.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join("");
      const treeActive = state.treeEnabled !== false;

      if (pendingDeleteConfirm !== null) {
        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">
            <div class="modal" style="max-width:320px;" onclick="event.stopPropagation()">
              <div class="modal-title" style="color:var(--warn-amber);">Sicherheitsabfrage</div>
              <div style="font-size:13px; color:var(--text-primary); line-height:1.4;">
                ${escapeHtml(pendingDeleteConfirm.message)}
              </div>
              <div class="modal-footer" style="justify-content:flex-end;">
                <button class="compact-btn" onclick="cancelDeleteConfirm()">Abbrechen</button>
                <button class="compact-btn danger" onclick="executeDeleteConfirm()">Ja, löschen</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (showGreetingsEditorModal) {
        const list = getBirthdayGreetingsList();
        const q = (greetingsSearchQuery || "").trim().toLowerCase();
        const selL = (greetingsSelectedLetter || "").trim().toUpperCase();
        const filtered = list
          .map((text, idx) => ({ text, idx }))
          .filter(item => {
            const matchesQ = !q || item.text.toLowerCase().includes(q) || String(item.idx + 1) === q;
            const matchesL = !selL || extractTextInitial(item.text) === selL;
            return matchesQ && matchesL;
          });

        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">
            <div class="modal" style="max-width:365px;" onclick="event.stopPropagation()">
              <div class="modal-header-sticky">
                <div class="modal-title" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🎂 Geburtstagsgrüße (${list.length})</div>
                <div class="btn-row">
                  <button class="compact-btn" style="padding:4px 7px; font-size:11px;" onclick="resetDefaultBirthdayGreetings()">🔄 100</button>
                  <button class="compact-btn primary" style="padding:4px 8px; font-size:11px;" onclick="showGreetingsEditorModal=false; saveState();">✓ Fertig</button>
                </div>
              </div>
              <div style="font-size:11px; color:var(--text-secondary); line-height:1.35;">
                Beim Öffnen einer Nachricht wählt die App zufällig einen dieser Glückwunschtexte aus. Der Platzhalter <b>{Name}</b> wird automatisch durch den Vornamen ersetzt.
              </div>
              <div style="display:flex; gap:5px; align-items:center;">
                <input class="field-input" style="flex:1;" placeholder="🔎 Spruch suchen (z. B. Glück, Kuchen, Nr.)..." value="${escapeHtml(greetingsSearchQuery)}" oninput="greetingsSearchQuery=this.value; renderModals();" />
                <button class="compact-btn" onclick="greetingsDropdownOpen=!greetingsDropdownOpen; renderModals();">▼ Liste (${filtered.length})</button>
                <button class="compact-btn primary" onclick="addNewBirthdayGreeting()">+ Neu</button>
              </div>
              ${renderAlphabetQuickBarHtml(greetingsSelectedLetter, (l) => `greetingsSelectedLetter='${l}'; renderModals()`)}
              ${greetingsDropdownOpen ? `
                <div style="background:var(--card-slate); border:1.5px solid var(--accent-steel); border-radius:8px; overflow:hidden;">
                  <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-slate); padding:6px 9px; border-bottom:1px solid var(--border-slate);">
                    <span style="font-size:11.5px; font-weight:700; color:var(--accent-steel);">✓ ${filtered.length} Sprüche</span>
                    <button class="compact-btn primary" style="padding:3px 8px; font-size:11px;" onclick="greetingsDropdownOpen=false; renderModals();">✓ Bestätigen</button>
                  </div>
                  <div style="max-height:160px; overflow-y:auto;">
                    ${filtered.map(item => `
                      <div style="padding:6px 9px; font-size:11.5px; cursor:pointer; border-bottom:1px solid var(--border-slate);" onclick="greetingsSearchQuery='${item.idx + 1}'; greetingsDropdownOpen=false; renderModals();">
                        <b>#${item.idx + 1}:</b> ${escapeHtml(item.text)}
                      </div>
                    `).join("")}
                  </div>
                </div>
              ` : ""}
              <div style="display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow-y:auto; padding-right:2px;">
                ${filtered.map(item => `
                  <div style="display:flex; gap:5px; align-items:center; background:var(--bg-slate); border:1px solid var(--border-slate); border-radius:7px; padding:5px 7px;">
                    <span style="font-size:10.5px; font-weight:700; color:var(--accent-steel); min-width:24px;">#${item.idx + 1}</span>
                    <input class="field-input" style="flex:1; font-size:11.5px; padding:4px 6px;" value="${escapeHtml(item.text)}" onchange="updateBirthdayGreetingAt(${item.idx}, this.value)" />
                    <span style="color:var(--warn-amber); cursor:pointer; font-weight:700; padding:0 4px;" onclick="deleteBirthdayGreetingAt(${item.idx})" title="Diesen Spruch löschen">✕</span>
                  </div>
                `).join("")}
              </div>
              <div class="modal-footer" style="justify-content:space-between;">
                <button class="compact-btn" onclick="showGreetingsEditorModal=false; showOptionsDialog=true; renderModals();">← Zurück zu Optionen</button>
                <button class="compact-btn primary" onclick="showGreetingsEditorModal=false; saveState();">✓ Fertig</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (mergeContactsModalState !== null) {
        const ms = mergeContactsModalState;
        const groups = findDuplicateSuggestionGroups(state.persons);
        const sortedCandidates = sortPersonsByLastName(state.persons);
        const selectedPersons = sortPersonsByLastName(state.persons.filter(p => (ms.selectedIds || []).includes(p.id)));
        const preview = selectedPersons.length >= 2
          ? buildMergedContactPreview(selectedPersons, ms.primaryId, ms.customName)
          : null;

        const multiPickerHtml = renderContactSearchDropdownHtml({
          key: "merge_contacts_picker",
          persons: sortedCandidates,
          selectedPersonId: null,
          placeholder: "🔎 Kontakte per Suche / ABCD ankreuzen",
          confirmLabel: "✓ Auswahl übernehmen",
          onSelectPersonJs: (pid) => `toggleMergeSelectedPerson(${pid})`,
          showInlineAlphabet: true,
          inModal: true,
          checkedIds: ms.selectedIds || []
        });

        const dismissedCount = getDismissedMergePairsSet().size;
        const dismissedFooterHtml = dismissedCount > 0 ? `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--bg-slate); border:1px solid var(--border-slate); border-radius:8px; padding:6px 9px; margin-top:4px;">
            <span style="font-size:11px; color:var(--text-secondary);">🚫 ${dismissedCount} abgelehnte Kombination(en) ausgeblendet</span>
            <button class="compact-btn" style="padding:3px 8px; font-size:10.5px;" onclick="resetDismissedMergeCombinations()">Zurücksetzen</button>
          </div>
        ` : "";

        let bodyHtml = "";

            bodyHtml = `
              <div style="background:var(--bg-slate); border:1px solid var(--border-slate); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px;">
                <div style="font-size:13px; font-weight:700; color:var(--text-primary);">Keine automatischen Duplikate gefunden 🎉</div>

                        m.birthdayIso ? `🎂 ${formatIsoToDdMmYyyy(m.birthdayIso)}` : "",

                          ${renderPersonAvatarHtml(m.name, m.photoBase64 || "", 26)}

                  </div>

                ${dismissedFooterHtml}
              </div>
            `;
          }
        } else {
          bodyHtml = `
            <div style="font-size:11.5px; font-weight:600; color:var(--text-secondary);">1. Kontakte zum Zusammenführen wählen (mind. 2):</div>
            ${multiPickerHtml}
            ${selectedPersons.length > 0 ? `

    function buildWidgetPreviewRows(maxCount = 15) {
      const today = todayIso();
      const list = [];
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && bdayDays <= 90) {
          const parts = String(p.birthdayIso || "").split("-");
          const ddMm = parts.length >= 3 ? `${parts[2].slice(0,2)}.${parts[1]}.` : "";
          const ageRaw = ContactResolver.formatUpcomingAge(p.birthdayIso, today);
          const digits = String(ageRaw || "").replace(/\D+/g, "");
          const meta = ddMm && digits ? `${ddMm} (${digits}.)` : ddMm;
          list.push({
            days: bdayDays,
            prio: 0,
            personId: p.id,
            icon: "🎂",
            name: p.name,
            meta,
            reason: `🎂 Geburtstag (${ageRaw})`,
            badge: bdayDays === 0 ? "Heute!" : (bdayDays === 1 ? "Morgen" : `${bdayDays}T`)
          });
        }
        const timerOccs = expandTimerOccurrencesJs(p, today, 4, 60);
        for (const tOcc of timerOccs) {
          if (tOcc.rawDays <= 45) {
            const dParts = String(tOcc.dateIso || "").split("-");
            const ddMm = dParts.length === 3 ? `${dParts[2]}.${dParts[1]}.` : "Timer";
            list.push({
              days: tOcc.sortDays,
              prio: 2,
              personId: p.id,
              icon: "⏳",
              name: p.name,
              meta: `Timer ${ddMm}`,
              reason: `⏳ Melde-Timer (${ddMm})`,
              badge: tOcc.rawDays <= 0 ? "Fällig" : (tOcc.rawDays === 1 ? "Morgen" : `${tOcc.rawDays}T`)
            });
          }
        }
      }
      for (const ev of (state.specialEvents || [])) {
        const p = state.persons.find(x => x.id === ev.personId && !x.isHidden);
        if (!p) continue;
        const occs = expandSpecialEventOccurrencesJs(ev, today, 4, 60);
        for (const occ of occs) {
          if (occ.days >= 0 && occ.days <= 60) {
            const dParts = String(occ.dateIso || "").split("-");
            const ddMm = dParts.length === 3 ? `${dParts[2]}.${dParts[1]}.` : "";
            list.push({
              days: occ.days,
              prio: 1,
              personId: p.id,
              icon: occ.isRecurring ? "🔁" : "🔔",
              name: p.name,
              meta: ddMm ? `${ev.title} (${ddMm})` : ev.title,
              reason: `${occ.isRecurring ? "🔁" : "🔔"} ${ev.title}${ddMm ? ` (${ddMm})` : ""}`,
              badge: occ.days === 0 ? "Heute" : (occ.days === 1 ? "Morgen" : `${occ.days}T`)
            });
          }
        }
      }
      list.sort((a, b) => (a.days - b.days) || (a.prio - b.prio) || a.name.localeCompare(b.name, "de"));
      return list.slice(0, maxCount);
    }

    function handleContactPhotoFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 256;
          let w = img.width || maxDim;
          let h = img.height || maxDim;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          if (photoPickerTargetMode === "create") {
            createDraft.photoBase64 = dataUrl;
          } else {
            detailDraftPhotoBase64 = dataUrl;
            const dp = state.persons.find(p => p.id === detailPersonId);
            if (dp) dp.photoRemovedByUser = false;
          }
          addLog(`📷 Kontaktfoto ("${file.name}") geladen & auf ${w}×${h}px optimiert.`);
          renderModals();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function checkTodaysBirthdaysPopup() {
      if (state.birthdayPopupEnabled === false) return;
      const today = todayIso();
      const storageKey = `remember_me_notified_bday_${today}`;
      let notified = [];
      try {
        notified = JSON.parse(localStorage.getItem(storageKey) || "[]");
      } catch (e) {}
      const notifiedSet = new Set(notified);
      let changed = false;
      for (const p of state.persons.filter(x => !x.isHidden)) {
        if (ContactResolver.daysUntilNextBirthday(p.birthdayIso, today) === 0) {
          if (!notifiedSet.has(p.id)) {
            notifiedSet.add(p.id);
            changed = true;
            showBirthdayHeadsUpToast(p, false);
          }
        }
      }
      if (changed) {
        try {
          localStorage.setItem(storageKey, JSON.stringify([...notifiedSet]));
        } catch (e) {}
      }
    }

    function arePersonsCoupleInTree(personIdA, personIdB) {
      if (!personIdA || !personIdB) return false;
      const partnerA = getCouplePartnerForPerson(personIdA);
      return !!(partnerA && partnerA.id === personIdB);
    }

    let wichtelSecretCodeModalState = null;

    function solveWichtelMatchingBacktrack(parts, isAllowedEdge) {
      const n = parts.length;
      const givers = [...parts].sort(() => Math.random() - 0.5);
      const usedReceiverIds = new Set();
      const assignment = new Map();

      function backtrack(idx) {
        if (idx === n) return true;
        const giver = givers[idx];
        const candidates = [...parts].sort(() => Math.random() - 0.5);
        for (const receiver of candidates) {
          if (giver.id === receiver.id) continue;
          if (usedReceiverIds.has(receiver.id)) continue;
          if (!isAllowedEdge(giver, receiver)) continue;
          usedReceiverIds.add(receiver.id);
          assignment.set(giver.id, receiver.id);
          if (backtrack(idx + 1)) return true;
          usedReceiverIds.delete(receiver.id);
          assignment.delete(giver.id);
        }
        return false;
      }

      return backtrack(0) ? assignment : null;
    }

    function rollWichtelGroup(groupId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      const parts = g.participants;
      if (parts.length < 2) {
        addLog("Mindestens 2 Teilnehmer werden zum Wichtel-Würfeln benötigt!");
        return;
      }

      // Speichere vorherige Zulosung als Vorjahres-/Letzt-Historie, falls schon ausgelost war
      parts.forEach(p => {
        if (p.drawnTargetId) {
          p.lastYearTargetId = p.drawnTargetId;
        }
      });

      // Mathematisch garantierter Backtracking-Solver (Stufe 1: Paar-Sperre + komplette Historie, Stufe 2: Paar-Sperre, Stufe 3: Reines Derangement)
      let bestAssignment = solveWichtelMatchingBacktrack(parts, (giver, receiver) => {
        if (g.excludeCouples && parts.length > 2 && arePersonsCoupleInTree(giver.personId, receiver.personId)) return false;
        if (g.excludeLastYear !== false && parts.length > 2) {
          if (giver.lastYearTargetId && giver.lastYearTargetId === receiver.id) return false;
          if (hasDrawnTargetInHistory(giver, receiver)) return false;
        }
        return true;
      });

      if (!bestAssignment && g.excludeCouples && parts.length > 2) {
        bestAssignment = solveWichtelMatchingBacktrack(parts, (giver, receiver) => {
          return !arePersonsCoupleInTree(giver.personId, receiver.personId);
        });
      }

      if (!bestAssignment) {
        bestAssignment = solveWichtelMatchingBacktrack(parts, () => true);
      }

      parts.forEach(p => {
        p.drawnTargetId = bestAssignment ? (bestAssignment.get(p.id) || null) : null;
        p.notifiedVia = "";
      });
      g.isDrawn = true;
      g.forceRevealed = false;
      g.drawnAt = new Date().toLocaleTimeString("de-DE");
      addLog(`🎲 Wichtelrunde "${g.groupName}" (${g.motto || 'Klassisch'}) per Backtracking-Solver geheim ausgelost! Paare & Historie garantiert berücksichtigt.`);
      saveState();
    }

    function encodeWichtelBlindCode(group, giver, target) {
      const payload = {
        groupName: group.groupName,
        motto: group.motto || "🎁 Klassisches Wichteln",
        budget: group.budget || "",
        revealDate: formatIsoToDdMmYyyy(group.revealDateIso) || "24.12.",
        giverName: giver.name,
        targetName: target.name,
        wishText: target.wishText || "",
        noGos: target.noGos || "",
        address: target.address || "",
        wishlistUrl: target.wishlistUrl || ""
      };
      const json = JSON.stringify(payload);
      const b64 = btoa(unescape(encodeURIComponent(json)));
      return `WICHTEL_SECRET:${b64}`;
    }

    function decodeWichtelBlindCode(rawText) {
      const str = String(rawText || "").trim();
      const idx = str.indexOf("WICHTEL_SECRET:");
      const b64Part = (idx >= 0 ? str.slice(idx + "WICHTEL_SECRET:".length) : str).trim().split(/\s+/)[0];
      const json = decodeURIComponent(escape(atob(b64Part)));
      return JSON.parse(json);
    }

      msg += `🎭 Motto: ${group.motto || "🎁 Klassisches Wichteln"}\n`;
      msg += `🎁 Du beschenkst: *${target.name}*!\n`;
      if (group.budget) msg += `💶 Budget: ${group.budget}\n`;
      if (target.wishText) msg += `📝 Wunschzettel: ${target.wishText}\n`;
      if (target.noGos) msg += `🚫 Bitte NICHT / Hinweis: ${target.noGos}\n`;
      if (target.address) msg += `📦 Post-Adresse: ${target.address}\n`;
      allUrls.forEach((u, idx) => {

    function saveWichtelGroupToHistory(g, notifyAll = false) {
      if (!g || !g.isDrawn) return null;
      if (!Array.isArray(state.wichtelHistory)) state.wichtelHistory = [];
      const yearNum = parseInt((g.revealDateIso || todayIso()).slice(0, 4), 10) || new Date().getFullYear();
      const pairings = g.participants.map(p => {
        const target = g.participants.find(x => x.id === p.drawnTargetId);
        return {
          giverName: p.name,
          giverPersonId: p.personId || null,
          giverPhone: p.phone || "",
          receiverName: target ? target.name : "?",
          receiverPersonId: target ? (target.personId || null) : null,
          wishText: p.wishText || "",
          noGos: p.noGos || "",
          address: p.address || "",
          wishlistUrl: p.wishlistUrl || ""
        };
      });
      let existing = state.wichtelHistory.find(h => h.groupName === g.groupName && h.year === yearNum);
      if (existing) {
        existing.adminName = g.adminName;
        existing.motto = g.motto;
        existing.budget = g.budget;
        existing.completedDateIso = g.revealDateIso || todayIso();
        existing.pairings = pairings;
      } else {
        existing = {
          id: state.nextId++,
          year: yearNum,
          groupName: g.groupName,
          adminName: g.adminName,
          motto: g.motto || "🎁 Klassisches Wichteln",
          budget: g.budget || "",
          completedDateIso: g.revealDateIso || todayIso(),
          pairings
        };
        state.wichtelHistory.unshift(existing);
      }
      if (notifyAll) {
        shareWichtelHistoryToParticipants(existing.id, "In-App");
      }
      return existing;
    }

    function archiveAndShareWichtelGroup(groupId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g || !g.isDrawn) return;
      g.forceRevealed = true;
      const entry = saveWichtelGroupToHistory(g, true);
      if (entry) {
        addLog(`📜 Wichtelperiode "${g.groupName}" abgeschlossen, in der Wichtel-Historie gespeichert & an alle Teilnehmer verteilt!`);
      }
      saveState();
    }

    function reuseWichtelHistoryEntry(historyId) {
      const h = (state.wichtelHistory || []).find(x => x.id === historyId);
      if (!h) return;
      const currentYear = parseInt(todayIso().slice(0, 4), 10);
      const nextYear = (h.year && h.year >= currentYear) ? h.year + 1 : currentYear;
      const baseTitle = (h.groupName || "Familien-Wichteln").replace(/\s*\d{4}\s*$/, "").trim();
      const reusedParticipants = (h.pairings || []).map(pair => {
        const contact = state.persons.find(p =>
          (pair.giverPersonId && p.id === pair.giverPersonId) ||
          p.name.toLowerCase() === (pair.giverName || "").toLowerCase()
        );
        return {
          personId: contact ? contact.id : (pair.giverPersonId || null),
          name: contact ? contact.name : pair.giverName,
          phone: contact ? (contact.phone || pair.giverPhone || "") : (pair.giverPhone || ""),
          appPeerId: contact ? (contact.appPeerId || "") : "",
          wishText: pair.wishText || (contact ? contact.notes : "") || "",
          noGos: pair.noGos || "",
          address: pair.address || (contact ? extractAddressFromPerson(contact) : "") || "",
          wishlistUrl: pair.wishlistUrl || "",
          extraWishUrls: []
        };
      });

      wichtelGroupModalState = {
        mode: "reuse",
        groupId: null,
        historyId: h.id,
        groupName: `${baseTitle} ${nextYear}`,
        adminName: h.adminName || "Ich (Admin)",
        motto: h.motto || "🎁 Klassisches Wichteln",
        budget: h.budget || "25 €",
        revealDate: `24.12.${nextYear}`,
        reminderDaysBefore: 7,
        excludeCouples: true,
        excludeLastYear: true,
        reusedParticipants
      };
      renderModals();
    }

    function buildPortableWichtelHistoryMessage(h) {
      const pairLines = (h.pairings || []).map(p => `🎁 ${p.giverName} ➔ hat ${p.receiverName} beschenkt`).join("\n");
      const exportPayload = JSON.stringify({
        year: h.year,
        groupName: h.groupName,
        adminName: h.adminName,
        motto: h.motto,
        budget: h.budget,
        completedDateIso: h.completedDateIso,
        pairings: h.pairings
      });
      return `📜🎄 *Wichtel-Historie zum Abschluss von „${h.groupName}“ (${h.year || ''})*\n` +
        `👑 Admin: ${h.adminName} • ${h.motto || '🎁 Klassisches Wichteln'}\n\n` +
        `🔓 *Auflösung – Wer hatte wen:*\n${pairLines}\n\n` +
        `♻️ *Für deine eigene Wichtel-Historie (zum Einsehen, Löschen oder Wiederverwenden als Admin im nächsten Jahr):*\n` +
        `WICHTEL_HISTORY_JSON:${exportPayload}`;
    }

    function shareWichtelHistoryToParticipants(historyId, channel) {
      const h = (state.wichtelHistory || []).find(x => x.id === historyId);
      if (!h) return;
      const msg = buildPortableWichtelHistoryMessage(h);
      if (channel === "WhatsApp") {
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
        addLog(`📲 Wichtel-Historie "${h.groupName}" per WhatsApp für alle Teilnehmer bereitgestellt.`);
      } else {
        const nowStr = new Date().toISOString().slice(0, 16).replace("T", " ");
        (h.pairings || []).forEach(pair => {
          state.directMessages.push({
            id: state.nextId++,
            personId: pair.giverPersonId || 0,
            targetPeerId: "KC-WICHTEL-HIST",
            senderDisplayName: h.adminName || "Gruppenadmin",
            direction: "OUTGOING",
            text: msg,
            timestampIso: nowStr,
            isRead: true
          });
        });
        addLog(`💬 Jeder Teilnehmer (${(h.pairings || []).length} Personen) hat seine eigene Wichtel-Historie für "${h.groupName}" erhalten!`);
        saveState();
      }
    }

      const el = document.getElementById("wh-import-text");
      const raw = (el ? el.value : "").trim();
      if (!raw) return;
      try {
        const jsonPart = raw.includes("WICHTEL_HISTORY_JSON:")
          ? raw.substring(raw.indexOf("WICHTEL_HISTORY_JSON:") + "WICHTEL_HISTORY_JSON:".length).trim()
          : raw;
        const parsed = JSON.parse(jsonPart);
        if (!parsed || !Array.isArray(parsed.pairings)) throw new Error("Ungültiges Format");
        if (!Array.isArray(state.wichtelHistory)) state.wichtelHistory = [];
        state.wichtelHistory.unshift({

          year: parsed.year || new Date().getFullYear(),
          groupName: parsed.groupName || "Importierte Wichtelrunde",
          adminName: parsed.adminName || "Admin",

          budget: parsed.budget || "25 €",
          completedDateIso: parsed.completedDateIso || todayIso(),
          pairings: parsed.pairings
        });
        wichtelHistoryImportModalOpen = false;
        addLog(`📥 Wichtel-Historie "${parsed.groupName}" erfolgreich importiert! Du kannst sie jetzt einsehen, löschen oder als Admin wiederverwenden.`);
        saveState();
      } catch (e) {

    let calendarPickerState = null;
    const MONTH_NAMES_DE = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    function openCalendarPicker(inputId) {
      const el = document.getElementById(inputId);
      const rawVal = el ? el.value : "";
      const iso = normalizeDateInputToIso(rawVal) || todayIso();
      const parts = iso.replace(/^--/, "2000-").split("-").map(Number);
      const tParts = todayIso().split("-").map(Number);
      const year = (parts.length === 3 && parts[0] >= 1900 && parts[0] <= 2100) ? parts[0] : tParts[0];
      const month = (parts.length === 3 && parts[1] >= 1 && parts[1] <= 12) ? (parts[1] - 1) : (tParts[1] - 1);
      const day = (parts.length === 3 && parts[2] >= 1 && parts[2] <= 31) ? parts[2] : tParts[2];
      calendarPickerState = { inputId, year, month, selectedDay: day };
      renderCalendarPopup();
    }

    function closeCalendarPicker() {
      calendarPickerState = null;
      const calRoot = document.getElementById("calendar-root");
      if (calRoot) calRoot.innerHTML = "";
    }

    function changeCalendarMonth(delta) {
      if (!calendarPickerState) return;
      let m = calendarPickerState.month + delta;
      let y = calendarPickerState.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      calendarPickerState.month = m;
      calendarPickerState.year = y;
      renderCalendarPopup();
    }

    function setCalendarYear(yearStr) {
      if (!calendarPickerState) return;
      calendarPickerState.year = parseInt(yearStr, 10) || calendarPickerState.year;
      renderCalendarPopup();
    }

    function setCalendarMonth(monthStr) {
      if (!calendarPickerState) return;
      calendarPickerState.month = parseInt(monthStr, 10) || 0;
      renderCalendarPopup();
    }

    function selectCalendarDay(day) {
      if (!calendarPickerState) return;
      const pad = n => String(n).padStart(2, "0");
      const formatted = `${pad(day)}.${pad(calendarPickerState.month + 1)}.${calendarPickerState.year}`;
      const el = document.getElementById(calendarPickerState.inputId);
      if (el) {
        el.value = formatted;
        if (calendarPickerState.inputId === "c-bday") {
          createDraft.bday = formatted;
        }
        if (calendarPickerState.inputId === "wg-reveal" && wichtelGroupModalState) {
          wichtelGroupModalState.revealDate = formatted;
        }
        if (calendarPickerState.inputId === "tm-startdate" && timerEntryModalState) {
          timerEntryModalState.startDate = formatted;
          renderModals();
        }
      }
      closeCalendarPicker();
    }

    function selectCalendarToday() {
      const tParts = todayIso().split("-").map(Number);
      if (!calendarPickerState) return;
      calendarPickerState.year = tParts[0];
      calendarPickerState.month = tParts[1] - 1;
      selectCalendarDay(tParts[2]);
    }

    function renderCalendarPopup() {
      const calRoot = document.getElementById("calendar-root");
      if (!calRoot) return;
      if (!calendarPickerState) {
        calRoot.innerHTML = "";
        return;
      }
      const { year, month, selectedDay } = calendarPickerState;
      const firstDayJs = new Date(year, month, 1).getDay(); // 0=Sun..6=Sat
      const startOffset = (firstDayJs + 6) % 7; // Monday=0..Sunday=6
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const yearOptions = [];
      for (let y = 2035; y >= 1920; y--) {
        yearOptions.push(`<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`);
      }
      const monthOptions = MONTH_NAMES_DE.map((name, idx) =>
        `<option value="${idx}" ${idx === month ? "selected" : ""}>${name}</option>`
      ).join("");

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div></div>`);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const isSel = d === selectedDay;
        cells.push(`
          <button class="compact-btn ${isSel ? 'primary' : ''}" style="padding:6px 0; font-size:12px; font-weight:${isSel ? '700' : '500'}; text-align:center;" onclick="selectCalendarDay(${d})">
            ${d}
          </button>
        `);
      }

      calRoot.innerHTML = `
        <div class="modal-backdrop" style="z-index:200;" onclick="if(event.target===this) closeCalendarPicker()">
          <div class="modal" style="max-width:310px;" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:4px;">
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(-1)">◀</button>
              <select class="field-select" style="flex:1.1;" onchange="setCalendarMonth(this.value)">${monthOptions}</select>
              <select class="field-select" style="flex:0.9;" onchange="setCalendarYear(this.value)">${yearOptions.join("")}</select>
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(1)">▶</button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; font-size:11px; color:var(--text-muted); font-weight:600; margin-top:4px;">
              <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;">
              ${cells.join("")}
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
              <button class="compact-btn" onclick="selectCalendarToday()">Heute</button>
              <button class="compact-btn" onclick="closeCalendarPicker()">Schließen</button>
            </div>
          </div>
        </div>
      `;
    }

    async function copyBackupJsonToClipboard() {
      const dateStr = formatIsoToDdMmYyyy(todayIso());
      const backupPayload = {
        app: "Remember Me",
        version: "1.0.38",
        createdAt: dateStr,
        state
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      try {
        await navigator.clipboard.writeText(jsonStr);
        addLog(`📋 Vollständiges JSON-Backup (${state.persons.length} Kontakte, ${(state.wichtelGroups || []).length} Wichtelrunden, ${(state.wichtelHistory || []).length} Historie) in Zwischenablage kopiert.`);
      } catch (e) {
        addLog("⚠️ Zwischenablage nicht verfügbar – nutze den .json Download.");
      }
    }

    async function sendBackupViaEmail() {
      const dateStr = formatIsoToDdMmYyyy(todayIso());
      const fileName = `Remember-Me-Sicherung-${dateStr}.json`;
      const backupPayload = {
        app: "Remember Me",
        version: "1.0.38",
        createdAt: dateStr,
        state
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });

      // Sicherungsdatei herunterladen
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);

      // Falls Web Share API mit Dateien verfügbar ist (Mobilbrowser)
      try {
        const file = new File([blob], fileName, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: `Remember Me Sicherung (${dateStr})`,
            text: `Sicherungsdatei (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen)`,
            files: [file]
          });
          addLog(`Sicherungsdatei "${fileName}" geteilt.`);
          return;
        }
      } catch (e) {}

      // Mail-Programm öffnen
      const recipient = (state.backupEmail || "").trim();
      const subject = `Remember Me – Sicherung vom ${dateStr}`;
      const body = `Hallo,\n\nanbei die Remember Me Sicherung vom ${dateStr} (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen).\nDie Datei "${fileName}" wurde heruntergeladen und kann dieser E-Mail angehängt werden.\n\n--- Sicherungsdaten (JSON) ---\n${jsonStr}`;
      window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      addLog(`Sicherungsdatei "${fileName}" erstellt und Mail-Versand geöffnet.`);
      saveState();
    }

    function importBackupFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedState = parsed.state || parsed;
          if (importedState && Array.isArray(importedState.persons)) {
            state = importedState;
            selectedTreeRootId = state.persons[0] ? state.persons[0].id : null;
            showOptionsDialog = false;
            addLog(`Sicherung aus "${file.name}" erfolgreich wiederhergestellt (${state.persons.length} Kontakte).`);
            saveState();
          }
        } catch (err) {
          addLog("Fehler beim Laden der Sicherungsdatei.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (state.persons.length > 0) {
      selectedTreeRootId = state.persons[0].id;
    }
    addLog("Remember Me v1.0.38 gestartet.");
    renderAll();
    checkTodaysBirthdaysPopup();
  </script>
</body>
</html>
