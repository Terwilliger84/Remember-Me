<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remember Me v1.0.5 – Interaktiver Testserver</title>
  <style>
    :root {
      --bg-slate: #0F172A;
      --card-slate: #1E293B;
      --border-slate: #334155;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --root-node-bg: #1E3A5F;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent-steel: #38BDF8;
      --warn-amber: #F59E0B;
      --warn-bg: #3B2F1E;
      --warn-text: #FDE68A;
      --danger: #EF4444;
      --success: #22C55E;
      --partner-rose: #F43F5E;
      --tree-green: #10B981;
    }

    body[data-theme="light"] {
      background-color: #CBD5E1;
      --bg-slate: #F1F5F9;
      --card-slate: #FFFFFF;
      --border-slate: #CBD5E1;
      --btn-bg: #E2E8F0;
      --btn-hover: #CBD5E1;
      --root-node-bg: #E0F2FE;
      --text-primary: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --accent-steel: #0284C7;
      --warn-amber: #D97706;
      --warn-bg: #FEF3C7;
      --warn-text: #92400E;
      --danger: #DC2626;
      --success: #16A34A;
      --partner-rose: #E11D48;
      --tree-green: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #070B14;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .testbench-header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
    }

    .testbench-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .testbench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .testbench-layout {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .testbench-layout {
        grid-template-columns: 1fr;
      }
    }

    .phone-frame {
      background: var(--bg-slate);
      border: 2px solid var(--border-slate);
      border-radius: 18px;
      padding: 14px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
    }

    .compact-btn {
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }

    .compact-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-steel);
    }

    .compact-btn.primary {
      background: #0284C7;
      color: #FFFFFF;
      border-color: var(--accent-steel);
    }

    .compact-btn.danger {
      background: #7F1D1D;
      color: #FFFFFF;
      border-color: var(--danger);
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .nav-tab {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .nav-tab.active {
      background: var(--btn-bg);
      color: var(--text-primary);
      border-color: var(--accent-steel);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 12px;
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .person-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .person-name-link {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent-steel);
      cursor: pointer;
    }

    .person-name-link:hover {
      text-decoration: underline;
    }

    .badge-app {
      font-size: 11px;
      color: var(--accent-steel);
      background: rgba(56, 189, 248, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .badge-nophone {
      font-size: 11px;
      color: var(--warn-amber);
      background: rgba(245, 158, 11, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .person-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .person-meta {
      font-size: 11px;
      margin-top: 4px;
    }

    .meta-muted { color: var(--text-muted); }
    .meta-accent { color: var(--accent-steel); }
    .meta-secondary { color: var(--text-secondary); }

    /* Stammbaum Styles */
    .tree-container {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 100%;
      overflow-x: auto;
      padding: 2px 0;
    }

    .tree-node {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 5px 8px;
      min-width: 72px;
      max-width: 118px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s, border-color 0.12s;
    }

    .tree-node:hover {
      transform: translateY(-1px);
      border-color: var(--accent-steel);
    }

    .tree-node.root {
      background: var(--root-node-bg);
      border: 1.5px solid var(--accent-steel);
    }

    .tree-node.partner {
      border-color: var(--partner-rose);
    }

    .tree-line-vertical {
      width: 2px;
      height: 14px;
      background: var(--accent-steel);
      margin: 2px 0;
    }

    .tree-branch-bar {
      height: 2px;
      background: var(--accent-steel);
      min-width: 90px;
      margin-bottom: 2px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-box {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .widget-tag {
      font-size: 10px;
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .widget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .widget-row:hover {
      background: var(--card-slate);
    }

    .widget-row-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .widget-row-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .widget-row-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      background: #1E293B;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border-slate);
    }

    .log-box {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
    }

    .log-list {
      margin-top: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }

    .log-item {
      padding: 6px 8px;
      background: var(--bg-slate);
      border-left: 3px solid var(--accent-steel);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    .modal {
      width: 100%;
      max-width: 358px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 82vh;
      max-height: 82dvh;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .field-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .field-input, .field-select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--accent-steel);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .warning-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-amber);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--warn-text);
      font-size: 12px;
      line-height: 1.4;
    }

    .modal-footer {
      position: sticky;
      bottom: -12px;
      background: var(--card-slate);
      border-top: 1px solid var(--border-slate);
      padding: 8px 0 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      z-index: 5;
    }

    .rel-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="testbench-header">
    <div class="testbench-title">
      <span class="status-dot"></span>
      <div>
        <div style="font-size: 14px; font-weight: 700;">Remember Me – Interaktiver Web-Testserver</div>
        <div style="font-size: 11px; color: var(--text-muted);">Mit automatischem Stammbaum, Beziehungs-Verwaltung, Namen-Antippen für Details & Erinnerungen</div>
      </div>
    </div>
    <div class="testbench-controls">
      <button class="compact-btn" onclick="runDailyReminderWorker()">🔔 DailyReminderWorker prüfen</button>
      <button class="compact-btn" onclick="seedSampleData()">🌱 Beispieldaten mit Stammbaum laden</button>
      <button class="compact-btn danger" onclick="resetDatabase()">🗑️ DB zurücksetzen</button>
    </div>
  </div>

  <div class="testbench-layout">
    <div class="phone-frame" id="app-root"></div>

    <div class="side-panel">
      <div class="widget-box">
        <div class="widget-header">
          <span class="widget-title">Anstehende Erinnerungen</span>
          <span class="widget-tag">Glance Homescreen-Widget</span>
        </div>
        <div id="widget-rows"></div>
      </div>

      <div class="log-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size: 13px; font-weight: 700;">System- & Intent-Protokoll</span>
          <button class="compact-btn" style="padding:2px 6px; font-size:10px;" onclick="clearLogs()">Leeren</button>
        </div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="calendar-root"></div>
  <input type="file" id="backup-file-input" accept=".json" style="display:none;" onchange="importBackupFile(event)" />

  <script>
    const RELATION_PRESETS = [
      "Kind von",
      "Ehe-Partner von",
      "Partner von",
      "Bruder von",
      "Schwester von",
      "Mutter von",
      "Vater von",
      "Elternteil von",
      "Oma/Opa von",
      "Enkelkind von",
      "Onkel/Tante von",
      "Cousin/Cousine von"
    ];

    function inverseRelationLabel(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return "Elternteil von";
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return "Kind von";
      if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner von";
      if (l.startsWith("partner")) return "Partner von";
      if (l.startsWith("bruder") || l.startsWith("schwester") || l.startsWith("geschwister")) return "Geschwister von";
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Enkelkind von";
      if (l.startsWith("enkel")) return "Oma/Opa von";
      if (l.startsWith("onkel") || l.startsWith("tante")) return "Neffe/Nichte von";
      if (l.startsWith("neffe") || l.startsWith("nichte")) return "Onkel/Tante von";
      if (l.startsWith("cousin")) return "Cousin/Cousine von";
      return "Verknüpft mit";
    }

    function relationGenerationStep(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return -1;
      if (l.startsWith("enkel")) return -2;
      if (l.startsWith("neffe") || l.startsWith("nichte")) return -1;
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return 1;
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return 2;
      if (l.startsWith("onkel") || l.startsWith("tante")) return 1;
      return 0;
    }

    function isPartnerRelation(label) {
      const l = (label || "").toLowerCase();
      return l.includes("partner") || l.includes("ehe");
    }

    function isSiblingRelation(label) {
      const l = (label || "").toLowerCase();
      return l.includes("bruder") || l.includes("schwester") || l.includes("geschwister");
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    function addDaysIso(baseIso, days) {
      const d = new Date(baseIso + "T00:00:00");
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function withYearIso(baseIso, year) {
      return year + baseIso.slice(4);
    }

    function daysBetween(date1Iso, date2Iso) {
      const d1 = new Date(date1Iso + "T00:00:00");
      const d2 = new Date(date2Iso + "T00:00:00");
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
    }

    const STORAGE_KEY = "rememberme_test_db_v2";
    let state = loadState();
    let activeTab = "Übersicht";
    let selectedTreeRootId = null;
    let syncStatus = `App-Code: ${state.ownPairingCode}`;
    let logs = [];

    let showCreateDialog = false;
    let detailPersonId = null;
    let popupState = null;

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { return JSON.parse(raw); } catch (e) {}
      }
      const code = "KC-ME-" + Math.floor(1000 + Math.random() * 9000);
      return {
        ownPairingCode: code,
        nextId: 10,
        persons: [],
        relations: [],
        specialEvents: [],
        directMessages: [],
        wichtelGroups: []
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString("de-DE");
      logs.unshift(`[${time}] ${msg}`);
      renderLogs();
    }

    function clearLogs() {
      logs = [];
      renderLogs();
    }

    function addBidirectionalRelation(fromId, toId, label) {
      if (!fromId || !toId || fromId === toId) return;
      const clean = label.trim();
      const existsFwd = state.relations.some(r => r.fromPersonId === fromId && r.toPersonId === toId && r.relationLabel.toLowerCase() === clean.toLowerCase());
      if (!existsFwd) {
        state.relations.push({ id: state.nextId++, fromPersonId: fromId, toPersonId: toId, relationLabel: clean, isFallbackContact: true });
      }
      const rev = inverseRelationLabel(clean);
      const existsRev = state.relations.some(r => r.fromPersonId === toId && r.toPersonId === fromId);
      if (!existsRev) {
        state.relations.push({ id: state.nextId++, fromPersonId: toId, toPersonId: fromId, relationLabel: rev, isFallbackContact: isPartnerRelation(clean) });
      }
    }

    const ContactResolver = {
      resolveTarget(person, relationsForPerson) {
        const ownPhone = (person.phone || "").trim();
        const ownEmail = (person.email || "").trim();
        const ownPeerId = (person.appPeerId || "").trim();

        if ((!person.hasNoOwnPhone && (ownPhone !== "" || ownEmail !== "")) || ownPeerId !== "") {
          const noPhoneButAppNotice = (person.hasNoOwnPhone && ownPhone === "" && ownPeerId !== "")
            ? `Hinweis: ${person.name} hat keine Handynummer, ist aber direkt per App-Code (${ownPeerId}) gekoppelt.`
            : null;
          return {
            targetPersonName: person.name,
            phone: ownPhone,
            email: ownEmail,
            appPeerId: ownPeerId,
            hasAppDirect: ownPeerId !== "",
            isRedirectedToRelative: false,
            relationDescription: null,
            warningNotice: noPhoneButAppNotice
          };
        }

        const fallbackPair = relationsForPerson.find(({ rel, target }) =>
          rel.isFallbackContact && ((target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim())
        ) || relationsForPerson.find(({ target }) =>
          (target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim()
        );

        if (fallbackPair) {
          const { rel, target: relative } = fallbackPair;
          return {
            targetPersonName: relative.name,
            phone: (relative.phone || "").trim(),
            email: (relative.email || "").trim(),
            appPeerId: "",
            hasAppDirect: false,
            isRedirectedToRelative: true,
            relationDescription: `${rel.relationLabel} ${relative.name}`,
            warningNotice: `Hinweis: ${person.name} hat keine eigene Nummer. Nachricht wird an ${relative.name} (${rel.relationLabel}) gerichtet.`
          };
        }

        return {
          targetPersonName: person.name,
          phone: "",
          email: ownEmail,
          appPeerId: "",
          hasAppDirect: false,
          isRedirectedToRelative: false,
          relationDescription: null,
          warningNotice: "Hinweis: Keine eigene Telefonnummer/E-Mail und kein erreichbarer verknüpfter Kontakt hinterlegt."
        };
      },

      daysUntilNextBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let nextBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (nextBday < today) nextBday = `${tYear + 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, nextBday);
        } catch (e) { return null; }
      },

      negativeDaysSinceLastBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let lastBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (lastBday > today) lastBday = `${tYear - 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, lastBday);
        } catch (e) { return null; }
      },

      formatPassedAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "hatte Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "hatte Geburtstag";
          const pad = n => String(n).padStart(2, "0");
          let lastYear = tParts[0];
          const thisYearBday = `${tParts[0]}-${pad(bParts[1])}-${pad(bParts[2])}`;
          if (thisYearBday > today) lastYear -= 1;
          const passedAge = Math.max(0, lastYear - bParts[0]);
          return `wurde ${passedAge}`;
        } catch (e) { return "hatte Geburtstag"; }
      },

      formatUpcomingAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "Geburtstag";
          const totalMonths = (tParts[0] - bParts[0]) * 12 + (tParts[1] - bParts[1]);
          const thisYearBday = `${tParts[0]}-${String(bParts[1]).padStart(2, "0")}-${String(bParts[2]).padStart(2, "0")}`;
          const nextYearAge = tParts[0] - bParts[0] + (thisYearBday < today ? 1 : 0);
          if (totalMonths >= 0 && totalMonths <= 23) return `${totalMonths} Mon. (wird ${nextYearAge})`;
          return `wird ${nextYearAge}`;
        } catch (e) { return "Geburtstag"; }
      },

      nextTimerDate(person, today = todayIso()) {
        if (!person.timerEnabled || person.timerInterval <= 0) return null;
        const base = person.lastContactedIso || today;
        const d = new Date(base + "T00:00:00");
        const interval = Number(person.timerInterval) || 14;
        switch (person.timerUnit) {
          case "WEEKS": d.setDate(d.getDate() + interval * 7); break;
          case "MONTHS": d.setMonth(d.getMonth() + interval); break;
          case "YEARS": d.setFullYear(d.getFullYear() + interval); break;
          default: d.setDate(d.getDate() + interval); break;
        }
        return d.toISOString().slice(0, 10);
      }
    };

    const WEEKDAY_NAMES_DE = {
      1: "Montag",
      2: "Dienstag",
      3: "Mittwoch",
      4: "Donnerstag",
      5: "Freitag",
      6: "Samstag",
      7: "Sonntag"
    };

    function isWeeklyDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("WEEKLY:");
    }

    function getWeeklyDayNumber(dateIso) {
      if (!isWeeklyDateSpec(dateIso)) return null;
      const num = parseInt(dateIso.split(":")[1], 10);
      return (num >= 1 && num <= 7) ? num : null;
    }

    function daysUntilWeeklyDay(weekday1To7, today = todayIso()) {
      const d = new Date(today + "T00:00:00");
      const jsDay = d.getDay(); // 0=Sun..6=Sat
      const isoDay = jsDay === 0 ? 7 : jsDay; // 1=Mon..7=Sun
      return (weekday1To7 - isoDay + 7) % 7;
    }

    function daysUntilEventSpec(dateIso, today = todayIso()) {
      if (isWeeklyDateSpec(dateIso)) {
        const wd = getWeeklyDayNumber(dateIso);
        return wd ? daysUntilWeeklyDay(wd, today) : 999;
      }
      return daysBetween(today, dateIso);
    }

    function formatEventBadgeText(ev, today = todayIso()) {
      if (isWeeklyDateSpec(ev.dateIso)) {
        const wd = getWeeklyDayNumber(ev.dateIso);
        const dayName = WEEKDAY_NAMES_DE[wd] || "Wöchentlich";
        const diff = daysUntilWeeklyDay(wd, today);
        if (diff === 0) return `🔔 Heute (${dayName}): ${ev.title}`;
        if (diff === 1) return `🔁 Jeden ${dayName}: ${ev.title} (morgen)`;
        return `🔁 Jeden ${dayName}: ${ev.title} (in ${diff}T)`;
      }
      return `${ev.title} (${formatIsoToDdMmYyyy(ev.dateIso)})`;
    }

    function formatIsoToDdMmYyyy(iso) {
      if (!iso || !iso.trim()) return "";
      const clean = iso.trim();
      if (isWeeklyDateSpec(clean)) {
        const wd = getWeeklyDayNumber(clean);
        return `🔁 Jeden ${WEEKDAY_NAMES_DE[wd] || "Wochentag"}`;
      }
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(clean)) return clean;
      if (clean.startsWith("--")) {
        const parts = clean.slice(2).split("-");
        if (parts.length === 2) return `${parts[1].padStart(2, "0")}.${parts[0].padStart(2, "0")}.`;
      }
      const parts = clean.split("-");
      return parts.length === 3 ? `${parts[2].padStart(2, "0")}.${parts[1].padStart(2, "0")}.${parts[0]}` : clean;
    }

    function normalizeDateInputToIso(input) {
      const clean = (input || "").trim();
      if (!clean) return "";
      if (isWeeklyDateSpec(clean)) return clean;
      const dotParts = clean.split(".");
      if (dotParts.length === 3 && dotParts[2].length === 4) {
        return `${dotParts[2]}-${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      if (dotParts.length >= 2 && (!dotParts[2] || dotParts[2] === "")) {
        return `--${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      const slashParts = clean.split("/");
      if (slashParts.length === 3 && slashParts[2].length === 4) {
        return `${slashParts[2]}-${slashParts[1].padStart(2, "0")}-${slashParts[0].padStart(2, "0")}`;
      }
      return clean;
    }

    function formatCompactBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const ageStr = ContactResolver.formatUpcomingAge(birthdayIso);
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      const whenStr = days === null ? "" : (days === 0 ? "heute" : (days === 1 ? "in 1 Tag" : `in ${days} Tagen`));
      return [dateStr, `${ageStr} ${whenStr}`.trim()].filter(Boolean).join("  •  ");
    }

    let showPastDates = false;
    let contactSortMode = "birthday"; // "birthday" | "firstname" | "lastname"

    function stripNameRoleSuffix(fullName) {
      return (fullName || "").replace(/\s*\([^)]*\)\s*/g, " ").trim();
    }

    function extractFirstName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts[0] || clean;
    }

    function extractLastName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts.length > 1 ? parts[parts.length - 1] : (parts[0] || clean);
    }

      if (!birthdayIso || !birthdayIso.trim()) return "";

      const negDays = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
      if (negDays === null) return dateStr;
      const negLabel = negDays === 0 ? "0 Tage (heute)" : (negDays === -1 ? "-1 Tag" : `${negDays} Tage`);
      return `${dateStr}  •  ${passedAgeStr} (${negLabel})`;
    }

      const p = state.persons.find(x => x.id === personId);

      addLog(p.isHidden ? `Kontakt "${p.name}" dauerhaft ausgeblendet (nur noch unter "Alle Kontakte" sichtbar).` : `Kontakt "${p.name}" wieder eingeblendet.`);
      saveState();

    function sortPersonsArray(arr) {
      return [...arr].sort((a, b) => {
        if (contactSortMode === "firstname") {
          const cmp = extractFirstName(a.name).localeCompare(extractFirstName(b.name), "de");
          return cmp !== 0 ? cmp : extractLastName(a.name).localeCompare(extractLastName(b.name), "de");
        }
        if (contactSortMode === "lastname") {
          const cmp = extractLastName(a.name).localeCompare(extractLastName(b.name), "de");
          return cmp !== 0 ? cmp : extractFirstName(a.name).localeCompare(extractFirstName(b.name), "de");
        }
        if (!showPastDates) {
          const da = ContactResolver.daysUntilNextBirthday(a.birthdayIso) ?? 999999;
          const db = ContactResolver.daysUntilNextBirthday(b.birthdayIso) ?? 999999;
          return da !== db ? da - db : a.name.localeCompare(b.name, "de");
        } else {
          const na = ContactResolver.negativeDaysSinceLastBirthday(a.birthdayIso) ?? -999999;
          const nb = ContactResolver.negativeDaysSinceLastBirthday(b.birthdayIso) ?? -999999;
          return na !== nb ? nb - na : a.name.localeCompare(b.name, "de");
        }
      });
    }

    function renderFamilyTreeTab() {
      const visiblePersons = state.persons.filter(p => !p.isHidden);
      if (visiblePersons.length === 0) return "";
      const rootPerson = visiblePersons.find(p => p.id === selectedTreeRootId) || visiblePersons[0];
      const personMap = new Map(visiblePersons.map(p => [p.id, p]));

      // BFS generation calculation
      const genMap = new Map();
      const queue = [rootPerson.id];
      genMap.set(rootPerson.id, 0);

      while (queue.length > 0) {
        const currId = queue.shift();
        const currGen = genMap.get(currId) || 0;

        state.relations.filter(r => r.fromPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.toPersonId) && personMap.has(rel.toPersonId)) {
            genMap.set(rel.toPersonId, currGen + relationGenerationStep(rel.relationLabel));
            queue.push(rel.toPersonId);
          }
        });
        state.relations.filter(r => r.toPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.fromPersonId) && personMap.has(rel.fromPersonId)) {
            genMap.set(rel.fromPersonId, currGen - relationGenerationStep(rel.relationLabel));
            queue.push(rel.fromPersonId);
          }
        });
      }

      function shortRelationName(rawLabel) {
        const l = (rawLabel || "").trim().toLowerCase();
        if (l.startsWith("mutter")) return "Mutter";
        if (l.startsWith("vater")) return "Vater";
        if (l.startsWith("elternteil") || l.startsWith("eltern")) return "Eltern";
        if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner";
        if (l.startsWith("partner")) return "Partner";
        if (l.startsWith("bruder")) return "Bruder";
        if (l.startsWith("schwester")) return "Schwester";
        if (l.startsWith("geschwister")) return "Geschwister";
        if (l.startsWith("kind")) return "Kind";
        if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Oma/Opa";
        if (l.startsWith("enkel")) return "Enkelkind";
        if (l.startsWith("onkel") || l.startsWith("tante")) return "Onkel/Tante";
        if (l.startsWith("neffe") || l.startsWith("nichte")) return "Neffe/Nichte";
        if (l.startsWith("cousin")) return "Cousin/Cousine";
        return rawLabel.replace(/\s+von$/i, "").trim() || "Familie";
      }

      function roleRelativeToRoot(p, genLevel) {
        if (p.id === rootPerson.id) return "Fokus";
        const directOut = state.relations.find(r => r.fromPersonId === p.id && r.toPersonId === rootPerson.id);
        if (directOut) return shortRelationName(directOut.relationLabel);
        const directIn = state.relations.find(r => r.fromPersonId === rootPerson.id && r.toPersonId === p.id);
        if (directIn) return shortRelationName(inverseRelationLabel(directIn.relationLabel));

        if (genLevel <= -2) return "Oma/Opa";
        if (genLevel >= 2) return "Enkelkind";
        if (genLevel === -1) {
          // Check if partner of a parent -> Eltern, or sibling of a parent -> Onkel/Tante
          const relToParent = state.relations.find(r =>
            r.fromPersonId === p.id && genMap.get(r.toPersonId) === -1 &&
            state.relations.some(pr =>
              (pr.fromPersonId === r.toPersonId && pr.toPersonId === rootPerson.id && relationGenerationStep(pr.relationLabel) === 1) ||
              (pr.fromPersonId === rootPerson.id && pr.toPersonId === r.toPersonId && relationGenerationStep(pr.relationLabel) === -1)
            )
          );
          if (relToParent && isPartnerRelation(relToParent.relationLabel)) return "Eltern";
          if (relToParent && isSiblingRelation(relToParent.relationLabel)) return "Onkel/Tante";
          return "Eltern";
        }
        if (genLevel === 1) {
          const isChildOfPartner = state.relations.some(r =>
            r.fromPersonId === p.id && isPartnerRelation(
              (state.relations.find(pr => pr.fromPersonId === r.toPersonId && pr.toPersonId === rootPerson.id) || {}).relationLabel || ""
            ) && relationGenerationStep(r.relationLabel) === -1
          );
          if (isChildOfPartner) return "Kind";
          return "Kind";
        }
        const anyRel = state.relations.find(r => r.fromPersonId === p.id);
        if (anyRel) return shortRelationName(anyRel.relationLabel);
        return "Familie";
      }

      function arePartnersOrCoParents(idA, idB) {
        const directRel = state.relations.find(r =>
          (r.fromPersonId === idA && r.toPersonId === idB) ||
          (r.fromPersonId === idB && r.toPersonId === idA)
        );
        if (directRel && isPartnerRelation(directRel.relationLabel)) return true;
        // Check if they share a common child
        const childrenOfA = state.relations
          .filter(r => r.toPersonId === idA && relationGenerationStep(r.relationLabel) === -1)
          .map(r => r.fromPersonId);
        return childrenOfA.some(cid =>
          state.relations.some(r => r.fromPersonId === cid && r.toPersonId === idB && relationGenerationStep(r.relationLabel) === -1)
        );
      }

      // Order members in a generation:
      // - For genLevel === 0: place rootPerson centered (siblings on left, partner on right)
      // - For other levels: place parents / partners directly side-by-side (nebeneinander)
      function orderRowMembers(members, genLevel) {
        if (genLevel === 0 && members.some(m => m.id === rootPerson.id)) {
          const others = members.filter(m => m.id !== rootPerson.id);
          const partners = others.filter(m => arePartnersOrCoParents(rootPerson.id, m.id));
          const nonPartners = others.filter(m => !arePartnersOrCoParents(rootPerson.id, m.id));
          if (partners.length > 0) {
            return [...nonPartners, rootPerson, ...partners];
          } else {
            const half = Math.ceil(nonPartners.length / 2);
            return [...nonPartners.slice(0, half), rootPerson, ...nonPartners.slice(half)];
          }
        }

        const visited = new Set();
        const ordered = [];
        const sortedSeed = [...members].sort((a, b) => {
          const aRole = roleRelativeToRoot(a, genLevel);
          const bRole = roleRelativeToRoot(b, genLevel);
          const aIsParent = aRole === "Eltern" || aRole === "Mutter" || aRole === "Vater";
          const bIsParent = bRole === "Eltern" || bRole === "Mutter" || bRole === "Vater";
          if (aIsParent && !bIsParent) return -1;
          if (!aIsParent && bIsParent) return 1;
          return a.name.localeCompare(b.name);
        });

        for (const m of sortedSeed) {
          if (visited.has(m.id)) continue;
          visited.add(m.id);
          ordered.push(m);
          for (const candidate of members) {
            if (!visited.has(candidate.id) && arePartnersOrCoParents(m.id, candidate.id)) {
              visited.add(candidate.id);
              ordered.push(candidate);
            }
          }
        }
        return ordered;
      }

      const levelsMap = new Map();
      for (const [pid, gen] of genMap.entries()) {
        if (!levelsMap.has(gen)) levelsMap.set(gen, []);
        levelsMap.get(gen).push(personMap.get(pid));
      }
      const sortedLevels = [...levelsMap.keys()].sort((a, b) => a - b);

      const dropdownOptions = visiblePersons.map(p => `
        <option value="${p.id}" ${p.id === rootPerson.id ? 'selected' : ''}>
          ${escapeHtml(p.name)}
        </option>
      `).join("");

      const levelsHtml = sortedLevels.map((lvl, idx) => {
        const members = orderRowMembers(levelsMap.get(lvl) || [], lvl);
        const nodesHtml = members.map((m, mIdx) => {
          const isRoot = m.id === rootPerson.id;
          const role = roleRelativeToRoot(m, lvl);
          const isPartner = isPartnerRelation(role);
          let connector = "";
          if (mIdx < members.length - 1) {
            const nextM = members[mIdx + 1];
            const coupled = arePartnersOrCoParents(m.id, nextM.id);
            connector = coupled
              ? `<span style="color:var(--partner-rose); font-size:12px; font-weight:700; padding:0 1px;">──</span>`
              : `<span style="width:4px; display:inline-block;"></span>`;
          }
          return `
            <div class="tree-node ${isRoot ? 'root' : ''} ${isPartner ? 'partner' : ''}" onclick="openDetailModal(${m.id})">
              <div style="font-size:11.5px; font-weight:700; color:var(--text-primary); line-height:1.2;">${escapeHtml(m.name)}</div>
              <div style="font-size:10px; color:${isRoot ? 'var(--accent-steel)' : (isPartner ? 'var(--partner-rose)' : 'var(--tree-green)')}; margin-top:2px; line-height:1.1;">
                ${escapeHtml(role)}
              </div>
            </div>
            ${connector}
          `;
        }).join("");

        const nextMembers = idx < sortedLevels.length - 1 ? (levelsMap.get(sortedLevels[idx + 1]) || []) : [];
        const connectorDown = idx < sortedLevels.length - 1 ? `
          <div class="tree-line-vertical"></div>
          ${nextMembers.length > 1 ? `<div class="tree-branch-bar"></div>` : ""}
        ` : "";

        return `
          <div class="tree-row">${nodesHtml}</div>
          ${connectorDown}
        `;
      }).join("");

      return `
        <div class="card" style="padding:8px 10px; display:flex; align-items:center; gap:8px;">
          <label class="field-label" style="white-space:nowrap; font-size:12px; font-weight:600; color:var(--text-secondary);">Kontakt:</label>
          <select class="field-select" style="flex:1;" onchange="selectedTreeRootId=parseInt(this.value, 10); renderPhoneApp();">
            ${dropdownOptions}
          </select>
        </div>
        <div class="tree-container" style="min-height:160px; justify-content:center;">
          ${levelsHtml}
        </div>
      `;
    }

    function renderDirectChatTab() {
      if (state.directMessages.length === 0) {

    function renderEventsTab() {

      state.specialEvents.forEach(ev => {

    let selectedWichtelGroupId = null;
    let wichtelGroupModalState = null; // { mode: 'create'|'edit', groupId, groupName, adminName, motto, budget, revealDate, reminderDaysBefore, excludeCouples, excludeLastYear }
    let wichtelParticipantModalState = null; // { mode: 'add'|'edit', groupId, participantId, checkedPersonIds, customName, customPhone, personId, name, phone, wishText, noGos, address, wishlistUrl, extraWishUrls }
    let wichtelSecretPeekState = null; // { groupId, participantId }
    let wichtelAnonQuestionState = null; // { groupId, targetParticipantId, questionText }

    const WICHTEL_MOTTOS = [
      "🎁 Klassisches Wichteln",
      "♻️ Schrottwichteln",
      "📖 Buch-Wichteln",
      "🛠️ Selbstgemachtes",
      "🎲 Würfel-/Räuberwichteln"
    ];

    function getCouplePartnerForPerson(personId) {
      if (!personId) return null;
      const directRel = state.relations.find(r =>
        (r.fromPersonId === personId || r.toPersonId === personId) &&
        isPartnerRelation(r.relationLabel)
      );
      if (directRel) {
        const partnerId = directRel.fromPersonId === personId ? directRel.toPersonId : directRel.fromPersonId;
        return state.persons.find(p => p.id === partnerId) || null;
      }
      // Auch gemeinsame Kinder (Co-Parents im Stammbaum) prüfen
      const childrenIds = state.relations
        .filter(r => r.toPersonId === personId && relationGenerationStep(r.relationLabel) === -1)
        .map(r => r.fromPersonId);
      for (const cid of childrenIds) {
        const otherParentRel = state.relations.find(r =>
          r.fromPersonId === cid && r.toPersonId !== personId && relationGenerationStep(r.relationLabel) === -1
        );
        if (otherParentRel) {
          return state.persons.find(p => p.id === otherParentRel.toPersonId) || null;
        }
      }
      return null;
    }

    function extractAddressFromPerson(person) {
      if (!person || !Array.isArray(person.extraInfos)) return "";
      const addrRow = person.extraInfos.find(x => (x.label || "").toLowerCase().includes("adresse") || (x.label || "").toLowerCase().includes("anschrift"));
      return addrRow ? (addrRow.value || "") : "";
    }

    function ensureWichtelGroups() {
      if (!Array.isArray(state.wichtelGroups)) {
        state.wichtelGroups = [];
      }
      if (state.wichtelGroups.length === 0 && state.persons.length > 0) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 5);
        state.wichtelGroups.push({
          id: state.nextId++,
          groupName: `Familien-Wichteln ${xmasYear}`,
          adminName: adultPersons[1] ? adultPersons[1].name : (adultPersons[0] ? adultPersons[0].name : "Ich (Admin)"),
          motto: "🎁 Klassisches Wichteln",
          budget: "25 €",
          revealDateIso: `${xmasYear}-12-24`,
          reminderDaysBefore: 7,
          excludeCouples: true,
          excludeLastYear: true,
          forceRevealed: false,
          isDrawn: false,
          drawnAt: "",
          participants: adultPersons.map(p => ({
            id: state.nextId++,
            personId: p.id,
            name: p.name,
            phone: p.phone || "",
            appPeerId: p.appPeerId || "",
            wishText: p.notes || "Überraschung, Schokolade, Buch",
            noGos: "",
            address: extractAddressFromPerson(p),
            wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`,
            extraWishUrls: [],
            drawnTargetId: null,
            lastYearTargetId: null,
            notifiedVia: ""
          }))
        });
      }
      if (selectedWichtelGroupId === null || !state.wichtelGroups.some(g => g.id === selectedWichtelGroupId)) {
        selectedWichtelGroupId = state.wichtelGroups[0] ? state.wichtelGroups[0].id : null;
      }
    }

    function isWichtelGroupRevealed(group) {
      if (!group) return false;
      if (group.forceRevealed) return true;
      const today = todayIso();
      return !!(group.revealDateIso && today >= group.revealDateIso);
    }

    function renderWichtelTab() {
      ensureWichtelGroups();
      const groups = state.wichtelGroups;

      const topBar = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            ${groups.map(g => `
              <button class="compact-btn ${g.id === selectedWichtelGroupId ? 'primary' : ''}" onclick="selectedWichtelGroupId=${g.id}; renderPhoneApp();">
                🎄 ${escapeHtml(g.groupName)}
              </button>
            `).join("")}
          </div>
          <button class="compact-btn primary" onclick="openWichtelGroupModal('create')">+ Neue Runde</button>
        </div>
      `;

      const group = groups.find(g => g.id === selectedWichtelGroupId);
      if (!group) {
        return topBar + `
          <div class="card">
            <div style="font-size:14px; font-weight:600; margin-bottom:4px;">🎄 Noch keine Wichtelrunde erstellt</div>
            <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
              Erstelle als Gruppenadmin eine neue Wichtelrunde, lade Kontakte per Ankreuzliste ein, hinterlege Wunschzettel oder Amazon-Wunschlisten und würfle die geheime Zulosung aus!
            </div>
            <button class="compact-btn primary" onclick="openWichtelGroupModal('create')">🎄 Erste Wichtelrunde starten</button>
          </div>
        `;
      }

      const revealed = isWichtelGroupRevealed(group);
      const revealDateFormatted = formatIsoToDdMmYyyy(group.revealDateIso) || "24.12.";
      const daysUntilReveal = group.revealDateIso ? daysBetween(todayIso(), group.revealDateIso) : 0;

      const statusBanner = !group.isDrawn
        ? `
          <div style="background:rgba(56, 189, 248, 0.12); border:1px solid var(--accent-steel); border-radius:8px; padding:9px 11px; margin-top:8px; font-size:12px; color:var(--text-primary);">
            🎲 <b>Bereit zum Würfeln:</b> Sobald alle Teilnehmer eingetragen sind, tippe auf <b>„🎲 Jetzt auslosen!“</b>. Niemand sieht die Gesamtliste vor Ablauf der Frist (${escapeHtml(revealDateFormatted)}).
          </div>
        `
        : (!revealed
          ? `
            <div style="background:rgba(16, 185, 129, 0.14); border:1px solid var(--tree-green); border-radius:8px; padding:9px 11px; margin-top:8px; font-size:12px; color:var(--text-primary); line-height:1.4;">
              🔒 <b>Geheimhaltung aktiv bis ${escapeHtml(revealDateFormatted)}</b> ${daysUntilReveal > 0 ? `(noch ${daysUntilReveal} Tage)` : ""}<br/>
              <span style="font-size:11px; color:var(--text-secondary);">Niemand in der Gruppe sieht, wer wen gezogen hat! Teile jedem Teilnehmer sein Los einzeln per <b>📲 WhatsApp</b> oder <b>💬 In-App</b> mit.</span>
            </div>
          `
          : `
            <div style="background:rgba(245, 158, 11, 0.16); border:1px solid var(--warn-amber); border-radius:8px; padding:10px 11px; margin-top:8px; font-size:12px; color:var(--text-primary);">
              <div style="font-weight:700; color:var(--warn-amber); margin-bottom:6px;">🔓 Frist abgelaufen (${escapeHtml(revealDateFormatted)}) – Alle Paarungen sind jetzt sichtbar:</div>
              <div style="display:flex; flex-direction:column; gap:4px;">
                ${group.participants.map(p => {
                  const target = group.participants.find(x => x.id === p.drawnTargetId);
                  return `<div style="background:var(--bg-slate); padding:5px 8px; border-radius:5px; border:1px solid var(--border-slate); font-size:12px;">🎁 <b>${escapeHtml(p.name)}</b> ➔ hat <b>${escapeHtml(target ? target.name : '?')}</b> beschenkt</div>`;
                }).join("")}
              </div>
            </div>
          `);

      const groupHeaderCard = `
        <div class="card" style="border-color:var(--accent-steel);">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div>
              <div style="font-size:16px; font-weight:700; color:var(--text-primary);">🎄 ${escapeHtml(group.groupName)}</div>
              <div style="font-size:12px; color:var(--text-secondary); margin-top:3px;">
                👑 Admin: <b>${escapeHtml(group.adminName || "Admin")}</b>
                ${group.budget ? ` • 💶 Budget: <b>${escapeHtml(group.budget)}</b>` : ""}
              </div>
              <div style="font-size:11.5px; color:var(--tree-green); font-weight:600; margin-top:2px;">
                ${escapeHtml(group.motto || "🎁 Klassisches Wichteln")}
                ${group.reminderDaysBefore ? ` • ⏰ Wecker: ${group.reminderDaysBefore}T vorher` : ""}
              </div>
              <div style="font-size:11px; color:var(--accent-steel); margin-top:2px;">
                📅 Auflösungs-Frist: <b>${escapeHtml(revealDateFormatted)}</b>
                ${group.excludeCouples ? ` • 💑 Paar-Sperre` : ""}
                ${group.excludeLastYear !== false ? ` • 🔄 Vorjahres-Sperre` : ""}

            </div>
            <div class="btn-row">
              <button class="compact-btn" onclick="openWichtelGroupModal('edit', ${group.id})" title="Runde bearbeiten">✏️</button>
              <button class="compact-btn danger" onclick="deleteWichtelGroup(${group.id})" title="Runde löschen">🗑️</button>
            </div>
          </div>

          ${statusBanner}

          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">
            <button class="compact-btn primary" style="flex:1; font-weight:700;" onclick="rollWichtelGroup(${group.id})">
              🎲 ${group.isDrawn ? "Neu würfeln" : "Jetzt auslosen!"}
            </button>
            <button class="compact-btn" onclick="openWichtelParticipantModal('add', ${group.id})">
              ☑️ Teilnehmer (${group.participants.length})
            </button>
            <button class="compact-btn" onclick="sendWichtelDeadlineReminder(${group.id})" title="Geschenk-Besorgungs-Wecker an alle senden">
              ⏰ Wecker
            </button>
            ${group.isDrawn ? `
              <button class="compact-btn" onclick="toggleWichtelForceReveal(${group.id})" title="Auflösung nach Fristablauf simulieren">
                ${revealed ? "🔒 Verbergen" : "🔓 Frist-Ablauf"}
              </button>
            ` : ""}
          </div>
        </div>
      `;

      const participantsHtml = group.participants.map(part => {
        const target = group.participants.find(x => x.id === part.drawnTargetId);
        const lastYearTarget = group.participants.find(x => x.id === part.lastYearTargetId);
        const partnerPerson = getCouplePartnerForPerson(part.personId);
        const partnerInGroup = partnerPerson ? group.participants.find(x => x.personId === partnerPerson.id) : null;
        const allUrls = [part.wishlistUrl, ...(Array.isArray(part.extraWishUrls) ? part.extraWishUrls : [])].filter(u => u && u.trim());

        const secretLine = !group.isDrawn
          ? `<span style="color:var(--text-muted);">Noch nicht ausgelost</span>`
          : (revealed && target
            ? `<span style="color:var(--warn-amber); font-weight:700;">🎁 Hat gezogen: ${escapeHtml(target.name)}</span>`
            : `<span style="color:var(--tree-green); font-weight:600;">🎲 Zugelost • 🔒 Geheim bis ${escapeHtml(revealDateFormatted)}</span>`);

        return `
          <div class="card" style="padding:10px 12px; ${partnerInGroup && group.excludeCouples ? 'border-left: 3px solid var(--partner-rose);' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span style="font-size:14px; font-weight:600; color:var(--text-primary);">${escapeHtml(part.name)}</span>
                  ${part.name === group.adminName ? `<span class="badge-app">👑 Admin</span>` : ""}
                  ${partnerInGroup && group.excludeCouples ? `<span style="font-size:10.5px; padding:1px 6px; border-radius:4px; background:rgba(244,63,94,0.16); color:var(--partner-rose); font-weight:700;">💑 Paar mit ${escapeHtml(partnerInGroup.name.split(" ")[0])} (gesperrt füreinander)</span>` : ""}
                  ${part.notifiedVia ? `<span style="font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(16,185,129,0.16); color:var(--tree-green); font-weight:600;">✓ ${escapeHtml(part.notifiedVia)}</span>` : ""}
                </div>
                <div style="font-size:11.5px; margin-top:3px;">
                  ${secretLine}
                  ${lastYearTarget && group.excludeLastYear !== false ? ` <span style="font-size:10.5px; color:var(--text-muted);">• 🔄 Vorjahr: ≠ ${escapeHtml(lastYearTarget.name.split(" ")[0])}</span>` : ""}
                </div>
                ${part.wishText ? `
                  <div style="font-size:11.5px; color:var(--text-secondary); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span>🎁 <b>Wunsch:</b> ${escapeHtml(part.wishText)}</span>
                    <a href="https://www.amazon.de/s?k=${encodeURIComponent(part.wishText)}" target="_blank" rel="noopener" style="font-size:10.5px; color:var(--accent-steel); text-decoration:none; background:rgba(56,189,248,0.12); padding:1px 6px; border-radius:4px; font-weight:600;">🔎 Amazon-Suche ↗</a>
                  </div>
                ` : ""}
                ${part.noGos ? `<div style="font-size:11px; color:var(--warn-amber); margin-top:3px;">🚫 <b>Bitte NICHT / Hinweis:</b> ${escapeHtml(part.noGos)}</div>` : ""}
                ${part.address ? `<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">📦 <b>Adresse:</b> ${escapeHtml(part.address)}</div>` : ""}
                ${allUrls.length > 0 ? `
                  <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
                    ${allUrls.map((u, idx) => `
                      <a href="${escapeHtml(u)}" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent-steel); text-decoration:none; font-weight:600;">
                        🛒 ${idx === 0 ? 'Amazon-Wunschliste' : `Wunsch-Link ${idx + 1}`} ↗
                      </a>
                    `).join(" • ")}
                  </div>
                ` : ""}
              </div>
              <div style="display:flex; gap:4px; align-items:center;">
                <button class="compact-btn" style="padding:4px 7px; font-size:11px;" onclick="openWichtelParticipantModal('edit', ${group.id}, ${part.id})" title="Wunschliste, No-Gos, Adresse & Links bearbeiten">🎁 Wunsch</button>
                <button class="compact-btn" style="padding:4px 7px; font-size:11px;" onclick="openWichtelAnonQuestionModal(${group.id}, ${part.id})" title="Anonyme Wichtel-Frage an ${escapeHtml(part.name)} senden">🕵️</button>
                <span style="color:var(--warn-amber); cursor:pointer; font-weight:700; padding:0 4px;" onclick="removeWichtelParticipant(${group.id}, ${part.id})" title="Teilnehmer entfernen">✕</span>
              </div>
            </div>

            ${group.isDrawn && target ? `
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-slate);">
                <button class="compact-btn primary" style="padding:4px 9px; font-size:11px;" onclick="notifyWichtelParticipant(${group.id}, ${part.id}, 'WhatsApp')">
                  📲 Los per WhatsApp
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="notifyWichtelParticipant(${group.id}, ${part.id}, 'In-App')">
                  💬 In-App senden
                </button>
                <button class="compact-btn" style="padding:4px 9px; font-size:11px;" onclick="openWichtelSecretPeek(${group.id}, ${part.id})" title="Nur für ${escapeHtml(part.name)} kurz aufdecken">
                  👁️ Geheimes Los
                </button>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");

      return topBar + groupHeaderCard + participantsHtml;
    }

    function renderWidget() {
      const container = document.getElementById("widget-rows");
      const today = todayIso();
      const items = [];
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && bdayDays <= 60) {
          items.push({ sortKey: bdayDays, personId: p.id, name: p.name, subtitle: `Geburtstag (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`, badge: bdayDays === 0 ? "Heute" : `in ${bdayDays}T` });
        }
      }
      for (const ev of state.specialEvents) {
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff >= 0 && diff <= 45) {
          const person = state.persons.find(p => p.id === ev.personId && !p.isHidden);
          const isWeekly = isWeeklyDateSpec(ev.dateIso);
          if (person) items.push({ sortKey: diff, personId: person.id, name: person.name, subtitle: isWeekly ? `${formatIsoToDdMmYyyy(ev.dateIso)}: ${ev.title}` : `Erinnerung: ${ev.title}`, badge: diff === 0 ? "Heute" : `in ${diff}T` });
        }
      }
      items.sort((a, b) => a.sortKey - b.sortKey);
      container.innerHTML = items.slice(0, 5).map(item => `
        <div class="widget-row" onclick="openPopupForPerson(${item.personId}, '${escapeHtml(item.subtitle)}')">
          <div>
            <div class="widget-row-name">${escapeHtml(item.name)}</div>
            <div class="widget-row-sub">${escapeHtml(item.subtitle)}</div>
          </div>
          <div class="widget-row-badge">${escapeHtml(item.badge)}</div>
        </div>
      `).join("");
    }

        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">
            <div class="modal" onclick="event.stopPropagation()">
              <div class="modal-title">Kontakt anlegen</div>
              <div class="field-group">

        const extraLinks = Array.isArray(wp.extraWishUrls) ? wp.extraWishUrls : [];
        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">

                  <input id="wp-name" class="field-input" value="${escapeHtml(wp.name)}" oninput="wichtelParticipantModalState.name=this.value" />
                </div>
                <div class="field-group" style="flex:0.9;">
                  <label class="field-label">Telefon (WhatsApp)</label>
                  <input id="wp-phone" class="field-input" value="${escapeHtml(wp.phone)}" oninput="wichtelParticipantModalState.phone=this.value" />

              <div class="field-group">
                <label class="field-label">🎁 Wunschzettel / Geschenk-Ideen</label>
                <div style="display:flex; gap:5px; align-items:center;">
                  <input id="wp-wish" class="field-input" style="flex:1;" placeholder="z. B. Krimi-Buch, Schokolade, Wollsocken" value="${escapeHtml(wp.wishText)}" oninput="wichtelParticipantModalState.wishText=this.value" />
                  <button class="compact-btn" style="padding:5px 8px; white-space:nowrap;" onclick="openAmazonSearchForWish()" title="Diesen Wunsch direkt auf Amazon suchen">🔎 Amazon</button>

              <div class="field-group">
                <label class="field-label">🚫 Bitte NICHT schenken / Allergien & Größen</label>
                <input id="wp-nogos" class="field-input" placeholder="z. B. Kein Marzipan, Nussallergie, Sockengröße 43" value="${escapeHtml(wp.noGos || '')}" oninput="wichtelParticipantModalState.noGos=this.value" />
              </div>
              <div class="field-group">
                <label class="field-label">📦 Post-Adresse (für Fern-Wichteln / Paketversand)</label>
                <input id="wp-address" class="field-input" placeholder="Straße, PLZ & Ort" value="${escapeHtml(wp.address || '')}" oninput="wichtelParticipantModalState.address=this.value" />
              </div>
              <div class="field-group">
                <label class="field-label">🛒 Haupt-Wunschliste (z. B. Amazon-Wunschliste)</label>
                <input id="wp-url" class="field-input" placeholder="https://www.amazon.de/hz/wishlist/..." value="${escapeHtml(wp.wishlistUrl)}" oninput="wichtelParticipantModalState.wishlistUrl=this.value" />
              </div>
              <div style="display:flex; flex-direction:column; gap:5px;">
                <label class="field-label">🔗 Weitere Wunsch-Links (Etsy, Thalia, Otto, Produkt-Links …)</label>
                ${extraLinks.map((u, idx) => `
                  <div style="display:flex; gap:5px; align-items:center;">
                    <input class="field-input" style="flex:1;" placeholder="https://..." value="${escapeHtml(u)}" oninput="wichtelParticipantModalState.extraWishUrls[${idx}] = this.value" />
                    <span style="color:var(--warn-amber); cursor:pointer; font-weight:700; padding:0 4px;" onclick="wichtelParticipantModalState.extraWishUrls.splice(${idx}, 1); renderModals();">✕</span>
                  </div>
                `).join("")}
                <div>
                  <button class="compact-btn primary" style="padding:3px 10px; font-weight:700;" onclick="addExtraWichtelUrlRow()">+ Weiterer Link</button>
                </div>
              </div>
              <div class="modal-footer">
                <button class="compact-btn" onclick="wichtelParticipantModalState=null; renderModals();">Abbrechen</button>
                <button class="compact-btn primary" onclick="saveWichtelParticipantModal()">Speichern</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (wichtelSecretPeekState !== null) {
        const group = (state.wichtelGroups || []).find(g => g.id === wichtelSecretPeekState.groupId);
        const giver = group ? group.participants.find(p => p.id === wichtelSecretPeekState.participantId) : null;
        const target = (group && giver) ? group.participants.find(p => p.id === giver.drawnTargetId) : null;
        if (!group || !giver || !target) {
          wichtelSecretPeekState = null;
          modalRoot.innerHTML = "";
          return;
        }
        const allTargetUrls = [target.wishlistUrl, ...(Array.isArray(target.extraWishUrls) ? target.extraWishUrls : [])].filter(u => u && u.trim());
        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">
            <div class="modal" style="max-width:345px;" onclick="event.stopPropagation()">
              <div class="modal-title">🤫 Geheimes Wichtel-Los für ${escapeHtml(giver.name)}</div>
              <div style="font-size:12px; color:var(--text-secondary);">
                <b>${escapeHtml(group.groupName)}</b> (${escapeHtml(group.motto || '🎁 Klassisches Wichteln')}) ${group.budget ? `• Budget: <b>${escapeHtml(group.budget)}</b>` : ""}
              </div>
              <div style="background:var(--bg-slate); border:1.5px solid var(--tree-green); border-radius:8px; padding:12px; text-align:center; margin:4px 0;">
