                <div style="font-size:17px; font-weight:700; color:var(--tree-green); margin-top:4px;">🎁 ${escapeHtml(target.name)}</div>
                ${target.wishText ? `
                  <div style="font-size:12px; color:var(--text-primary); margin-top:6px;">
                    📝 <b>Wunschzettel:</b> ${escapeHtml(target.wishText)}
                    <div style="margin-top:4px;">
                      <a href="https://www.amazon.de/s?k=${encodeURIComponent(target.wishText)}" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent-steel);">🔎 Auf Amazon suchen ↗</a>
                    </div>
                  </div>
                ` : ""}
                ${target.noGos ? `<div style="font-size:11.5px; color:var(--warn-amber); margin-top:6px;">🚫 <b>Bitte NICHT / Hinweis:</b> ${escapeHtml(target.noGos)}</div>` : ""}
                ${target.address ? `<div style="font-size:11px; color:var(--text-secondary); margin-top:5px;">📦 <b>Versand-Adresse:</b> ${escapeHtml(target.address)}</div>` : ""}
                ${allTargetUrls.length > 0 ? `
                  <div style="display:flex; flex-direction:column; gap:5px; margin-top:8px;">
                    ${allTargetUrls.map((u, idx) => `
                      <a href="${escapeHtml(u)}" target="_blank" rel="noopener" class="compact-btn primary" style="display:inline-block; text-decoration:none; font-size:11.5px;">
                        🛒 ${idx === 0 ? 'Amazon-Wunschliste öffnen' : `Wunsch-Link ${idx + 1} öffnen`} ↗
                      </a>
                    `).join("")}
                  </div>
                ` : ""}
              </div>
              <div style="display:flex; justify-content:center;">
                <button class="compact-btn" style="font-size:11px;" onclick="wichtelSecretPeekState=null; openWichtelAnonQuestionModal(${group.id}, ${target.id});">
                  🕵️ Anonyme Frage an ${escapeHtml(target.name.split(' ')[0])} senden
                </button>
              </div>
              <div style="font-size:11px; color:var(--warn-amber); text-align:center;">
                🔒 Geheim bis zur Auflösung am ${escapeHtml(formatIsoToDdMmYyyy(group.revealDateIso))}!
              </div>
              <div class="modal-footer" style="justify-content:flex-end;">
                <button class="compact-btn primary" onclick="wichtelSecretPeekState=null; renderModals();">Verstanden & schließen</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (wichtelAnonQuestionState !== null) {
        const group = (state.wichtelGroups || []).find(g => g.id === wichtelAnonQuestionState.groupId);
        const target = group ? group.participants.find(p => p.id === wichtelAnonQuestionState.targetParticipantId) : null;
        if (!group || !target) {
          wichtelAnonQuestionState = null;
          modalRoot.innerHTML = "";
          return;
        }
        modalRoot.innerHTML = `
          <div class="modal-backdrop" onclick="closeModals(event)">
            <div class="modal" style="max-width:340px;" onclick="event.stopPropagation()">
              <div class="modal-title">🕵️ Anonyme Wichtel-Frage („Geheimer Bote“)</div>
              <div style="font-size:12px; color:var(--text-secondary); line-height:1.4;">
                Stelle <b>${escapeHtml(target.name)}</b> anonym eine Frage (z. B. nach Größe, Lieblingsfarbe oder ob ein Buch schon vorhanden ist), ohne deine Identität als Wichtel zu verraten!
              </div>
              <div class="field-group">
                <label class="field-label">Deine geheime Frage an ${escapeHtml(target.name.split(" ")[0])}</label>
                <input id="waq-text" class="field-input" placeholder="z. B. Hast du Band 2 schon? / Welche Größe?" value="${escapeHtml(wichtelAnonQuestionState.questionText)}" oninput="wichtelAnonQuestionState.questionText=this.value" />
              </div>
              <div class="modal-footer">
                <button class="compact-btn" onclick="wichtelAnonQuestionState=null; renderModals();">Abbrechen</button>
                <div class="btn-row">
                  <button class="compact-btn primary" onclick="sendWichtelAnonQuestion('WhatsApp')">📲 WhatsApp</button>
                  <button class="compact-btn" onclick="sendWichtelAnonQuestion('In-App')">💬 In-App</button>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      modalRoot.innerHTML = "";
    }

    function renderLogs() {
      const el = document.getElementById("log-list");
      if (!el) return;
      el.innerHTML = logs.map(l => `<div class="log-item">${escapeHtml(l)}</div>`).join("");
    }

    function setTab(tab) {
      activeTab = tab;
      renderPhoneApp();
    }

    let createExtraInfos = [];
    let detailExtraInfos = [];
    let pendingDeleteConfirm = null;
    let showOptionsDialog = false;
    let detailRelationsExpanded = false;
    let createRelationsExpanded = false;
    let createDraft = { name: "", bday: "", noPhone: false, phone: "", email: "", timer: "14", notes: "" };

    function openOptionsModal() {
      showOptionsDialog = true;
      renderModals();
    }

    function setTreeEnabled(enabled) {
      state.treeEnabled = !!enabled;
      if (!state.treeEnabled && activeTab === "Stammbaum") {
        activeTab = "Übersicht";
      }
      saveState();
    }

    function setWichtelEnabled(enabled) {
      state.wichtelEnabled = !!enabled;
      if (!state.wichtelEnabled && activeTab === "🎄 Wichteln") {
        activeTab = "Übersicht";
      }
      saveState();
    }

    function openWichtelGroupModal(mode, groupId = null) {
      ensureWichtelGroups();
      const xmasYear = parseInt(todayIso().slice(0, 4), 10);
      if (mode === "edit" && groupId) {
        const g = state.wichtelGroups.find(x => x.id === groupId);
        if (!g) return;
        wichtelGroupModalState = {
          mode: "edit",
          groupId: g.id,
          groupName: g.groupName || "",
          adminName: g.adminName || "",
          motto: g.motto || "🎁 Klassisches Wichteln",
          budget: g.budget || "25 €",
          revealDate: formatIsoToDdMmYyyy(g.revealDateIso) || `24.12.${xmasYear}`,
          reminderDaysBefore: g.reminderDaysBefore ?? 7,
          excludeCouples: !!g.excludeCouples,
          excludeLastYear: g.excludeLastYear !== false
        };
      } else {
        wichtelGroupModalState = {
          mode: "create",
          groupId: null,
          groupName: `Weihnachts-Wichteln ${xmasYear}`,
          adminName: state.persons[0] ? state.persons[0].name : "Ich (Admin)",
          motto: "🎁 Klassisches Wichteln",
          budget: "25 €",
          revealDate: `24.12.${xmasYear}`,
          reminderDaysBefore: 7,
          excludeCouples: true,
          excludeLastYear: true
        };
      }
      renderModals();
    }

    function saveWichtelGroupModal() {
      if (!wichtelGroupModalState) return;
      const nameEl = document.getElementById("wg-name");
      const adminEl = document.getElementById("wg-admin");
      const mottoEl = document.getElementById("wg-motto");
      const budgetEl = document.getElementById("wg-budget");
      const revealEl = document.getElementById("wg-reveal");
      const remEl = document.getElementById("wg-reminder");
      const couplesEl = document.getElementById("wg-couples");
      const lastYearEl = document.getElementById("wg-lastyear");

      const groupName = (nameEl ? nameEl.value : wichtelGroupModalState.groupName).trim() || "Wichtelrunde";
      const adminName = (adminEl ? adminEl.value : wichtelGroupModalState.adminName).trim() || "Gruppenadmin";
      const motto = mottoEl ? mottoEl.value : (wichtelGroupModalState.motto || "🎁 Klassisches Wichteln");
      const budget = (budgetEl ? budgetEl.value : wichtelGroupModalState.budget).trim();
      const revealDateIso = normalizeDateInputToIso(revealEl ? revealEl.value : wichtelGroupModalState.revealDate) || `${todayIso().slice(0, 4)}-12-24`;
      const reminderDaysBefore = parseInt(remEl ? remEl.value : wichtelGroupModalState.reminderDaysBefore, 10) || 7;
      const excludeCouples = couplesEl ? couplesEl.checked : !!wichtelGroupModalState.excludeCouples;
      const excludeLastYear = lastYearEl ? lastYearEl.checked : (wichtelGroupModalState.excludeLastYear !== false);

      if (wichtelGroupModalState.mode === "edit" && wichtelGroupModalState.groupId) {
        const g = state.wichtelGroups.find(x => x.id === wichtelGroupModalState.groupId);
        if (g) {
          g.groupName = groupName;
          g.adminName = adminName;
          g.motto = motto;
          g.budget = budget;
          g.revealDateIso = revealDateIso;
          g.reminderDaysBefore = reminderDaysBefore;
          g.excludeCouples = excludeCouples;
          g.excludeLastYear = excludeLastYear;
          addLog(`Wichtelrunde "${groupName}" (Motto: ${motto}, Admin: ${adminName}) aktualisiert.`);
        }
      } else {
        const newGroupId = state.nextId++;
        const adminPerson = state.persons.find(p => p.name.toLowerCase() === adminName.toLowerCase());
        state.wichtelGroups.push({
          id: newGroupId,
          groupName,
          adminName,
          motto,
          budget,
          revealDateIso,
          reminderDaysBefore,
          excludeCouples,
          excludeLastYear,
          forceRevealed: false,
          isDrawn: false,
          drawnAt: "",
          participants: [
            {
              id: state.nextId++,
              personId: adminPerson ? adminPerson.id : null,
              name: adminName,
              phone: adminPerson ? (adminPerson.phone || "") : "",
              appPeerId: adminPerson ? (adminPerson.appPeerId || "") : "",
              wishText: "",
              noGos: "",
              address: adminPerson ? extractAddressFromPerson(adminPerson) : "",
              wishlistUrl: "",
              extraWishUrls: [],
              drawnTargetId: null,
              lastYearTargetId: null,
              notifiedVia: ""
            }
          ]
        });
        selectedWichtelGroupId = newGroupId;
        addLog(`Neue Wichtelrunde "${groupName}" (${motto}) von Gruppenadmin "${adminName}" angelegt.`);
      }
      wichtelGroupModalState = null;
      saveState();
    }

    function deleteWichtelGroup(groupId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      askDeleteConfirm(`Wichtelrunde „${g.groupName}" wirklich löschen?`, () => {
        state.wichtelGroups = state.wichtelGroups.filter(x => x.id !== groupId);
        if (selectedWichtelGroupId === groupId) {
          selectedWichtelGroupId = state.wichtelGroups[0] ? state.wichtelGroups[0].id : null;
        }
        addLog(`Wichtelrunde "${g.groupName}" gelöscht.`);
        saveState();
      });
    }

    function openWichtelParticipantModal(mode, groupId, participantId = null) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      if (mode === "edit" && participantId) {
        const p = g.participants.find(x => x.id === participantId);
        if (!p) return;
        wichtelParticipantModalState = {
          mode: "edit",
          groupId: g.id,
          participantId: p.id,
          personId: p.personId || -1,
          name: p.name || "",
          phone: p.phone || "",
          wishText: p.wishText || "",
          noGos: p.noGos || "",
          address: p.address || "",
          wishlistUrl: p.wishlistUrl || "",
          extraWishUrls: Array.isArray(p.extraWishUrls) ? [...p.extraWishUrls] : []
        };
      } else {
        const existingPersonIds = g.participants.map(p => p.personId).filter(Boolean);
        wichtelParticipantModalState = {
          mode: "add",
          groupId: g.id,
          participantId: null,
          checkedPersonIds: [...existingPersonIds],
          customName: "",
          customPhone: ""
        };
      }
      renderModals();
    }

    function toggleWichtelChecklistPerson(personId, checked) {
      if (!wichtelParticipantModalState || !Array.isArray(wichtelParticipantModalState.checkedPersonIds)) return;
      const set = new Set(wichtelParticipantModalState.checkedPersonIds);
      if (checked) set.add(personId);
      else set.delete(personId);
      wichtelParticipantModalState.checkedPersonIds = [...set];
    }

    function selectAllWichtelChecklist(selectAll) {
      if (!wichtelParticipantModalState) return;
      wichtelParticipantModalState.checkedPersonIds = selectAll ? state.persons.map(p => p.id) : [];
      renderModals();
    }

    function addExtraWichtelUrlRow() {
      if (!wichtelParticipantModalState) return;
      if (!Array.isArray(wichtelParticipantModalState.extraWishUrls)) {
        wichtelParticipantModalState.extraWishUrls = [];
      }
      wichtelParticipantModalState.extraWishUrls.push("");
      renderModals();
    }

    function openAmazonSearchForWish() {
      const wishEl = document.getElementById("wp-wish");
      const q = (wishEl ? wishEl.value : (wichtelParticipantModalState && wichtelParticipantModalState.wishText) || "").trim();
      const url = q ? `https://www.amazon.de/s?k=${encodeURIComponent(q)}` : "https://www.amazon.de/hz/wishlist/intro";
      window.open(url, "_blank");
    }

    function saveWichtelParticipantModal() {
      if (!wichtelParticipantModalState) return;
      const g = (state.wichtelGroups || []).find(x => x.id === wichtelParticipantModalState.groupId);
      if (!g) return;

      if (wichtelParticipantModalState.mode === "edit" && wichtelParticipantModalState.participantId) {
        const nameEl = document.getElementById("wp-name");
        const phoneEl = document.getElementById("wp-phone");
        const wishEl = document.getElementById("wp-wish");
        const noGosEl = document.getElementById("wp-nogos");
        const addrEl = document.getElementById("wp-address");
        const urlEl = document.getElementById("wp-url");

        const name = (nameEl ? nameEl.value : wichtelParticipantModalState.name).trim();
        if (!name) return;
        const part = g.participants.find(x => x.id === wichtelParticipantModalState.participantId);
        if (part) {
          part.name = name;
          part.phone = (phoneEl ? phoneEl.value : wichtelParticipantModalState.phone).trim();
          part.wishText = (wishEl ? wishEl.value : wichtelParticipantModalState.wishText).trim();
          part.noGos = (noGosEl ? noGosEl.value : (wichtelParticipantModalState.noGos || "")).trim();
          part.address = (addrEl ? addrEl.value : (wichtelParticipantModalState.address || "")).trim();
          part.wishlistUrl = (urlEl ? urlEl.value : wichtelParticipantModalState.wishlistUrl).trim();
          part.extraWishUrls = (wichtelParticipantModalState.extraWishUrls || []).map(x => (x || "").trim()).filter(Boolean);
          addLog(`Wunschliste, No-Gos & Adresse für "${name}" in "${g.groupName}" gespeichert.`);
        }
      } else {
        // Multi-Select Ankreuzliste verarbeiten
        const checkedSet = new Set(wichtelParticipantModalState.checkedPersonIds || []);
        // Behalte manuell angelegte Teilnehmer ohne personId + alle angekreuzten Kontakte
        const keptCustom = g.participants.filter(p => !p.personId);
        const updatedParticipants = [...keptCustom];

        for (const pid of checkedSet) {
          const existing = g.participants.find(p => p.personId === pid);
          if (existing) {
            updatedParticipants.push(existing);
          } else {
            const person = state.persons.find(p => p.id === pid);
            if (person) {
              updatedParticipants.push({
                id: state.nextId++,
                personId: person.id,
                name: person.name,
                phone: person.phone || "",
                appPeerId: person.appPeerId || "",
                wishText: person.notes || "",
                noGos: "",
                address: extractAddressFromPerson(person),
                wishlistUrl: "",
                extraWishUrls: [],
                drawnTargetId: null,
                lastYearTargetId: null,
                notifiedVia: ""
              });
            }
          }
        }

        const customNameEl = document.getElementById("wp-custom-name");
        const customPhoneEl = document.getElementById("wp-custom-phone");
        const cName = (customNameEl ? customNameEl.value : (wichtelParticipantModalState.customName || "")).trim();
        const cPhone = (customPhoneEl ? customPhoneEl.value : (wichtelParticipantModalState.customPhone || "")).trim();
        if (cName) {
          updatedParticipants.push({
            id: state.nextId++,
            personId: null,
            name: cName,
            phone: cPhone,
            appPeerId: "",
            wishText: "",
            noGos: "",
            address: "",
            wishlistUrl: "",
            extraWishUrls: [],
            drawnTargetId: null,
            lastYearTargetId: null,
            notifiedVia: ""
          });
        }

        g.participants = updatedParticipants;
        g.isDrawn = false;
        g.participants.forEach(p => { p.drawnTargetId = null; p.notifiedVia = ""; });
        addLog(`Teilnehmerliste für "${g.groupName}" aktualisiert (${g.participants.length} Teilnehmer).`);
      }
      wichtelParticipantModalState = null;
      saveState();
    }

    function removeWichtelParticipant(groupId, participantId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      const part = g.participants.find(x => x.id === participantId);
      if (!part) return;
      askDeleteConfirm(`Teilnehmer „${part.name}" aus der Wichtelrunde entfernen?`, () => {
        g.participants = g.participants.filter(x => x.id !== participantId);
        g.isDrawn = false;
        g.participants.forEach(p => { p.drawnTargetId = null; p.notifiedVia = ""; });
        addLog(`Teilnehmer "${part.name}" aus "${g.groupName}" entfernt.`);
        saveState();
      });
    }

    function arePersonsCoupleInTree(personIdA, personIdB) {
      if (!personIdA || !personIdB) return false;
      const partnerA = getCouplePartnerForPerson(personIdA);
      return !!(partnerA && partnerA.id === personIdB);
    }

    function rollWichtelGroup(groupId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      const parts = g.participants;
      if (parts.length < 2) {
        addLog("Mindestens 2 Teilnehmer werden zum Wichtel-Würfeln benötigt!");
        return;
      }

      // Speichere vorherige Zulosung als Vorjahres-/Letzt-Historie, falls schon ausgelost war
      parts.forEach(p => {
        if (p.drawnTargetId) {
          p.lastYearTargetId = p.drawnTargetId;
        }
      });

      // Zufällige Derangement-Auslosung (niemand zieht sich selbst; optional Paar-Sperre & Vorjahres-Sperre)
      let bestAssignment = null;
      for (let attempt = 0; attempt < 200; attempt++) {
        const shuffled = [...parts].sort(() => Math.random() - 0.5);
        let valid = true;
        const candidateMap = new Map();
        for (let i = 0; i < shuffled.length; i++) {
          const giver = shuffled[i];
          const receiver = shuffled[(i + 1) % shuffled.length];
          if (giver.id === receiver.id) {
            valid = false;
            break;
          }
          if (g.excludeCouples && parts.length > 2 && arePersonsCoupleInTree(giver.personId, receiver.personId)) {
            valid = false;
            break;
          }
          if (g.excludeLastYear !== false && parts.length > 3 && giver.lastYearTargetId && giver.lastYearTargetId === receiver.id && attempt < 140) {
            valid = false;
            break;
          }
          candidateMap.set(giver.id, receiver.id);
        }
        if (valid) {
          bestAssignment = candidateMap;
          break;
        }
      }

      if (!bestAssignment) {
        const shuffled = [...parts].sort(() => Math.random() - 0.5);
        bestAssignment = new Map();
        for (let i = 0; i < shuffled.length; i++) {
          bestAssignment.set(shuffled[i].id, shuffled[(i + 1) % shuffled.length].id);
        }
      }

      parts.forEach(p => {
        p.drawnTargetId = bestAssignment.get(p.id) || null;
        p.notifiedVia = "";
      });
      g.isDrawn = true;
      g.forceRevealed = false;
      g.drawnAt = new Date().toLocaleTimeString("de-DE");
      addLog(`🎲 Wichtelrunde "${g.groupName}" (${g.motto || 'Klassisch'}) geheim ausgelost! Paare & Vorjahr berücksichtigt.`);
      saveState();
    }

    function buildWichtelSecretMessage(group, giver, target) {
      const revealStr = formatIsoToDdMmYyyy(group.revealDateIso) || "Weihnachten";
      const allUrls = [target.wishlistUrl, ...(Array.isArray(target.extraWishUrls) ? target.extraWishUrls : [])].filter(u => u && u.trim());
      let msg = `🎄 Hallo ${giver.name.split(" ")[0]}! Hier ist dein geheimes Los für unsere Wichtelrunde „${group.groupName}“ (Admin: ${group.adminName}):\n\n`;
      msg += `🎭 Motto: ${group.motto || "🎁 Klassisches Wichteln"}\n`;
      msg += `🎁 Du beschenkst: *${target.name}*!\n`;
      if (group.budget) msg += `💶 Budget: ${group.budget}\n`;
      if (target.wishText) msg += `📝 Wunschzettel: ${target.wishText}\n`;
      if (target.noGos) msg += `🚫 Bitte NICHT / Hinweis: ${target.noGos}\n`;
      if (target.address) msg += `📦 Post-Adresse: ${target.address}\n`;
      allUrls.forEach((u, idx) => {
        msg += `🛒 ${idx === 0 ? "Amazon-Wunschliste" : `Wunsch-Link ${idx + 1}`}: ${u}\n`;
      });
      msg += `\n🤫 Pssst: Niemand sonst kennt dein Los! Erst ab dem ${revealStr} wird für alle aufgelöst, wer wen gezogen hat.`;
      return msg;
    }

    function notifyWichtelParticipant(groupId, participantId, channel) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      const giver = g.participants.find(x => x.id === participantId);

          ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`

    let calendarPickerState = null;
    const MONTH_NAMES_DE = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    function openCalendarPicker(inputId) {
      const el = document.getElementById(inputId);
      const rawVal = el ? el.value : "";
      const iso = normalizeDateInputToIso(rawVal) || todayIso();
      const parts = iso.replace(/^--/, "2000-").split("-").map(Number);
      const tParts = todayIso().split("-").map(Number);
      const year = (parts.length === 3 && parts[0] >= 1900 && parts[0] <= 2100) ? parts[0] : tParts[0];
      const month = (parts.length === 3 && parts[1] >= 1 && parts[1] <= 12) ? (parts[1] - 1) : (tParts[1] - 1);
      const day = (parts.length === 3 && parts[2] >= 1 && parts[2] <= 31) ? parts[2] : tParts[2];
      calendarPickerState = { inputId, year, month, selectedDay: day };
      renderCalendarPopup();
    }

    function closeCalendarPicker() {
      calendarPickerState = null;
      const calRoot = document.getElementById("calendar-root");
      if (calRoot) calRoot.innerHTML = "";
    }

    function changeCalendarMonth(delta) {
      if (!calendarPickerState) return;
      let m = calendarPickerState.month + delta;
      let y = calendarPickerState.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      calendarPickerState.month = m;
      calendarPickerState.year = y;
      renderCalendarPopup();
    }

    function setCalendarYear(yearStr) {
      if (!calendarPickerState) return;
      calendarPickerState.year = parseInt(yearStr, 10) || calendarPickerState.year;
      renderCalendarPopup();
    }

    function setCalendarMonth(monthStr) {
      if (!calendarPickerState) return;
      calendarPickerState.month = parseInt(monthStr, 10) || 0;
      renderCalendarPopup();
    }

    function selectCalendarDay(day) {
      if (!calendarPickerState) return;
      const pad = n => String(n).padStart(2, "0");
      const formatted = `${pad(day)}.${pad(calendarPickerState.month + 1)}.${calendarPickerState.year}`;
      const el = document.getElementById(calendarPickerState.inputId);
      if (el) {
        el.value = formatted;
        if (calendarPickerState.inputId === "c-bday") {
          createDraft.bday = formatted;
        }
        if (calendarPickerState.inputId === "wg-reveal" && wichtelGroupModalState) {
          wichtelGroupModalState.revealDate = formatted;
        }
      }
      closeCalendarPicker();
    }

    function selectCalendarToday() {
      const tParts = todayIso().split("-").map(Number);
      if (!calendarPickerState) return;
      calendarPickerState.year = tParts[0];
      calendarPickerState.month = tParts[1] - 1;
      selectCalendarDay(tParts[2]);
    }

    function renderCalendarPopup() {
      const calRoot = document.getElementById("calendar-root");
      if (!calRoot) return;
      if (!calendarPickerState) {
        calRoot.innerHTML = "";
        return;
      }
      const { year, month, selectedDay } = calendarPickerState;
      const firstDayJs = new Date(year, month, 1).getDay(); // 0=Sun..6=Sat
      const startOffset = (firstDayJs + 6) % 7; // Monday=0..Sunday=6
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const yearOptions = [];
      for (let y = 2035; y >= 1920; y--) {
        yearOptions.push(`<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`);
      }
      const monthOptions = MONTH_NAMES_DE.map((name, idx) =>
        `<option value="${idx}" ${idx === month ? "selected" : ""}>${name}</option>`
      ).join("");

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div></div>`);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const isSel = d === selectedDay;
        cells.push(`
          <button class="compact-btn ${isSel ? 'primary' : ''}" style="padding:6px 0; font-size:12px; font-weight:${isSel ? '700' : '500'}; text-align:center;" onclick="selectCalendarDay(${d})">
            ${d}
          </button>
        `);
      }

      calRoot.innerHTML = `
        <div class="modal-backdrop" style="z-index:200;" onclick="if(event.target===this) closeCalendarPicker()">
          <div class="modal" style="max-width:310px;" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:4px;">
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(-1)">◀</button>
              <select class="field-select" style="flex:1.1;" onchange="setCalendarMonth(this.value)">${monthOptions}</select>
              <select class="field-select" style="flex:0.9;" onchange="setCalendarYear(this.value)">${yearOptions.join("")}</select>
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(1)">▶</button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; font-size:11px; color:var(--text-muted); font-weight:600; margin-top:4px;">
              <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;">
              ${cells.join("")}
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
              <button class="compact-btn" onclick="selectCalendarToday()">Heute</button>
              <button class="compact-btn" onclick="closeCalendarPicker()">Schließen</button>
            </div>
          </div>
        </div>
      `;
    }

    async function sendBackupViaEmail() {
      const dateStr = formatIsoToDdMmYyyy(todayIso());
      const fileName = `Remember-Me-Sicherung-${dateStr}.json`;
      const backupPayload = {
        app: "Remember Me",
        version: "1.0.10",
        createdAt: dateStr,
        state
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });

      // Sicherungsdatei herunterladen
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);

      // Falls Web Share API mit Dateien verfügbar ist (Mobilbrowser)
      try {
        const file = new File([blob], fileName, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: `Remember Me Sicherung (${dateStr})`,
            text: `Sicherungsdatei (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen)`,
            files: [file]
          });
          addLog(`Sicherungsdatei "${fileName}" geteilt.`);
          return;
        }
      } catch (e) {}

      // Mail-Programm öffnen
      const recipient = (state.backupEmail || "").trim();
      const subject = `Remember Me – Sicherung vom ${dateStr}`;
      const body = `Hallo,\n\nanbei die Remember Me Sicherung vom ${dateStr} (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen).\nDie Datei "${fileName}" wurde heruntergeladen und kann dieser E-Mail angehängt werden.\n\n--- Sicherungsdaten (JSON) ---\n${jsonStr}`;
      window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      addLog(`Sicherungsdatei "${fileName}" erstellt und Mail-Versand geöffnet.`);
      saveState();
    }

    function importBackupFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedState = parsed.state || parsed;
          if (importedState && Array.isArray(importedState.persons)) {
            state = importedState;
            selectedTreeRootId = state.persons[0] ? state.persons[0].id : null;
            showOptionsDialog = false;
            addLog(`Sicherung aus "${file.name}" erfolgreich wiederhergestellt (${state.persons.length} Kontakte).`);
            saveState();
          }
        } catch (err) {
          addLog("Fehler beim Laden der Sicherungsdatei.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (state.persons.length === 0) {
      seedSampleData();
    } else {
      selectedTreeRootId = state.persons[0].id;
      addLog("Remember Me v1.0.10 gestartet.");
      renderAll();
    }
  </script>
</body>
</html>
