<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remember Me v1.0.18 – Interaktiver Testserver</title>
  <style>
    /* Standard-Theme: ☀️ Sanftes Blau (Hell) */
    :root,
    body[data-theme="warm"],
    body[data-theme="light"] {
      background-color: #DCE8F5;
      --bg-slate: #F2F7FC;
      --card-slate: #FFFFFF;
      --border-slate: #CFE0F0;
      --btn-bg: #E3EFFA;
      --btn-hover: #D0E3F5;
      --primary-bg: #3B82C4;
      --primary-hover: #2C6CA8;
      --root-node-bg: #DFEFFC;
      --text-primary: #182B42;
      --text-secondary: #415A77;
      --text-muted: #728CA8;
      --accent-steel: #3B82C4;
      --warn-amber: #2563EB;
      --warn-bg: #E0F2FE;
      --warn-text: #1E40AF;
      --danger: #C9352B;
      --success: #2E7D5B;
      --partner-rose: #D6336C;
      --tree-green: #2E7D5B;
      --card-shadow: 0 3px 10px rgba(24, 43, 66, 0.06);
    }

    /* 🌙 Sanftes Nachtblau */
    body[data-theme="cozy-dark"],
    body[data-theme="dark"] {
      background-color: #0D1624;
      --bg-slate: #131F31;
      --card-slate: #1B2B42;
      --border-slate: #2C4263;
      --btn-bg: #243854;
      --btn-hover: #2F486B;
      --primary-bg: #4A90E2;
      --primary-hover: #357ABD;
      --root-node-bg: #1E3A5F;
      --text-primary: #F0F6FC;
      --text-secondary: #B8CCE0;
      --text-muted: #7E97B3;
      --accent-steel: #63A4FF;
      --warn-amber: #60A5FA;
      --warn-bg: #1E3A5F;
      --warn-text: #DBEAFE;
      --danger: #EF4444;
      --success: #34D399;
      --partner-rose: #FB7185;
      --tree-green: #34D399;
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.32);
    }

    /* 🎄 Weihnachts-Modus */
    body[data-theme="xmas"] {
      background-color: #162B20;
      --bg-slate: #F7F3E8;
      --card-slate: #FFFDF8;
      --border-slate: #D8C7A8;
      --btn-bg: #ECE3CE;
      --btn-hover: #DFD2B5;
      --primary-bg: #1E5A3A;
      --primary-hover: #16462C;
      --root-node-bg: #FCE8E6;
      --text-primary: #1B3124;
      --text-secondary: #3B5545;
      --text-muted: #6C8273;
      --accent-steel: #B4232A;
      --warn-amber: #C28512;
      --warn-bg: #FEF5D8;
      --warn-text: #855808;
      --danger: #B4232A;
      --success: #1E5A3A;
      --partner-rose: #C81E45;
      --tree-green: #1E5A3A;
      --card-shadow: 0 4px 12px rgba(24, 52, 36, 0.08);
    }

    /* 💎 Klassisch (Slate/Blau) */
    body[data-theme="classic"] {
      background-color: #070B14;
      --bg-slate: #0F172A;
      --card-slate: #1E293B;
      --border-slate: #334155;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --primary-bg: #0284C7;
      --primary-hover: #0369A1;
      --root-node-bg: #1E3A5F;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent-steel: #38BDF8;
      --warn-amber: #F59E0B;
      --warn-bg: #3B2F1E;
      --warn-text: #FDE68A;
      --danger: #EF4444;
      --success: #22C55E;
      --partner-rose: #F43F5E;
      --tree-green: #10B981;
      --card-shadow: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .testbench-header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
    }

    .testbench-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .testbench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .testbench-layout {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .testbench-layout {
        grid-template-columns: 1fr;
      }
    }

    .phone-frame {
      background: var(--bg-slate);
      border: 2px solid var(--border-slate);
      border-radius: 22px;
      padding: 14px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(24, 43, 66, 0.2);
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
    }

    .compact-btn {
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-slate);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .compact-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-steel);
    }

    .compact-btn.primary {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
    }

    .compact-btn.primary:hover {
      background: var(--primary-hover);
    }

    .compact-btn.danger {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
    }

    /* Kompakte Icon-Navigation */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 12px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 5px;
      box-shadow: var(--card-shadow);
    }

    @media (max-width: 480px) {
      .nav-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 6px 3px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .nav-tab .nav-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .nav-tab:hover {
      background: var(--btn-bg);
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
      box-shadow: 0 2px 8px rgba(59, 130, 196, 0.28);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }

    .card {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--card-shadow);
    }

    /* Runde Kontakt-Avatare & Countdown-Badges */
    .person-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
      letter-spacing: 0.5px;
      position: relative;
    }

    .countdown-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      white-space: nowrap;
    }

    .countdown-pill.today {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
    }

    .countdown-pill.soon {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-amber);
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .person-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .person-name-link {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
    }

    .person-name-link:hover {
      color: var(--accent-steel);
      text-decoration: underline;
    }

    .badge-app {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent-steel);
      background: var(--btn-bg);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .badge-nophone {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--warn-amber);
      background: var(--warn-bg);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .person-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .person-meta {
      font-size: 11px;
      margin-top: 4px;
    }

    .meta-muted { color: var(--text-muted); }
    .meta-accent { color: var(--accent-steel); }
    .meta-secondary { color: var(--text-secondary); }

    /* Stammbaum Styles */
    .tree-container {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 100%;
      overflow-x: auto;
      padding: 2px 0;
    }

    .tree-node {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 5px 8px;
      min-width: 72px;
      max-width: 118px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s, border-color 0.12s;
    }

    .tree-node:hover {
      transform: translateY(-1px);
      border-color: var(--accent-steel);
    }

    .tree-node.root {
      background: var(--root-node-bg);
      border: 1.5px solid var(--accent-steel);
    }

    .tree-node.partner {
      border-color: var(--partner-rose);
    }

    .tree-line-vertical {
      width: 2px;
      height: 14px;
      background: var(--accent-steel);
      margin: 2px 0;
    }

    .tree-branch-bar {
      height: 2px;
      background: var(--accent-steel);
      min-width: 90px;
      margin-bottom: 2px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-box {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .widget-tag {
      font-size: 10px;
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .widget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .widget-row:hover {
      background: var(--card-slate);
    }

    .widget-row-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .widget-row-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .widget-row-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-steel);
      background: var(--btn-bg);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--border-slate);
    }

    .log-box {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
    }

    .log-list {
      margin-top: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }

    .log-item {
      padding: 6px 8px;
      background: var(--bg-slate);
      border-left: 3px solid var(--accent-steel);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    .modal {
      width: 100%;
      max-width: 358px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 82vh;
      max-height: 82dvh;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .field-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .field-input, .field-select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--accent-steel);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .warning-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-amber);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--warn-text);
      font-size: 12px;
      line-height: 1.4;
    }

    .modal-footer {
      position: sticky;
      bottom: -12px;
      background: var(--card-slate);
      border-top: 1px solid var(--border-slate);
      padding: 8px 0 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      z-index: 5;
    }

    .rel-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="testbench-header">
    <div class="testbench-title">
      <span class="status-dot"></span>
      <div>
        <div style="font-size: 14px; font-weight: 700;">Remember Me – Interaktiver Web-Testserver</div>
        <div style="font-size: 11px; color: var(--text-muted);">Mit automatischem Stammbaum, Beziehungs-Verwaltung, Namen-Antippen für Details & Erinnerungen</div>
      </div>
    </div>
    <div class="testbench-controls">
      <button class="compact-btn" onclick="runDailyReminderWorker()">🔔 DailyReminderWorker prüfen</button>
      <button class="compact-btn" onclick="seedSampleData()">🌱 Beispieldaten mit Stammbaum laden</button>
      <button class="compact-btn danger" onclick="resetDatabase()">🗑️ DB zurücksetzen</button>
    </div>
  </div>

  <div class="testbench-layout">
    <div class="phone-frame" id="app-root"></div>

    <div class="side-panel">
      <div class="widget-box">
        <div class="widget-header">
          <span class="widget-title">Anstehende Erinnerungen</span>
          <span class="widget-tag">Glance Homescreen-Widget</span>
        </div>
        <div id="widget-rows"></div>
      </div>

      <div class="log-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size: 13px; font-weight: 700;">System- & Intent-Protokoll</span>
          <button class="compact-btn" style="padding:2px 6px; font-size:10px;" onclick="clearLogs()">Leeren</button>
        </div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="calendar-root"></div>
  <input type="file" id="backup-file-input" accept=".json" style="display:none;" onchange="importBackupFile(event)" />
  <input type="file" id="contact-photo-file-input" accept="image/*" style="display:none;" onchange="handleContactPhotoFile(event)" />

  <script>
    const RELATION_PRESETS = [
      "Kind von",
      "Ehe-Partner von",
      "Partner von",
      "Bruder von",
      "Schwester von",
      "Mutter von",
      "Vater von",
      "Elternteil von",
      "Oma/Opa von",
      "Enkelkind von",
      "Onkel/Tante von",
      "Cousin/Cousine von"
    ];

    function inverseRelationLabel(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return "Elternteil von";
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return "Kind von";
      if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner von";
      if (l.startsWith("partner")) return "Partner von";
      if (l.startsWith("bruder") || l.startsWith("schwester") || l.startsWith("geschwister")) return "Geschwister von";
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Enkelkind von";
      if (l.startsWith("enkel")) return "Oma/Opa von";
      if (l.startsWith("onkel") || l.startsWith("tante")) return "Neffe/Nichte von";
      if (l.startsWith("neffe") || l.startsWith("nichte")) return "Onkel/Tante von";
      if (l.startsWith("cousin")) return "Cousin/Cousine von";
      return "Verknüpft mit";
    }

    function relationGenerationStep(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return -1;
      if (l.startsWith("enkel")) return -2;
      if (l.startsWith("neffe") || l.startsWith("nichte")) return -1;
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return 1;
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return 2;
      if (l.startsWith("onkel") || l.startsWith("tante")) return 1;
      return 0;
    }

    function isPartnerRelation(label) {
      const l = (label || "").toLowerCase();
      return l.includes("partner") || l.includes("ehe");
    }

    function isSiblingRelation(label) {
      const l = (label || "").toLowerCase();
      return l.includes("bruder") || l.includes("schwester") || l.includes("geschwister");
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    function addDaysIso(baseIso, days) {
      const d = new Date(baseIso + "T00:00:00");
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function withYearIso(baseIso, year) {
      return year + baseIso.slice(4);
    }

    function daysBetween(date1Iso, date2Iso) {
      const d1 = new Date(date1Iso + "T00:00:00");
      const d2 = new Date(date2Iso + "T00:00:00");
      return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));

    const STORAGE_KEY = "rememberme_test_db_v2";

    function addBidirectionalRelation(fromId, toId, label) {
      if (!fromId || !toId || fromId === toId) return;
      const clean = label.trim();
      const existsFwd = state.relations.some(r => r.fromPersonId === fromId && r.toPersonId === toId && r.relationLabel.toLowerCase() === clean.toLowerCase());
      if (!existsFwd) {
        state.relations.push({ id: state.nextId++, fromPersonId: fromId, toPersonId: toId, relationLabel: clean, isFallbackContact: true });
      }
      const rev = inverseRelationLabel(clean);
      const existsRev = state.relations.some(r => r.fromPersonId === toId && r.toPersonId === fromId);
      if (!existsRev) {
        state.relations.push({ id: state.nextId++, fromPersonId: toId, toPersonId: fromId, relationLabel: rev, isFallbackContact: isPartnerRelation(clean) });
      }

      resolveTarget(person, relationsForPerson) {
        const ownPhone = (person.phone || "").trim();
        const ownEmail = (person.email || "").trim();

        if ((!person.hasNoOwnPhone && (ownPhone !== "" || ownEmail !== "")) || ownPeerId !== "") {
          const noPhoneButAppNotice = (person.hasNoOwnPhone && ownPhone === "" && ownPeerId !== "")
            ? `Hinweis: ${person.name} hat keine Handynummer, ist aber direkt per App-Code (${ownPeerId}) gekoppelt.`
            : null;
          return {
            targetPersonName: person.name,
            phone: ownPhone,
            email: ownEmail,
            appPeerId: ownPeerId,
            hasAppDirect: ownPeerId !== "",
            isRedirectedToRelative: false,
            relationDescription: null,
            warningNotice: noPhoneButAppNotice
          };
        }

        const fallbackPair = relationsForPerson.find(({ rel, target }) =>
          rel.isFallbackContact && ((target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim())
        ) || relationsForPerson.find(({ target }) =>
          (target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim()
        );

        if (fallbackPair) {
          const { rel, target: relative } = fallbackPair;
          return {
            targetPersonName: relative.name,
            phone: (relative.phone || "").trim(),
            email: (relative.email || "").trim(),
            appPeerId: "",
            hasAppDirect: false,
            isRedirectedToRelative: true,
            relationDescription: `${rel.relationLabel} ${relative.name}`,
            warningNotice: `Hinweis: ${person.name} hat keine eigene Nummer. Nachricht wird an ${relative.name} (${rel.relationLabel}) gerichtet.`
          };
        }

        return {
          targetPersonName: person.name,
          phone: "",
          email: ownEmail,
          appPeerId: "",
          hasAppDirect: false,
          isRedirectedToRelative: false,
          relationDescription: null,
          warningNotice: "Hinweis: Keine eigene Telefonnummer/E-Mail und kein erreichbarer verknüpfter Kontakt hinterlegt."
        };
      },

      daysUntilNextBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let nextBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (nextBday < today) nextBday = `${tYear + 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, nextBday);
        } catch (e) { return null; }
      },

      negativeDaysSinceLastBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let lastBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (lastBday > today) lastBday = `${tYear - 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, lastBday);
        } catch (e) { return null; }
      },

      formatPassedAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "hatte Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "hatte Geburtstag";
          const pad = n => String(n).padStart(2, "0");
          let lastYear = tParts[0];
          const thisYearBday = `${tParts[0]}-${pad(bParts[1])}-${pad(bParts[2])}`;
          if (thisYearBday > today) lastYear -= 1;
          const passedAge = Math.max(0, lastYear - bParts[0]);
          return `wurde ${passedAge}`;
        } catch (e) { return "hatte Geburtstag"; }
      },

      formatUpcomingAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "Geburtstag";
          const totalMonths = (tParts[0] - bParts[0]) * 12 + (tParts[1] - bParts[1]);
          const thisYearBday = `${tParts[0]}-${String(bParts[1]).padStart(2, "0")}-${String(bParts[2]).padStart(2, "0")}`;
          const nextYearAge = tParts[0] - bParts[0] + (thisYearBday < today ? 1 : 0);
          if (totalMonths === 0 && nextYearAge === 0) return "Neugeboren (0 Mon.)";
          if (totalMonths >= 0 && totalMonths <= 23) return `${totalMonths} Mon. (wird ${Math.max(1, nextYearAge)})`;
          return `wird ${nextYearAge}`;
        } catch (e) { return "Geburtstag"; }
      },

      nextTimerDate(person, today = todayIso()) {
        if (!person.timerEnabled || person.timerInterval <= 0) return null;
        const base = person.lastContactedIso || today;
        const d = new Date(base + "T00:00:00");
        const interval = Number(person.timerInterval) || 14;
        switch (person.timerUnit) {
          case "WEEKS": d.setDate(d.getDate() + interval * 7); break;
          case "MONTHS": d.setMonth(d.getMonth() + interval); break;
          case "YEARS": d.setFullYear(d.getFullYear() + interval); break;
          default: d.setDate(d.getDate() + interval); break;
        }
        return d.toISOString().slice(0, 10);
      }
    };

    function runDailyReminderWorker() {
      const today = todayIso();
      let rolledCount = 0;

      // 1. Automatisch überfällige REPEAT:-Erinnerungen weiterrollen & heute fällige melden
      for (const ev of state.specialEvents) {
        if (isRepeatDateSpec(ev.dateIso)) {
          const parts = ev.dateIso.split(":");
          const count = Math.max(1, parseInt(parts[1], 10) || 1);
          const unit = (parts[2] || "DAYS").toUpperCase();
          const storedDate = parts[3] || today;
          if (storedDate < today) {
            const rep = parseRepeatDateSpec(ev.dateIso, today);
            ev.dateIso = `REPEAT:${rep.count}:${rep.unit}:${rep.nextIso}`;
            rolledCount++;
          }
        }
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff === 0 || diff === (ev.leadDays || 1)) {
          const p = state.persons.find(x => x.id === ev.personId && !x.isHidden);
          if (p) {
            openPopupForPerson(p.id, `🔔 Erinnerung (${diff === 0 ? 'Heute' : `in ${diff}T`}): ${ev.title}`);
            addLog(`DailyReminderWorker -> Erinnerung "${ev.title}" für ${p.name} ausgelöst.`);
            if (rolledCount > 0) saveState();
            return;
          }
        }
      }

      // 2. Geburtstage heute/morgen & Melde-Timer prüfen (nur sichtbare Kontakte)
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && (bdayDays === 0 || bdayDays === 1)) {
          openPopupForPerson(p.id, `🎂 ${bdayDays === 0 ? 'Heute Geburtstag!' : 'Morgen Geburtstag'} (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`);
          addLog(`DailyReminderWorker -> Geburtstags-Erinnerung für ${p.name}`);
          return;
        }
        const nextTimer = ContactResolver.nextTimerDate(p, today);
        if (nextTimer && nextTimer <= today) {
          openPopupForPerson(p.id, `⏳ Melde-Timer fällig (${p.timerInterval} ${formatTimerUnitDe(p.timerUnit)})`);
          addLog(`DailyReminderWorker -> Melde-Timer-Dialog für ${p.name}`);
          return;
        }
      }
      if (rolledCount > 0) saveState();
      addLog(`DailyReminderWorker: Prüfung abgeschlossen (${rolledCount} wiederkehrende Termine weitergerollt).`);
    }

      for (let i = 0; i < s.length; i++) {

      return AVATAR_GRADIENTS[hash % AVATAR_GRADIENTS.length];

    const WEEKDAY_NAMES_DE = {
      1: "Montag",
      2: "Dienstag",
      3: "Mittwoch",
      4: "Donnerstag",
      5: "Freitag",
      6: "Samstag",
      7: "Sonntag"
    };

    function isWeeklyDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("WEEKLY:");
    }

    function isRepeatDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("REPEAT:");
    }

    function addIntervalToIsoDate(baseIso, count, unit) {
      const n = Math.max(1, parseInt(count, 10) || 1);
      const d = new Date((baseIso || todayIso()) + "T00:00:00");
      switch ((unit || "DAYS").toUpperCase()) {
        case "WEEKS": d.setDate(d.getDate() + n * 7); break;
        case "MONTHS": d.setMonth(d.getMonth() + n); break;
        case "YEARS": d.setFullYear(d.getFullYear() + n); break;
        default: d.setDate(d.getDate() + n); break;
      }
      return d.toISOString().slice(0, 10);
    }

    function formatRhythmTextDe(count, unit) {
      const n = Math.max(1, parseInt(count, 10) || 1);
      const u = (unit || "DAYS").toUpperCase();
      if (u === "WEEKS") return n === 1 ? "1 Woche" : `${n} Wochen`;
      if (u === "MONTHS") return n === 1 ? "1 Monat" : `${n} Monate`;
      if (u === "YEARS") return n === 1 ? "1 Jahr" : `${n} Jahre`;
      return n === 1 ? "1 Tag" : `${n} Tage`;
    }

    function parseRepeatDateSpec(dateIso, today = todayIso()) {
      if (!isRepeatDateSpec(dateIso)) return null;
      const parts = dateIso.split(":");
      const count = Math.max(1, parseInt(parts[1], 10) || 1);
      const unit = (parts[2] || "DAYS").toUpperCase();
      let nextIso = parts[3] || addIntervalToIsoDate(today, count, unit);
      let guard = 0;
      while (nextIso < today && guard < 1000) {
        nextIso = addIntervalToIsoDate(nextIso, count, unit);
        guard++;
      }
      return { count, unit, nextIso };
    }

    function getWeeklyDayNumber(dateIso) {
      if (!isWeeklyDateSpec(dateIso)) return null;
      const num = parseInt(dateIso.split(":")[1], 10);
      return (num >= 1 && num <= 7) ? num : null;
    }

    function daysUntilWeeklyDay(weekday1To7, today = todayIso()) {
      const d = new Date(today + "T00:00:00");
      const jsDay = d.getDay(); // 0=Sun..6=Sat
      const isoDay = jsDay === 0 ? 7 : jsDay; // 1=Mon..7=Sun
      return (weekday1To7 - isoDay + 7) % 7;
    }

    function daysUntilEventSpec(dateIso, today = todayIso()) {
      if (isRepeatDateSpec(dateIso)) {
        const rep = parseRepeatDateSpec(dateIso, today);
        return rep ? daysBetween(today, rep.nextIso) : 999;
      }
      if (isWeeklyDateSpec(dateIso)) {
        const wd = getWeeklyDayNumber(dateIso);
        return wd ? daysUntilWeeklyDay(wd, today) : 999;
      }
      return daysBetween(today, dateIso);
    }

    function formatEventBadgeText(ev, today = todayIso()) {
      if (isRepeatDateSpec(ev.dateIso)) {
        const rep = parseRepeatDateSpec(ev.dateIso, today);
        const rhythmStr = formatRhythmTextDe(rep.count, rep.unit);
        const nextStr = formatIsoToDdMmYyyy(rep.nextIso);
        const diff = daysBetween(today, rep.nextIso);
        if (diff === 0) return `🔔 Heute: ${ev.title} (alle ${rhythmStr})`;
        return `🔁 Alle ${rhythmStr}: ${ev.title} (${nextStr})`;
      }
      if (isWeeklyDateSpec(ev.dateIso)) {
        const wd = getWeeklyDayNumber(ev.dateIso);
        const dayName = WEEKDAY_NAMES_DE[wd] || "Wöchentlich";
        const diff = daysUntilWeeklyDay(wd, today);
        if (diff === 0) return `🔔 Heute (${dayName}): ${ev.title}`;
        if (diff === 1) return `🔁 Jeden ${dayName}: ${ev.title} (morgen)`;
        return `🔁 Jeden ${dayName}: ${ev.title} (in ${diff}T)`;
      }
      return `${ev.title} (${formatIsoToDdMmYyyy(ev.dateIso)})`;
    }

    function formatIsoToDdMmYyyy(iso) {
      if (!iso || !iso.trim()) return "";
      const clean = iso.trim();
      if (isRepeatDateSpec(clean)) {
        const rep = parseRepeatDateSpec(clean);
        const dParts = rep.nextIso.split("-");
        const nextFormatted = dParts.length === 3 ? `${dParts[2].padStart(2, "0")}.${dParts[1].padStart(2, "0")}.${dParts[0]}` : rep.nextIso;
        return `🔁 Alle ${formatRhythmTextDe(rep.count, rep.unit)} • Nächster: ${nextFormatted}`;
      }
      if (isWeeklyDateSpec(clean)) {
        const wd = getWeeklyDayNumber(clean);
        return `🔁 Jeden ${WEEKDAY_NAMES_DE[wd] || "Wochentag"}`;
      }
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(clean)) return clean;
      if (clean.startsWith("--")) {
        const parts = clean.slice(2).split("-");
        if (parts.length === 2) return `${parts[1].padStart(2, "0")}.${parts[0].padStart(2, "0")}.`;
      }
      const parts = clean.split("-");
      return parts.length === 3 ? `${parts[2].padStart(2, "0")}.${parts[1].padStart(2, "0")}.${parts[0]}` : clean;
    }

    function normalizeDateInputToIso(input) {
      const clean = (input || "").trim();
      if (!clean) return "";
      if (isWeeklyDateSpec(clean) || isRepeatDateSpec(clean)) return clean;
      const dotParts = clean.split(".");
      if (dotParts.length === 3 && dotParts[2].length === 4) {
        return `${dotParts[2]}-${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      if (dotParts.length >= 2 && (!dotParts[2] || dotParts[2] === "")) {
        return `--${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      const slashParts = clean.split("/");
      if (slashParts.length === 3 && slashParts[2].length === 4) {
        return `${slashParts[2]}-${slashParts[1].padStart(2, "0")}-${slashParts[0].padStart(2, "0")}`;
      }
      return clean;
    }

    function formatCompactBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const ageStr = ContactResolver.formatUpcomingAge(birthdayIso);
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      const whenStr = days === null ? "" : (days === 0 ? "heute" : (days === 1 ? "in 1 Tag" : `in ${days} Tagen`));
      return [dateStr, `${ageStr} ${whenStr}`.trim()].filter(Boolean).join("  •  ");
    }

    let showPastDates = false;
    let contactSortMode = "birthday"; // "birthday" | "firstname" | "lastname"

    function stripNameRoleSuffix(fullName) {
      return (fullName || "").replace(/\s*\([^)]*\)\s*/g, " ").trim();
    }

    function extractFirstName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts[0] || clean;
    }

    function extractLastName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts.length > 1 ? parts[parts.length - 1] : (parts[0] || clean);
    }

    function cycleContactSortMode() {

    function getSortModeButtonLabel() {
      if (contactSortMode === "firstname") return "⇅ Vorname";
      if (contactSortMode === "lastname") return "⇅ Name";

    }

    function formatPassedBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const passedAgeStr = ContactResolver.formatPassedAge(birthdayIso);
      const negDays = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
      if (negDays === null) return dateStr;
      const negLabel = negDays === 0 ? "0 Tage (heute)" : (negDays === -1 ? "-1 Tag" : `${negDays} Tage`);
      return `${dateStr}  •  ${passedAgeStr} (${negLabel})`;
    }

    let allContactsFilter = "all"; // "all" | "hidden"

    function togglePersonHidden(personId) {
      const p = state.persons.find(x => x.id === personId);
      if (!p) return;
      p.isHidden = !p.isHidden;
      addLog(p.isHidden ? `Kontakt "${p.name}" dauerhaft ausgeblendet (nur noch unter "Alle Kontakte" sichtbar).` : `Kontakt "${p.name}" wieder eingeblendet.`);
      saveState();
    }

    function sortPersonsArray(arr) {
      return [...arr].sort((a, b) => {
        if (contactSortMode === "firstname") {
          const cmp = extractFirstName(a.name).localeCompare(extractFirstName(b.name), "de");
          return cmp !== 0 ? cmp : extractLastName(a.name).localeCompare(extractLastName(b.name), "de");
        }
        if (contactSortMode === "lastname") {
          const cmp = extractLastName(a.name).localeCompare(extractLastName(b.name), "de");
          return cmp !== 0 ? cmp : extractFirstName(a.name).localeCompare(extractFirstName(b.name), "de");
        }
        if (!showPastDates) {
          const da = ContactResolver.daysUntilNextBirthday(a.birthdayIso) ?? 999999;
          const db = ContactResolver.daysUntilNextBirthday(b.birthdayIso) ?? 999999;
          return da !== db ? da - db : a.name.localeCompare(b.name, "de");
        } else {
          const na = ContactResolver.negativeDaysSinceLastBirthday(a.birthdayIso) ?? -999999;
          const nb = ContactResolver.negativeDaysSinceLastBirthday(b.birthdayIso) ?? -999999;
          return na !== nb ? nb - na : a.name.localeCompare(b.name, "de");
        }
      });
    }

    function renderAllContactsTab() {
      const hiddenCount = state.persons.filter(p => p.isHidden).length;
      const baseList = allContactsFilter === "hidden"
        ? state.persons.filter(p => p.isHidden)
        : state.persons;
      const sorted = sortPersonsArray(baseList);

      const headerBar = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px;">
          <button class="compact-btn" onclick="cycleContactSortMode()" title="Sortierreihenfolge umschalten (Geburtstag / Vorname / Name)">
            ${getSortModeButtonLabel()}
          </button>
          <div class="btn-row">
            <button class="compact-btn ${allContactsFilter === 'all' ? 'primary' : ''}" onclick="allContactsFilter='all'; renderPhoneApp();">
              Alle (${state.persons.length})
            </button>
            <button class="compact-btn ${allContactsFilter === 'hidden' ? 'primary' : ''}" onclick="allContactsFilter='hidden'; renderPhoneApp();">
              Ausgeblendet (${hiddenCount})
            </button>
          </div>
        </div>
      `;

      if (sorted.length === 0) {
        return headerBar + `
          <div class="card">
            <div style="font-size:12px; color:var(--text-secondary);">Keine Kontakte in dieser Ansicht vorhanden.</div>
          </div>
        `;
      }

      const listHtml = sorted.map(person => {
        const bdayLine = formatCompactBirthdayLine(person.birthdayIso);
        const subText = bdayLine || (person.phone ? `Ohne Datum • ${person.phone}` : "Ohne Datumsangabe");
        const pillHtml = renderBirthdayCountdownPill(person.birthdayIso, false);
        return `
          <div class="card" style="padding: 10px 12px; opacity:${person.isHidden ? '0.68' : '1'};">
            <div class="person-header" style="align-items: center;">
              <div style="cursor:pointer;" onclick="openDetailModal(${person.id})">
                ${renderPersonAvatarHtml(person.name)}
              </div>
              <div style="flex:1; min-width:0; cursor:pointer;" onclick="openDetailModal(${person.id})" title="Antippen für Details">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span style="font-size:15px; font-weight:700; color:var(--text-primary);">${escapeHtml(person.name)}</span>
                  ${pillHtml}
                  ${person.isHidden ? `<span class="badge-nophone">Ausgeblendet</span>` : ""}
                  ${!person.birthdayIso ? `<span class="badge-app">Ohne Datum</span>` : ""}
                </div>
                <div class="person-sub" style="margin-top:2px; color:var(--text-secondary);">${escapeHtml(subText)}</div>
              </div>
              <div class="btn-row">
                <button class="compact-btn ${person.isHidden ? 'primary' : ''}" onclick="togglePersonHidden(${person.id})">
                  ${person.isHidden ? "Einblenden" : "Ausblenden"}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return headerBar + listHtml;
    }

    function renderPersonsList() {
      const visiblePersons = state.persons.filter(p => !p.isHidden);
      const sorted = sortPersonsArray(visiblePersons);

      const headerBar = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px;">
          <button class="compact-btn" onclick="cycleContactSortMode()" title="Sortierreihenfolge umschalten (Geburtstag / Vorname / Name)">
            ${getSortModeButtonLabel()}
          </button>
          <button class="compact-btn ${showPastDates ? 'primary' : ''}" onclick="showPastDates=!showPastDates; renderPhoneApp();">
            ${showPastDates ? "Anstehende zeigen" : "Vergangene Termine"}
          </button>
        </div>
      `;

      const today = todayIso();
      const listHtml = sorted.map(person => {
        const personEvents = state.specialEvents.filter(e => e.personId === person.id);
        const bdayLine = showPastDates
          ? formatPassedBirthdayLine(person.birthdayIso)
          : formatCompactBirthdayLine(person.birthdayIso);
        const fallbackLine = !bdayLine ? "Ohne Datumsangabe" : "";
        const pillHtml = renderBirthdayCountdownPill(person.birthdayIso, showPastDates);

        return `
          <div class="card" style="padding: 10px 12px;">
            <div class="person-header" style="align-items: center;">
              <div style="cursor:pointer;" onclick="openDetailModal(${person.id})">
                ${renderPersonAvatarHtml(person.name)}
              </div>
              <div style="flex:1; min-width:0; cursor:pointer;" onclick="openDetailModal(${person.id})" title="Antippen für Details">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span style="font-size:15px; font-weight:700; color:var(--text-primary);">${escapeHtml(person.name)}</span>
                  ${pillHtml}
                </div>
                ${bdayLine ? `<div class="person-sub" style="margin-top:2px; color:${showPastDates ? 'var(--warn-amber)' : 'var(--text-secondary)'};">${escapeHtml(bdayLine)}</div>` : `<div class="person-sub" style="margin-top:2px; color:var(--text-muted);">${escapeHtml(fallbackLine)}</div>`}
                ${personEvents.length > 0 ? `
                  <div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;">
                    ${personEvents.map(e => {
                      const isDueToday = daysUntilEventSpec(e.dateIso, today) === 0;
                      const isWeekly = isWeeklyDateSpec(e.dateIso) || isRepeatDateSpec(e.dateIso);
                      const badgeBg = isDueToday ? "var(--warn-bg)" : (isWeekly ? "rgba(46, 125, 91, 0.14)" : "var(--btn-bg)");
                      const badgeColor = isDueToday ? "var(--warn-amber)" : (isWeekly ? "var(--tree-green)" : "var(--accent-steel)");
                      return `<span style="font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; background:${badgeBg}; color:${badgeColor};">${escapeHtml(formatEventBadgeText(e, today))}</span>`;
                    }).join("")}
                  </div>
                ` : ""}
              </div>
              <div class="btn-row">
                <button class="compact-btn primary" onclick="openPopupForPerson(${person.id}, '${showPastDates ? 'Nachträglich zum Geburtstag' : 'Erinnerung'}')">💬 Gruß</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return headerBar + listHtml;
    }

    let treeZoom = 1.0;
    let treePanX = 0;
    let treePanY = 0;
    let isTreeDragging = false;
    let treeDragStartX = 0;
    let treeDragStartY = 0;
    let lastTreePinchDist = null;

    function setTreeZoom(val) {
      treeZoom = Math.min(2.2, Math.max(0.35, Math.round(val * 100) / 100));
      renderPhoneApp();
    }

    function zoomTreeBy(delta) {
      setTreeZoom(treeZoom + delta);
    }

    function resetTreeZoom() {
      treeZoom = 1.0;
      treePanX = 0;
      treePanY = 0;
      renderPhoneApp();
    }

    function fitTreeZoom(maxRowCount, levelCount) {
      const widthScale = maxRowCount > 2 ? (2.9 / maxRowCount) : 1.0;
      const heightScale = levelCount > 4 ? (4.0 / levelCount) : 1.0;
      const fit = Math.min(1.0, widthScale, heightScale);
      treePanX = 0;
      treePanY = 0;
      setTreeZoom(Math.max(0.4, fit));
    }

    function handleTreeMouseDown(e) {
      if (e.target.closest(".tree-node")) return;
      isTreeDragging = true;
      treeDragStartX = e.clientX - treePanX;
      treeDragStartY = e.clientY - treePanY;
    }

    function handleTreeMouseMove(e) {
      if (!isTreeDragging) return;
      treePanX = e.clientX - treeDragStartX;
      treePanY = e.clientY - treeDragStartY;
      const inner = document.getElementById("tree-pan-inner");
      if (inner) {
        inner.style.transform = `translate(${treePanX}px, ${treePanY}px)`;
      }
    }

    function handleTreeMouseUp() {
      isTreeDragging = false;
    }

    function handleTreeWheel(e) {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      zoomTreeBy(delta);
    }

    function handleTreeTouchStart(e) {
      if (e.touches && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTreePinchDist = Math.hypot(dx, dy);
      } else if (e.touches && e.touches.length === 1 && !e.target.closest(".tree-node")) {
        isTreeDragging = true;
        treeDragStartX = e.touches[0].clientX - treePanX;
        treeDragStartY = e.touches[0].clientY - treePanY;
      }
    }

    function handleTreeTouchMove(e) {
      if (e.touches && e.touches.length === 2 && lastTreePinchDist) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (dist > 5) {
          const ratio = dist / lastTreePinchDist;
          if (Math.abs(ratio - 1) > 0.04) {
            lastTreePinchDist = dist;
            setTreeZoom(treeZoom * ratio);
          }
        }
      } else if (e.touches && e.touches.length === 1 && isTreeDragging) {
        treePanX = e.touches[0].clientX - treeDragStartX;
        treePanY = e.touches[0].clientY - treeDragStartY;
        const inner = document.getElementById("tree-pan-inner");
        if (inner) {
          inner.style.transform = `translate(${treePanX}px, ${treePanY}px)`;
        }
      }
    }

    function handleTreeTouchEnd() {
      lastTreePinchDist = null;
      isTreeDragging = false;
    }

    function renderFamilyTreeTab() {
      const visiblePersons = state.persons.filter(p => !p.isHidden);
      if (visiblePersons.length === 0) return "";
      const rootPerson = visiblePersons.find(p => p.id === selectedTreeRootId) || visiblePersons[0];
      const personMap = new Map(visiblePersons.map(p => [p.id, p]));

      // BFS generation calculation
      const genMap = new Map();
      const queue = [rootPerson.id];
      genMap.set(rootPerson.id, 0);

      while (queue.length > 0) {
        const currId = queue.shift();
        const currGen = genMap.get(currId) || 0;

        state.relations.filter(r => r.fromPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.toPersonId) && personMap.has(rel.toPersonId)) {
            genMap.set(rel.toPersonId, currGen + relationGenerationStep(rel.relationLabel));
            queue.push(rel.toPersonId);
          }
        });
        state.relations.filter(r => r.toPersonId === currId).forEach(rel => {
          if (!genMap.has(rel.fromPersonId) && personMap.has(rel.fromPersonId)) {
            genMap.set(rel.fromPersonId, currGen - relationGenerationStep(rel.relationLabel));
            queue.push(rel.fromPersonId);
          }
        });
      }

      function shortRelationName(rawLabel) {
        const l = (rawLabel || "").trim().toLowerCase();
        if (l.startsWith("mutter")) return "Mutter";
        if (l.startsWith("vater")) return "Vater";
        if (l.startsWith("elternteil") || l.startsWith("eltern")) return "Eltern";
        if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner";
        if (l.startsWith("partner")) return "Partner";
        if (l.startsWith("bruder")) return "Bruder";
        if (l.startsWith("schwester")) return "Schwester";
        if (l.startsWith("geschwister")) return "Geschwister";
        if (l.startsWith("kind")) return "Kind";
        if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Oma/Opa";
        if (l.startsWith("enkel")) return "Enkelkind";
        if (l.startsWith("onkel") || l.startsWith("tante")) return "Onkel/Tante";
        if (l.startsWith("neffe") || l.startsWith("nichte")) return "Neffe/Nichte";
        if (l.startsWith("cousin")) return "Cousin/Cousine";
        return rawLabel.replace(/\s+von$/i, "").trim() || "Familie";
      }

      function roleRelativeToRoot(p, genLevel) {
        if (p.id === rootPerson.id) return "Fokus";
        const directOut = state.relations.find(r => r.fromPersonId === p.id && r.toPersonId === rootPerson.id);
        if (directOut) return shortRelationName(directOut.relationLabel);
        const directIn = state.relations.find(r => r.fromPersonId === rootPerson.id && r.toPersonId === p.id);
        if (directIn) return shortRelationName(inverseRelationLabel(directIn.relationLabel));

        if (genLevel <= -2) return "Oma/Opa";
        if (genLevel >= 2) return "Enkelkind";
        if (genLevel === -1) {
          const relToParent = state.relations.find(r =>
            r.fromPersonId === p.id && genMap.get(r.toPersonId) === -1 &&
            state.relations.some(pr =>
              (pr.fromPersonId === r.toPersonId && pr.toPersonId === rootPerson.id && relationGenerationStep(pr.relationLabel) === 1) ||
              (pr.fromPersonId === rootPerson.id && pr.toPersonId === r.toPersonId && relationGenerationStep(pr.relationLabel) === -1)
            )
          );
          if (relToParent && isPartnerRelation(relToParent.relationLabel)) return "Eltern";
          if (relToParent && isSiblingRelation(relToParent.relationLabel)) return "Onkel/Tante";
          return "Eltern";
        }
        if (genLevel === 1) {
          return "Kind";
        }
        const anyRel = state.relations.find(r => r.fromPersonId === p.id);
        if (anyRel) return shortRelationName(anyRel.relationLabel);
        return "Familie";
      }

      function arePartnersOrCoParents(idA, idB) {
        const directRel = state.relations.find(r =>
          (r.fromPersonId === idA && r.toPersonId === idB) ||
          (r.fromPersonId === idB && r.toPersonId === idA)
        );
        if (directRel && isPartnerRelation(directRel.relationLabel)) return true;
        const childrenOfA = state.relations
          .filter(r => r.toPersonId === idA && relationGenerationStep(r.relationLabel) === -1)
          .map(r => r.fromPersonId);
        return childrenOfA.some(cid =>
          state.relations.some(r => r.fromPersonId === cid && r.toPersonId === idB && relationGenerationStep(r.relationLabel) === -1)
        );
      }

      function orderRowMembers(members, genLevel) {
        if (genLevel === 0 && members.some(m => m.id === rootPerson.id)) {
          const others = members.filter(m => m.id !== rootPerson.id);
          const partners = others.filter(m => arePartnersOrCoParents(rootPerson.id, m.id));
          const nonPartners = others.filter(m => !arePartnersOrCoParents(rootPerson.id, m.id));
          if (partners.length > 0) {
            return [...nonPartners, rootPerson, ...partners];
          } else {
            const half = Math.ceil(nonPartners.length / 2);
            return [...nonPartners.slice(0, half), rootPerson, ...nonPartners.slice(half)];
          }
        }

        const visited = new Set();
        const ordered = [];
        const sortedSeed = [...members].sort((a, b) => {
          const aRole = roleRelativeToRoot(a, genLevel);
          const bRole = roleRelativeToRoot(b, genLevel);
          const aIsParent = aRole === "Eltern" || aRole === "Mutter" || aRole === "Vater";
          const bIsParent = bRole === "Eltern" || bRole === "Mutter" || bRole === "Vater";
          if (aIsParent && !bIsParent) return -1;
          if (!aIsParent && bIsParent) return 1;
          return a.name.localeCompare(b.name);
        });

        for (const m of sortedSeed) {
          if (visited.has(m.id)) continue;
          visited.add(m.id);
          ordered.push(m);
          for (const candidate of members) {
            if (!visited.has(candidate.id) && arePartnersOrCoParents(m.id, candidate.id)) {
              visited.add(candidate.id);
              ordered.push(candidate);
            }
          }
        }
        return ordered;
      }

      const levelsMap = new Map();
      for (const [pid, gen] of genMap.entries()) {
        if (!levelsMap.has(gen)) levelsMap.set(gen, []);
        levelsMap.get(gen).push(personMap.get(pid));
      }
      const sortedLevels = [...levelsMap.keys()].sort((a, b) => a - b);
      let maxRowCount = 1;
      for (const lvl of sortedLevels) {
        const len = (levelsMap.get(lvl) || []).length;
        if (len > maxRowCount) maxRowCount = len;
      }

      const dropdownOptions = visiblePersons.map(p => `
        <option value="${p.id}" ${p.id === rootPerson.id ? 'selected' : ''}>
          ${escapeHtml(p.name)}
        </option>
      `).join("");

      const z = treeZoom;
      const nodeMinW = Math.round(74 * z);
      const nodeMaxW = Math.round(122 * z);
      const nodePadV = Math.max(2, Math.round(6 * z));
      const nodePadH = Math.max(3, Math.round(9 * z));
      const nameFont = Math.max(6.5, +(11.5 * z).toFixed(1));
      const roleFont = Math.max(5.5, +(10 * z).toFixed(1));
      const connFont = Math.max(6, +(12 * z).toFixed(1));
      const vLineH = Math.max(6, Math.round(14 * z));
      const branchMinW = Math.max(40, Math.round(90 * z));
      const rowGap = Math.max(2, Math.round(4 * z));

      const levelsHtml = sortedLevels.map((lvl, idx) => {
        const members = orderRowMembers(levelsMap.get(lvl) || [], lvl);
        const nodesHtml = members.map((m, mIdx) => {
          const isRoot = m.id === rootPerson.id;
          const role = roleRelativeToRoot(m, lvl);
          const isPartner = isPartnerRelation(role);
          let connector = "";
          if (mIdx < members.length - 1) {
            const nextM = members[mIdx + 1];
            const coupled = arePartnersOrCoParents(m.id, nextM.id);
            connector = coupled
              ? `<span style="color:var(--partner-rose); font-size:${connFont}px; font-weight:700; padding:0 2px;">❤️</span>`
              : `<span style="width:${Math.max(2, Math.round(4 * z))}px; display:inline-block;"></span>`;
          }
          const avatarSize = Math.max(16, Math.round(24 * z));
          const photoHtml = m.photoBase64
            ? `<div style="display:flex; justify-content:center; margin-bottom:${Math.max(1, Math.round(2 * z))}px;">${renderPersonAvatarHtml(m.name, m.photoBase64, avatarSize)}</div>`
            : "";
          return `
            <div class="tree-node ${isRoot ? 'root' : ''} ${isPartner ? 'partner' : ''}"
                 style="min-width:${nodeMinW}px; max-width:${nodeMaxW}px; padding:${nodePadV}px ${nodePadH}px; border-radius:10px;"
                 onclick="openDetailModal(${m.id})">
              ${photoHtml}
              <div style="font-size:${nameFont}px; font-weight:700; color:var(--text-primary); line-height:1.2;">${escapeHtml(m.name)}</div>
              <div style="font-size:${roleFont}px; color:${isRoot ? 'var(--accent-steel)' : (isPartner ? 'var(--partner-rose)' : 'var(--tree-green)')}; margin-top:2px; line-height:1.1; font-weight:600;">
                ${escapeHtml(role)}
              </div>
            </div>
            ${connector}
          `;
        }).join("");

        const nextMembers = idx < sortedLevels.length - 1 ? (levelsMap.get(sortedLevels[idx + 1]) || []) : [];
        const connectorDown = idx < sortedLevels.length - 1 ? `
          <div class="tree-line-vertical" style="height:${vLineH}px;"></div>
          ${nextMembers.length > 1 ? `<div class="tree-branch-bar" style="min-width:${branchMinW}px;"></div>` : ""}
        ` : "";

        return `
          <div class="tree-row" style="gap:${rowGap}px; width:max-content; overflow:visible;">${nodesHtml}</div>
          ${connectorDown}
        `;
      }).join("");

      const zoomPct = Math.round(treeZoom * 100);

      return `
        <div class="card" style="padding:8px 10px; display:flex; flex-direction:column; gap:7px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <label class="field-label" style="white-space:nowrap; font-size:12px; font-weight:600; color:var(--text-secondary);">🌳 Fokus:</label>
            <select class="field-select" style="flex:1;" onchange="selectedTreeRootId=parseInt(this.value, 10); renderPhoneApp();">
              ${dropdownOptions}
            </select>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap;">
            <span style="font-size:11px; color:var(--text-muted);">✋ Ziehen & 🔍 Zoomen:</span>
            <div class="btn-row" style="gap:4px;">
              <button class="compact-btn" style="padding:3px 8px; font-weight:700;" onclick="zoomTreeBy(-0.15)" title="Rauszoomen">➖</button>
              <button class="compact-btn ${zoomPct === 100 && treePanX === 0 && treePanY === 0 ? 'primary' : ''}" style="padding:3px 8px; font-size:11px;" onclick="resetTreeZoom()" title="Auf 100% & Mitte zurücksetzen">${zoomPct}%</button>
              <button class="compact-btn" style="padding:3px 8px; font-weight:700;" onclick="zoomTreeBy(0.15)" title="Reinzoomen">➕</button>
              <button class="compact-btn" style="padding:3px 8px; font-size:11px;" onclick="fitTreeZoom(${maxRowCount}, ${sortedLevels.length})" title="Großen Stammbaum komplett einpassen">⛶ Passend</button>
            </div>
          </div>
        </div>
        <div class="tree-container"
             style="min-height:210px; overflow:hidden; align-items: stretch; cursor:grab; user-select:none;"
             onmousedown="handleTreeMouseDown(event)"
             onmousemove="handleTreeMouseMove(event)"
             onmouseup="handleTreeMouseUp()"
             onmouseleave="handleTreeMouseUp()"
             onwheel="handleTreeWheel(event)"
             ontouchstart="handleTreeTouchStart(event)"
             ontouchmove="handleTreeTouchMove(event)"
             ontouchend="handleTreeTouchEnd()">
          <div id="tree-pan-inner" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:max-content; margin:0 auto; padding:8px; transform:translate(${treePanX}px, ${treePanY}px);">
            ${levelsHtml}
          </div>
        </div>
      `;
    }

    function renderDirectChatTab() {
      if (state.directMessages.length === 0) {
        return `<div class="card"><div style="font-size:12px; color:var(--text-secondary);">Noch keine Nachrichten vorhanden.</div></div>`;
      }
      return state.directMessages.map(m => {
        const person = state.persons.find(p => p.id === m.personId);
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
              <span>${escapeHtml(person ? person.name : m.senderDisplayName)} (${escapeHtml(m.targetPeerId)})</span>
              <span>${escapeHtml(m.timestampIso)}</span>
            </div>
            <div style="font-size:13px; margin-top:4px;"><b>${escapeHtml(m.senderDisplayName)}:</b> ${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join("");
    }

    function formatTimerUnitDe(unit) {
      switch ((unit || "").toUpperCase()) {
        case "DAYS": return "Tage";
        case "WEEKS": return "Wochen";
        case "MONTHS": return "Monate";
        case "YEARS": return "Jahre";
        default: return unit || "Tage";
      }
    }

    function renderTimerTab() {
      const today = todayIso();
      const timerPersons = state.persons.filter(p => !p.isHidden && p.timerEnabled);
      return timerPersons.map(p => {
        const nextDate = ContactResolver.nextTimerDate(p, today);
        const diff = daysBetween(today, nextDate);
        const pillText = diff <= 0 ? "⏳ Fällig!" : `⏳ in ${diff}T`;
        return `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <div style="cursor:pointer;" onclick="openDetailModal(${p.id})">
              ${renderPersonAvatarHtml(p.name)}
            </div>
            <div style="flex:1; min-width:0; cursor:pointer;" onclick="openDetailModal(${p.id})">
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <span class="person-name-link">${escapeHtml(p.name)}</span>
                <span class="countdown-pill ${diff <= 0 ? 'today' : (diff <= 3 ? 'soon' : '')}">${pillText}</span>
              </div>
              <div class="person-sub">Alle ${p.timerInterval} ${formatTimerUnitDe(p.timerUnit)} • Nächste: ${formatIsoToDdMmYyyy(nextDate)}</div>
            </div>
            <button class="compact-btn primary" onclick="openPopupForPerson(${p.id}, 'Melde-Timer')">💬 Gruß</button>
          </div>
        `;
      }).join("");
    }

    function renderEventsTab() {
      const today = todayIso();
      const rows = [];
      state.specialEvents.forEach(ev => {
        const person = state.persons.find(p => p.id === ev.personId && !p.isHidden);
        if (!person) return;
        const days = daysUntilEventSpec(ev.dateIso, today);
        const isWeekly = isWeeklyDateSpec(ev.dateIso) || isRepeatDateSpec(ev.dateIso);
        rows.push({
          days,
          personId: ev.personId,
          personName: person.name,
          title: `${isWeekly ? "🔁 " : "🔔 "}${ev.title} (${person.name})`,
          sub: `${formatIsoToDdMmYyyy(ev.dateIso)}`,
          badge: days === 0 ? "Heute!" : `in ${days}T`
        });
      });
      state.persons.filter(p => !p.isHidden).forEach(p => {
        if (p.birthdayIso) {
          const days = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
          rows.push({
            days: days ?? 999,
            personId: p.id,
            personName: p.name,
            title: `🎂 Geburtstag: ${p.name}`,
            sub: `${formatIsoToDdMmYyyy(p.birthdayIso)} (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`,
            badge: days === 0 ? "Heute!" : `in ${days}T`
          });
        }
      });
      rows.sort((a, b) => a.days - b.days);
      return rows.map(r => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div style="cursor:pointer;" onclick="openDetailModal(${r.personId})">
            ${renderPersonAvatarHtml(r.personName)}
          </div>
          <div style="flex:1; min-width:0; cursor:pointer;" onclick="openDetailModal(${r.personId})">
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <span class="person-name-link" style="font-size:14px;">${escapeHtml(r.title)}</span>
              <span class="countdown-pill ${r.days === 0 ? 'today' : (r.days <= 7 ? 'soon' : '')}">${escapeHtml(r.badge)}</span>
            </div>
            <div class="person-sub">${escapeHtml(r.sub)}</div>
          </div>
          <button class="compact-btn primary" onclick="openPopupForPerson(${r.personId}, '${escapeHtml(r.title)}')">💬 Gruß</button>
        </div>
      `).join("");
    }

    let selectedWichtelGroupId = null;
    let wichtelGroupModalState = null; // { mode: 'create'|'edit'|'reuse', groupId, historyId, groupName, adminName, motto, budget, revealDate, reminderDaysBefore, excludeCouples, excludeLastYear, reusedParticipants }
    let wichtelParticipantModalState = null; // { mode: 'add'|'edit', groupId, participantId, checkedPersonIds, customName, customPhone, personId, name, phone, wishText, noGos, address, wishlistUrl, extraWishUrls }
    let wichtelSecretPeekState = null; // { groupId, participantId }
    let wichtelAnonQuestionState = null; // { groupId, targetParticipantId, questionText }
    let wichtelHistoryImportModalOpen = false;
    let wichtelHistoryShareState = null; // { historyId }

    const WICHTEL_MOTTOS = [
      "🎁 Klassisches Wichteln",
      "♻️ Schrottwichteln",
      "📖 Buch-Wichteln",
      "🛠️ Selbstgemachtes",
      "🎲 Würfel-/Räuberwichteln"
    ];

    function getCouplePartnerForPerson(personId) {
      if (!personId) return null;
      const directRel = state.relations.find(r =>
        (r.fromPersonId === personId || r.toPersonId === personId) &&
        isPartnerRelation(r.relationLabel)
      );
      if (directRel) {
        const partnerId = directRel.fromPersonId === personId ? directRel.toPersonId : directRel.fromPersonId;
        return state.persons.find(p => p.id === partnerId) || null;
      }
      // Auch gemeinsame Kinder (Co-Parents im Stammbaum) prüfen
      const childrenIds = state.relations
        .filter(r => r.toPersonId === personId && relationGenerationStep(r.relationLabel) === -1)
        .map(r => r.fromPersonId);
      for (const cid of childrenIds) {
        const otherParentRel = state.relations.find(r =>
          r.fromPersonId === cid && r.toPersonId !== personId && relationGenerationStep(r.relationLabel) === -1
        );
        if (otherParentRel) {
          return state.persons.find(p => p.id === otherParentRel.toPersonId) || null;
        }
      }
      return null;
    }

    function extractAddressFromPerson(person) {
      if (!person || !Array.isArray(person.extraInfos)) return "";
      const addrRow = person.extraInfos.find(x => (x.label || "").toLowerCase().includes("adresse") || (x.label || "").toLowerCase().includes("anschrift"));
      return addrRow ? (addrRow.value || "") : "";
    }

    function ensureWichtelGroups() {
      if (!Array.isArray(state.wichtelGroups)) {
        state.wichtelGroups = [];
      }
      if (!Array.isArray(state.wichtelHistory)) {
        state.wichtelHistory = [];
      }
      if (state.wichtelGroups.length === 0 && state.persons.length > 0) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 5);
        state.wichtelGroups.push({
          id: state.nextId++,
          groupName: `Familien-Wichteln ${xmasYear}`,
          adminName: adultPersons[1] ? adultPersons[1].name : (adultPersons[0] ? adultPersons[0].name : "Ich (Admin)"),
          motto: "🎁 Klassisches Wichteln",
          budget: "25 €",
          revealDateIso: `${xmasYear}-12-24`,
          reminderDaysBefore: 7,
          excludeCouples: true,
          excludeLastYear: true,
          forceRevealed: false,
          isDrawn: false,
          drawnAt: "",
          participants: adultPersons.map(p => ({
            id: state.nextId++,
            personId: p.id,
            name: p.name,
            phone: p.phone || "",
            appPeerId: p.appPeerId || "",
            wishText: p.notes || "Überraschung, Schokolade, Buch",
            noGos: "",
            address: extractAddressFromPerson(p),
            wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`,
            extraWishUrls: [],
            drawnTargetId: null,
            lastYearTargetId: null,
            notifiedVia: ""
          }))
        });
      }
      if (state.wichtelHistory.length === 0 && state.persons.length >= 2) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 4);
        if (adultPersons.length >= 2) {
          state.wichtelHistory.push({
            id: state.nextId++,
            year: xmasYear - 1,
            groupName: `Familien-Wichteln ${xmasYear - 1}`,
            adminName: adultPersons[0].name,
            motto: "🎁 Klassisches Wichteln",
            budget: "25 €",
            completedDateIso: `${xmasYear - 1}-12-24`,
            pairings: adultPersons.map((p, idx) => {
              const target = adultPersons[(idx + 1) % adultPersons.length];
              return {
                giverName: p.name,
                giverPersonId: p.id,
                giverPhone: p.phone || "",
                receiverName: target.name,
                receiverPersonId: target.id,
                wishText: p.notes || "",
                noGos: "",
                address: extractAddressFromPerson(p),
                wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`
              };
            })
          });
        }
      }
      if (selectedWichtelGroupId === null || !state.wichtelGroups.some(g => g.id === selectedWichtelGroupId)) {
        selectedWichtelGroupId = state.wichtelGroups[0] ? state.wichtelGroups[0].id : null;
      }
    }

    function getHistoricalTargetsForParticipant(part) {
      if (!part || !Array.isArray(state.wichtelHistory)) return [];
      const results = [];
      const pNameLower = (part.name || "").trim().toLowerCase();
      for (const h of state.wichtelHistory) {
        for (const pair of (h.pairings || [])) {
          const sameId = part.personId && pair.giverPersonId && part.personId === pair.giverPersonId;
          const sameName = (pair.giverName || "").trim().toLowerCase() === pNameLower;
          if (sameId || sameName) {
            results.push({
              year: h.year || (h.completedDateIso ? h.completedDateIso.slice(0, 4) : ""),
              groupName: h.groupName,
              receiverName: pair.receiverName,
              receiverPersonId: pair.receiverPersonId
            });
          }
        }
      }
      return results;
    }

    function hasDrawnTargetInHistory(giverPart, receiverPart) {
      if (!giverPart || !receiverPart) return false;
      const pastList = getHistoricalTargetsForParticipant(giverPart);
      const rNameLower = (receiverPart.name || "").trim().toLowerCase();
      return pastList.some(item =>
        (receiverPart.personId && item.receiverPersonId && receiverPart.personId === item.receiverPersonId) ||
        (item.receiverName || "").trim().toLowerCase() === rNameLower
      );
    }

    function isWichtelGroupRevealed(group) {
      if (!group) return false;
      if (group.forceRevealed) return true;
      const today = todayIso();
      return !!(group.revealDateIso && today >= group.revealDateIso);
    }

    function renderWichtelTab() {
      ensureWichtelGroups();
      const groups = state.wichtelGroups;

      const topBar = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:4px;">
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            ${groups.map(g => `
              <button class="compact-btn ${g.id === selectedWichtelGroupId ? 'primary' : ''}" onclick="selectedWichtelGroupId=${g.id}; renderPhoneApp();">
                🎄 ${escapeHtml(g.groupName)}
              </button>
            `).join("")}
          </div>
          <div style="display:flex; gap:5px;">
            <button class="compact-btn" onclick="openWichtelSecretCodeModal()" title="Empfangenen geheimen Wichtel-Los-Code entschlüsseln">🔐 Los-Code</button>
            <button class="compact-btn primary" onclick="openWichtelGroupModal('create')">+ Neue Runde</button>
          </div>
        </div>
      `;

      const group = groups.find(g => g.id === selectedWichtelGroupId);
      if (!group) {
        return topBar + `
          <div class="card">
            <div style="font-size:14px; font-weight:600; margin-bottom:4px;">🎄 Noch keine Wichtelrunde erstellt</div>
            <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">
              Erstelle als Gruppenadmin eine neue Wichtelrunde, lade Kontakte per Ankreuzliste ein, hinterlege Wunschzettel oder Amazon-Wunschlisten und würfle die geheime Zulosung aus!
            </div>
            <button class="compact-btn primary" onclick="openWichtelGroupModal('create')">🎄 Erste Wichtelrunde starten</button>
          </div>
        `;
      }

      const revealed = isWichtelGroupRevealed(group);
      const revealDateFormatted = formatIsoToDdMmYyyy(group.revealDateIso) || "24.12.";
      const daysUntilReveal = group.revealDateIso ? daysBetween(todayIso(), group.revealDateIso) : 0;

      const statusBanner = !group.isDrawn
        ? `
          <div style="background:rgba(56, 189, 248, 0.12); border:1px solid var(--accent-steel); border-radius:8px; padding:9px 11px; margin-top:8px; font-size:12px; color:var(--text-primary);">
            🎲 <b>Bereit zum Würfeln:</b> Sobald alle Teilnehmer eingetragen sind, tippe auf <b>„🎲 Jetzt auslosen!“</b>. Niemand sieht die Gesamtliste vor Ablauf der Frist (${escapeHtml(revealDateFormatted)}).
          </div>
        `
        : (!revealed
          ? `
            <div style="background:rgba(16, 185, 129, 0.14); border:1px solid var(--tree-green); border-radius:8px; padding:9px 11px; margin-top:8px; font-size:12px; color:var(--text-primary); line-height:1.4;">
              🔒 <b>Geheimhaltung aktiv bis ${escapeHtml(revealDateFormatted)}</b> ${daysUntilReveal > 0 ? `(noch ${daysUntilReveal} Tage)` : ""}<br/>
              <span style="font-size:11px; color:var(--text-secondary);">Niemand in der Gruppe sieht, wer wen gezogen hat! Teile jedem Teilnehmer sein Los einzeln per <b>📲 WhatsApp</b> oder <b>💬 In-App</b> mit.</span>
            </div>
          `
          : `
            <div style="background:rgba(245, 158, 11, 0.16); border:1px solid var(--warn-amber); border-radius:8px; padding:10px 11px; margin-top:8px; font-size:12px; color:var(--text-primary);">
              <div style="font-weight:700; color:var(--warn-amber); margin-bottom:6px;">🔓 Frist abgelaufen (${escapeHtml(revealDateFormatted)}) – Alle Paarungen sind jetzt sichtbar:</div>
              <div style="display:flex; flex-direction:column; gap:4px;">
                ${group.participants.map(p => {
                  const target = group.participants.find(x => x.id === p.drawnTargetId);
                  return `<div style="background:var(--bg-slate); padding:5px 8px; border-radius:5px; border:1px solid var(--border-slate); font-size:12px;">🎁 <b>${escapeHtml(p.name)}</b> ➔ hat <b>${escapeHtml(target ? target.name : '?')}</b> beschenkt</div>`;
                }).join("")}
              </div>
            </div>
          `);

      const groupHeaderCard = `
        <div class="card" style="border-color:var(--accent-steel);">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div>
              <div style="font-size:16px; font-weight:700; color:var(--text-primary);">🎄 ${escapeHtml(group.groupName)}</div>
              <div style="font-size:12px; color:var(--text-secondary); margin-top:3px;">
                👑 Admin: <b>${escapeHtml(group.adminName || "Admin")}</b>
                ${group.budget ? ` • 💶 Budget: <b>${escapeHtml(group.budget)}</b>` : ""}
              </div>
              <div style="font-size:11.5px; color:var(--tree-green); font-weight:600; margin-top:2px;">
                ${escapeHtml(group.motto || "🎁 Klassisches Wichteln")}
                ${group.reminderDaysBefore ? ` • ⏰ Wecker: ${group.reminderDaysBefore}T vorher` : ""}
              </div>
              <div style="font-size:11px; color:var(--accent-steel); margin-top:2px;">
                📅 Auflösungs-Frist: <b>${escapeHtml(revealDateFormatted)}</b>
                ${group.excludeCouples ? ` • 💑 Paar-Sperre` : ""}
                ${group.excludeLastYear !== false ? ` • 📜 Keine Wiederholungen (Historie aktiv)` : ""}
              </div>
            </div>
            <div class="btn-row">
              <button class="compact-btn" onclick="openWichtelGroupModal('edit', ${group.id})" title="Runde bearbeiten">✏️</button>
              <button class="compact-btn danger" onclick="deleteWichtelGroup(${group.id})" title="Runde löschen">🗑️</button>
