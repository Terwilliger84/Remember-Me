<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remember Me v1.0.38 – Interaktiver Testserver</title>
  <style>
    /* Standard-Theme: ☀️ Sanftes Blau (Hell) */
    :root,
    body[data-theme="warm"],
    body[data-theme="light"] {
      background-color: #DCE8F5;
      --bg-slate: #F2F7FC;
      --card-slate: #FFFFFF;
      --border-slate: #CFE0F0;
      --btn-bg: #E3EFFA;
      --btn-hover: #D0E3F5;
      --primary-bg: #3B82C4;
      --primary-hover: #2C6CA8;
      --root-node-bg: #DFEFFC;
      --text-primary: #182B42;
      --text-secondary: #415A77;
      --text-muted: #728CA8;
      --accent-steel: #3B82C4;
      --warn-amber: #2563EB;
      --warn-bg: #E0F2FE;
      --warn-text: #1E40AF;
      --danger: #C9352B;
      --success: #2E7D5B;
      --partner-rose: #D6336C;
      --tree-green: #2E7D5B;
      --card-shadow: 0 3px 10px rgba(24, 43, 66, 0.06);
    }

    /* 🌙 Sanftes Nachtblau */
    body[data-theme="cozy-dark"],
    body[data-theme="dark"] {
      background-color: #0D1624;
      --bg-slate: #131F31;
      --card-slate: #1B2B42;
      --border-slate: #2C4263;
      --btn-bg: #243854;
      --btn-hover: #2F486B;
      --primary-bg: #4A90E2;
      --primary-hover: #357ABD;
      --root-node-bg: #1E3A5F;
      --text-primary: #F0F6FC;
      --text-secondary: #B8CCE0;
      --text-muted: #7E97B3;
      --accent-steel: #63A4FF;
      --warn-amber: #60A5FA;
      --warn-bg: #1E3A5F;
      --warn-text: #DBEAFE;
      --danger: #EF4444;
      --success: #34D399;
      --partner-rose: #FB7185;
      --tree-green: #34D399;
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.32);
    }

    /* 🎄 Weihnachts-Modus */
    body[data-theme="xmas"] {
      background-color: #162B20;
      --bg-slate: #F7F3E8;
      --card-slate: #FFFDF8;
      --border-slate: #D8C7A8;
      --btn-bg: #ECE3CE;
      --btn-hover: #DFD2B5;
      --primary-bg: #1E5A3A;
      --primary-hover: #16462C;
      --root-node-bg: #FCE8E6;
      --text-primary: #1B3124;
      --text-secondary: #3B5545;
      --text-muted: #6C8273;
      --accent-steel: #B4232A;
      --warn-amber: #C28512;
      --warn-bg: #FEF5D8;
      --warn-text: #855808;
      --danger: #B4232A;
      --success: #1E5A3A;
      --partner-rose: #C81E45;
      --tree-green: #1E5A3A;
      --card-shadow: 0 4px 12px rgba(24, 52, 36, 0.08);
    }

    /* 💎 Klassisch (Slate/Blau) */
    body[data-theme="classic"] {
      background-color: #070B14;
      --bg-slate: #0F172A;
      --card-slate: #1E293B;
      --border-slate: #334155;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --primary-bg: #0284C7;
      --primary-hover: #0369A1;
      --root-node-bg: #1E3A5F;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --accent-steel: #38BDF8;
      --warn-amber: #F59E0B;
      --warn-bg: #3B2F1E;
      --warn-text: #FDE68A;
      --danger: #EF4444;
      --success: #22C55E;
      --partner-rose: #F43F5E;
      --tree-green: #10B981;
      --card-shadow: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .testbench-header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
    }

    .testbench-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .testbench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .testbench-layout {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .testbench-layout {
        grid-template-columns: 1fr;
      }
    }

    .phone-frame {
      background: var(--bg-slate);
      border: 2px solid var(--border-slate);
      border-radius: 22px;
      padding: 14px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(24, 43, 66, 0.2);
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
    }

    .compact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-slate);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .compact-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-steel);
    }

    .compact-btn.primary {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
    }

    .compact-btn.primary:hover {
      background: var(--primary-hover);
    }

    .compact-btn.danger {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
    }

    /* Kompakte Icon-Navigation */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 12px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 5px;
      box-shadow: var(--card-shadow);
    }

    @media (max-width: 480px) {
      .nav-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 6px 3px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .nav-tab .nav-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .nav-tab:hover {
      background: var(--btn-bg);
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
      box-shadow: 0 2px 8px rgba(59, 130, 196, 0.28);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }

    .card {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--card-shadow);
    }

    /* Runde Kontakt-Avatare & Countdown-Badges */
    .person-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
      letter-spacing: 0.5px;
      position: relative;
    }

    .countdown-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.1;
    }

    .countdown-pill.today {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
    }

    .countdown-pill.soon {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-amber);
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .person-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .person-name-link {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
    }

    .person-name-link:hover {
      color: var(--accent-steel);
      text-decoration: underline;
    }

    .badge-app {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent-steel);
      background: var(--btn-bg);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-nophone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--warn-amber);
      background: var(--warn-bg);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .person-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .person-meta {
      font-size: 11px;
      margin-top: 4px;
    }

    .meta-muted { color: var(--text-muted); }
    .meta-accent { color: var(--accent-steel); }
    .meta-secondary { color: var(--text-secondary); }

    /* Stammbaum Styles */
    .tree-container {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      width: 100%;
      overflow-x: auto;
      padding: 2px 0;
    }

    .tree-node {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 5px 8px;
      min-width: 72px;
      max-width: 118px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s, border-color 0.12s;
    }

    .tree-node:hover {
      transform: translateY(-1px);
      border-color: var(--accent-steel);
    }

    .tree-node.root {
      background: var(--root-node-bg);
      border: 1.5px solid var(--accent-steel);
    }

    .tree-node.partner {
      border-color: var(--partner-rose);
    }

    .tree-line-vertical {
      width: 2px;
      height: 14px;
      background: var(--accent-steel);
      margin: 2px 0;
    }

    .tree-branch-bar {
      height: 2px;
      background: var(--accent-steel);
      min-width: 90px;
      margin-bottom: 2px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-box {
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .widget-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 10px;
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      padding: 3px 7px;
      border-radius: 4px;
    }

    .widget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .widget-row:hover {
      background: var(--card-slate);
    }

    .widget-row-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .widget-row-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .widget-row-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-steel);
      background: var(--btn-bg);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-slate);
    }

    .log-box {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 14px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
    }

    .log-list {
      margin-top: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
    }

    .log-item {
      padding: 6px 8px;
      background: var(--bg-slate);
      border-left: 3px solid var(--accent-steel);
      border-radius: 4px;
      color: var(--text-secondary);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    .modal {
      width: 100%;
      max-width: 358px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 82vh;
      max-height: 82dvh;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .field-label {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .field-input, .field-select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      box-sizing: border-box;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text-primary);
      font-size: 12.5px;
      outline: none;
    }

    .field-input:focus, .field-select:focus {
      border-color: var(--accent-steel);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .warning-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-amber);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--warn-text);
      font-size: 12px;
      line-height: 1.4;
    }

    .modal-header-sticky {
      position: sticky;
      top: -12px;
      background: var(--card-slate);
      border-bottom: 1px solid var(--border-slate);
      padding: 4px 0 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
      z-index: 10;
    }

    .modal-footer {
      position: sticky;
      bottom: -12px;
      background: var(--card-slate);
      border-top: 1px solid var(--border-slate);
      padding: 8px 0 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      z-index: 5;
    }

    .rel-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-slate);
      border: 1px solid var(--border-slate);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="testbench-header">
    <div class="testbench-title">
      <span class="status-dot"></span>
      <div>
        <div style="font-size: 14px; font-weight: 700;">Remember Me – Interaktiver Web-Testserver</div>
        <div style="font-size: 11px; color: var(--text-muted);">Mit automatischem Stammbaum, Beziehungs-Verwaltung, Namen-Antippen für Details & Erinnerungen</div>
      </div>
    </div>
    <div class="testbench-controls">
      <button class="compact-btn" onclick="runDailyReminderWorker()">🔔 DailyReminderWorker prüfen</button>
      <button class="compact-btn" onclick="seedSampleData()">🌱 Beispieldaten mit Stammbaum laden</button>
      <button class="compact-btn danger" onclick="resetDatabase()">🗑️ DB zurücksetzen</button>
    </div>
  </div>

  <div class="testbench-layout">
    <div class="phone-frame" id="app-root"></div>

    <div class="side-panel">
      <div class="widget-box">
        <div class="widget-header">
          <span class="widget-title">Anstehende Erinnerungen</span>
          <span class="widget-tag">Glance Homescreen-Widget</span>
        </div>
        <div id="widget-rows"></div>
      </div>

      <div class="log-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size: 13px; font-weight: 700;">System- & Intent-Protokoll</span>
          <button class="compact-btn" style="padding:2px 6px; font-size:10px;" onclick="clearLogs()">Leeren</button>
        </div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="calendar-root"></div>
  <input type="file" id="backup-file-input" accept=".json" style="display:none;" onchange="importBackupFile(event)" />
  <input type="file" id="contact-photo-file-input" accept="image/*" style="display:none;" onchange="handleContactPhotoFile(event)" />

  <script>
    const RELATION_PRESETS = [
      "Kind von",
      "Ehe-Partner von",
      "Partner von",
      "Bruder von",
      "Schwester von",
      "Mutter von",
      "Vater von",
      "Elternteil von",
      "Oma/Opa von",
      "Enkelkind von",
      "Onkel/Tante von",
      "Cousin/Cousine von"
    ];

    function inverseRelationLabel(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return "Elternteil von";
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return "Kind von";
      if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner von";
      if (l.startsWith("partner")) return "Partner von";
      if (l.startsWith("bruder") || l.startsWith("schwester") || l.startsWith("geschwister")) return "Geschwister von";
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Enkelkind von";
      if (l.startsWith("enkel")) return "Oma/Opa von";
      if (l.startsWith("onkel") || l.startsWith("tante")) return "Neffe/Nichte von";
      if (l.startsWith("neffe") || l.startsWith("nichte")) return "Onkel/Tante von";
      if (l.startsWith("cousin")) return "Cousin/Cousine von";
      return "Verknüpft mit";
    }

    function relationGenerationStep(label) {
      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return -1;
      if (l.startsWith("enkel")) return -2;
      if (l.startsWith("neffe") || l.startsWith("nichte")) return -1;
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil")) return 1;
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return 2;
      if (l.startsWith("onkel") || l.startsWith("tante")) return 1;
      return 0;
    }

      return l.includes("partner") || l.includes("ehe");

      const l = (label || "").toLowerCase();

      const d1 = new Date(date1Iso + "T00:00:00");

    function addBidirectionalRelation(fromId, toId, label) {
      if (!fromId || !toId || fromId === toId) return;
      const clean = label.trim();
      const existsFwd = state.relations.some(r => r.fromPersonId === fromId && r.toPersonId === toId && r.relationLabel.toLowerCase() === clean.toLowerCase());
      if (!existsFwd) {
        state.relations.push({ id: state.nextId++, fromPersonId: fromId, toPersonId: toId, relationLabel: clean, isFallbackContact: true });
      }
      const rev = inverseRelationLabel(clean);
      const existsRev = state.relations.some(r => r.fromPersonId === toId && r.toPersonId === fromId);
      if (!existsRev) {
        state.relations.push({ id: state.nextId++, fromPersonId: toId, toPersonId: fromId, relationLabel: rev, isFallbackContact: isPartnerRelation(clean) });
      }
    }

    const ContactResolver = {
      resolveTarget(person, relationsForPerson) {
        const ownPhone = (person.phone || "").trim();
        const ownEmail = (person.email || "").trim();
        const ownPeerId = (person.appPeerId || "").trim();

        if ((!person.hasNoOwnPhone && (ownPhone !== "" || ownEmail !== "")) || ownPeerId !== "") {
          const noPhoneButAppNotice = (person.hasNoOwnPhone && ownPhone === "" && ownPeerId !== "")
            ? `Hinweis: ${person.name} hat keine Handynummer, ist aber direkt per App-Code (${ownPeerId}) gekoppelt.`
            : null;
          return {
            targetPersonName: person.name,
            phone: ownPhone,
            email: ownEmail,
            appPeerId: ownPeerId,
            hasAppDirect: ownPeerId !== "",
            isRedirectedToRelative: false,
            relationDescription: null,
            warningNotice: noPhoneButAppNotice
          };
        }

        const fallbackPair = relationsForPerson.find(({ rel, target }) =>
          rel.isFallbackContact && ((target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim())
        ) || relationsForPerson.find(({ target }) =>
          (target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim()
        );

        if (fallbackPair) {
          const { rel, target: relative } = fallbackPair;
          return {
            targetPersonName: relative.name,
            phone: (relative.phone || "").trim(),
            email: (relative.email || "").trim(),
            appPeerId: "",
            hasAppDirect: false,
            isRedirectedToRelative: true,
            relationDescription: `${rel.relationLabel} ${relative.name}`,
            warningNotice: `Hinweis: ${person.name} hat keine eigene Nummer. Nachricht wird an ${relative.name} (${rel.relationLabel}) gerichtet.`
          };
        }

        return {
          targetPersonName: person.name,
          phone: "",
          email: ownEmail,
          appPeerId: "",
          hasAppDirect: false,
          isRedirectedToRelative: false,
          relationDescription: null,
          warningNotice: "Hinweis: Keine eigene Telefonnummer/E-Mail und kein erreichbarer verknüpfter Kontakt hinterlegt."
        };
      },

      daysUntilNextBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let nextBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (nextBday < today) nextBday = `${tYear + 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, nextBday);
        } catch (e) { return null; }
      },

      negativeDaysSinceLastBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let lastBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (lastBday > today) lastBday = `${tYear - 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, lastBday);
        } catch (e) { return null; }
      },

      formatPassedAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "hatte Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "hatte Geburtstag";
          const pad = n => String(n).padStart(2, "0");
          let lastYear = tParts[0];
          const thisYearBday = `${tParts[0]}-${pad(bParts[1])}-${pad(bParts[2])}`;
          if (thisYearBday > today) lastYear -= 1;
          const passedAge = Math.max(0, lastYear - bParts[0]);
          return `wurde ${passedAge}`;
        } catch (e) { return "hatte Geburtstag"; }
      },

      formatUpcomingAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "Geburtstag";
          const totalMonths = (tParts[0] - bParts[0]) * 12 + (tParts[1] - bParts[1]);
          const thisYearBday = `${tParts[0]}-${String(bParts[1]).padStart(2, "0")}-${String(bParts[2]).padStart(2, "0")}`;
          const nextYearAge = tParts[0] - bParts[0] + (thisYearBday < today ? 1 : 0);
          if (totalMonths === 0 && nextYearAge === 0) return "Neugeboren (0 Mon.)";
          if (totalMonths >= 0 && totalMonths <= 23) return `${totalMonths} Mon. (wird ${Math.max(1, nextYearAge)})`;
          return `wird ${nextYearAge}`;
        } catch (e) { return "Geburtstag"; }
      },

      nextTimerDate(person, today = todayIso()) {
        if (!person.timerEnabled || person.timerInterval <= 0) return null;
        const base = person.lastContactedIso || today;
        const d = new Date(base + "T00:00:00");
        const interval = Number(person.timerInterval) || 14;
        switch (person.timerUnit) {
          case "WEEKS": d.setDate(d.getDate() + interval * 7); break;
          case "MONTHS": d.setMonth(d.getMonth() + interval); break;
          case "YEARS": d.setFullYear(d.getFullYear() + interval); break;
          default: d.setDate(d.getDate() + interval); break;
        }
        return d.toISOString().slice(0, 10);
      }
    };

    function makeIllustratedPortraitDataUrl(name) {
      const n = String(name || "").toLowerCase();
      let bg1 = "#4A90E2", bg2 = "#2B5B84", skin = "#F6D0B8", hair = "#4A5568", shirt = "#2E7D5B", style = "woman", glasses = false, beard = false;
      if (n.includes("helga") || n.includes("oma")) {
        bg1 = "#5B9BD5"; bg2 = "#2E5B88"; skin = "#F7D5BE"; hair = "#D9D9E0"; shirt = "#4A6FA5"; style = "oma"; glasses = true;
      } else if (n.includes("anna")) {
        bg1 = "#38BDF8"; bg2 = "#0284C7"; skin = "#F8D6C0"; hair = "#4A5568"; shirt = "#2E7D5B"; style = "woman";
      } else if (n.includes("sabine")) {
        bg1 = "#6366F1"; bg2 = "#3730A3"; skin = "#F7D4BC"; hair = "#64748B"; shirt = "#3B82F6"; style = "woman";
      } else if (n.includes("thomas")) {
        bg1 = "#2E7D5B"; bg2 = "#164A33"; skin = "#F0C5A8"; hair = "#334155"; shirt = "#2B4C7E"; style = "man";
      } else if (n.includes("markus")) {
        bg1 = "#3B82F6"; bg2 = "#1E3A8A"; skin = "#F2C8AD"; hair = "#475569"; shirt = "#0284C7"; style = "man";
      } else if (n.includes("max")) {
        bg1 = "#0EA5E9"; bg2 = "#0C4A6E"; skin = "#EFC2A5"; hair = "#1E293B"; shirt = "#374151"; style = "man"; beard = true;
      } else if (n.includes("leo") || n.includes("baby")) {
        bg1 = "#60A5FA"; bg2 = "#2563EB"; skin = "#FBE0CD"; hair = "#94A3B8"; shirt = "#38BDF8"; style = "baby";
      } else if (n.includes("praxis") || n.includes("dr.")) {
        bg1 = "#14B8A6"; bg2 = "#0F766E"; skin = "#F3CBB2"; hair = "#9CA3AF"; shirt = "#FFFFFF"; style = "man"; glasses = true;
      } else {
        let h = 0;
        for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
        const bgPairs = [["#4A90E2","#2563EB"],["#38BDF8","#0284C7"],["#6366F1","#4338CA"],["#14B8A6","#0D9488"]];
        const pair = bgPairs[h % bgPairs.length];
        bg1 = pair[0]; bg2 = pair[1];
        const hairs = ["#334155", "#475569", "#1E293B", "#64748B", "#94A3B8"];
        hair = hairs[h % hairs.length];
        const shirts = ["#2B4C7E", "#0284C7", "#2E7D5B", "#4F46E5"];
        shirt = shirts[(h >> 2) % shirts.length];
        style = (h % 2 === 0) ? "woman" : "man";
      }

      const hairBack = (style === "woman")
        ? `<path d="M30 58 C28 92, 34 108, 42 114 L86 114 C94 108, 100 92, 98 58 Z" fill="${hair}"/>`
        : (style === "oma" ? `<circle cx="64" cy="26" r="14" fill="${hair}"/>` : "");

      const hairTop = (style === "baby")
        ? `<path d="M58 28 Q66 18 70 27 Q75 21 72 31" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`
        : (style === "woman" || style === "oma")
          ? `<path d="M32 58 C32 30, 96 30, 96 58 C84 42, 48 42, 32 58 Z" fill="${hair}"/>`
          : `<path d="M34 54 C34 28, 94 28, 94 54 C84 40, 44 40, 34 54 Z" fill="${hair}"/>`;

      const glassesSvg = glasses
        ? `<g stroke="#374151" stroke-width="2.4" fill="none"><circle cx="52" cy="60" r="8"/><circle cx="76" cy="60" r="8"/><line x1="60" y1="60" x2="68" y2="60"/></g>`
        : "";

      const beardSvg = beard
        ? `<path d="M40 68 C42 88, 86 88, 88 68 C82 76, 46 76, 40 68 Z" fill="${hair}" opacity="0.85"/>`
        : "";

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs>
        <rect width="128" height="128" rx="64" fill="url(#bg)"/>
        ${hairBack}
        <path d="M22 128 C26 98, 44 92, 64 92 C84 92, 102 98, 106 128 Z" fill="${shirt}"/>
        <rect x="54" y="78" width="20" height="18" rx="8" fill="${skin}"/>
        <ellipse cx="64" cy="60" rx="${style === 'baby' ? 24 : 26}" ry="${style === 'baby' ? 24 : 28}" fill="${skin}"/>
        ${hairTop}
        <circle cx="52" cy="60" r="3" fill="#2C201B"/>
        <circle cx="76" cy="60" r="3" fill="#2C201B"/>
        ${glassesSvg}
        ${beardSvg}
        <path d="M55 72 Q64 79 73 72" stroke="#A84A3A" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function runDailyReminderWorker() {
      const today = todayIso();
      let rolledCount = 0;

      // 1. Automatisch überfällige REPEAT:-Erinnerungen weiterrollen & heute fällige melden
      for (const ev of state.specialEvents) {
        if (isRepeatDateSpec(ev.dateIso)) {
          const parts = ev.dateIso.split(":");
          const count = Math.max(1, parseInt(parts[1], 10) || 1);
          const unit = (parts[2] || "DAYS").toUpperCase();
          const storedDate = parts[3] || today;
          if (storedDate < today) {
            const rep = parseRepeatDateSpec(ev.dateIso, today);
            ev.dateIso = `REPEAT:${rep.count}:${rep.unit}:${rep.nextIso}`;
            rolledCount++;
          }
        }
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff === 0 || diff === (ev.leadDays || 1)) {
          const p = state.persons.find(x => x.id === ev.personId && !x.isHidden);
          if (p) {
            openPopupForPerson(p.id, `🔔 Erinnerung (${diff === 0 ? 'Heute' : `in ${diff}T`}): ${ev.title}`);
            addLog(`DailyReminderWorker -> Erinnerung "${ev.title}" für ${p.name} ausgelöst.`);
            if (rolledCount > 0) saveState();
            return;
          }
        }
      }

      // 2. Geburtstage heute/morgen & Melde-Timer prüfen (nur sichtbare Kontakte)
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (state.birthdayPopupEnabled !== false && bdayDays !== null && bdayDays === 0) {
          showBirthdayHeadsUpToast(p, false);
          openPopupForPerson(p.id, `🎂 Heute Geburtstag! (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`);
          addLog(`DailyReminderWorker -> Geburtstags-Popup für ${p.name}`);
          return;
        }
        const nextTimer = ContactResolver.nextTimerDate(p, today);
        if (nextTimer && nextTimer <= today) {
          openPopupForPerson(p.id, `⏳ Melde-Timer fällig (${p.timerInterval} ${formatTimerUnitDe(p.timerUnit)})`);
          addLog(`DailyReminderWorker -> Melde-Timer-Dialog für ${p.name}`);
          return;
        }
      }
      if (rolledCount > 0) saveState();
      addLog(`DailyReminderWorker: Prüfung abgeschlossen (${rolledCount} wiederkehrende Termine weitergerollt).`);
    }

    const AVATAR_GRADIENTS = [
      "linear-gradient(135deg, #4A90E2, #2563EB)",
      "linear-gradient(135deg, #38BDF8, #0284C7)",
      "linear-gradient(135deg, #60A5FA, #3B82F6)",
      "linear-gradient(135deg, #6366F1, #4338CA)",
      "linear-gradient(135deg, #2DD4BF, #0D9488)",
      "linear-gradient(135deg, #4C6EF5, #364FC7)",
      "linear-gradient(135deg, #0CA678, #087F5B)",
      "linear-gradient(135deg, #818CF8, #4F46E5)"
    ];

    function getInitials(fullName) {
      const clean = stripNameRoleSuffix(fullName || "");
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function getAvatarGradient(name) {
      const s = String(name || "");
      let hash = 0;
      for (let i = 0; i < s.length; i++) {
        hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
      }
      return AVATAR_GRADIENTS[hash % AVATAR_GRADIENTS.length];
    }

    function normalizePhotoSrc(photoBase64) {
      if (!photoBase64 || typeof photoBase64 !== "string" || !photoBase64.trim()) return "";
      const s = photoBase64.trim();
      if (s.startsWith("data:") || s.startsWith("http") || s.startsWith("blob:")) return s;
      return `data:image/jpeg;base64,${s}`;
    }

    function renderPersonAvatarHtml(name, photoOverride = null, sizePx = 36) {
      let rawPhoto = photoOverride;
      if (rawPhoto === null && Array.isArray(state.persons)) {
        const found = state.persons.find(p => p.name === name && p.photoBase64);
        if (found) rawPhoto = found.photoBase64;
      }
      const src = normalizePhotoSrc(rawPhoto);
      const sizeStyle = sizePx !== 36 ? `width:${sizePx}px; height:${sizePx}px; font-size:${Math.round(sizePx * 0.36)}px;` : "";
      if (src) {
        return `<div class="person-avatar" style="${sizeStyle} background:var(--btn-bg); overflow:hidden; padding:0;"><img src="${escapeHtml(src)}" alt="${escapeHtml(name)}" style="width:100%; height:100%; object-fit:cover; display:block; border-radius:50%;" /></div>`;
      }
      const initials = escapeHtml(getInitials(name));
      const bg = getAvatarGradient(name);
      return `<div class="person-avatar" style="${sizeStyle} background:${bg};">${initials}</div>`;
    }

    function renderBirthdayCountdownPill(birthdayIso, isPastMode = false) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      if (isPastMode) {
        const neg = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
        if (neg === null) return "";
        const label = neg === 0 ? "🎂 Heute!" : `🎂 vor ${Math.abs(neg)}T`;
        return `<span class="countdown-pill ${neg === 0 ? 'today' : ''}">${label}</span>`;
      }
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      if (days === null) return "";
      if (days === 0) return `<span class="countdown-pill today">🎂 Heute!</span>`;
      if (days === 1) return `<span class="countdown-pill soon">🎂 Morgen!</span>`;
      if (days <= 7) return `<span class="countdown-pill soon">🎂 in ${days}T</span>`;
      return `<span class="countdown-pill">🎂 in ${days}T</span>`;
    }

    function getRelationsForPerson(personId) {
      return state.relations
        .filter(r => r.fromPersonId === personId)
        .map(rel => {
          const target = state.persons.find(p => p.id === rel.toPersonId);
          return target ? { rel, target } : null;
        })
        .filter(Boolean);
    }

    function openPopupForPerson(personId, reason = "Erinnerung") {
      const person = state.persons.find(p => p.id === personId);
      if (!person) return;
      const relPairs = getRelationsForPerson(person.id);
      const resolved = ContactResolver.resolveTarget(person, relPairs);
      const firstName = resolved.targetPersonName.split(" ")[0];
      const isPast = String(reason || "").toLowerCase().includes("nachträglich");
      popupState = {
        personId: person.id,
        reason,
        quickMessageText: pickRandomBirthdayGreeting(firstName, isPast)
      };
      renderAll();

    function sendDirectOrFallback() {
      if (!popupState) return;
      const person = state.persons.find(p => p.id === popupState.personId);
      if (!person) return;
      const resolved = ContactResolver.resolveTarget(person, getRelationsForPerson(person.id));
      const text = (popupState.quickMessageText || "").trim() || "Herzliche Grüße!";
      const nowStr = new Date().toISOString().slice(0, 16).replace("T", " ");

      if (resolved.hasAppDirect) {
        state.directMessages.push({
          id: state.nextId++,
          personId: person.id,
          targetPeerId: resolved.appPeerId,
          senderDisplayName: "Ich",
          direction: "OUTGOING",
          text,
          timestampIso: nowStr,
          isRead: true
        });
        person.lastContactedIso = todayIso();
        addLog(`App-Direkt gesendet an ${resolved.targetPersonName} (${resolved.appPeerId}): "${text}"`);
      } else if (resolved.phone) {
        addLog(`Fallback auf WhatsApp an ${resolved.targetPersonName} (${resolved.phone}): "${text}"`);
        window.open(`https://wa.me/${resolved.phone.replace(/[^0-9]/g, "")}?text=${encodeURIComponent(text)}`, "_blank");
      }
      popupState = null;
      saveState();

    function dispatchChannel(channel) {
      if (!popupState) return;

      const resolved = ContactResolver.resolveTarget(person, getRelationsForPerson(person.id));

      if (!cleanPhone) {

    const WEEKDAY_NAMES_DE = {
      1: "Montag",
      2: "Dienstag",
      3: "Mittwoch",
      4: "Donnerstag",
      5: "Freitag",
      6: "Samstag",
      7: "Sonntag"
    };

    function isWeeklyDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("WEEKLY:");
    }

    function isRepeatDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("REPEAT:");
    }

    function addIntervalToIsoDate(baseIso, count, unit) {
      const n = Math.max(1, parseInt(count, 10) || 1);
      const d = new Date((baseIso || todayIso()) + "T00:00:00");
      switch ((unit || "DAYS").toUpperCase()) {
        case "WEEKS": d.setDate(d.getDate() + n * 7); break;
        case "MONTHS": d.setMonth(d.getMonth() + n); break;
        case "YEARS": d.setFullYear(d.getFullYear() + n); break;
        default: d.setDate(d.getDate() + n); break;
      }
      return d.toISOString().slice(0, 10);
    }

    function formatRhythmTextDe(count, unit) {
      const n = Math.max(1, parseInt(count, 10) || 1);
      const u = (unit || "DAYS").toUpperCase();
      if (u === "WEEKS") return n === 1 ? "1 Woche" : `${n} Wochen`;
      if (u === "MONTHS") return n === 1 ? "1 Monat" : `${n} Monate`;
      if (u === "YEARS") return n === 1 ? "1 Jahr" : `${n} Jahre`;
      return n === 1 ? "1 Tag" : `${n} Tage`;
    }

    function parseRepeatDateSpec(dateIso, today = todayIso()) {
      if (!isRepeatDateSpec(dateIso)) return null;
      const parts = dateIso.split(":");
      const count = Math.max(1, parseInt(parts[1], 10) || 1);
      const unit = (parts[2] || "DAYS").toUpperCase();
      let nextIso = parts[3] || addIntervalToIsoDate(today, count, unit);
      let guard = 0;
      while (nextIso < today && guard < 1000) {
        nextIso = addIntervalToIsoDate(nextIso, count, unit);
        guard++;
      }
      return { count, unit, nextIso };
    }

    function getWeeklyDayNumber(dateIso) {
      if (!isWeeklyDateSpec(dateIso)) return null;
      const num = parseInt(dateIso.split(":")[1], 10);
      return (num >= 1 && num <= 7) ? num : null;
    }

    function daysUntilWeeklyDay(weekday1To7, today = todayIso()) {
      const d = new Date(today + "T00:00:00");
      const jsDay = d.getDay(); // 0=Sun..6=Sat
      const isoDay = jsDay === 0 ? 7 : jsDay; // 1=Mon..7=Sun
      return (weekday1To7 - isoDay + 7) % 7;
    }

    function daysUntilEventSpec(dateIso, today = todayIso()) {
      if (isRepeatDateSpec(dateIso)) {
        const rep = parseRepeatDateSpec(dateIso, today);
        return rep ? daysBetween(today, rep.nextIso) : 999;
      }
      if (isWeeklyDateSpec(dateIso)) {
        const wd = getWeeklyDayNumber(dateIso);
        return wd ? daysUntilWeeklyDay(wd, today) : 999;
      }
      return daysBetween(today, dateIso);
    }

    function formatEventBadgeText(ev, today = todayIso()) {
      if (isRepeatDateSpec(ev.dateIso)) {
        const rep = parseRepeatDateSpec(ev.dateIso, today);
        const rhythmStr = formatRhythmTextDe(rep.count, rep.unit);
        const nextStr = formatIsoToDdMmYyyy(rep.nextIso);
        const diff = daysBetween(today, rep.nextIso);
        if (diff === 0) return `🔔 Heute: ${ev.title} (alle ${rhythmStr})`;
        return `🔁 Alle ${rhythmStr}: ${ev.title} (${nextStr})`;
      }
      if (isWeeklyDateSpec(ev.dateIso)) {
        const wd = getWeeklyDayNumber(ev.dateIso);
        const dayName = WEEKDAY_NAMES_DE[wd] || "Wöchentlich";
        const diff = daysUntilWeeklyDay(wd, today);
        if (diff === 0) return `🔔 Heute (${dayName}): ${ev.title}`;
        if (diff === 1) return `🔁 Jeden ${dayName}: ${ev.title} (morgen)`;
        return `🔁 Jeden ${dayName}: ${ev.title} (in ${diff}T)`;
      }
      return `${ev.title} (${formatIsoToDdMmYyyy(ev.dateIso)})`;
    }

    function formatIsoToDdMmYyyy(iso) {
      if (!iso || !iso.trim()) return "";
      const clean = iso.trim();
      if (isRepeatDateSpec(clean)) {
        const rep = parseRepeatDateSpec(clean);
        const dParts = rep.nextIso.split("-");
        const nextFormatted = dParts.length === 3 ? `${dParts[2].padStart(2, "0")}.${dParts[1].padStart(2, "0")}.${dParts[0]}` : rep.nextIso;
        return `🔁 Alle ${formatRhythmTextDe(rep.count, rep.unit)} • Nächster: ${nextFormatted}`;
      }
      if (isWeeklyDateSpec(clean)) {
        const wd = getWeeklyDayNumber(clean);
        return `🔁 Jeden ${WEEKDAY_NAMES_DE[wd] || "Wochentag"}`;
      }
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(clean)) return clean;
      if (clean.startsWith("--")) {
        const parts = clean.slice(2).split("-");
        if (parts.length === 2) return `${parts[1].padStart(2, "0")}.${parts[0].padStart(2, "0")}.`;
      }
      const parts = clean.split("-");
      return parts.length === 3 ? `${parts[2].padStart(2, "0")}.${parts[1].padStart(2, "0")}.${parts[0]}` : clean;
    }

    function normalizeDateInputToIso(input) {
      const clean = (input || "").trim();
      if (!clean) return "";
      if (isWeeklyDateSpec(clean) || isRepeatDateSpec(clean)) return clean;
      const dotParts = clean.split(".");
      if (dotParts.length === 3 && dotParts[2].length === 4) {
        return `${dotParts[2]}-${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      if (dotParts.length >= 2 && (!dotParts[2] || dotParts[2] === "")) {
        return `--${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      const slashParts = clean.split("/");
      if (slashParts.length === 3 && slashParts[2].length === 4) {
        return `${slashParts[2]}-${slashParts[1].padStart(2, "0")}-${slashParts[0].padStart(2, "0")}`;
      }
      return clean;
    }

    function formatCompactBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const ageStr = ContactResolver.formatUpcomingAge(birthdayIso);
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      const whenStr = days === null ? "" : (days === 0 ? "heute" : (days === 1 ? "in 1 Tag" : `in ${days} Tagen`));
      return [dateStr, `${ageStr} ${whenStr}`.trim()].filter(Boolean).join("  •  ");
    }

    let showPastDates = false;
    let contactSortMode = "lastname"; // Standardmäßig immer nach Nachnamen sortieren ("lastname" | "birthday" | "firstname")
    let tabSearchQuery = "";
    let tabSelectedLetter = "";
    const dropdownUiState = {}; // key -> { open, query, letter }

    function getDropdownState(key) {
      if (!dropdownUiState[key]) {
        dropdownUiState[key] = { open: false, query: "", letter: "" };
      }
      return dropdownUiState[key];
    }

    function stripNameRoleSuffix(fullName) {
      return (fullName || "").replace(/\s*\([^)]*\)\s*/g, " ").trim();
    }

    function extractFirstName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      if (!clean) return "";
      if (clean.includes(",")) {
        const afterComma = clean.split(",").slice(1).join(",").trim();
        if (afterComma) return afterComma;
      }
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts.length > 1 ? parts.slice(0, -1).join(" ") : (parts[0] || clean);
    }

    const COMPANY_NAME_REGEX = /\b(gmbh|mbh|kg|ohg|gbr|ag|ug|e\.?v\.?|co\.|praxis|kanzlei|apotheke|autohaus|bäckerei|baeckerei|metzgerei|baugeschäft|baugeschaeft|hotel|restaurant|gasthof|schule|gemeinde|stadt|sparkasse|bank|versicherung|klinik|zentrum|verein)\b/i;
    const TRAILING_CONTACT_TAGS = new Set([
      "mobil", "handy", "privat", "arbeit", "büro", "buero", "festnetz", "tel", "tel.", "telefon", "zentrale", "home", "work"
    ]);

    function isLikelyOrganizationName(cleanName) {
      return COMPANY_NAME_REGEX.test(cleanName || "");
    }

    function extractLastName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      if (!clean) return "";
      if (clean.includes(",")) {
        const beforeComma = clean.split(",")[0].trim();
        if (beforeComma) return beforeComma;
      }
      if (isLikelyOrganizationName(clean)) return clean;
      const parts = clean.split(/\s+/).filter(Boolean);
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        parts.pop();
      }
      return parts.length > 1 ? parts[parts.length - 1] : (parts[0] || clean);
    }

    function formatLastNameFirst(fullName) {
      const raw = (fullName || "").trim();
      if (!raw || raw.includes(",")) return raw;
      const roleMatch = raw.match(/\([^)]*\)$/);
      const roleSuffix = roleMatch ? ` ${roleMatch[0]}` : "";
      const clean = stripNameRoleSuffix(raw);
      if (isLikelyOrganizationName(clean)) return raw;
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return raw;
      const trailingTags = [];
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        trailingTags.unshift(parts.pop());
      }
      const last = parts[parts.length - 1];
      const first = parts.slice(0, -1).join(" ");
      const extraTagSuffix = trailingTags.length > 0 ? ` (${trailingTags.join(" ")})` : "";
      return `${last}, ${first}${extraTagSuffix}${roleSuffix}`;
    }

    function splitFullNameIntoFirstAndLast(fullName) {
      const raw = String(fullName || "").trim();
      if (!raw) return { firstName: "", lastName: "" };
      if (raw.includes(",")) {
        const idx = raw.indexOf(",");
        return {
          firstName: raw.slice(idx + 1).trim(),
          lastName: raw.slice(0, idx).trim()
        };
      }
      const roleMatch = raw.match(/\([^)]*\)$/);
      const roleSuffix = roleMatch ? roleMatch[0].trim() : "";
      const clean = stripNameRoleSuffix(raw);
      if (isLikelyOrganizationName(clean)) {
        return { firstName: "", lastName: raw };
      }
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 0) return { firstName: "", lastName: "" };
      if (parts.length === 1) {
        return { firstName: roleSuffix ? `${parts[0]} ${roleSuffix}` : parts[0], lastName: "" };
      }
      const trailingTags = [];
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        trailingTags.unshift(parts.pop());
      }
      const last = parts[parts.length - 1];
      const firstBase = parts.slice(0, -1).join(" ");
      let extra = "";
      if (trailingTags.length > 0) extra += ` (${trailingTags.join(" ")})`;
      if (roleSuffix) extra += ` ${roleSuffix}`;
      return { firstName: `${firstBase}${extra}`.trim(), lastName: last };
    }

    function combineFirstAndLastName(firstName, lastName) {
      const f = String(firstName || "").replace(/,/g, " ").trim().replace(/\s+/g, " ");
      const l = String(lastName || "").replace(/,/g, " ").trim().replace(/\s+/g, " ");
      if (l && f) return `${l}, ${f}`;
      if (f) return f;
      if (l) return l;
      return "";
    }

    function normalizeLetterInitial(ch) {
      const u = String(ch || "").toUpperCase();
      if (u === "Ä") return "A";
      if (u === "Ö" || u === "Ø") return "O";
      if (u === "Ü") return "U";
      if (u === "ß") return "S";
      if (u === "Ł") return "L";
      if (u === "Đ") return "D";
      if (/^[A-Z]$/.test(u)) return u;
      const decomp = u.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const m = decomp.match(/[A-Z]/);
      return m ? m[0] : "#";
    }

    function normalizeSearchKey(str) {
      return String(str || "")
        .trim()
        .toLowerCase()
        .replace(/ä/g, "ae")
        .replace(/ö/g, "oe")
        .replace(/ü/g, "ue")
        .replace(/ß/g, "ss")
        .replace(/ł/g, "l")
        .replace(/đ/g, "d")
        .replace(/ø/g, "o")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function extractLastNameInitial(fullName) {
      const last = extractLastName(fullName).trim() || String(fullName || "").trim();
      const m = last.match(/[\p{L}\p{N}]/u);
      if (!m) return "#";
      return /\p{L}/u.test(m[0]) ? normalizeLetterInitial(m[0]) : "#";
    }

    function extractTextInitial(text) {
      const m = String(text || "").trim().match(/[\p{L}\p{N}]/u);
      if (!m) return "#";
      return /\p{L}/u.test(m[0]) ? normalizeLetterInitial(m[0]) : "#";
    }

    function comparePersonsByLastName(a, b) {
      const cmp = normalizeSearchKey(extractLastName(a.name)).localeCompare(normalizeSearchKey(extractLastName(b.name)), "de", { sensitivity: "base" });
      if (cmp !== 0) return cmp;
      return normalizeSearchKey(extractFirstName(a.name)).localeCompare(normalizeSearchKey(extractFirstName(b.name)), "de", { sensitivity: "base" });
    }

    function sortPersonsByLastName(arr) {
      return [...(arr || [])].sort(comparePersonsByLastName);
    }

    function matchesPersonSearchAndLetter(person, query, letter) {
      const l = String(letter || "").trim().toUpperCase();
      if (l && extractLastNameInitial(person.name) !== l) return false;
      const q = String(query || "").trim().toLowerCase();
      if (!q) return true;
      const fullLower = (person.name || "").toLowerCase();
      const formatted = formatLastNameFirst(person.name).toLowerCase();
      const phoneLower = (person.phone || "").toLowerCase();
      if (fullLower.includes(q) || formatted.includes(q) || phoneLower.includes(q)) return true;

      const haystackNorm = normalizeSearchKey(`${person.name || ""} ${formatLastNameFirst(person.name)} ${person.phone || ""}`);
      const tokens = q.split(/[\s,]+/).filter(Boolean);
      return tokens.every(tok => {
        const tokNorm = normalizeSearchKey(tok);
        return fullLower.includes(tok) || formatted.includes(tok) || phoneLower.includes(tok) || (tokNorm && haystackNorm.includes(tokNorm));
      });
    }

    const ALPHABET_ROW_1 = ["A","B","C","D","E","F","G","H","I","J","K","L","M"];
    const ALPHABET_ROW_2 = ["N","O","P","Q","R","S","T","U","V","W","X","Y","Z","#"];

    function renderAlphabetQuickBarHtml(selectedLetter, onSelectJsExprFn) {
      const sel = String(selectedLetter || "").toUpperCase();
      const btnStyle = (active) =>
        `padding:2px 5px; min-width:20px; font-size:10px; font-weight:700; border-radius:5px; line-height:1.1; justify-content:center; text-align:center;`;
      const row1Html = [
        `<button type="button" class="compact-btn ${!sel ? 'primary' : ''}" style="${btnStyle(!sel)}" onclick="${onSelectJsExprFn('')}">Alle</button>`,
        ...ALPHABET_ROW_1.map(l => {
          const active = sel === l;
          return `<button type="button" class="compact-btn ${active ? 'primary' : ''}" style="${btnStyle(active)}" onclick="${onSelectJsExprFn(active ? '' : l)}">${l}</button>`;
        })
      ].join("");
      const row2Html = ALPHABET_ROW_2.map(l => {
        const active = sel === l;
        return `<button type="button" class="compact-btn ${active ? 'primary' : ''}" style="${btnStyle(active)}" onclick="${onSelectJsExprFn(active ? '' : l)}">${l}</button>`;
      }).join("");
      return `
        <div style="display:flex; flex-direction:column; gap:3px; width:100%;">
          <div style="display:flex; flex-wrap:wrap; gap:2px; align-items:center;">${row1Html}</div>
          <div style="display:flex; flex-wrap:wrap; gap:2px; align-items:center;">${row2Html}</div>
        </div>
      `;
    }

    function toggleContactDropdown(key, rerenderModal = false) {
      const st = getDropdownState(key);
      st.open = !st.open;
      if (rerenderModal) renderModals(); else renderPhoneApp();
    }

    function setContactDropdownQuery(key, val, rerenderModal = false, syncTab = false) {
      const st = getDropdownState(key);
      st.query = val;
      if (syncTab) tabSearchQuery = val;
      if (rerenderModal) renderModals(); else renderPhoneApp();
    }

      const st = getDropdownState(key);
      st.letter = letter;
      if (syncTab) tabSelectedLetter = letter;
      if (rerenderModal) renderModals(); else renderPhoneApp();

          <div style="background:var(--bg-slate); padding:7px 9px; border-bottom:1px solid var(--border-slate); display:flex; flex-direction:column; gap:5px;">

              </span>
              <button type="button" class="compact-btn primary" style="padding:3px 8px; font-size:11px; flex-shrink:0;" onclick="${confirmClickJs}">${escapeHtml(confirmLabel)}</button>
            </div>
            <div style="display:flex; gap:5px; align-items:center;">
              <input class="field-input" style="flex:1; font-size:11.5px; padding:4px 7px;" placeholder="🔎 Nachname / Vorname tippen..." value="${escapeHtml(q)}" oninput="setContactDropdownQuery('${key}', this.value, ${inModal}, ${syncWithTab})" />
              ${(q || letter) ? `<button type="button" class="compact-btn" style="padding:3px 7px; font-size:10.5px;" onclick="setContactDropdownQuery('${key}', '', ${inModal}, ${syncWithTab}); setContactDropdownLetter('${key}', '', ${inModal}, ${syncWithTab});">✕ Reset</button>` : ""}
            </div>
            ${renderAlphabetQuickBarHtml(letter, (l) => `setContactDropdownLetter('${key}', '${l}', ${inModal}, ${syncWithTab})`)}
          </div>
          <div style="max-height:195px; overflow-y:auto; display:flex; flex-direction:column;">
            ${allowNone ? `
              <div style="padding:7px 10px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--border-slate); color:${selectedPersonId === -1 ? 'var(--accent-steel)' : 'var(--text-secondary)'}; font-weight:${selectedPersonId === -1 ? '700' : '400'};"
                   onclick="${onSelectNoneJs || ''}; getDropdownState('${key}').open=false; ${inModal ? 'renderModals()' : 'renderPhoneApp()'}">
                🚫 ${escapeHtml(noneLabel)}
              </div>
            ` : ""}
            ${(matchingHiddenCount > 0 && onShowHiddenJs) ? `
              <div style="padding:7px 10px; font-size:11.5px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:6px; background:var(--warn-bg); color:var(--warn-amber); font-weight:700; border-bottom:1px solid var(--warn-amber);"
                   onclick="getDropdownState('${key}').open=false; ${onShowHiddenJs}">
                <span>👁 ${matchingHiddenCount} ausgeblendet für diesen Filter</span>

            ${filtered.length === 0 ? `<div style="padding:10px; font-size:11.5px; color:var(--text-muted);">Kein Kontakt für diesen Filter gefunden.</div>` : ""}
            ${filtered.map(p => {
              const isSel = p.id === selectedPersonId || (checkedSet && checkedSet.has(p.id));
              const clickJs = checkedSet
                ? `${onSelectPersonJs(p.id)}`
                : `${onSelectPersonJs(p.id)}; getDropdownState('${key}').open=false; ${inModal ? 'renderModals()' : 'renderPhoneApp()'}`;
              return `
                <div style="padding:6px 10px; font-size:12.5px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:6px; border-bottom:1px solid var(--border-slate); background:${isSel ? 'rgba(59,130,196,0.12)' : 'transparent'}; color:${isSel ? 'var(--accent-steel)' : 'var(--text-primary)'}; font-weight:${isSel ? '700' : '500'};"
                     onclick="${clickJs}">
                  <span style="word-break:break-word;">

      return `
        <div style="display:flex; flex-direction:column; gap:5px; width:100%;">

               onclick="toggleContactDropdown('${key}', ${inModal})">

              ${escapeHtml(triggerText)}
