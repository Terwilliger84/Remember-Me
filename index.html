    function renderWidget() {
      const container = document.getElementById("widget-rows");
      const widgetBox = document.getElementById("widget-box");
      const widgetTitle = document.getElementById("widget-title");
      const today = todayIso();
      const items = [];
      let hasOpenBirthdayToday = false;

      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && bdayDays <= 366) {
          const isToday = bdayDays === 0;
          const congrats = isToday ? getOngoingBirthdayCongrats(p, today) : null;
          if (isToday && !congrats) hasOpenBirthdayToday = true;
          const ageLabel = ContactResolver.formatUpcomingAge(p.birthdayIso, today);
          items.push({
            sortKey: bdayDays,
            priority: 0,
            personId: p.id,
            isBirthdayToday: isToday,
            isCongratulatedToday: Boolean(congrats),
            displayName: isToday ? (congrats ? `✅🎂 ${p.name}` : `🎉🎂 ${p.name}`) : `🎂 ${p.name}`,
            reason: isToday ? `🎂 Heute Geburtstag! (${ageLabel})` : `Geburtstag (${ageLabel})`,
            badge: isToday ? (congrats ? "✅ HEUTE" : "🎂 HEUTE!") : (bdayDays === 1 ? "Morgen" : `${bdayDays}T`)
          });
        }
      }
      for (const ev of state.specialEvents) {
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff >= 0 && diff <= 180) {
          const person = state.persons.find(p => p.id === ev.personId && !p.isHidden);
          if (person) {
            items.push({
              sortKey: diff,
              priority: 1,
              personId: person.id,
              isBirthdayToday: false,
              isCongratulatedToday: false,
              displayName: `🔔 ${person.name}`,
              reason: `Erinnerung: ${ev.title}`,
              badge: diff === 0 ? "Heute" : (diff === 1 ? "Morgen" : `${diff}T`)
            });
          }
        }
      }
      items.sort((a, b) => (a.sortKey - b.sortKey) || (a.priority - b.priority));

      if (widgetBox) {
        widgetBox.classList.toggle("has-today-bday", hasOpenBirthdayToday);
      }
      if (widgetTitle) {
        widgetTitle.textContent = hasOpenBirthdayToday ? "🎉 HEUTE GEBURTSTAG!" : "🎂 Kompakt (2×1) – 4 Zeilen";
      }

      const topFour = items.slice(0, 4);
      if (topFour.length === 0) {
        container.innerHTML = `<div style="font-size:11px; color:var(--text-muted); padding:4px 2px; white-space:nowrap;">Keine Termine</div>`;
        return;
      }
      container.innerHTML = topFour.map(item => {
        const rowCls = item.isBirthdayToday
          ? (item.isCongratulatedToday ? "widget-row bday-done" : "widget-row bday-today")
          : "widget-row";
        return `
          <div class="${rowCls}" onclick="openPopupForPerson(${item.personId}, '${escapeHtml(item.reason)}')">
            <div class="widget-row-name">${escapeHtml(item.displayName)}</div>
            <div class="widget-row-badge">${escapeHtml(item.badge)}</div>
          </div>
        `;
      }).join("");
    }

        const AVAILABLE_EXTRA_MESSENGERS = ["Telegram", "Signal", "Threema", "Messenger", "Instagram", "Viber"];

        const extraButtonsHtml = enabledExtras.map(ch => `

        const isOngoingBday = isPersonOngoingBirthdayToday(p);

      if (wichtelGroupModalState !== null) {

          `<option value="${escapeHtml(m)}" ${wg.motto === m ? 'selected' : ''}>${escapeHtml(m)}</option>`

        modalRoot.innerHTML = `

              <div class="modal-header-sticky">

                <button class="compact-btn primary" onclick="saveWichtelGroupModal()">${wg.mode === 'reuse' ? 'Runde übernehmen & bearbeiten' : 'Speichern'}</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (wichtelParticipantModalState !== null) {
        const wp = wichtelParticipantModalState;
        if (wp.mode === "add") {
          const sortedWichtelPersons = sortPersonsByLastName(state.persons);
          const ddState = getDropdownState("wichtel_checklist_dd");
          const filteredForChecklist = sortedWichtelPersons.filter(p => matchesPersonSearchAndLetter(p, ddState.query, ddState.letter));
          const filteredIdSet = new Set(filteredForChecklist.map(p => p.id));

          // Sortiere Kontakte nach Nachname so, dass Paare direkt untereinander in einer hervorgehobenen Paar-Box stehen
          const orderedContacts = [];
          const visitedIds = new Set();
          for (const p of filteredForChecklist) {
            if (visitedIds.has(p.id)) continue;
            const partner = getCouplePartnerForPerson(p.id);
            if (partner && !visitedIds.has(partner.id) && filteredIdSet.has(partner.id)) {
              visitedIds.add(p.id);
              visitedIds.add(partner.id);
              orderedContacts.push({ type: "couple", members: [p, partner] });
            } else {
              visitedIds.add(p.id);
              orderedContacts.push({ type: "single", person: p });
            }
          }

          const checklistDropdownHtml = renderContactSearchDropdownHtml({
            key: "wichtel_checklist_dd",

          const checklistHtml = orderedContacts.map(item => {
            if (item.type === "couple") {

    function buildWidgetPreviewRows(maxCount = 15) {
      const today = todayIso();
      const list = [];
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && bdayDays <= 90) {
          const parts = String(p.birthdayIso || "").split("-");
          const ddMm = parts.length >= 3 ? `${parts[2].slice(0,2)}.${parts[1]}.` : "";
          const ageRaw = ContactResolver.formatUpcomingAge(p.birthdayIso, today);
          const digits = String(ageRaw || "").replace(/\D+/g, "");
          const meta = ddMm && digits ? `${ddMm} (${digits}.)` : ddMm;
          list.push({
            days: bdayDays,
            prio: 0,
            personId: p.id,
            icon: "🎂",
            name: p.name,
            meta,
            reason: `🎂 Geburtstag (${ageRaw})`,
            badge: bdayDays === 0 ? "Heute!" : (bdayDays === 1 ? "Morgen" : `${bdayDays}T`)
          });
        }
        const timerOccs = expandTimerOccurrencesJs(p, today, 4, 60);
        for (const tOcc of timerOccs) {
          if (tOcc.rawDays <= 45) {
            const dParts = String(tOcc.dateIso || "").split("-");
            const ddMm = dParts.length === 3 ? `${dParts[2]}.${dParts[1]}.` : "Timer";
            list.push({
              days: tOcc.sortDays,
              prio: 2,
              personId: p.id,
              icon: "⏳",
              name: p.name,
              meta: `Timer ${ddMm}`,
              reason: `⏳ Melde-Timer (${ddMm})`,
              badge: tOcc.rawDays <= 0 ? "Fällig" : (tOcc.rawDays === 1 ? "Morgen" : `${tOcc.rawDays}T`)
            });
          }
        }
      }
      for (const ev of (state.specialEvents || [])) {
        const p = state.persons.find(x => x.id === ev.personId && !x.isHidden);
        if (!p) continue;
        const occs = expandSpecialEventOccurrencesJs(ev, today, 4, 60);
        for (const occ of occs) {
          if (occ.days >= 0 && occ.days <= 60) {
            const dParts = String(occ.dateIso || "").split("-");
            const ddMm = dParts.length === 3 ? `${dParts[2]}.${dParts[1]}.` : "";
            list.push({
              days: occ.days,
              prio: 1,
              personId: p.id,
              icon: occ.isRecurring ? "🔁" : "🔔",
              name: p.name,
              meta: ddMm ? `${ev.title} (${ddMm})` : ev.title,
              reason: `${occ.isRecurring ? "🔁" : "🔔"} ${ev.title}${ddMm ? ` (${ddMm})` : ""}`,
              badge: occ.days === 0 ? "Heute" : (occ.days === 1 ? "Morgen" : `${occ.days}T`)
            });
          }
        }
      }
      list.sort((a, b) => (a.days - b.days) || (a.prio - b.prio) || a.name.localeCompare(b.name, "de"));
      return list.slice(0, maxCount);
    }

    function handleContactPhotoFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 256;
          let w = img.width || maxDim;
          let h = img.height || maxDim;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          if (photoPickerTargetMode === "create") {
            createDraft.photoBase64 = dataUrl;
          } else {
            detailDraftPhotoBase64 = dataUrl;
            const dp = state.persons.find(p => p.id === detailPersonId);
            if (dp) dp.photoRemovedByUser = false;
          }
          addLog(`📷 Kontaktfoto ("${file.name}") geladen & auf ${w}×${h}px optimiert.`);
          renderModals();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function checkTodaysBirthdaysPopup() {
      if (state.birthdayPopupEnabled === false) return;
      const today = todayIso();
      const storageKey = `remember_me_notified_bday_${today}`;
      let notified = [];
      try {
        notified = JSON.parse(localStorage.getItem(storageKey) || "[]");
      } catch (e) {}
      const notifiedSet = new Set(notified);
      let changed = false;
      for (const p of state.persons.filter(x => !x.isHidden)) {
        if (ContactResolver.daysUntilNextBirthday(p.birthdayIso, today) === 0) {
          if (!notifiedSet.has(p.id)) {
            notifiedSet.add(p.id);
            changed = true;
            showBirthdayHeadsUpToast(p, false);
          }
        }
      }
      if (changed) {
        try {
          localStorage.setItem(storageKey, JSON.stringify([...notifiedSet]));
        } catch (e) {}
      }
    }

    // =========================================================================
    // Appwrite Cloud Online-Wichteln (100 % Admin-blind & 100 % anonymes Q&A)
    // =========================================================================
    const WICHTEL_PORTAL_BASE_URL = "https://wichteln.kirchnerapp.workers.dev";
    const WICHTEL_API_PROXY_BASE = "https://wichteln.kirchnerapp.workers.dev/v1";
    const WICHTEL_FALLBACK_API_BASE = "https://fra.cloud.appwrite.io/v1";
    const WICHTEL_APPWRITE_PROJECT_ID = "6981eb5a00304f3ed7a3";
    const WICHTEL_DB_ID = "remember_me_db";
    const WICHTEL_COL_ID = "wichteln";

    let wichtelCloudBusy = false;
    const wichtelAutoSyncedRounds = new Set();

    function generateWichtelRandomCode(len = 10) {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      const rnd = new Uint32Array(len);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(rnd);
      } else {
        for (let i = 0; i < len; i++) rnd[i] = Math.floor(Math.random() * 0xffffffff);
      }
      let out = "";
      for (let i = 0; i < len; i++) out += chars[rnd[i] % chars.length];
      return out;
    }

    function wichtelSha256Bytes(asciiBytes) {
      const K = [
        0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
        0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
        0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
        0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
        0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
        0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
        0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
        0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
      ];
      let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      const l = asciiBytes.length;
      const bitLenHi = Math.floor((l * 8) / 0x100000000);
      const bitLenLo = (l * 8) >>> 0;
      const padLen = ((l + 9 + 63) >> 6) << 6;
      const m = new Uint8Array(padLen);
      m.set(asciiBytes);
      m[l] = 0x80;
      const dv = new DataView(m.buffer);
      dv.setUint32(padLen - 8, bitLenHi, false);
      dv.setUint32(padLen - 4, bitLenLo, false);
      const W = new Uint32Array(64);
      const rotr = (x, n) => (x >>> n) | (x << (32 - n));
      for (let i = 0; i < padLen; i += 64) {
        for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4, false);
        for (let t = 16; t < 64; t++) {
          const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
          const s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
          const ch = (e & f) ^ ((~e) & g);
          const temp1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
          const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
          const maj = (a & b) ^ (a & c) ^ (b & c);
          const temp2 = (S0 + maj) >>> 0;
          h = g; g = f; f = e; e = (d + temp1) >>> 0;
          d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
        }
        H = H.map((v, idx) => (v + [a, b, c, d, e, f, g, h][idx]) >>> 0);
      }
      const out = new Uint8Array(32);
      const outDv = new DataView(out.buffer);
      H.forEach((v, idx) => outDv.setUint32(idx * 4, v, false));
      return out;
    }

    function wichtelSha256Hex(str) {
      const digest = wichtelSha256Bytes(new TextEncoder().encode(String(str || "")));
      return Array.from(digest).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function sealWichtelBoxJs(plainJsonStr, roundId, pid) {
      const plain = new TextEncoder().encode(plainJsonStr);
      const cipher = new Uint8Array(plain.length);
      let blockIdx = 0;
      for (let offset = 0; offset < plain.length; offset += 32) {
        const keyBlock = wichtelSha256Bytes(new TextEncoder().encode(`RM_WICHTEL_V1:${roundId}:${pid}:${blockIdx++}`));
        const chunk = Math.min(32, plain.length - offset);
        for (let j = 0; j < chunk; j++) {
          cipher[offset + j] = plain[offset + j] ^ keyBlock[j];
        }
      }
      let bin = "";
      for (let i = 0; i < cipher.length; i++) bin += String.fromCharCode(cipher[i]);
      return btoa(bin);
    }

    function buildWichtelGroupPortalUrl(cloudRoundId) {
      return `${WICHTEL_PORTAL_BASE_URL}/?r=${encodeURIComponent(cloudRoundId || "")}`;
    }

    function buildWichtelDirectMemberPortalUrl(cloudRoundId, cloudPid, directToken) {
      return `${WICHTEL_PORTAL_BASE_URL}/?r=${encodeURIComponent(cloudRoundId || "")}&p=${encodeURIComponent(cloudPid || "")}&k=${encodeURIComponent(directToken || "")}`;
    }

    async function wichtelAppwriteFetch(method, path, bodyObj = null) {
      const bases = [WICHTEL_API_PROXY_BASE, WICHTEL_FALLBACK_API_BASE];
      let lastErr = null;
      for (const base of bases) {
        try {
          const opts = {
            method,
            headers: {
              "Content-Type": "application/json",
              "x-appwrite-project": WICHTEL_APPWRITE_PROJECT_ID
            }
          };
          if (bodyObj !== null) opts.body = JSON.stringify(bodyObj);
          const res = await fetch(base + path, opts);
          const text = await res.text();
          return { status: res.status, text };
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("Appwrite nicht erreichbar");
    }

    function wichtelQEqual(attr, val) {
      return encodeURIComponent(JSON.stringify({ method: "equal", attribute: attr, values: [val] }));
    }

    function wichtelQLimit(n) {
      return encodeURIComponent(JSON.stringify({ method: "limit", values: [n] }));
    }

    async function upsertWichtelDocOnline(docId, roundId, docType, slotKey, payloadObj) {
      const data = {
        roundId,
        docType,
        slotKey,
        payload: JSON.stringify(payloadObj)
      };
      const createRes = await wichtelAppwriteFetch("POST", `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents`, {
        documentId: docId,
        data
      });
      if (createRes.status === 409) {
        await wichtelAppwriteFetch("PATCH", `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents/${docId}`, { data });
      }
    }

    async function triggerWichtelPushEventOnline(cloudRoundId, bodyObj) {
      if (!cloudRoundId) return;
      try {
        await fetch(`${WICHTEL_PORTAL_BASE_URL}/api/push-event`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign({ roundId: cloudRoundId }, bodyObj || {}))
        });
      } catch (e) {}
    }

    async function fetchWichtelPushPidsOnline(cloudRoundId) {
      if (!cloudRoundId) return new Set();
      try {
        const res = await fetch(`${WICHTEL_PORTAL_BASE_URL}/api/push-status?r=${encodeURIComponent(cloudRoundId)}`);
        if (!res.ok) return new Set();
        const data = await res.json();
        const arr = Array.isArray(data.enabledPids) ? data.enabledPids.map(n => Number(n) || 0) : [];
        return new Set(arr.filter(Boolean));
      } catch (e) {
        return new Set();
      }
    }

    async function deleteWichtelRoundOnline(cloudRoundId) {
      if (!cloudRoundId) return;
      for (const rKey of [cloudRoundId, `push_${cloudRoundId}`]) {
        try {
          const res = await wichtelAppwriteFetch(
            "GET",
            `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents?queries[]=${wichtelQEqual("roundId", rKey)}&queries[]=${wichtelQLimit(250)}`
          );
          if (res.status >= 200 && res.status < 300) {
            const docs = (JSON.parse(res.text).documents || []);
            for (const d of docs) {
              if (d.$id) {
                await wichtelAppwriteFetch("DELETE", `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents/${d.$id}`);
              }
            }
          }
        } catch (e) {}
      }
    }

    async function publishWichtelRoundToAppwrite(g, oldCloudRoundId = "") {
      if (!g || !g.isDrawn || !g.cloudRoundId) return false;
      wichtelCloudBusy = true;
      renderPhoneApp();
      try {
        if (oldCloudRoundId && oldCloudRoundId !== g.cloudRoundId) {
          await deleteWichtelRoundOnline(oldCloudRoundId);
        }
        const outThreadByPid = {};
        const inThreadByPid = {};
        g.participants.forEach(p => {
          outThreadByPid[p.cloudPid] = `th_${generateWichtelRandomCode(14)}`;
        });
        g.participants.forEach(p => {
          const target = g.participants.find(x => x.id === p.drawnTargetId);
          if (target) {
            inThreadByPid[target.cloudPid] = outThreadByPid[p.cloudPid];
          }
        });

        await upsertWichtelDocOnline(`r_${g.cloudRoundId}`, g.cloudRoundId, "ROUND", "META", {
          cloudRoundId: g.cloudRoundId,
          groupName: g.groupName,
          adminName: g.adminName || "Admin",
          motto: g.motto || "🎁 Klassisches Wichteln",
          budget: g.budget || "",
          revealDateIso: g.revealDateIso || "",
          forceRevealed: !!g.forceRevealed,
          createdAt: new Date().toISOString(),
          roster: g.participants.map(p => ({ pid: p.cloudPid, name: p.name }))
        });

        for (const p of g.participants) {
          const target = g.participants.find(x => x.id === p.drawnTargetId);
          if (!target) continue;
          const secretJson = JSON.stringify({
            targetPid: target.cloudPid,
            targetName: target.name,
            outThreadId: outThreadByPid[p.cloudPid] || "",
            inThreadId: inThreadByPid[p.cloudPid] || ""
          });
          const sealedBox = sealWichtelBoxJs(secretJson, g.cloudRoundId, p.cloudPid);
          await upsertWichtelDocOnline(`p_${g.cloudRoundId}_${p.cloudPid}`, g.cloudRoundId, "PART", `P_${p.cloudPid}`, {
            pid: p.cloudPid,
            name: p.name,
            tokenHash: wichtelSha256Hex(p.directToken || ""),
            pinHash: "",
            openedAt: "",
            wishUpdatedAt: "",
            wishText: p.wishText || "",
            noGos: p.noGos || "",
            address: p.address || "",
            wishlistUrl: p.wishlistUrl || "",
            extraWishUrls: Array.isArray(p.extraWishUrls) ? p.extraWishUrls.filter(Boolean) : [],
            sealedBox
          });
        }

        g.cloudSyncedAt = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        wichtelAutoSyncedRounds.add(g.cloudRoundId);
        addLog(`☁️ Wichtelrunde "${g.groupName}" verschlüsselt & 100 % Admin-blind im Appwrite-Portal veröffentlicht!`);
        wichtelCloudBusy = false;
        saveState();
        return true;
      } catch (err) {
        wichtelCloudBusy = false;
        addLog(`⚠️ Cloud-Upload fehlgeschlagen: ${err.message || err}`);
        renderPhoneApp();
        return false;
      }
    }

    async function syncWichtelRoundLiveStatus(groupId, logSuccess = true) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g || !g.isDrawn) return;
      if (!g.cloudRoundId) {
        g.cloudRoundId = generateWichtelRandomCode(10);
        g.participants.forEach((p, idx) => {
          p.cloudPid = p.cloudPid || (idx + 1);
          p.directToken = p.directToken || generateWichtelRandomCode(12);
        });
        await publishWichtelRoundToAppwrite(g, "");
        return;
      }
      wichtelCloudBusy = true;
      renderPhoneApp();
      try {
        const res = await wichtelAppwriteFetch(
          "GET",
          `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents?queries[]=${wichtelQEqual("roundId", g.cloudRoundId)}&queries[]=${wichtelQLimit(250)}`
        );
        wichtelCloudBusy = false;
        if (res.status < 200 || res.status >= 300) {
          renderPhoneApp();
          return;
        }
        const docs = JSON.parse(res.text).documents || [];
        if (docs.length === 0) {
          await publishWichtelRoundToAppwrite(g, "");
          return;
        }
        let totalMsgs = 0;
        let unreadMsgs = 0;
        const partByPid = {};
        for (const doc of docs) {
          let pObj = null;
          try { pObj = JSON.parse(doc.payload || "{}"); } catch (e) {}
          if (!pObj) continue;
          if (doc.docType === "PART" && pObj.pid) {
            partByPid[pObj.pid] = pObj;
          } else if (doc.docType === "MSG") {
            totalMsgs++;
            const unread = pObj.fromRole === "SANTA" ? !pObj.readByTarget : !pObj.readBySanta;
            if (unread) unreadMsgs++;
          }
        }
        const pushPids = await fetchWichtelPushPidsOnline(g.cloudRoundId);
        g.participants.forEach(p => {
          const cp = partByPid[p.cloudPid];
          p.cloudHasPush = pushPids.has(p.cloudPid);
          if (!cp) return;
          p.cloudOpened = !!(cp.openedAt && String(cp.openedAt).trim());
          p.cloudHasPin = !!(cp.pinHash && String(cp.pinHash).trim());
          const cWish = (cp.wishText || "").trim();
          const cUrl = (cp.wishlistUrl || "").trim();
          const cExtras = Array.isArray(cp.extraWishUrls) ? cp.extraWishUrls.filter(Boolean) : [];
          p.cloudHasWishlist = !!(cWish || cUrl || cExtras.length > 0);
          if (cWish) p.wishText = cWish;
          if (cp.noGos && String(cp.noGos).trim()) p.noGos = String(cp.noGos).trim();
          if (cp.address && String(cp.address).trim()) p.address = String(cp.address).trim();
          if (cUrl) p.wishlistUrl = cUrl;
          if (cExtras.length > 0) p.extraWishUrls = cExtras;
        });
        g.cloudTotalMessages = totalMsgs;
        g.cloudUnreadMessages = unreadMsgs;
        g.cloudSyncedAt = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        if (logSuccess) {
          const opened = g.participants.filter(x => x.cloudOpened).length;
          const pushes = g.participants.filter(x => x.cloudHasPush).length;
          addLog(`🔄 Live-Status aus Appwrite geladen: ${opened}/${g.participants.length} Lose geöffnet, ${pushes} Handy-Meldungen aktiv, ${totalMsgs} anonyme Nachrichten (${unreadMsgs} ungelesen).`);
        }
        saveState();
      } catch (err) {
        wichtelCloudBusy = false;
        if (logSuccess) addLog("⚠️ Appwrite-Cloud momentan nicht erreichbar.");
        renderPhoneApp();
      }
    }

    async function updateWichtelParticipantOnline(g, part) {
      if (!g || !g.isDrawn || !g.cloudRoundId || !part || !part.cloudPid) return;
      try {
        const docId = `p_${g.cloudRoundId}_${part.cloudPid}`;
        const res = await wichtelAppwriteFetch("GET", `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents/${docId}`);
        if (res.status >= 200 && res.status < 300) {
          const doc = JSON.parse(res.text);
          const payloadObj = JSON.parse(doc.payload || "{}");
          payloadObj.name = part.name;
          payloadObj.wishText = part.wishText || "";
          payloadObj.noGos = part.noGos || "";
          payloadObj.address = part.address || "";
          payloadObj.wishlistUrl = part.wishlistUrl || "";
          payloadObj.extraWishUrls = Array.isArray(part.extraWishUrls) ? part.extraWishUrls.filter(Boolean) : [];
          payloadObj.wishUpdatedAt = new Date().toISOString();
          await upsertWichtelDocOnline(docId, g.cloudRoundId, "PART", `P_${part.cloudPid}`, payloadObj);
          triggerWichtelPushEventOnline(g.cloudRoundId, { eventType: "WISH_UPDATED", fromPid: part.cloudPid });
        }
      } catch (e) {}
    }

    async function updateWichtelForceRevealOnline(g) {
      if (!g || !g.cloudRoundId) return;
      try {
        const docId = `r_${g.cloudRoundId}`;
        const res = await wichtelAppwriteFetch("GET", `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents/${docId}`);
        if (res.status >= 200 && res.status < 300) {
          const doc = JSON.parse(res.text);
          const payloadObj = JSON.parse(doc.payload || "{}");
          payloadObj.forceRevealed = !!g.forceRevealed;
          await upsertWichtelDocOnline(docId, g.cloudRoundId, "ROUND", "META", payloadObj);
          if (g.forceRevealed) {
            triggerWichtelPushEventOnline(g.cloudRoundId, { eventType: "ROUND_REVEALED" });
          }
        }
      } catch (e) {}
    }

    function resetWichtelMemberPinOnline(groupId, participantId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      const part = g ? g.participants.find(x => x.id === participantId) : null;
      if (!g || !part || !g.cloudRoundId || !part.cloudPid) return;
      askDeleteConfirm(`Hat ${part.name} die 4-stellige Portal-PIN vergessen? Die PIN wird zurückgesetzt (das Los bleibt weiterhin geheim!).`, async () => {
        try {
          const docId = `p_${g.cloudRoundId}_${part.cloudPid}`;
          const res = await wichtelAppwriteFetch("GET", `/databases/${WICHTEL_DB_ID}/collections/${WICHTEL_COL_ID}/documents/${docId}`);
          if (res.status >= 200 && res.status < 300) {
            const doc = JSON.parse(res.text);
            const payloadObj = JSON.parse(doc.payload || "{}");
            payloadObj.pinHash = "";

    function resolveWichtelMemberPhone(member) {
      if (!member) return "";
      if (member.phone && member.phone.trim()) return member.phone.trim();
      const p = (state.persons || []).find(x => (member.personId && x.id === member.personId) || (x.name || "").trim().toLowerCase() === (member.name || "").trim().toLowerCase());
      return p && p.phone ? p.phone.trim() : "";
    }

    function resolveWichtelMemberEmail(member) {
      if (!member) return "";
      if (member.email && member.email.trim()) return member.email.trim();
      const p = (state.persons || []).find(x => (member.personId && x.id === member.personId) || (x.name || "").trim().toLowerCase() === (member.name || "").trim().toLowerCase());
      return p && p.email ? p.email.trim() : "";
    }

    function normalizeWhatsAppPhoneNumber(raw) {
      const trimmed = String(raw || "").trim();
      if (!trimmed) return "";
      const digitsOnly = trimmed.replace(/[^0-9]/g, "");
      if (digitsOnly.length < 6) return "";
      if (trimmed.startsWith("+")) return digitsOnly;
      if (trimmed.startsWith("00")) return digitsOnly.replace(/^00/, "");
      if (digitsOnly.startsWith("0")) return "49" + digitsOnly.slice(1);
      return digitsOnly;
    }

    function openWichtelQuickSendModal(groupId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);

        g.cloudRoundId = generateWichtelRandomCode(10);
        g.participants.forEach((p, idx) => {
          if (!p.cloudPid) p.cloudPid = idx + 1;
          if (!p.directToken) p.directToken = generateWichtelRandomCode(12);

    function arePersonsCoupleInTree(personIdA, personIdB) {
      if (!personIdA || !personIdB) return false;
      const partnerA = getCouplePartnerForPerson(personIdA);
      return !!(partnerA && partnerA.id === personIdB);
    }

    let wichtelSecretCodeModalState = null;

    function solveWichtelMatchingBacktrack(parts, isAllowedEdge) {
      const n = parts.length;
      const givers = [...parts].sort(() => Math.random() - 0.5);
      const usedReceiverIds = new Set();
      const assignment = new Map();

      function backtrack(idx) {
        if (idx === n) return true;
        const giver = givers[idx];
        const candidates = [...parts].sort(() => Math.random() - 0.5);
        for (const receiver of candidates) {
          if (giver.id === receiver.id) continue;
          if (usedReceiverIds.has(receiver.id)) continue;
          if (!isAllowedEdge(giver, receiver)) continue;
          usedReceiverIds.add(receiver.id);
          assignment.set(giver.id, receiver.id);
          if (backtrack(idx + 1)) return true;
          usedReceiverIds.delete(receiver.id);
          assignment.delete(giver.id);
        }
        return false;
      }

      return backtrack(0) ? assignment : null;
    }

    function executeWichtelRoll(g) {
      const parts = g.participants;
      parts.forEach(p => {
        if (p.drawnTargetId) {
          p.lastYearTargetId = p.drawnTargetId;
        }
      });

      let bestAssignment = solveWichtelMatchingBacktrack(parts, (giver, receiver) => {
        if (g.excludeCouples && parts.length > 2 && arePersonsCoupleInTree(giver.personId, receiver.personId)) return false;
        if (g.excludeLastYear !== false && parts.length > 2) {
          if (giver.lastYearTargetId && giver.lastYearTargetId === receiver.id) return false;
          if (hasDrawnTargetInHistory(giver, receiver)) return false;
        }
        return true;
      });

      if (!bestAssignment && g.excludeCouples && parts.length > 2) {
        bestAssignment = solveWichtelMatchingBacktrack(parts, (giver, receiver) => {
          return !arePersonsCoupleInTree(giver.personId, receiver.personId);
        });
      }

      if (!bestAssignment) {
        bestAssignment = solveWichtelMatchingBacktrack(parts, () => true);
      }

      const oldCloudId = g.cloudRoundId || "";
      g.cloudRoundId = generateWichtelRandomCode(10);
      g.cloudSyncedAt = "";
      g.cloudTotalMessages = 0;
      g.cloudUnreadMessages = 0;

      parts.forEach((p, idx) => {
        p.drawnTargetId = bestAssignment ? (bestAssignment.get(p.id) || null) : null;
        p.notifiedVia = "";
        p.cloudPid = idx + 1;
        p.directToken = generateWichtelRandomCode(12);
        p.cloudOpened = false;
        p.cloudHasPin = false;
        p.cloudHasPush = false;
        p.cloudHasWishlist = !!((p.wishText && p.wishText.trim()) || (p.wishlistUrl && p.wishlistUrl.trim()));
      });
      g.isDrawn = true;
      g.forceRevealed = false;
      g.drawnAt = new Date().toLocaleTimeString("de-DE");
      addLog(`🎲 Wichtelrunde "${g.groupName}" geheim ausgelost (100 % Admin-blind)! Verbinde mit Appwrite-Wichtelportal…`);
      wichtelQuickSendGroupId = g.id;
      saveState();
      publishWichtelRoundToAppwrite(g, oldCloudId);
    }

    let calendarPickerState = null;
    const MONTH_NAMES_DE = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    function openCalendarPicker(inputId) {
      const el = document.getElementById(inputId);
      const rawVal = el ? el.value : "";
      const iso = normalizeDateInputToIso(rawVal) || todayIso();
      const parts = iso.replace(/^--/, "2000-").split("-").map(Number);
      const tParts = todayIso().split("-").map(Number);
      const year = (parts.length === 3 && parts[0] >= 1900 && parts[0] <= 2100) ? parts[0] : tParts[0];
      const month = (parts.length === 3 && parts[1] >= 1 && parts[1] <= 12) ? (parts[1] - 1) : (tParts[1] - 1);
      const day = (parts.length === 3 && parts[2] >= 1 && parts[2] <= 31) ? parts[2] : tParts[2];
      calendarPickerState = { inputId, year, month, selectedDay: day };
      renderCalendarPopup();
    }

    function closeCalendarPicker() {
      calendarPickerState = null;
      const calRoot = document.getElementById("calendar-root");
      if (calRoot) calRoot.innerHTML = "";
    }

    function changeCalendarMonth(delta) {
      if (!calendarPickerState) return;
      let m = calendarPickerState.month + delta;
      let y = calendarPickerState.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      calendarPickerState.month = m;
      calendarPickerState.year = y;
      renderCalendarPopup();
    }

    function setCalendarYear(yearStr) {
      if (!calendarPickerState) return;
      calendarPickerState.year = parseInt(yearStr, 10) || calendarPickerState.year;
      renderCalendarPopup();
    }

    function setCalendarMonth(monthStr) {
      if (!calendarPickerState) return;
      calendarPickerState.month = parseInt(monthStr, 10) || 0;
      renderCalendarPopup();
    }

    function selectCalendarDay(day) {
      if (!calendarPickerState) return;
      const pad = n => String(n).padStart(2, "0");
      const formatted = `${pad(day)}.${pad(calendarPickerState.month + 1)}.${calendarPickerState.year}`;
      const el = document.getElementById(calendarPickerState.inputId);
      if (el) {
        el.value = formatted;
        if (calendarPickerState.inputId === "c-bday") {
          createDraft.bday = formatted;
          updateContactHeroLive("create");
        }
        if (calendarPickerState.inputId === "d-bday") {
          updateContactHeroLive("detail");
        }
        if (calendarPickerState.inputId === "wg-reveal" && wichtelGroupModalState) {
          wichtelGroupModalState.revealDate = formatted;
        }
        if (calendarPickerState.inputId === "tm-startdate" && timerEntryModalState) {
          timerEntryModalState.startDate = formatted;
          renderModals();
        }
      }
      closeCalendarPicker();
    }

    function selectCalendarToday() {
      const tParts = todayIso().split("-").map(Number);
      if (!calendarPickerState) return;
      calendarPickerState.year = tParts[0];
      calendarPickerState.month = tParts[1] - 1;
      selectCalendarDay(tParts[2]);
    }

    function renderCalendarPopup() {
      const calRoot = document.getElementById("calendar-root");
      if (!calRoot) return;
      if (!calendarPickerState) {
        calRoot.innerHTML = "";
        return;
      }
      const { year, month, selectedDay } = calendarPickerState;
      const firstDayJs = new Date(year, month, 1).getDay(); // 0=Sun..6=Sat
      const startOffset = (firstDayJs + 6) % 7; // Monday=0..Sunday=6
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const yearOptions = [];
      for (let y = 2035; y >= 1920; y--) {
        yearOptions.push(`<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`);
      }
      const monthOptions = MONTH_NAMES_DE.map((name, idx) =>
        `<option value="${idx}" ${idx === month ? "selected" : ""}>${name}</option>`
      ).join("");

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div></div>`);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const isSel = d === selectedDay;
        cells.push(`
          <button class="compact-btn ${isSel ? 'primary' : ''}" style="padding:6px 0; font-size:12px; font-weight:${isSel ? '700' : '500'}; text-align:center;" onclick="selectCalendarDay(${d})">
            ${d}
          </button>
        `);
      }

      calRoot.innerHTML = `
        <div class="modal-backdrop" style="z-index:200;" onclick="if(event.target===this) closeCalendarPicker()">
          <div class="modal" style="max-width:310px;" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:4px;">
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(-1)">◀</button>
              <select class="field-select" style="flex:1.1;" onchange="setCalendarMonth(this.value)">${monthOptions}</select>
              <select class="field-select" style="flex:0.9;" onchange="setCalendarYear(this.value)">${yearOptions.join("")}</select>
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(1)">▶</button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; font-size:11px; color:var(--text-muted); font-weight:600; margin-top:4px;">
              <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;">
              ${cells.join("")}
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
              <button class="compact-btn" onclick="selectCalendarToday()">Heute</button>
              <button class="compact-btn" onclick="closeCalendarPicker()">Schließen</button>
            </div>
          </div>
        </div>
      `;
    }

    }

    async function sendBackupViaEmail() {
      const dateStr = formatIsoToDdMmYyyy(todayIso());
      const fileName = `Remember-Me-Sicherung-${dateStr}.json`;
      const backupPayload = {
        app: "Remember Me",
        version: "1.0.50",
        createdAt: dateStr,
        state
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });

      // Sicherungsdatei herunterladen
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);

      // Falls Web Share API mit Dateien verfügbar ist (Mobilbrowser)
      try {
        const file = new File([blob], fileName, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: `Remember Me Sicherung (${dateStr})`,
            text: `Sicherungsdatei (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen)`,
            files: [file]
          });
          addLog(`Sicherungsdatei "${fileName}" geteilt.`);
          return;
        }
      } catch (e) {}

      // Mail-Programm öffnen
      const recipient = (state.backupEmail || "").trim();
      const subject = `Remember Me – Sicherung vom ${dateStr}`;
      const body = `Hallo,\n\nanbei die Remember Me Sicherung vom ${dateStr} (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen).\nDie Datei "${fileName}" wurde heruntergeladen und kann dieser E-Mail angehängt werden.\n\n--- Sicherungsdaten (JSON) ---\n${jsonStr}`;
      window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      addLog(`Sicherungsdatei "${fileName}" erstellt und Mail-Versand geöffnet.`);
      saveState();
    }

    function importBackupFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedState = parsed.state || parsed;
          if (importedState && Array.isArray(importedState.persons)) {
            state = importedState;
            selectedTreeRootId = state.persons[0] ? state.persons[0].id : null;
            showOptionsDialog = false;
            addLog(`Sicherung aus "${file.name}" erfolgreich wiederhergestellt (${state.persons.length} Kontakte).`);
            saveState();
          }
        } catch (err) {
          addLog("Fehler beim Laden der Sicherungsdatei.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (state.persons.length > 0) {
      selectedTreeRootId = state.persons[0].id;
    }
    addLog("Remember Me v1.0.50 gestartet.");
    renderAll();
    checkTodaysBirthdaysPopup();
  </script>
</body>
</html>
