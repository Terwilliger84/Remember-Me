    function expandSpecialEventOccurrencesJs(ev, today = todayIso(), maxOccurrences = 6, maxHorizonDays = 365) {
      const clean = String(ev.dateIso || "").trim();
      if (!clean) return [];
      const results = [];
      if (isWeeklyDateSpec(clean)) {
        const wd = getWeeklyDayNumber(clean);
        if (!wd) return [];
        const dayName = WEEKDAY_NAMES_DE[wd] || "Wochentag";
        const firstDiff = daysUntilWeeklyDay(wd, today);
        for (let occ = 0; occ < maxOccurrences; occ++) {
          const days = firstDiff + occ * 7;
          if (days > maxHorizonDays) break;
          results.push({
            occIdx: occ,
            dateIso: addIntervalToIsoDate(today, days, "DAYS"),
            days,
            isRecurring: true,
            recurrenceNote: `🔁 Jeden ${dayName}`
          });
        }
        return results;
      }
      if (isRepeatDateSpec(clean)) {
        const rep = parseRepeatDateSpec(clean, today);
        if (!rep) return [];
        const rhythmStr = formatRhythmTextDe(rep.count, rep.unit);
        let curIso = rep.nextIso;
        for (let occ = 0; occ < maxOccurrences; occ++) {
          const days = daysBetween(today, curIso);
          if (days > maxHorizonDays) break;
          results.push({
            occIdx: occ,
            dateIso: curIso,
            days,
            isRecurring: true,
            recurrenceNote: `🔁 Alle ${rhythmStr}`
          });
          curIso = addIntervalToIsoDate(curIso, rep.count, rep.unit);
        }
        return results;
      }
      const diff = daysBetween(today, clean);
      if (diff !== null && !Number.isNaN(diff)) {
        results.push({
          occIdx: 0,
          dateIso: clean,
          days: diff,
          isRecurring: false,
          recurrenceNote: ""
        });
      }
      return results;
    }

    function expandTimerOccurrencesJs(person, today = todayIso(), maxOccurrences = 5, maxHorizonDays = 180) {
      if (!person.timerEnabled || (Number(person.timerInterval) || 0) <= 0) return [];
      const firstIso = ContactResolver.nextTimerDate(person, today);
      if (!firstIso) return [];
      const interval = Math.max(1, Number(person.timerInterval) || 14);
      const unit = (person.timerUnit || "DAYS").toUpperCase();
      const rhythmStr = formatRhythmTextDe(interval, unit);
      const results = [];
      let curIso = firstIso;
      for (let occ = 0; occ < maxOccurrences; occ++) {
        const rawDays = daysBetween(today, curIso);
        if (rawDays > maxHorizonDays) break;
        results.push({
          occIdx: occ,
          dateIso: curIso,
          rawDays,
          sortDays: Math.max(0, rawDays),
          rhythmStr
        });
        const stepBase = curIso < today ? today : curIso;
        curIso = addIntervalToIsoDate(stepBase, interval, unit);
      }
      return results;
    }

    function renderOverviewCountdownPillHtml(item, showPast) {
      if (item.kind === "REL_ONLY") return "";
      if (showPast) {
        const d = item.daysUntil;
        if (d === 0 && item.kind === "BIRTHDAY" && item.isCongratulatedToday) {
          return `<span class="countdown-pill" style="background:rgba(22,163,74,0.16); color:#15803D; font-weight:800;">✅ Gratuliert</span>`;
        }
        const label = d === 0 ? "Heute" : (d === -1 ? "Gestern" : `vor ${Math.abs(d)}T`);
        return `<span class="countdown-pill" style="background:var(--warn-bg); color:var(--warn-amber);">${escapeHtml(label)}</span>`;
      }
      if (item.rawDays !== undefined && item.rawDays < 0) {
        return `<span class="countdown-pill" style="background:var(--warn-bg); color:var(--warn-amber);">Überfällig (${Math.abs(item.rawDays)}T)</span>`;
      }
      const d = item.daysUntil;
      if (d <= 0) {
        if (item.kind === "BIRTHDAY" && item.isCongratulatedToday) {
          return `<span class="countdown-pill" style="background:rgba(22,163,74,0.16); color:#15803D; font-weight:800;">✅ Gratuliert</span>`;
        }
        if (item.kind === "BIRTHDAY") {
          return `<span class="countdown-pill" style="background:rgba(245,158,11,0.22); color:#B45309; border:1px solid #F59E0B; font-weight:800;">🎉 Heute!</span>`;
        }
        const text = item.kind === "TIMER" ? "⏳ Fällig!" : "🔔 Heute!";
        return `<span class="countdown-pill" style="background:var(--warn-bg); color:var(--warn-amber);">${escapeHtml(text)}</span>`;
      }
      if (d === 1) {
        return `<span class="countdown-pill" style="background:rgba(46, 125, 91, 0.16); color:var(--tree-green);">Morgen</span>`;
      }
      if (d <= 14) {
        return `<span class="countdown-pill" style="background:rgba(46, 125, 91, 0.14); color:var(--tree-green);">in ${d} Tagen</span>`;
      }
      return `<span class="countdown-pill">in ${d}T</span>`;
    }

    function buildOverviewTimelineEntries(persons, linkedPersonIds, showPast, sortMode, today = todayIso()) {
      const items = [];
      for (const person of persons) {
        const personEvents = (state.specialEvents || []).filter(e => e.personId === person.id);
        let hasAnyTimelineEntry = false;

        if (showPast) {
          if (person.birthdayIso && person.birthdayIso.trim()) {
            const negDays = ContactResolver.negativeDaysSinceLastBirthday(person.birthdayIso, today);
            if (negDays !== null) {
              const congrats = negDays === 0 ? getOngoingBirthdayCongrats(person, today) : null;
              hasAnyTimelineEntry = true;
              items.push({
                uniqueKey: `past_bday_${person.id}`,
                person,
                kind: "BIRTHDAY",
                daysUntil: negDays,
                priority: 0,
                isCongratulatedToday: Boolean(congrats),
                congratsChannel: congrats ? congrats.channel : "",
                headline: formatPassedBirthdayLine(person.birthdayIso) + (congrats ? `  •  ✅ ${congrats.channel}` : ""),
                subline: "",
                greetingOccasion: "Nachträglich zum Geburtstag"
              });
            }
          }
          for (const ev of personEvents) {
            if (!isWeeklyDateSpec(ev.dateIso) && !isRepeatDateSpec(ev.dateIso)) {
              const diff = daysBetween(today, ev.dateIso);
              if (diff !== null && diff < 0) {
                hasAnyTimelineEntry = true;
                items.push({
                  uniqueKey: `past_ev_${ev.id}`,
                  person,
                  kind: "EVENT",
                  daysUntil: diff,
                  priority: 1,
                  headline: `🔔 ${ev.title} (${formatIsoToDdMmYyyy(ev.dateIso)})`,
                  subline: "",
                  greetingOccasion: ev.title
                });
              }
            }
          }
          continue;
        }

        // 1. Geburtstag (nächster anstehender Geburtstag)
        if (person.birthdayIso && person.birthdayIso.trim()) {
          const bdayDays = ContactResolver.daysUntilNextBirthday(person.birthdayIso, today);
          if (bdayDays !== null) {
            const congrats = bdayDays === 0 ? getOngoingBirthdayCongrats(person, today) : null;
            hasAnyTimelineEntry = true;
            items.push({
              uniqueKey: `bday_${person.id}`,
              person,
              kind: "BIRTHDAY",
              daysUntil: bdayDays,
              priority: 0,
              isCongratulatedToday: Boolean(congrats),
              congratsChannel: congrats ? congrats.channel : "",
              headline: `🎂 ${formatCompactBirthdayLine(person.birthdayIso)}${congrats ? `  •  ✅ ${congrats.channel}` : ""}`,
              subline: "",
              greetingOccasion: "Herzlichen Glückwunsch zum Geburtstag"
            });
          }
        }

        // 2. Einzelne & wiederkehrende Termine/Erinnerungen (mehrfache Vorkommen pro Kontakt erlaubt!)
        for (const ev of personEvents) {
          const occs = expandSpecialEventOccurrencesJs(ev, today, 6, 365);
          for (const occ of occs) {
            if (occ.days >= 0) {
              hasAnyTimelineEntry = true;
              const formattedDate = formatIsoToDdMmYyyy(occ.dateIso);
              items.push({
                uniqueKey: `ev_${ev.id}_${occ.occIdx}`,
                person,
                kind: "EVENT",
                daysUntil: occ.days,
                priority: 1,
                isRecurring: occ.isRecurring,
                headline: `🔔 ${ev.title} • ${formattedDate}`,
                subline: occ.recurrenceNote || "",
                greetingOccasion: ev.title
              });
            }
          }
        }

        // 3. Wiederkehrender Melde-Timer (mehrfache Vorkommen pro Kontakt erlaubt!)
        const timerOccs = expandTimerOccurrencesJs(person, today, 5, 180);
        for (const tOcc of timerOccs) {
          hasAnyTimelineEntry = true;
          const formattedDate = formatIsoToDdMmYyyy(tOcc.dateIso);
          items.push({
            uniqueKey: `timer_${person.id}_${tOcc.occIdx}`,
            person,
            kind: "TIMER",
            daysUntil: tOcc.sortDays,
            rawDays: tOcc.rawDays,
            priority: 2,
            isRecurring: true,
            headline: `⏳ Melde-Timer • ${formattedDate}`,
            subline: `🔁 Alle ${tOcc.rhythmStr}`,
            greetingOccasion: "Erinnerung"
          });
        }

        // 4. Kontakte ohne Datum/Termin, aber mit Verknüpfung (z. B. Kind von ...) am Ende ohne "Ohne Datum"
        if (!hasAnyTimelineEntry && linkedPersonIds.has(person.id)) {
          items.push({
            uniqueKey: `relonly_${person.id}`,
            person,
            kind: "REL_ONLY",
            daysUntil: Number.MAX_SAFE_INTEGER,
            priority: 9,
            headline: "",
            subline: "",
            greetingOccasion: "Erinnerung"
          });
        }
      }

      if (showPast) {
        items.sort((a, b) => (b.daysUntil - a.daysUntil) || (a.priority - b.priority) || formatLastNameFirst(a.person.name).localeCompare(formatLastNameFirst(b.person.name), "de"));
      } else if (sortMode === "lastname") {
        items.sort((a, b) => formatLastNameFirst(a.person.name).localeCompare(formatLastNameFirst(b.person.name), "de") || (a.daysUntil - b.daysUntil) || (a.priority - b.priority));
      } else {
        items.sort((a, b) => (a.daysUntil - b.daysUntil) || (a.priority - b.priority) || formatLastNameFirst(a.person.name).localeCompare(formatLastNameFirst(b.person.name), "de"));
      }
      return items;
    }

    function renderPersonsList() {
      const linkedPersonIds = new Set();
      (state.relations || []).forEach(r => {
        linkedPersonIds.add(r.fromPersonId);
        linkedPersonIds.add(r.toPersonId);
      });

      const isOverviewEligible = (p) =>
        Boolean(p.birthdayIso && p.birthdayIso.trim()) ||
        Boolean(p.timerEnabled && (Number(p.timerInterval) || 0) > 0) ||
        eventPersonIds.has(p.id) ||
        linkedPersonIds.has(p.id);

      const hiddenPersons = state.persons.filter(p => p.isHidden && isOverviewEligible(p));
      const visiblePersons = state.persons.filter(p => !p.isHidden && isOverviewEligible(p));
      const filteredVisible = visiblePersons.filter(p => matchesPersonSearchAndLetter(p, tabSearchQuery, tabSelectedLetter));

        const incRels = (state.relations || [])
          .filter(r => r.toPersonId === person.id && !fwdTargetIds.has(r.fromPersonId))
          .map(r => {
            const target = state.persons.find(p => p.id === r.fromPersonId);
            return target ? `${inverseRelationLabel(r.relationLabel)} ${formatLastNameFirst(target.name)}` : null;
          })
          .filter(Boolean);
        const relationDescriptions = [

        const pillHtml = renderOverviewCountdownPillHtml(item, showPastDates);
        const isTodayBdayOpen = !showPastDates && item.kind === "BIRTHDAY" && item.daysUntil === 0 && !item.isCongratulatedToday;

              </div>
            </div>
          </div>
        `;
      }).join("");

      return headerBar + listHtml;
    }

    let treeZoom = 1.0;
    let treePanX = 0;
    let treePanY = 0;
    let isTreeDragging = false;
    let treeDragStartX = 0;
    let treeDragStartY = 0;
    let lastTreePinchDist = null;
    let treeEditConnectionsMode = false;
    let treeFirstPickedPersonId = null;
    let treeRelationModalState = null; // { originalAId, originalBId, fromId, toId, label, isExisting }
    let showAllTreeEdgesModal = false;
    let createPendingRelations = [{ label: "Kind von", targetId: -1 }];
    let detailPendingRelations = [{ label: "Kind von", targetId: -1 }];

    function setTreeZoom(val) {
      treeZoom = Math.min(2.0, Math.max(0.35, Math.round(val * 100) / 100));
      renderPhoneApp();
    }

    function zoomTreeBy(delta) {
      setTreeZoom(treeZoom + delta);
    }

    function resetTreeZoom() {
      treeZoom = 1.0;
      treePanX = 0;
      treePanY = 0;
      renderPhoneApp();
    }

    function fitTreeZoom(maxRowCount, levelCount) {
      const widthScale = maxRowCount > 2 ? (2.35 / maxRowCount) : 0.95;
      const heightScale = levelCount > 3 ? (3.2 / levelCount) : 1.0;
      const fit = Math.min(1.0, widthScale, heightScale);
      treePanX = 0;
      treePanY = 0;
      setTreeZoom(Math.max(0.42, fit));
    }

    function toggleTreeEditConnectionsMode() {
      treeEditConnectionsMode = !treeEditConnectionsMode;
      treeFirstPickedPersonId = null;
      renderPhoneApp();
    }

    function openTreeConnectionModal(person1Id, person2Id) {
      if (!person1Id || !person2Id || person1Id === person2Id) return;
      const existing = state.relations.find(r =>
        r.fromPersonId === person1Id && r.toPersonId === person2Id &&
        !/^elternteil/i.test(r.relationLabel) && !/^geschwister/i.test(r.relationLabel)
      ) || state.relations.find(r =>
        r.fromPersonId === person1Id && r.toPersonId === person2Id
      ) || state.relations.find(r =>
        r.fromPersonId === person2Id && r.toPersonId === person1Id
      );

      if (existing) {
        treeRelationModalState = {
          originalAId: person1Id,
          originalBId: person2Id,
          fromId: existing.fromPersonId,
          toId: existing.toPersonId,
          label: existing.relationLabel,
          isExisting: true
        };
      } else {
        treeRelationModalState = {
          originalAId: 0,
          originalBId: 0,
          fromId: person1Id,
          toId: person2Id,
          label: "Kind von",
          isExisting: false
        };
      }
      renderModals();
    }

    function handleTreeNodeClick(personId, event) {
      if (event) event.stopPropagation();
      if (treeEditConnectionsMode) {
        if (!treeFirstPickedPersonId) {
          treeFirstPickedPersonId = personId;
          renderPhoneApp();
        } else if (treeFirstPickedPersonId === personId) {
          treeFirstPickedPersonId = null;
          renderPhoneApp();
        } else {
          const first = treeFirstPickedPersonId;
          treeFirstPickedPersonId = null;
          renderPhoneApp();
          openTreeConnectionModal(first, personId);
        }
      } else {
        openDetailModal(personId);
      }
    }

    function swapTreeModalDirection() {
      if (!treeRelationModalState) return;
      const tmp = treeRelationModalState.fromId;
      treeRelationModalState.fromId = treeRelationModalState.toId;
      treeRelationModalState.toId = tmp;
      renderModals();
    }

    function saveTreeModalConnection() {
      if (!treeRelationModalState) return;
      const { originalAId, originalBId, fromId, toId, label, isExisting } = treeRelationModalState;
      if (!fromId || !toId || fromId === toId) return;
      if (isExisting && originalAId > 0 && originalBId > 0) {
        replaceBidirectionalRelation(originalAId, originalBId, fromId, toId, label);
        addLog(`Stammbaum-Verbindung aktualisiert: "${label}".`);
      } else {
        addBidirectionalRelation(fromId, toId, label);
        addLog(`Neue Stammbaum-Verbindung angelegt: "${label}".`);
      }
      treeRelationModalState = null;
      saveState();
      renderModals();
    }

    function disconnectTreeModalConnection() {
      if (!treeRelationModalState) return;
      const { originalAId, originalBId } = treeRelationModalState;
      if (originalAId > 0 && originalBId > 0) {
        deleteBidirectionalRelationPair(originalAId, originalBId, null);
        addLog("Stammbaum-Verbindung getrennt.");
      }
      treeRelationModalState = null;
      saveState();
      renderModals();
    }

    function disconnectTreeEdgeQuick(aId, bId) {
      deleteBidirectionalRelationPair(aId, bId, null);
      addLog("Stammbaum-Verbindung getrennt.");
      saveState();
      renderModals();
    }

    function handleTreeMouseDown(e) {
      if (e.target.closest(".tree-node") || e.target.closest(".tree-edge-badge")) return;
      isTreeDragging = true;
      treeDragStartX = e.clientX - treePanX;
      treeDragStartY = e.clientY - treePanY;
    }

    function handleTreeMouseMove(e) {
      if (!isTreeDragging) return;
      treePanX = e.clientX - treeDragStartX;
      treePanY = e.clientY - treeDragStartY;
      const inner = document.getElementById("tree-pan-inner");
      if (inner) {
        inner.style.transform = `translate(${treePanX}px, ${treePanY}px)`;
      }
    }

    function handleTreeMouseUp() {
      isTreeDragging = false;
    }

    function handleTreeWheel(e) {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      zoomTreeBy(delta);
    }

    function handleTreeTouchStart(e) {
      if (e.touches && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastTreePinchDist = Math.hypot(dx, dy);
      } else if (e.touches && e.touches.length === 1 && !e.target.closest(".tree-node") && !e.target.closest(".tree-edge-badge")) {
        isTreeDragging = true;
        treeDragStartX = e.touches[0].clientX - treePanX;
        treeDragStartY = e.touches[0].clientY - treePanY;
      }
    }

    function handleTreeTouchMove(e) {
      if (e.touches && e.touches.length === 2 && lastTreePinchDist) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        if (dist > 5) {
          const ratio = dist / lastTreePinchDist;
          if (Math.abs(ratio - 1) > 0.04) {
            lastTreePinchDist = dist;
            setTreeZoom(treeZoom * ratio);
          }
        }
      } else if (e.touches && e.touches.length === 1 && isTreeDragging) {
        treePanX = e.touches[0].clientX - treeDragStartX;
        treePanY = e.touches[0].clientY - treeDragStartY;
        const inner = document.getElementById("tree-pan-inner");
        if (inner) {
          inner.style.transform = `translate(${treePanX}px, ${treePanY}px)`;
        }
      }
    }

    function handleTreeTouchEnd() {
      lastTreePinchDist = null;
      isTreeDragging = false;
    }

    function extractCanonicalTreeEdges(validPersonIds) {
      const pairMap = new Map();
      for (const r of state.relations) {
        if (!validPersonIds.has(r.fromPersonId) || !validPersonIds.has(r.toPersonId) || r.fromPersonId === r.toPersonId) continue;
        const idA = Math.min(r.fromPersonId, r.toPersonId);
        const idB = Math.max(r.fromPersonId, r.toPersonId);
        const key = `${idA}_${idB}`;
        if (!pairMap.has(key)) pairMap.set(key, { idA, idB, rels: [] });
        pairMap.get(key).rels.push(r);
      }

      const edges = [];
      for (const { idA, idB, rels } of pairMap.values()) {
        const parentRel = rels.find(r => isDirectParentLabel(r.relationLabel));
        const childRel = rels.find(r => isDirectChildLabel(r.relationLabel));
        const partnerRel = rels.find(r => isPartnerRelation(r.relationLabel));
        const siblingRel = rels.find(r => isSiblingRelation(r.relationLabel));

        if (parentRel) {
          const pId = parentRel.fromPersonId;
          const cId = parentRel.toPersonId;
          const spec = rels.find(r => r.fromPersonId === pId && (/^mutter/i.test(r.relationLabel) || /^vater/i.test(r.relationLabel))) || parentRel;
          edges.push({ personAId: idA, personBId: idB, fromId: spec.fromPersonId, toId: spec.toPersonId, label: spec.relationLabel, kind: "PARENT_CHILD", parentId: pId, childId: cId });
        } else if (childRel) {
          const cId = childRel.fromPersonId;
          const pId = childRel.toPersonId;
          edges.push({ personAId: idA, personBId: idB, fromId: childRel.fromPersonId, toId: childRel.toPersonId, label: childRel.relationLabel, kind: "PARENT_CHILD", parentId: pId, childId: cId });
        } else if (partnerRel) {
          const ehe = rels.find(r => /^ehe/i.test(r.relationLabel)) || partnerRel;
          edges.push({ personAId: idA, personBId: idB, fromId: ehe.fromPersonId, toId: ehe.toPersonId, label: ehe.relationLabel, kind: "PARTNER" });
        } else if (siblingRel) {
          const specSib = rels.find(r => /^bruder/i.test(r.relationLabel) || /^schwester/i.test(r.relationLabel)) || siblingRel;
          edges.push({ personAId: idA, personBId: idB, fromId: specSib.fromPersonId, toId: specSib.toPersonId, label: specSib.relationLabel, kind: "SIBLING" });
        } else {
          const chosen = rels[0];
          edges.push({ personAId: idA, personBId: idB, fromId: chosen.fromPersonId, toId: chosen.toPersonId, label: chosen.relationLabel, kind: "EXTENDED" });
        }
      }
      return edges;
    }

    function shortTreeRelationName(rawLabel) {
      const l = (rawLabel || "").trim().toLowerCase();
      if (l.startsWith("mutter")) return "Mutter";
      if (l.startsWith("vater")) return "Vater";
      if (l.startsWith("elternteil") || l.startsWith("eltern")) return "Elternteil";
      if (l.startsWith("ehe-partner") || l.startsWith("ehepartner")) return "Ehe-Partner";
      if (l.startsWith("partner")) return "Partner";
      if (l.startsWith("bruder")) return "Bruder";
      if (l.startsWith("schwester")) return "Schwester";
      if (l.startsWith("geschwister")) return "Geschwister";
      if (l.startsWith("kind")) return "Kind";
      if (l.startsWith("oma") || l.startsWith("opa") || l.startsWith("großelter")) return "Oma/Opa";
      if (l.startsWith("enkel")) return "Enkelkind";
      if (l.startsWith("onkel") || l.startsWith("tante")) return "Onkel/Tante";
      if (l.startsWith("neffe") || l.startsWith("nichte")) return "Neffe/Nichte";
      if (l.startsWith("cousin")) return "Cousin/Cousine";
      return String(rawLabel || "").replace(/\s+von$/i, "").trim() || "Familie";
    }

    function renderFamilyTreeTab() {
      const visiblePersons = sortPersonsByLastName(state.persons.filter(p => !p.isHidden));
      if (visiblePersons.length === 0) {
        return `<div class="card"><div style="font-size:12.5px; color:var(--text-secondary);">Lege Kontakte und Beziehungen an, um den Stammbaum zu sehen.</div></div>`;
      }
      const rootPerson = visiblePersons.find(p => p.id === selectedTreeRootId) || visiblePersons[0];
      const personMap = new Map(visiblePersons.map(p => [p.id, p]));
      const allCanonicalEdges = extractCanonicalTreeEdges(new Set(personMap.keys()));

      // Priorisierte Breitensuche ab Fokus-Person
      const kindPrio = { PARENT_CHILD: 0, PARTNER: 1, SIBLING: 2, EXTENDED: 3 };
      const prioritizedEdges = [...allCanonicalEdges].sort((a, b) => (kindPrio[a.kind] ?? 9) - (kindPrio[b.kind] ?? 9));
      const genMap = new Map();
      const queue = [rootPerson.id];
      genMap.set(rootPerson.id, 0);

      while (queue.length > 0) {
        const currId = queue.shift();
        const currGen = genMap.get(currId) || 0;
        for (const edge of prioritizedEdges) {
          if (edge.fromId === currId && !genMap.has(edge.toId)) {
            const step = edge.kind === "PARENT_CHILD"
              ? (edge.parentId === currId ? 1 : -1)
              : (edge.kind === "PARTNER" || edge.kind === "SIBLING" ? 0 : relationGenerationStep(edge.label));
            genMap.set(edge.toId, currGen + step);
            queue.push(edge.toId);
          } else if (edge.toId === currId && !genMap.has(edge.fromId)) {
            const step = edge.kind === "PARENT_CHILD"
              ? (edge.parentId === currId ? 1 : -1)
              : (edge.kind === "PARTNER" || edge.kind === "SIBLING" ? 0 : -relationGenerationStep(edge.label));
            genMap.set(edge.fromId, currGen + step);
            queue.push(edge.fromId);
          }
        }
      }

      const treeEdges = allCanonicalEdges.filter(e => genMap.has(e.personAId) && genMap.has(e.personBId));

      function explicitPartners(idA, idB) {
        return treeEdges.some(e => e.kind === "PARTNER" && ((e.personAId === idA && e.personBId === idB) || (e.personAId === idB && e.personBId === idA)));
      }
      function explicitSiblings(idA, idB) {
        return treeEdges.some(e => e.kind === "SIBLING" && ((e.personAId === idA && e.personBId === idB) || (e.personAId === idB && e.personBId === idA)));
      }
      function directParentsOf(childId) {
        return treeEdges.filter(e => e.kind === "PARENT_CHILD" && e.childId === childId).map(e => e.parentId);
      }
      function directChildrenOf(parentId) {
        return treeEdges.filter(e => e.kind === "PARENT_CHILD" && e.parentId === parentId).map(e => e.childId);
      }

      function roleRelativeToRoot(p) {
        if (p.id === rootPerson.id) return "Fokus";
        const directPairRels = state.relations.filter(r =>
          (r.fromPersonId === p.id && r.toPersonId === rootPerson.id) ||
          (r.fromPersonId === rootPerson.id && r.toPersonId === p.id)
        );
        if (directPairRels.length > 0) {
          const outRel = directPairRels.find(r => r.fromPersonId === p.id && !/^elternteil/i.test(r.relationLabel) && !/^geschwister/i.test(r.relationLabel))
            || directPairRels.find(r => r.fromPersonId === p.id);
          if (outRel) return shortTreeRelationName(outRel.relationLabel);
          return shortTreeRelationName(inverseRelationLabel(directPairRels[0].relationLabel));
        }

        const rootParents = directParentsOf(rootPerson.id);
        const rootChildren = directChildrenOf(rootPerson.id);
        const rootPartners = treeEdges
          .filter(e => e.kind === "PARTNER" && (e.personAId === rootPerson.id || e.personBId === rootPerson.id))
          .map(e => e.personAId === rootPerson.id ? e.personBId : e.personAId);
        const rootSiblings = [
          ...new Set([
            ...treeEdges.filter(e => e.kind === "SIBLING" && (e.personAId === rootPerson.id || e.personBId === rootPerson.id))
              .map(e => e.personAId === rootPerson.id ? e.personBId : e.personAId),
            ...rootParents.flatMap(pid => directChildrenOf(pid)).filter(cid => cid !== rootPerson.id)
          ])
        ];

        if (rootPartners.some(rp => directParentsOf(rp).includes(p.id))) return "Schwiegereltern";
        if (rootParents.some(par => directParentsOf(par).includes(p.id))) return "Oma/Opa";
        if (rootParents.some(par => explicitSiblings(p.id, par) || directParentsOf(par).some(gp => directChildrenOf(gp).includes(p.id) && p.id !== par))) return "Onkel/Tante";
        if (rootParents.some(par => explicitPartners(p.id, par))) return "Partner v. Eltern";
        if (rootPartners.some(rp => explicitSiblings(p.id, rp)) || rootSiblings.some(rs => explicitPartners(p.id, rs))) return "Schwager/in";
        if (rootSiblings.some(rs => directChildrenOf(rs).includes(p.id))) return "Neffe/Nichte";
        if (rootChildren.some(rc => explicitPartners(p.id, rc))) return "Schwiegerkind";
        if (rootChildren.some(rc => directChildrenOf(rc).includes(p.id))) return "Enkelkind";
        return "Familie";
      }

      // 2D-Koordinaten-Layout berechnen (Eltern exakt über eigenen Kindern, Partner nebeneinander)
      const z = treeZoom;
      const nodeW = 142 * z;
      const nodeH = 92 * z;
      const partnerGap = 44 * z;
      const siblingGap = 24 * z;
      const groupGap = 42 * z;
      const levelStepY = 142 * z;
      const canvasPadX = 24 * z;
      const canvasPadY = 22 * z;

      const rawMembersByGen = new Map();
      for (const [pid, g] of genMap.entries()) {
        if (!rawMembersByGen.has(g)) rawMembersByGen.set(g, []);
        rawMembersByGen.get(g).push(personMap.get(pid));
      }

      const xCenter = new Map();

      function parentFootprintHalfWidth(personId) {
        const g = genMap.get(personId);
        const parentsUpper = directParentsOf(personId).filter(pid => genMap.get(pid) === g - 1);
        if (parentsUpper.length >= 2) return (2 * nodeW + partnerGap) / 2;
        if (parentsUpper.length === 1) {
          const p = parentsUpper[0];
          const hasPartner = (rawMembersByGen.get(g - 1) || []).some(m => m.id !== p && explicitPartners(p, m.id));
          return hasPartner ? (2 * nodeW + partnerGap) / 2 : nodeW / 2;
        }
        return nodeW / 2;
      }

      // A) Ebene 0 strukturieren
      const gen0Members = rawMembersByGen.get(0) || [];
      if (gen0Members.length > 0) {
        const placedGen0 = new Set();
        const orderedGen0 = [];
        const rootPartners = gen0Members.filter(m => m.id !== rootPerson.id && explicitPartners(rootPerson.id, m.id)).sort(comparePersonsByLastName);
        const rootSibs = gen0Members.filter(m =>
          m.id !== rootPerson.id && !explicitPartners(rootPerson.id, m.id) &&
          (explicitSiblings(rootPerson.id, m.id) || directParentsOf(rootPerson.id).some(pid => directParentsOf(m.id).includes(pid)))
        ).sort(comparePersonsByLastName);

        for (const sib of rootSibs) {
          const sibPartners = gen0Members.filter(m => m.id !== rootPerson.id && m.id !== sib.id && explicitPartners(sib.id, m.id) && !placedGen0.has(m.id));
          for (const sp of sibPartners) { placedGen0.add(sp.id); orderedGen0.push(sp); }
          if (!placedGen0.has(sib.id)) { placedGen0.add(sib.id); orderedGen0.push(sib); }
        }
        if (!placedGen0.has(rootPerson.id)) { placedGen0.add(rootPerson.id); orderedGen0.push(rootPerson); }
        for (const rp of rootPartners) {
          if (!placedGen0.has(rp.id)) { placedGen0.add(rp.id); orderedGen0.push(rp); }
          const rpSibs = gen0Members.filter(m => !placedGen0.has(m.id) && (explicitSiblings(rp.id, m.id) || directParentsOf(rp.id).some(pid => directParentsOf(m.id).includes(pid)))).sort(comparePersonsByLastName);
          for (const rps of rpSibs) { placedGen0.add(rps.id); orderedGen0.push(rps); }
        }
        for (const rem of [...gen0Members].sort(comparePersonsByLastName)) {
          if (!placedGen0.has(rem.id)) { placedGen0.add(rem.id); orderedGen0.push(rem); }
          for (const rmp of gen0Members.filter(m => !placedGen0.has(m.id) && explicitPartners(rem.id, m.id))) {
            placedGen0.add(rmp.id); orderedGen0.push(rmp);
          }
        }

        let cursorX = 0;
        orderedGen0.forEach((p, idx) => {
          if (idx === 0) {
            xCenter.set(p.id, 0);
            cursorX = 0;
          } else {
            const prev = orderedGen0[idx - 1];
            const baseGap = explicitPartners(prev.id, p.id)
              ? partnerGap
              : ((explicitSiblings(prev.id, p.id) || directParentsOf(prev.id).some(pid => directParentsOf(p.id).includes(pid))) ? siblingGap : groupGap);
            const shareParent = directParentsOf(prev.id).some(pid => directParentsOf(p.id).includes(pid));
            const minDist = (!shareParent && directParentsOf(prev.id).length > 0 && directParentsOf(p.id).length > 0)
              ? Math.max(nodeW + baseGap, parentFootprintHalfWidth(prev.id) + parentFootprintHalfWidth(p.id) + groupGap)
              : (nodeW + baseGap);
            cursorX += minDist;
            xCenter.set(p.id, cursorX);
          }
        });
        const rootShift = xCenter.get(rootPerson.id) || 0;
        orderedGen0.forEach(p => xCenter.set(p.id, (xCenter.get(p.id) || 0) - rootShift));
        rawMembersByGen.set(0, orderedGen0);
      }

      function resolveUnitOverlaps(units, minGap) {
        if (units.length <= 1) return;
        for (let pass = 0; pass < 4; pass++) {
          for (let i = 0; i < units.length - 1; i++) {
            const leftU = units[i];
            const rightU = units[i + 1];
            const overlap = (leftU.centerX + leftU.halfW + minGap) - (rightU.centerX - rightU.halfW);
            if (overlap > 0.1) {
              if (leftU.hasVerticalAnchor && !rightU.hasVerticalAnchor) rightU.centerX += overlap;
              else if (!leftU.hasVerticalAnchor && rightU.hasVerticalAnchor) leftU.centerX -= overlap;
              else { leftU.centerX -= overlap / 2; rightU.centerX += overlap / 2; }
            }
          }
        }
      }

      // B) Aufwärts-Pass (Eltern strikt über ihren eigenen Kindern)
      const upperGens = [...rawMembersByGen.keys()].filter(g => g < 0).sort((a, b) => b - a);
      for (const g of upperGens) {
        const rowMembers = [...(rawMembersByGen.get(g) || [])].sort(comparePersonsByLastName);
        const used = new Set();
        const rawUnits = [];
        for (const m of rowMembers) {
          if (used.has(m.id)) continue;
          used.add(m.id);
          const partner = rowMembers.find(c => !used.has(c.id) && explicitPartners(m.id, c.id));
          if (partner) { used.add(partner.id); rawUnits.push([m, partner]); }
          else rawUnits.push([m]);
        }

        const unitAnchors = new Map();
        rawUnits.forEach((uMembers, idx) => {
          const childXs = [...new Set(uMembers.flatMap(pm => directChildrenOf(pm.id)))].filter(cid => xCenter.has(cid)).map(cid => xCenter.get(cid));
          if (childXs.length > 0) {
            unitAnchors.set(idx, { x: childXs.reduce((a, b) => a + b, 0) / childXs.length, anchored: true });
          } else {
            const jumpXs = treeEdges.filter(e => uMembers.some(um => e.personAId === um.id || e.personBId === um.id))
              .map(e => uMembers.some(um => um.id === e.personAId) ? e.personBId : e.personAId)
              .filter(tid => (genMap.get(tid) ?? g) > g && xCenter.has(tid))
              .map(tid => xCenter.get(tid));
            if (jumpXs.length > 0) {
              unitAnchors.set(idx, { x: jumpXs.reduce((a, b) => a + b, 0) / jumpXs.length, anchored: false });
            }
          }
        });

        rawUnits.forEach((uMembers, idx) => {
          if (!unitAnchors.has(idx)) {
            const sibUnitIdx = rawUnits.findIndex((otherM, oIdx) => oIdx !== idx && unitAnchors.has(oIdx) && uMembers.some(um => otherM.some(om => explicitSiblings(um.id, om.id))));
            if (sibUnitIdx >= 0) {
              const refX = unitAnchors.get(sibUnitIdx).x;
              unitAnchors.set(idx, { x: refX + (refX <= 0 ? -(nodeW + siblingGap) : (nodeW + siblingGap)), anchored: false });
            } else {
              unitAnchors.set(idx, { x: 0, anchored: false });
            }
          }
        });

        const positionedUnits = rawUnits.map((members, idx) => {
          const anc = unitAnchors.get(idx) || { x: 0, anchored: false };
          const w = members.length === 2 ? (2 * nodeW + partnerGap) : nodeW;
          return { members, centerX: anc.x, hasVerticalAnchor: anc.anchored, width: w, halfW: w / 2 };
        }).sort((a, b) => a.centerX - b.centerX);

        resolveUnitOverlaps(positionedUnits, groupGap);
        const finalOrder = [];
        for (const u of positionedUnits) {
          if (u.members.length === 2) {
            xCenter.set(u.members[0].id, u.centerX - (nodeW + partnerGap) / 2);
            xCenter.set(u.members[1].id, u.centerX + (nodeW + partnerGap) / 2);
            finalOrder.push(u.members[0], u.members[1]);
          } else {
            xCenter.set(u.members[0].id, u.centerX);
            finalOrder.push(u.members[0]);
          }
        }
        rawMembersByGen.set(g, finalOrder);
      }

      // C) Abwärts-Pass (Kinder strikt unter ihren eigenen Eltern)
      const lowerGens = [...rawMembersByGen.keys()].filter(g => g > 0).sort((a, b) => a - b);
      for (const g of lowerGens) {
        const rowMembers = [...(rawMembersByGen.get(g) || [])].sort((a, b) => {
          const pa = directParentsOf(a.id).filter(pid => genMap.get(pid) === g - 1).length;
          const pb = directParentsOf(b.id).filter(pid => genMap.get(pid) === g - 1).length;
          if (pb !== pa) return pb - pa;
          return comparePersonsByLastName(a, b);
        });
        const used = new Set();
        const childUnits = [];
        for (const m of rowMembers) {
          if (used.has(m.id)) continue;
          used.add(m.id);
          const mParents = directParentsOf(m.id).filter(pid => xCenter.has(pid)).sort((a, b) => a - b);
          const partner = rowMembers.find(c => !used.has(c.id) && explicitPartners(m.id, c.id));
          if (partner) {
            used.add(partner.id);
            const combined = [...new Set([...mParents, ...directParentsOf(partner.id).filter(pid => xCenter.has(pid))])].sort((a, b) => a - b);
            childUnits.push({ members: [m, partner], parentIds: combined });
          } else {
            childUnits.push({ members: [m], parentIds: mParents });
          }
        }

        const grouped = new Map();
        childUnits.forEach((cu, idx) => {
          const key = cu.parentIds.length > 0 ? `P:${cu.parentIds.join(",")}` : `OTHER:${idx}`;
          if (!grouped.has(key)) grouped.set(key, []);
          grouped.get(key).push(cu);
        });

        const positionedUnits = [];
        for (const groupList of grouped.values()) {
          const pIds = groupList[0].parentIds;
          let anchorX = 0;
          if (pIds.length > 0) {
            const pxs = pIds.map(pid => xCenter.get(pid)).filter(v => v !== undefined);
            anchorX = pxs.length > 0 ? pxs.reduce((a, b) => a + b, 0) / pxs.length : 0;
          } else {
            const sampleMembers = groupList.flatMap(x => x.members);
            const connXs = treeEdges.filter(e => sampleMembers.some(sm => e.personAId === sm.id || e.personBId === sm.id))
              .map(e => sampleMembers.some(sm => sm.id === e.personAId) ? e.personBId : e.personAId)
              .filter(tid => xCenter.has(tid)).map(tid => xCenter.get(tid));
            anchorX = connXs.length > 0 ? connXs.reduce((a, b) => a + b, 0) / connXs.length : 0;
          }

          const widths = groupList.map(cu => cu.members.length === 2 ? (2 * nodeW + partnerGap) : nodeW);
          const totalW = widths.reduce((a, b) => a + b, 0) + siblingGap * Math.max(0, groupList.length - 1);
          let curLeft = anchorX - totalW / 2;
          groupList.forEach((cu, i) => {
            const w = widths[i];
            positionedUnits.push({ members: cu.members, centerX: curLeft + w / 2, hasVerticalAnchor: cu.parentIds.length > 0, width: w, halfW: w / 2 });
            curLeft += w + siblingGap;
          });
        }

        positionedUnits.sort((a, b) => a.centerX - b.centerX);
        resolveUnitOverlaps(positionedUnits, siblingGap);
        const finalOrder = [];
        for (const u of positionedUnits) {
          if (u.members.length === 2) {
            xCenter.set(u.members[0].id, u.centerX - (nodeW + partnerGap) / 2);
            xCenter.set(u.members[1].id, u.centerX + (nodeW + partnerGap) / 2);
            finalOrder.push(u.members[0], u.members[1]);
          } else {
            xCenter.set(u.members[0].id, u.centerX);
            finalOrder.push(u.members[0]);
          }
        }
        rawMembersByGen.set(g, finalOrder);
      }

      const sortedLevels = [...rawMembersByGen.keys()].sort((a, b) => a - b);
      let maxRowCount = 1;
      const rawNodes = [];
      sortedLevels.forEach((genLevel, rowIdx) => {
        const list = rawMembersByGen.get(genLevel) || [];
        if (list.length > maxRowCount) maxRowCount = list.length;
        const topY = canvasPadY + rowIdx * levelStepY;
        for (const p of list) {
          const cx = xCenter.get(p.id) || 0;
          rawNodes.push({
            person: p,
            genLevel,
            left: cx - nodeW / 2,
            top: topY,
            width: nodeW,
            height: nodeH,
            roleText: roleRelativeToRoot(p)
          });
        }
      });

      const minLeft = rawNodes.length > 0 ? Math.min(...rawNodes.map(n => n.left)) : 0;
      const shiftX = canvasPadX - minLeft;
      const positionedNodes = rawNodes.map(n => {
        const left = n.left + shiftX;
        return {
          ...n,
          left,
          right: left + n.width,
          bottom: n.top + n.height,
          centerX: left + n.width / 2,
          centerY: n.top + n.height / 2
        };
      });
      const nodeCoordsById = new Map(positionedNodes.map(n => [n.person.id, n]));
      const totalCanvasW = Math.max(260 * z, (positionedNodes.length > 0 ? Math.max(...positionedNodes.map(n => n.right)) : nodeW) + canvasPadX);
      const totalCanvasH = Math.max(155 * z, (positionedNodes.length > 0 ? Math.max(...positionedNodes.map(n => n.bottom)) : nodeH) + canvasPadY);

      // SVG-Pfade für direkte Beziehungslinien generieren
      const strokeMain = Math.max(1.5, +(2.5 * z).toFixed(1));
      const strokeSubtle = Math.max(1.3, +(2.0 * z).toFixed(1));
      const dotR = Math.max(2.2, +(3.3 * z).toFixed(1));
      const dashSpec = `${Math.max(4, Math.round(7 * z))} ${Math.max(3, Math.round(5 * z))}`;
      const svgParts = [];
      const badgeParts = [];

      function buildRoundedDropPath(sx, sy, ex, ey, my) {
        if (Math.abs(sx - ex) < 1.5) return `M ${sx.toFixed(1)} ${sy.toFixed(1)} L ${ex.toFixed(1)} ${ey.toFixed(1)}`;
        const maxR = Math.min(Math.abs(ex - sx) / 2, Math.abs(my - sy) / 2, Math.abs(ey - my) / 2, Math.max(4, 10 * z));
        const dirX = ex > sx ? 1 : -1;
        const dirY1 = my >= sy ? 1 : -1;
        const dirY2 = ey >= my ? 1 : -1;
        return [
          `M ${sx.toFixed(1)} ${sy.toFixed(1)}`,
          `L ${sx.toFixed(1)} ${(my - dirY1 * maxR).toFixed(1)}`,
          `Q ${sx.toFixed(1)} ${my.toFixed(1)} ${(sx + dirX * maxR).toFixed(1)} ${my.toFixed(1)}`,
          `L ${(ex - dirX * maxR).toFixed(1)} ${my.toFixed(1)}`,
          `Q ${ex.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${(my + dirY2 * maxR).toFixed(1)}`,
          `L ${ex.toFixed(1)} ${ey.toFixed(1)}`
        ].join(" ");
      }

      // 1. Partner-Linien
      for (const edge of treeEdges.filter(e => e.kind === "PARTNER")) {
        const nA = nodeCoordsById.get(edge.personAId);
        const nB = nodeCoordsById.get(edge.personBId);
        if (!nA || !nB) continue;
        const leftN = nA.centerX <= nB.centerX ? nA : nB;
        const rightN = leftN.person.id === nA.person.id ? nB : nA;
        const betweenExists = leftN.genLevel === rightN.genLevel && positionedNodes.some(n =>
          n.genLevel === leftN.genLevel && n.person.id !== leftN.person.id && n.person.id !== rightN.person.id &&
          n.centerX > leftN.centerX && n.centerX < rightN.centerX
        );
        let bx, by;
        if (leftN.genLevel === rightN.genLevel && !betweenExists) {
          svgParts.push(`<line x1="${leftN.right.toFixed(1)}" y1="${leftN.centerY.toFixed(1)}" x2="${rightN.left.toFixed(1)}" y2="${rightN.centerY.toFixed(1)}" stroke="var(--partner-rose)" stroke-width="${strokeMain}" stroke-linecap="round" />`);
          svgParts.push(`<circle cx="${leftN.right.toFixed(1)}" cy="${leftN.centerY.toFixed(1)}" r="${dotR}" fill="var(--partner-rose)" />`);
          svgParts.push(`<circle cx="${rightN.left.toFixed(1)}" cy="${rightN.centerY.toFixed(1)}" r="${dotR}" fill="var(--partner-rose)" />`);
          bx = (leftN.right + rightN.left) / 2;
          by = leftN.centerY;
        } else {
          const archY = Math.max(leftN.bottom, rightN.bottom) + 14 * z;
          svgParts.push(`<path d="M ${leftN.centerX.toFixed(1)} ${leftN.bottom.toFixed(1)} L ${leftN.centerX.toFixed(1)} ${archY.toFixed(1)} L ${rightN.centerX.toFixed(1)} ${archY.toFixed(1)} L ${rightN.centerX.toFixed(1)} ${rightN.bottom.toFixed(1)}" fill="none" stroke="var(--partner-rose)" stroke-width="${strokeMain}" stroke-linecap="round" stroke-linejoin="round" />`);
          bx = (leftN.centerX + rightN.centerX) / 2;
          by = archY;
        }
        badgeParts.push({
          x: bx, y: by, fromId: edge.fromId, toId: edge.toId,
          text: treeEditConnectionsMode ? "✏️ ❤️" : "❤️",
          borderColor: "var(--partner-rose)", textColor: "var(--partner-rose)"
        });
      }

      // 2. Eltern -> Kind Linien (nur zu den tatsächlichen Kindern!)
      const childrenByParentSet = new Map();
      for (const n of positionedNodes) {
        const pIds = directParentsOf(n.person.id).filter(pid => nodeCoordsById.has(pid)).sort((a, b) => a - b);
        if (pIds.length === 0) continue;
        const key = pIds.join(",");
        if (!childrenByParentSet.has(key)) childrenByParentSet.set(key, []);
        childrenByParentSet.get(key).push(n);
      }

      let groupIdx = 0;
      for (const [pKey, cNodesRaw] of childrenByParentSet.entries()) {
        const cNodes = [...cNodesRaw].sort((a, b) => a.centerX - b.centerX);
        const pNodes = pKey.split(",").map(id => nodeCoordsById.get(Number(id))).filter(Boolean).sort((a, b) => a.centerX - b.centerX);
        if (pNodes.length === 0 || cNodes.length === 0) continue;
        const laneShift = ((groupIdx % 3) - 1) * (5 * z);
        groupIdx++;

        if (pNodes.length === 2 && pNodes[0].genLevel === pNodes[1].genLevel) {
          const [pLeft, pRight] = pNodes;
          const areAdjPartners = explicitPartners(pLeft.person.id, pRight.person.id) &&
            !positionedNodes.some(n => n.genLevel === pLeft.genLevel && n.person.id !== pLeft.person.id && n.person.id !== pRight.person.id && n.centerX > pLeft.centerX && n.centerX < pRight.centerX);
          let originX, originY;
          if (areAdjPartners) {
            originX = (pLeft.right + pRight.left) / 2;
            originY = pLeft.centerY;
            svgParts.push(`<circle cx="${originX.toFixed(1)}" cy="${originY.toFixed(1)}" r="${dotR}" fill="var(--accent-steel)" />`);
          } else {
            originX = (pLeft.centerX + pRight.centerX) / 2;
            originY = pLeft.bottom + 11 * z;
            for (const pn of [pLeft, pRight]) {
              svgParts.push(`<path d="M ${pn.centerX.toFixed(1)} ${pn.bottom.toFixed(1)} L ${pn.centerX.toFixed(1)} ${originY.toFixed(1)} L ${originX.toFixed(1)} ${originY.toFixed(1)}" fill="none" stroke="var(--accent-steel)" stroke-width="${strokeSubtle}" stroke-linecap="round" />`);
              svgParts.push(`<circle cx="${pn.centerX.toFixed(1)}" cy="${pn.bottom.toFixed(1)}" r="${dotR}" fill="var(--accent-steel)" />`);
            }
          }
          const minTop = Math.min(...cNodes.map(c => c.top));
          const channelY = Math.min(Math.max((pLeft.bottom + minTop) / 2 + laneShift, pLeft.bottom + 10 * z), Math.max(pLeft.bottom + 10 * z, minTop - 10 * z));
          for (const cn of cNodes) {
            svgParts.push(`<path d="${buildRoundedDropPath(originX, originY, cn.centerX, cn.top, channelY)}" fill="none" stroke="var(--accent-steel)" stroke-width="${strokeMain}" stroke-linecap="round" stroke-linejoin="round" />`);
            svgParts.push(`<circle cx="${cn.centerX.toFixed(1)}" cy="${cn.top.toFixed(1)}" r="${dotR}" fill="var(--accent-steel)" />`);
          }
        } else {
          for (const pn of pNodes) {
            const minTop = Math.min(...cNodes.map(c => c.top));
            const channelY = Math.min(Math.max((pn.bottom + minTop) / 2 + laneShift, pn.bottom + 8 * z), Math.max(pn.bottom + 8 * z, minTop - 8 * z));
            svgParts.push(`<circle cx="${pn.centerX.toFixed(1)}" cy="${pn.bottom.toFixed(1)}" r="${dotR}" fill="var(--accent-steel)" />`);
            for (const cn of cNodes) {
              svgParts.push(`<path d="${buildRoundedDropPath(pn.centerX, pn.bottom, cn.centerX, cn.top, channelY)}" fill="none" stroke="var(--accent-steel)" stroke-width="${strokeMain}" stroke-linecap="round" stroke-linejoin="round" />`);
              svgParts.push(`<circle cx="${cn.centerX.toFixed(1)}" cy="${cn.top.toFixed(1)}" r="${dotR}" fill="var(--accent-steel)" />`);
            }
          }
        }
      }

      if (treeEditConnectionsMode) {
        for (const edge of treeEdges.filter(e => e.kind === "PARENT_CHILD")) {
          const pNode = nodeCoordsById.get(edge.parentId);
          const cNode = nodeCoordsById.get(edge.childId);
          if (!pNode || !cNode) continue;
          const others = directParentsOf(cNode.person.id).filter(pid => pid !== pNode.person.id);
          let xOff = 0;
          if (others.length > 0 && nodeCoordsById.has(others[0])) {
            xOff = pNode.centerX < nodeCoordsById.get(others[0]).centerX ? (-14 * z) : (14 * z);
          }
          badgeParts.push({
            x: cNode.centerX + xOff, y: cNode.top - 14 * z,
            fromId: edge.fromId, toId: edge.toId,
            text: `✏️ ${shortTreeRelationName(edge.label)}`,
            borderColor: "var(--accent-steel)", textColor: "var(--accent-steel)"
          });
        }
      }

      // 3. Geschwister-Linien
      for (const edge of treeEdges.filter(e => e.kind === "SIBLING")) {
        const sharedParent = directParentsOf(edge.personAId).some(pid => directParentsOf(edge.personBId).includes(pid));
        if (sharedParent && !treeEditConnectionsMode) continue;
        const nA = nodeCoordsById.get(edge.personAId);
        const nB = nodeCoordsById.get(edge.personBId);
        if (!nA || !nB) continue;
        const leftN = nA.centerX <= nB.centerX ? nA : nB;
        const rightN = leftN.person.id === nA.person.id ? nB : nA;
        const betweenExists = leftN.genLevel === rightN.genLevel && positionedNodes.some(n =>
          n.genLevel === leftN.genLevel && n.person.id !== leftN.person.id && n.person.id !== rightN.person.id &&
          n.centerX > leftN.centerX && n.centerX < rightN.centerX
        );
        let bx, by;
        if (leftN.genLevel === rightN.genLevel && !betweenExists) {
          const ly = leftN.centerY - 14 * z;
          svgParts.push(`<line x1="${leftN.right.toFixed(1)}" y1="${ly.toFixed(1)}" x2="${rightN.left.toFixed(1)}" y2="${ly.toFixed(1)}" stroke="var(--tree-green)" stroke-width="${strokeSubtle}" ${sharedParent ? `stroke-dasharray="${dashSpec}"` : ""} stroke-linecap="round" />`);
          bx = (leftN.right + rightN.left) / 2;
          by = ly;
        } else {
          const archY = Math.min(leftN.top, rightN.top) - 13 * z;
          svgParts.push(`<path d="M ${leftN.centerX.toFixed(1)} ${leftN.top.toFixed(1)} L ${leftN.centerX.toFixed(1)} ${archY.toFixed(1)} L ${rightN.centerX.toFixed(1)} ${archY.toFixed(1)} L ${rightN.centerX.toFixed(1)} ${rightN.top.toFixed(1)}" fill="none" stroke="var(--tree-green)" stroke-width="${strokeSubtle}" stroke-dasharray="${dashSpec}" stroke-linecap="round" stroke-linejoin="round" />`);
          bx = (leftN.centerX + rightN.centerX) / 2;
          by = archY;
        }
        badgeParts.push({
          x: bx, y: by, fromId: edge.fromId, toId: edge.toId,
          text: treeEditConnectionsMode ? "✏️ 🤝" : "🤝",
          borderColor: "var(--tree-green)", textColor: "var(--tree-green)"
        });
      }

      // 4. Weitere Familien-Verbindungen (Oma/Opa direkt, Onkel/Tante, Cousin/Cousine)
      const violetColor = "#8B5CF6";
      for (const edge of treeEdges.filter(e => e.kind === "EXTENDED")) {
        const nA = nodeCoordsById.get(edge.personAId);
        const nB = nodeCoordsById.get(edge.personBId);
        if (!nA || !nB) continue;
        const upper = nA.centerY <= nB.centerY ? nA : nB;
        const lower = upper.person.id === nA.person.id ? nB : nA;
        const sx = upper.genLevel === lower.genLevel ? (upper.centerX <= lower.centerX ? upper.right : upper.left) : upper.centerX;
        const sy = upper.genLevel === lower.genLevel ? upper.centerY : upper.bottom;
        const ex = upper.genLevel === lower.genLevel ? (upper.centerX <= lower.centerX ? lower.left : lower.right) : lower.centerX;
        const ey = upper.genLevel === lower.genLevel ? lower.centerY : lower.top;
        const my = (sy + ey) / 2;
        svgParts.push(`<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} C ${sx.toFixed(1)} ${my.toFixed(1)}, ${ex.toFixed(1)} ${my.toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="${violetColor}" stroke-width="${strokeSubtle}" stroke-dasharray="${dashSpec}" stroke-linecap="round" />`);
        badgeParts.push({
          x: (sx + ex) / 2, y: (sy + ey) / 2,
          fromId: edge.fromId, toId: edge.toId,
          text: treeEditConnectionsMode ? `✏️ ${shortTreeRelationName(edge.label)}` : shortTreeRelationName(edge.label),
          borderColor: violetColor, textColor: violetColor
        });
      }

      const avatarSize = Math.max(15, Math.round(24 * z));
      const nameFont = Math.max(7, +(11.5 * z).toFixed(1));
      const roleFont = Math.max(6, +(9.5 * z).toFixed(1));
      const subFont = Math.max(5.5, +(8.8 * z).toFixed(1));
      const badgeFont = Math.max(6.5, +(9.5 * z).toFixed(1));

      const cardsHtml = positionedNodes.map(node => {
        const m = node.person;
        const isRoot = m.id === rootPerson.id;
        const isPicked = treeFirstPickedPersonId === m.id;
        const role = node.roleText;
        const isPartnerRole = isPartnerRelation(role) || role === "Schwiegereltern" || role === "Schwager/in" || role === "Schwiegerkind";
        const accentColor = isPicked
          ? "var(--warn-amber)"
          : (isRoot ? "var(--accent-steel)" : (isPartnerRole ? "var(--partner-rose)" : ((role === "Mutter" || role === "Vater" || role === "Elternteil" || role === "Oma/Opa") ? "var(--accent-steel)" : "var(--tree-green)")));

        let birthText = "";
        const b = (m.birthdayIso || "").trim();
        if (b && !b.startsWith("WEEKLY:") && !b.startsWith("REPEAT:")) {
          if (b.startsWith("--") && b.length >= 7) birthText = `* ${b.slice(5, 7)}.${b.slice(2, 4)}.`;
          else if (b.length >= 10) birthText = `${b.slice(8, 10)}.${b.slice(5, 7)}.${b.slice(0, 4)}`;
        }

        const focusPinHtml = (!isRoot && !treeEditConnectionsMode && z >= 0.65)
          ? `<span class="tree-focus-pin" style="width:${Math.max(14, Math.round(18 * z))}px; height:${Math.max(14, Math.round(18 * z))}px; font-size:${Math.max(7, +(8.5 * z).toFixed(1))}px;" title="Als Fokus im Stammbaum zentrieren" onclick="event.stopPropagation(); selectedTreeRootId=${m.id}; treePanX=0; treePanY=0; renderPhoneApp();">🎯</span>`
          : "";

        return `
          <div class="tree-node ${isRoot ? 'root' : ''} ${isPartnerRelation(role) ? 'partner' : ''} ${isPicked ? 'picked-first' : ''}"
               style="left:${node.left.toFixed(1)}px; top:${node.top.toFixed(1)}px; width:${node.width.toFixed(1)}px; height:${node.height.toFixed(1)}px; border-radius:${Math.max(6, Math.round(12 * z))}px; padding:${Math.max(3, Math.round(5 * z))}px ${Math.max(4, Math.round(7 * z))}px;"
               onclick="handleTreeNodeClick(${m.id}, event)">
            <div style="position:absolute; top:0; left:0; right:0; height:${Math.max(2, Math.round(3.2 * z))}px; background:${accentColor};"></div>
            ${focusPinHtml}
            <div style="margin-bottom:${Math.max(1, Math.round(2 * z))}px;">${renderPersonAvatarHtml(m.name, m.photoBase64, avatarSize)}</div>
            <div style="font-size:${nameFont}px; font-weight:700; color:var(--text-primary); line-height:1.15; max-width:100%; overflow-wrap:anywhere;">${escapeHtml(m.name)}</div>
            ${(birthText && z >= 0.6) ? `<div style="font-size:${subFont}px; color:var(--text-muted); line-height:1.1; margin-top:1px; white-space:nowrap;">${escapeHtml(birthText)}</div>` : ""}
            <div style="margin-top:${Math.max(1, Math.round(2 * z))}px; background:rgba(59,130,196,0.11); border-radius:${Math.max(4, Math.round(6 * z))}px; padding:1px ${Math.max(4, Math.round(6 * z))}px; font-size:${roleFont}px; font-weight:700; color:${accentColor}; white-space:nowrap;">
              ${escapeHtml(isRoot ? "⭐ Fokus" : role)}
            </div>
          </div>
        `;
      }).join("");

      const badgesHtml = badgeParts.map(b => `
        <div class="tree-edge-badge"
             style="left:${b.x.toFixed(1)}px; top:${b.y.toFixed(1)}px; border:1.2px solid ${b.borderColor}; color:${b.textColor}; font-size:${badgeFont}px;"
             title="Verbindung bearbeiten oder trennen"
             onclick="event.stopPropagation(); openTreeConnectionModal(${b.fromId}, ${b.toId});">
          ${escapeHtml(b.text)}
        </div>
      `).join("");

      const focusDropdownHtml = renderContactSearchDropdownHtml({
        key: "tab_family_tree_focus",
        persons: visiblePersons,
        selectedPersonId: rootPerson.id,
        placeholder: "🌳 Fokus-Kontakt (Nachname) wählen...",
        onSelectPersonJs: (pid) => `selectedTreeRootId=${pid}; treePanX=0; treePanY=0; renderPhoneApp()`,
        showInlineAlphabet: true,
        inModal: false
      });

      const unconnected = visiblePersons.filter(p => !genMap.has(p.id));
      const unconnectedHtml = unconnected.length > 0 ? `
        <div class="card" style="padding:9px 10px; display:flex; flex-direction:column; gap:6px; border-radius:12px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="font-size:12px; font-weight:700; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
              Nicht verknüpft (${unconnected.length})
            </span>
            ${infoHintBtn("tree_unconnected", "Nicht verknüpfte Kontakte", `Tippe auf einen Kontakt, um ihn direkt mit ${rootPerson.name} im Stammbaum zu verknüpfen.`)}
          </div>
          ${renderContactSearchDropdownHtml({
            key: "tab_family_tree_unconnected",
            persons: unconnected,
            selectedPersonId: null,
            placeholder: `🔗 Verknüpfen (${unconnected.length})...`,
            onSelectPersonJs: (pid) => `openTreeConnectionModal(${pid}, ${rootPerson.id})`,
            showInlineAlphabet: true,
            inModal: false
          })}
          <div style="display:flex; flex-wrap:nowrap; overflow-x:auto; gap:5px; padding-bottom:2px;">
            ${unconnected.map(up => `
              <button class="compact-btn" style="padding:4px 9px; font-size:11px; color:var(--accent-steel); flex-shrink:0;" onclick="openTreeConnectionModal(${up.id}, ${rootPerson.id})">
                + ${escapeHtml(formatLastNameFirst(up.name))}
              </button>
            `).join("")}
          </div>
        </div>
      ` : "";

      const zoomPct = Math.round(treeZoom * 100);
      const defaultOtherId = (visiblePersons.find(p => p.id !== rootPerson.id) || {}).id || 0;
      const pickedFirstObj = treeFirstPickedPersonId ? personMap.get(treeFirstPickedPersonId) : null;

      return `
        <div class="card" style="padding:9px 11px; display:flex; flex-direction:column; gap:7px; border-radius:14px; background:linear-gradient(180deg, rgba(59,130,196,0.08) 0%, var(--card-slate) 100%);">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="section-icon-badge" style="border-color:var(--tree-green); background:rgba(21,128,61,0.14);">🌳</span>
            <div style="min-width:0; flex:1;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:14px; font-weight:700; color:var(--text-primary); white-space:nowrap;">Familien-Stammbaum</span>
                ${infoHintBtn("tree_legend", "Stammbaum & Linien", "Linien-Farben:\n• Blau (━━): Eltern ↔ Kind\n• Rosa (━❤️━): Partner / Ehe\n• Grün (━🤝━): Geschwister\n• Violett (╌╌): Weitere Familie\n\nBedienung: Ziehen & Zoomen per Maus/Touch. Über „✏️ Linien“ Verbindungen antippen oder 2 Personen wählen.")}
              </div>
              <div style="font-size:10.5px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${positionedNodes.length} Pers. · ${sortedLevels.length} Ebenen · ${treeEdges.length} Linien
              </div>
            </div>
          </div>

          ${focusDropdownHtml}

          <div style="display:flex; gap:5px; align-items:center; overflow-x:auto; white-space:nowrap;">
            <button class="compact-btn ${treeEditConnectionsMode ? 'primary' : ''}" style="font-weight:700; padding:5px 9px;" onclick="toggleTreeEditConnectionsMode()">
              ${treeEditConnectionsMode ? '✓ Linien' : '✏️ Linien'}
            </button>
            ${defaultOtherId > 0 ? `
              <button class="compact-btn" style="padding:5px 9px; font-weight:600;" onclick="openTreeConnectionModal(${rootPerson.id}, ${defaultOtherId})">
                + Neu
              </button>
            ` : ""}
            ${treeEdges.length > 0 ? `
              <button class="compact-btn" style="padding:5px 9px; font-weight:600;" onclick="showAllTreeEdgesModal=true; renderModals();">
                📋 (${treeEdges.length})
              </button>
            ` : ""}
            <button class="compact-btn" style="padding:4px 8px; font-weight:700;" onclick="zoomTreeBy(-0.15)">➖</button>
            <button class="compact-btn ${zoomPct === 100 && treePanX === 0 && treePanY === 0 ? 'primary' : ''}" style="padding:4px 8px; font-size:11px;" onclick="resetTreeZoom()">${zoomPct}%</button>
            <button class="compact-btn" style="padding:4px 8px; font-weight:700;" onclick="zoomTreeBy(0.15)">➕</button>
            <button class="compact-btn" style="padding:4px 8px; font-size:11px;" onclick="fitTreeZoom(${maxRowCount}, ${sortedLevels.length})">⛶</button>
          </div>
        </div>

        ${treeEditConnectionsMode ? `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; background:rgba(59,130,196,0.14); border:1px solid var(--accent-steel); border-radius:8px; padding:6px 10px; font-size:11.5px; color:var(--text-primary); white-space:nowrap; overflow:hidden;">
            <span style="overflow:hidden; text-overflow:ellipsis;">${pickedFirstObj ? `1.: <b>${escapeHtml(pickedFirstObj.name)}</b> → 2. Person wählen` : '✏️ Linie oder 2 Personen nacheinander antippen'}</span>
            ${pickedFirstObj ? `<button class="compact-btn" style="padding:3px 7px;" onclick="treeFirstPickedPersonId=null; renderPhoneApp();">✕</button>` : ""}
          </div>
        ` : ""}

        <div class="tree-container ${treeEditConnectionsMode ? 'edit-active' : ''}"
             style="min-height:250px; overflow:hidden; cursor:grab; user-select:none;"
             onmousedown="handleTreeMouseDown(event)"
             onmousemove="handleTreeMouseMove(event)"
             onmouseup="handleTreeMouseUp()"
             onmouseleave="handleTreeMouseUp()"
             onwheel="handleTreeWheel(event)"
             ontouchstart="handleTreeTouchStart(event)"
             ontouchmove="handleTreeTouchMove(event)"
             ontouchend="handleTreeTouchEnd()">
          <div id="tree-pan-inner" style="position:relative; width:${totalCanvasW.toFixed(1)}px; height:${totalCanvasH.toFixed(1)}px; flex-shrink:0; transform:translate(${treePanX}px, ${treePanY}px);">
            <svg width="${totalCanvasW.toFixed(1)}" height="${totalCanvasH.toFixed(1)}" style="position:absolute; left:0; top:0; pointer-events:none; overflow:visible;">
              ${svgParts.join("")}
            </svg>
            ${cardsHtml}
            ${badgesHtml}
          </div>
        </div>
        ${unconnectedHtml}
      `;
    }

    function renderDirectChatTab() {
      if (state.directMessages.length === 0) {
        return `<div class="card"><div style="font-size:12px; color:var(--text-secondary);">Noch keine Nachrichten vorhanden.</div></div>`;
      }
      return state.directMessages.map(m => {
        const person = state.persons.find(p => p.id === m.personId);
        return `
          <div class="card">
            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted);">
              <span>${escapeHtml(person ? person.name : m.senderDisplayName)} (${escapeHtml(m.targetPeerId)})</span>
              <span>${escapeHtml(m.timestampIso)}</span>
            </div>
            <div style="font-size:13px; margin-top:4px;"><b>${escapeHtml(m.senderDisplayName)}:</b> ${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join("");
    }

    function formatTimerUnitDe(unit) {
      switch ((unit || "").toUpperCase()) {
        case "DAYS": return "Tage";
        case "WEEKS": return "Wochen";
        case "MONTHS": return "Monate";
        case "YEARS": return "Jahre";
        default: return unit || "Tage";
      }
    }

    let timerEntryModalState = null; // { isEditing, personId, createNewContact, newName, newPhone, interval, unit, startDate, notes }

    function openTimerEntryModal(personId = null) {
      const visible = sortPersonsByLastName(state.persons.filter(p => !p.isHidden));
      const target = personId ? visible.find(p => p.id === personId) : visible[0];
      timerEntryModalState = {
        isEditing: !!personId && !!target,
        personId: target ? target.id : -1,
        createNewContact: !personId && visible.length === 0,
        newFirstName: "",
        newLastName: "",
        newPhone: "",
        interval: String((target && target.timerInterval > 0) ? target.timerInterval : 14),
        unit: (target && target.timerUnit) ? target.timerUnit : "DAYS",
        startDate: formatIsoToDdMmYyyy((target && target.lastContactedIso) ? target.lastContactedIso : todayIso()),
        notes: (target && target.notes) ? target.notes : ""
      };
      renderModals();
    }

    function selectContactForTimerModal(personId) {
      if (!timerEntryModalState) return;
      const p = state.persons.find(x => x.id === personId);
      if (!p) return;
      timerEntryModalState.personId = p.id;
      timerEntryModalState.interval = String(p.timerInterval > 0 ? p.timerInterval : 14);
      timerEntryModalState.unit = p.timerUnit || "DAYS";
      timerEntryModalState.startDate = formatIsoToDdMmYyyy(p.lastContactedIso || todayIso());
      timerEntryModalState.notes = p.notes || "";
      renderModals();
    }

    function saveTimerEntryModal() {
      if (!timerEntryModalState) return;
      const t = timerEntryModalState;
      const cleanInterval = Math.max(1, parseInt(t.interval, 10) || 14);
      const cleanUnit = t.unit || "DAYS";
      const cleanStartIso = normalizeDateInputToIso(t.startDate) || todayIso();

      if (t.createNewContact) {
        const cleanName = combineFirstAndLastName(t.newFirstName || "", t.newLastName || "");
        if (!cleanName) return;
        const newId = state.nextId++;
        state.persons.push({
          id: newId,
          name: cleanName,
          birthdayIso: "",
          hasNoOwnPhone: false,
          phone: (t.newPhone || "").trim(),
          email: "",
          appPeerId: "",
          notes: (t.notes || "").trim(),
          photoBase64: makeIllustratedPortraitDataUrl(cleanName),
          timerEnabled: true,
          timerInterval: cleanInterval,
          timerUnit: cleanUnit,
          lastContactedIso: cleanStartIso
        });
        addLog(`⏳ Neuer Kontakt "${cleanName}" mit Melde-Timer (alle ${cleanInterval} ${formatTimerUnitDe(cleanUnit)}) angelegt.`);
      } else {
        const person = state.persons.find(p => p.id === t.personId);
        if (!person) return;
        person.timerEnabled = true;
        person.timerInterval = cleanInterval;
        person.timerUnit = cleanUnit;
        person.lastContactedIso = cleanStartIso;
        if ((t.notes || "").trim()) {
          person.notes = t.notes.trim();
        }
        addLog(`⏳ Melde-Timer für "${person.name}" gespeichert (alle ${cleanInterval} ${formatTimerUnitDe(cleanUnit)}).`);
      }
      timerEntryModalState = null;
      saveState();
    }

    function disableTimerForPerson(personId) {
      const person = state.persons.find(p => p.id === personId);
      if (!person) return;
      askDeleteConfirm(`Melde-Timer für „${formatLastNameFirst(person.name)}“ deaktivieren?`, () => {
        person.timerEnabled = false;
        timerEntryModalState = null;
        addLog(`⏳ Melde-Timer für "${person.name}" deaktiviert.`);
        saveState();
      });
    }

    function renderTimerTab() {
      const today = todayIso();
      const allTimerPersons = sortPersonsByLastName(state.persons.filter(p => !p.isHidden && p.timerEnabled));

    function renderEventsTab() {
      const today = todayIso();
      const visiblePersons = sortPersonsByLastName(state.persons.filter(p => !p.isHidden));

      state.specialEvents.forEach(ev => {
        const person = visiblePersons.find(p => p.id === ev.personId);

        if (!matchesPersonSearchAndLetter(person, tabSearchQuery, tabSelectedLetter) &&
            !ev.title.toLowerCase().includes((tabSearchQuery || "").trim().toLowerCase())) {
          return;

        const days = daysUntilEventSpec(ev.dateIso, today);
        const isWeekly = isWeeklyDateSpec(ev.dateIso) || isRepeatDateSpec(ev.dateIso);
        rows.push({
          days,
          person,
          personId: ev.personId,
          personName: person.name,
          title: `${isWeekly ? "🔁 " : "🔔 "}${ev.title} (${formatLastNameFirst(person.name)})`,
          sub: `${formatIsoToDdMmYyyy(ev.dateIso)}`,
          badge: days === 0 ? "Heute!" : `in ${days}T`

      });
      visiblePersons.forEach(p => {
        if (p.birthdayIso && matchesPersonSearchAndLetter(p, tabSearchQuery, tabSelectedLetter)) {
          const days = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
          const congrats = days === 0 ? getOngoingBirthdayCongrats(p, today) : null;
          rows.push({
            days: days ?? 999,
            person: p,
            personId: p.id,
            personName: p.name,
            isBirthday: true,
            isCongratulatedToday: Boolean(congrats),
            title: `🎂 ${formatLastNameFirst(p.name)}`,
            sub: `${formatIsoToDdMmYyyy(p.birthdayIso)} (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})${congrats ? ` • ✅ ${congrats.channel}` : ""}`,
            badge: days === 0 ? (congrats ? "✅ Gratuliert" : "🎉 Heute!") : `in ${days}T`

          <div style="cursor:pointer;" onclick="openDetailModal(${r.personId})">
            ${renderPersonAvatarHtml(r.personName)}
          </div>

              <span class="person-name-link" style="font-size:14px;">${escapeHtml(r.title)}</span>

            </div>
            <div class="person-sub">${escapeHtml(r.sub)}</div>
          </div>

      "♻️ Schrottwichteln",

      "🛠️ Selbstgemachtes",
      "🎲 Würfel-/Räuberwichteln"

    function getCouplePartnerForPerson(personId) {
      if (!personId) return null;
      const directRel = state.relations.find(r =>
        (r.fromPersonId === personId || r.toPersonId === personId) &&
        isPartnerRelation(r.relationLabel)
      );
      if (directRel) {
        const partnerId = directRel.fromPersonId === personId ? directRel.toPersonId : directRel.fromPersonId;
        return state.persons.find(p => p.id === partnerId) || null;
      }
      // Auch gemeinsame Kinder (Co-Parents im Stammbaum) prüfen
      const childrenIds = state.relations
        .filter(r => r.toPersonId === personId && relationGenerationStep(r.relationLabel) === -1)
        .map(r => r.fromPersonId);
      for (const cid of childrenIds) {
        const otherParentRel = state.relations.find(r =>
          r.fromPersonId === cid && r.toPersonId !== personId && relationGenerationStep(r.relationLabel) === -1
        );
        if (otherParentRel) {
          return state.persons.find(p => p.id === otherParentRel.toPersonId) || null;
        }
      }
      return null;
    }

    function extractAddressFromPerson(person) {
      if (!person || !Array.isArray(person.extraInfos)) return "";
      const addrRow = person.extraInfos.find(x => (x.label || "").toLowerCase().includes("adresse") || (x.label || "").toLowerCase().includes("anschrift"));
      return addrRow ? (addrRow.value || "") : "";
    }

    function ensureWichtelGroups() {
      if (!Array.isArray(state.wichtelGroups)) {
        state.wichtelGroups = [];
      }
      if (!Array.isArray(state.wichtelHistory)) {
        state.wichtelHistory = [];
      }
      if (state.wichtelGroups.length === 0 && state.persons.length > 0) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 5);
        state.wichtelGroups.push({
          id: state.nextId++,
          groupName: `Familien-Wichteln ${xmasYear}`,
          adminName: adultPersons[1] ? adultPersons[1].name : (adultPersons[0] ? adultPersons[0].name : "Ich (Admin)"),
          motto: "🎁 Klassisches Wichteln",
          budget: "25 €",
          revealDateIso: `${xmasYear}-12-24`,
          reminderDaysBefore: 7,
          excludeCouples: true,
          excludeLastYear: true,
          forceRevealed: false,
          isDrawn: false,
          drawnAt: "",
          participants: adultPersons.map(p => ({
            id: state.nextId++,
            personId: p.id,
            name: p.name,
            phone: p.phone || "",
            appPeerId: p.appPeerId || "",
            wishText: p.notes || "Überraschung, Schokolade, Buch",
            noGos: "",
            address: extractAddressFromPerson(p),
            wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`,
            extraWishUrls: [],
            drawnTargetId: null,
            lastYearTargetId: null,
            notifiedVia: ""
          }))
        });
      }
      if (state.wichtelHistory.length === 0 && state.persons.length >= 2) {
        const today = todayIso();
        const xmasYear = parseInt(today.slice(0, 4), 10);
        const adultPersons = state.persons.filter(p => !p.isHidden && !p.name.toLowerCase().includes("baby")).slice(0, 4);
        if (adultPersons.length >= 2) {
          state.wichtelHistory.push({
            id: state.nextId++,
            year: xmasYear - 1,
            groupName: `Familien-Wichteln ${xmasYear - 1}`,
            adminName: adultPersons[0].name,
            motto: "🎁 Klassisches Wichteln",
            budget: "25 €",
            completedDateIso: `${xmasYear - 1}-12-24`,
            pairings: adultPersons.map((p, idx) => {
              const target = adultPersons[(idx + 1) % adultPersons.length];
              return {
                giverName: p.name,
                giverPersonId: p.id,
                giverPhone: p.phone || "",
                receiverName: target.name,
                receiverPersonId: target.id,
                wishText: p.notes || "",
                noGos: "",
                address: extractAddressFromPerson(p),
                wishlistUrl: `https://www.amazon.de/hz/wishlist/ls/${p.name.split(" ")[0].toUpperCase()}-WISH`
              };
            })
          });
        }
      }
      if (selectedWichtelGroupId === null || !state.wichtelGroups.some(g => g.id === selectedWichtelGroupId)) {
        selectedWichtelGroupId = state.wichtelGroups[0] ? state.wichtelGroups[0].id : null;
      }
    }

    function getHistoricalTargetsForParticipant(part) {
      if (!part || !Array.isArray(state.wichtelHistory)) return [];
      const results = [];
      const pNameLower = (part.name || "").trim().toLowerCase();
      for (const h of state.wichtelHistory) {
        for (const pair of (h.pairings || [])) {
          const sameId = part.personId && pair.giverPersonId && part.personId === pair.giverPersonId;
          const sameName = (pair.giverName || "").trim().toLowerCase() === pNameLower;
          if (sameId || sameName) {
            results.push({
              year: h.year || (h.completedDateIso ? h.completedDateIso.slice(0, 4) : ""),
              groupName: h.groupName,
              receiverName: pair.receiverName,
              receiverPersonId: pair.receiverPersonId
            });
          }
        }
      }
      return results;
    }

    function hasDrawnTargetInHistory(giverPart, receiverPart) {
      if (!giverPart || !receiverPart) return false;
      const pastList = getHistoricalTargetsForParticipant(giverPart);
      const rNameLower = (receiverPart.name || "").trim().toLowerCase();
      return pastList.some(item =>
        (receiverPart.personId && item.receiverPersonId && receiverPart.personId === item.receiverPersonId) ||
        (item.receiverName || "").trim().toLowerCase() === rNameLower
      );
    }

    function isWichtelGroupRevealed(group) {
      if (!group) return false;
      if (group.forceRevealed) return true;
      const today = todayIso();
      return !!(group.revealDateIso && today >= group.revealDateIso);
    }
