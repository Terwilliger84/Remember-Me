      --border-slate: #334155;

      --btn-hover: #475569;
      --primary-bg: #0284C7;
      --primary-hover: #2563EB;
      --root-node-bg: #1E3A5F;

    }

    /* 🎄 Festlich (Tanne & Gold Dunkel – identisch mit Android App & Widget) */
    body[data-theme="xmas"] {
      background-color: #091712;
      --bg-slate: #0F241D;
      --card-slate: #163329;
      --border-slate: #265444;
      --btn-bg: #20483A;
      --btn-hover: #295B49;
      --primary-bg: #15803D;
      --primary-hover: #0F766E;
      --root-node-bg: #3F1D24;
      --text-primary: #FEFCE8;
      --text-secondary: #D1FAE5;

      --accent-steel: #FBBF24;
      --warn-amber: #F87171;
      --warn-bg: #3B2314;
      --warn-text: #FDE68A;
      --danger: #EF4444;
      --success: #34D399;
      --partner-rose: #FB7185;
      --tree-green: #34D399;
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .testbench-header {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      box-shadow: var(--card-shadow);
    }

    .testbench-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .testbench-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .testbench-layout {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .testbench-layout {
        grid-template-columns: 1fr;
      }
    }

    .phone-frame {
      background: var(--bg-slate);
      border: 2px solid var(--border-slate);
      border-radius: 22px;
      padding: 14px;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 45px rgba(24, 43, 66, 0.2);
      position: relative;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .app-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
    }

    .compact-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-slate);
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      flex-shrink: 0;
    }

    .info-hint-btn {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1.2px solid var(--accent-steel);
      background: rgba(59, 130, 196, 0.15);
      color: var(--accent-steel);
      font-size: 11px;
      font-weight: 800;
      font-family: Georgia, serif;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      line-height: 1;
    }

    .info-hint-btn:hover {
      background: var(--accent-steel);
      color: #FFFFFF;
    }

    .compact-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-steel);
    }

    .compact-btn.primary {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
    }

    .compact-btn.primary:hover {
      background: var(--primary-hover);
    }

    .compact-btn.danger {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
    }

    /* Kompakte Icon-Navigation */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 12px;
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 5px;
      box-shadow: var(--card-shadow);
    }

    @media (max-width: 480px) {
      .nav-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 6px 3px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .nav-tab .nav-icon {
      font-size: 16px;
      line-height: 1.1;
    }

    .nav-tab:hover {
      background: var(--btn-bg);
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
      box-shadow: 0 2px 8px rgba(59, 130, 196, 0.28);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }

    .card {
      background: var(--card-slate);
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--card-shadow);
    }

    /* Runde Kontakt-Avatare & Countdown-Badges */
    .person-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
      letter-spacing: 0.5px;
      position: relative;
    }

    .countdown-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.1;
    }

    .countdown-pill.today {
      background: var(--primary-bg);
      color: #FFFFFF;
      border-color: var(--primary-bg);
    }

    .countdown-pill.soon {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-amber);
    }

    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .person-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .person-name-link {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
    }

    .person-name-link:hover {
      color: var(--accent-steel);
      text-decoration: underline;
    }

    .badge-app {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent-steel);
      background: var(--btn-bg);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-nophone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--warn-amber);
      background: var(--warn-bg);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .person-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .person-meta {
      font-size: 11px;
      margin-top: 4px;
    }

    .meta-muted { color: var(--text-muted); }
    .meta-accent { color: var(--accent-steel); }
    .meta-secondary { color: var(--text-secondary); }

    /* Stammbaum Styles (v1.0.41 Optik-Upgrade & Direkt-Linien) */
    .tree-container {
      background-color: var(--card-slate);
      background-image: radial-gradient(var(--border-slate) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      border: 1px solid var(--border-slate);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tree-container.edit-active {
      border: 1.5px solid var(--accent-steel);
      box-shadow: 0 0 0 2px rgba(59, 130, 196, 0.14);
    }

    .tree-node {
      background: linear-gradient(180deg, var(--bg-slate) 0%, var(--card-slate) 100%);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      box-sizing: border-box;
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
    }

    .tree-node:hover {
      transform: translateY(-1.5px);
      border-color: var(--accent-steel);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
      z-index: 5;
    }

    .tree-node.root {
      background: linear-gradient(180deg, var(--root-node-bg) 0%, var(--card-slate) 100%);
      border: 2px solid var(--accent-steel);
    }

    .tree-node.partner {
      border-color: var(--partner-rose);
    }

    .tree-node.picked-first {
      border: 2px solid var(--warn-amber) !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22);
    }

    .tree-edge-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      background: var(--card-slate);
      border-radius: 999px;
      padding: 2px 7px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 6;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.14);
      transition: transform 0.12s;
    }

    .tree-edge-badge:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .tree-focus-pin {
      position: absolute;
      top: 5px;
      right: 5px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1px solid var(--border-slate);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 4;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .widget-box {
      background: var(--bg-slate);
      border: 1.5px solid var(--border-slate);
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.32);
    }
    .widget-box.has-bday-today {
      border-color: #f59e0b;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35), 0 10px 25px rgba(0, 0, 0, 0.32);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }

    .widget-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .widget-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.1;
      font-size: 9.5px;
      color: var(--accent-steel);
      border: 1px solid var(--border-slate);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .widget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;

      const l = (label || "").trim().toLowerCase();
      if (l.startsWith("kind") || l.startsWith("sohn") || l.startsWith("tochter")) return "Elternteil von";
      if (l.startsWith("mutter") || l.startsWith("vater") || l.startsWith("elternteil") || l.startsWith("eltern")) return "Kind von";

      if (l.startsWith("bruder") || l.startsWith("schwester") || l.startsWith("geschwister")) return "Geschwister von";

      if (l.startsWith("cousin")) return "Cousin/Cousine von";

      if (l.startsWith("enkel")) return -2;
      if (l.startsWith("neffe") || l.startsWith("nichte")) return -1;

    function addBidirectionalRelation(fromId, toId, label) {
      if (!fromId || !toId || fromId === toId) return;
      const clean = label.trim();
      const existsFwd = state.relations.some(r => r.fromPersonId === fromId && r.toPersonId === toId && r.relationLabel.toLowerCase() === clean.toLowerCase());
      if (!existsFwd) {
        state.relations.push({ id: state.nextId++, fromPersonId: fromId, toPersonId: toId, relationLabel: clean, isFallbackContact: true });
      }
      const rev = inverseRelationLabel(clean);
      const existsRev = state.relations.some(r => r.fromPersonId === toId && r.toPersonId === fromId && r.relationLabel.toLowerCase() === rev.toLowerCase());
      if (!existsRev) {
        state.relations.push({
          id: state.nextId++,
          fromPersonId: toId,
          toPersonId: fromId,
          relationLabel: rev,
          isFallbackContact: isDirectParentLabel(clean) || isPartnerRelation(clean)
        });
      }
    }

    function deleteBidirectionalRelationPair(personAId, personBId, specificRel = null) {
      if (specificRel) {
        const inv = inverseRelationLabel(specificRel.relationLabel).toLowerCase();
        const fwdCount = state.relations.filter(r => r.fromPersonId === specificRel.fromPersonId && r.toPersonId === specificRel.toPersonId).length;
        state.relations = state.relations.filter(r => {
          if (r.id === specificRel.id) return false;
          if (r.fromPersonId === specificRel.fromPersonId && r.toPersonId === specificRel.toPersonId && r.relationLabel.toLowerCase() === specificRel.relationLabel.toLowerCase()) return false;
          if (r.fromPersonId === specificRel.toPersonId && r.toPersonId === specificRel.fromPersonId && (r.relationLabel.toLowerCase() === inv || fwdCount <= 1)) return false;
          return true;
        });
      } else {
        state.relations = state.relations.filter(r =>
          !((r.fromPersonId === personAId && r.toPersonId === personBId) || (r.fromPersonId === personBId && r.toPersonId === personAId))
        );
      }
    }

    function replaceBidirectionalRelation(oldAId, oldBId, newFromId, newToId, newLabel) {
      if (oldAId > 0 && oldBId > 0) {
        deleteBidirectionalRelationPair(oldAId, oldBId, null);
      }
      if (newFromId > 0 && newToId > 0 && newFromId !== newToId) {
        deleteBidirectionalRelationPair(newFromId, newToId, null);
        addBidirectionalRelation(newFromId, newToId, newLabel);
      }
    }

    const ContactResolver = {
      resolveTarget(person, relationsForPerson) {
        const ownPhone = (person.phone || "").trim();
        const ownEmail = (person.email || "").trim();
        const ownPeerId = (person.appPeerId || "").trim();

        if ((!person.hasNoOwnPhone && (ownPhone !== "" || ownEmail !== "")) || ownPeerId !== "") {
          const noPhoneButAppNotice = (person.hasNoOwnPhone && ownPhone === "" && ownPeerId !== "")
            ? `Hinweis: ${person.name} hat keine Handynummer, ist aber direkt per App-Code (${ownPeerId}) gekoppelt.`
            : null;
          return {
            targetPersonName: person.name,
            phone: ownPhone,
            email: ownEmail,
            appPeerId: ownPeerId,
            hasAppDirect: ownPeerId !== "",
            isRedirectedToRelative: false,
            relationDescription: null,
            warningNotice: noPhoneButAppNotice
          };
        }

        const fallbackPair = relationsForPerson.find(({ rel, target }) =>
          rel.isFallbackContact && ((target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim())
        ) || relationsForPerson.find(({ target }) =>
          (target.appPeerId || "").trim() || (target.phone || "").trim() || (target.email || "").trim()
        );

        if (fallbackPair) {
          const { rel, target: relative } = fallbackPair;
          return {
            targetPersonName: relative.name,
            phone: (relative.phone || "").trim(),
            email: (relative.email || "").trim(),
            appPeerId: "",
            hasAppDirect: false,
            isRedirectedToRelative: true,
            relationDescription: `${rel.relationLabel} ${relative.name}`,
            warningNotice: `Hinweis: ${person.name} hat keine eigene Nummer. Nachricht wird an ${relative.name} (${rel.relationLabel}) gerichtet.`
          };
        }

        return {
          targetPersonName: person.name,
          phone: "",
          email: ownEmail,
          appPeerId: "",
          hasAppDirect: false,
          isRedirectedToRelative: false,
          relationDescription: null,
          warningNotice: "Hinweis: Keine eigene Telefonnummer/E-Mail und kein erreichbarer verknüpfter Kontakt hinterlegt."
        };
      },

      daysUntilNextBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let nextBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (nextBday < today) nextBday = `${tYear + 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, nextBday);
        } catch (e) { return null; }
      },

      negativeDaysSinceLastBirthday(birthdayIso, today = todayIso()) {
        if (!birthdayIso || !birthdayIso.trim()) return null;
        try {
          const clean = birthdayIso.replace(/^--/, "");
          const parts = clean.split("-");
          const month = parts.length === 3 ? parseInt(parts[1], 10) : parseInt(parts[0], 10);
          const day = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(parts[1], 10);
          const tYear = parseInt(today.slice(0, 4), 10);
          const pad = n => String(n).padStart(2, "0");
          let lastBday = `${tYear}-${pad(month)}-${pad(day)}`;
          if (lastBday > today) lastBday = `${tYear - 1}-${pad(month)}-${pad(day)}`;
          return daysBetween(today, lastBday);
        } catch (e) { return null; }
      },

      formatPassedAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "hatte Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "hatte Geburtstag";
          const pad = n => String(n).padStart(2, "0");
          let lastYear = tParts[0];
          const thisYearBday = `${tParts[0]}-${pad(bParts[1])}-${pad(bParts[2])}`;
          if (thisYearBday > today) lastYear -= 1;
          const passedAge = Math.max(0, lastYear - bParts[0]);
          return `wurde ${passedAge}`;
        } catch (e) { return "hatte Geburtstag"; }
      },

      formatUpcomingAge(birthdayIso, today = todayIso()) {
        if (!birthdayIso || birthdayIso.startsWith("--")) return "Geburtstag";
        try {
          const bParts = birthdayIso.split("-").map(Number);
          const tParts = today.split("-").map(Number);
          if (bParts.length !== 3) return "Geburtstag";
          const totalMonths = (tParts[0] - bParts[0]) * 12 + (tParts[1] - bParts[1]);
          const thisYearBday = `${tParts[0]}-${String(bParts[1]).padStart(2, "0")}-${String(bParts[2]).padStart(2, "0")}`;
          const nextYearAge = tParts[0] - bParts[0] + (thisYearBday < today ? 1 : 0);
          if (totalMonths === 0 && nextYearAge === 0) return "Neugeboren (0 Mon.)";
          if (totalMonths >= 0 && totalMonths <= 23) return `${totalMonths} Mon. (wird ${Math.max(1, nextYearAge)})`;
          return `wird ${nextYearAge}`;
        } catch (e) { return "Geburtstag"; }
      },

      nextTimerDate(person, today = todayIso()) {
        if (!person.timerEnabled || person.timerInterval <= 0) return null;
        const base = person.lastContactedIso || today;
        const d = new Date(base + "T00:00:00");
        const interval = Number(person.timerInterval) || 14;
        switch (person.timerUnit) {
          case "WEEKS": d.setDate(d.getDate() + interval * 7); break;
          case "MONTHS": d.setMonth(d.getMonth() + interval); break;
          case "YEARS": d.setFullYear(d.getFullYear() + interval); break;
          default: d.setDate(d.getDate() + interval); break;
        }
        return d.toISOString().slice(0, 10);
      }
    };

    function makeIllustratedPortraitDataUrl(name) {
      const n = String(name || "").toLowerCase();
      let bg1 = "#4A90E2", bg2 = "#2B5B84", skin = "#F6D0B8", hair = "#4A5568", shirt = "#2E7D5B", style = "woman", glasses = false, beard = false;
      if (n.includes("helga") || n.includes("oma")) {
        bg1 = "#5B9BD5"; bg2 = "#2E5B88"; skin = "#F7D5BE"; hair = "#D9D9E0"; shirt = "#4A6FA5"; style = "oma"; glasses = true;
      } else if (n.includes("anna")) {
        bg1 = "#38BDF8"; bg2 = "#0284C7"; skin = "#F8D6C0"; hair = "#4A5568"; shirt = "#2E7D5B"; style = "woman";
      } else if (n.includes("sabine")) {
        bg1 = "#6366F1"; bg2 = "#3730A3"; skin = "#F7D4BC"; hair = "#64748B"; shirt = "#3B82F6"; style = "woman";
      } else if (n.includes("thomas")) {
        bg1 = "#2E7D5B"; bg2 = "#164A33"; skin = "#F0C5A8"; hair = "#334155"; shirt = "#2B4C7E"; style = "man";
      } else if (n.includes("markus")) {
        bg1 = "#3B82F6"; bg2 = "#1E3A8A"; skin = "#F2C8AD"; hair = "#475569"; shirt = "#0284C7"; style = "man";
      } else if (n.includes("max")) {
        bg1 = "#0EA5E9"; bg2 = "#0C4A6E"; skin = "#EFC2A5"; hair = "#1E293B"; shirt = "#374151"; style = "man"; beard = true;
      } else if (n.includes("leo") || n.includes("baby")) {
        bg1 = "#60A5FA"; bg2 = "#2563EB"; skin = "#FBE0CD"; hair = "#94A3B8"; shirt = "#38BDF8"; style = "baby";
      } else if (n.includes("praxis") || n.includes("dr.")) {
        bg1 = "#14B8A6"; bg2 = "#0F766E"; skin = "#F3CBB2"; hair = "#9CA3AF"; shirt = "#FFFFFF"; style = "man"; glasses = true;
      } else {
        let h = 0;
        for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
        const bgPairs = [["#4A90E2","#2563EB"],["#38BDF8","#0284C7"],["#6366F1","#4338CA"],["#14B8A6","#0D9488"]];
        const pair = bgPairs[h % bgPairs.length];
        bg1 = pair[0]; bg2 = pair[1];
        const hairs = ["#334155", "#475569", "#1E293B", "#64748B", "#94A3B8"];
        hair = hairs[h % hairs.length];
        const shirts = ["#2B4C7E", "#0284C7", "#2E7D5B", "#4F46E5"];
        shirt = shirts[(h >> 2) % shirts.length];
        style = (h % 2 === 0) ? "woman" : "man";
      }

      const hairBack = (style === "woman")
        ? `<path d="M30 58 C28 92, 34 108, 42 114 L86 114 C94 108, 100 92, 98 58 Z" fill="${hair}"/>`
        : (style === "oma" ? `<circle cx="64" cy="26" r="14" fill="${hair}"/>` : "");

      const hairTop = (style === "baby")
        ? `<path d="M58 28 Q66 18 70 27 Q75 21 72 31" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`
        : (style === "woman" || style === "oma")
          ? `<path d="M32 58 C32 30, 96 30, 96 58 C84 42, 48 42, 32 58 Z" fill="${hair}"/>`
          : `<path d="M34 54 C34 28, 94 28, 94 54 C84 40, 44 40, 34 54 Z" fill="${hair}"/>`;

      const glassesSvg = glasses
        ? `<g stroke="#374151" stroke-width="2.4" fill="none"><circle cx="52" cy="60" r="8"/><circle cx="76" cy="60" r="8"/><line x1="60" y1="60" x2="68" y2="60"/></g>`
        : "";

      const beardSvg = beard
        ? `<path d="M40 68 C42 88, 86 88, 88 68 C82 76, 46 76, 40 68 Z" fill="${hair}" opacity="0.85"/>`
        : "";

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs>
        <rect width="128" height="128" rx="64" fill="url(#bg)"/>
        ${hairBack}
        <path d="M22 128 C26 98, 44 92, 64 92 C84 92, 102 98, 106 128 Z" fill="${shirt}"/>
        <rect x="54" y="78" width="20" height="18" rx="8" fill="${skin}"/>
        <ellipse cx="64" cy="60" rx="${style === 'baby' ? 24 : 26}" ry="${style === 'baby' ? 24 : 28}" fill="${skin}"/>
        ${hairTop}
        <circle cx="52" cy="60" r="3" fill="#2C201B"/>
        <circle cx="76" cy="60" r="3" fill="#2C201B"/>
        ${glassesSvg}
        ${beardSvg}
        <path d="M55 72 Q64 79 73 72" stroke="#A84A3A" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function runDailyReminderWorker() {
      const today = todayIso();
      let rolledCount = 0;

      // 1. Automatisch überfällige REPEAT:-Erinnerungen weiterrollen & heute fällige melden
      for (const ev of state.specialEvents) {
        if (isRepeatDateSpec(ev.dateIso)) {
          const parts = ev.dateIso.split(":");
          const count = Math.max(1, parseInt(parts[1], 10) || 1);
          const unit = (parts[2] || "DAYS").toUpperCase();
          const storedDate = parts[3] || today;
          if (storedDate < today) {
            const rep = parseRepeatDateSpec(ev.dateIso, today);
            ev.dateIso = `REPEAT:${rep.count}:${rep.unit}:${rep.nextIso}`;
            rolledCount++;
          }
        }
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff === 0 || diff === (ev.leadDays || 1)) {
          const p = state.persons.find(x => x.id === ev.personId && !x.isHidden);
          if (p) {
            openPopupForPerson(p.id, `🔔 Erinnerung (${diff === 0 ? 'Heute' : `in ${diff}T`}): ${ev.title}`);
            addLog(`DailyReminderWorker -> Erinnerung "${ev.title}" für ${p.name} ausgelöst.`);
            if (rolledCount > 0) saveState();
            return;
          }
        }
      }

      // 2. Geburtstage heute/morgen & Melde-Timer prüfen (nur sichtbare Kontakte)
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (state.birthdayPopupEnabled !== false && bdayDays !== null && bdayDays === 0 && !getOngoingBirthdayCongrats(p, today)) {
          showBirthdayHeadsUpToast(p, false);
          openPopupForPerson(p.id, `🎂 Heute Geburtstag! (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`);
          addLog(`DailyReminderWorker -> Geburtstags-Popup für ${p.name}`);
          return;
        }
        const nextTimer = ContactResolver.nextTimerDate(p, today);
        if (nextTimer && nextTimer <= today) {
          openPopupForPerson(p.id, `⏳ Melde-Timer fällig (${p.timerInterval} ${formatTimerUnitDe(p.timerUnit)})`);
          addLog(`DailyReminderWorker -> Melde-Timer-Dialog für ${p.name}`);
          return;
        }
      }
      if (rolledCount > 0) saveState();
      addLog(`DailyReminderWorker: Prüfung abgeschlossen (${rolledCount} wiederkehrende Termine weitergerollt).`);
    }

    const AVATAR_GRADIENTS = [
      "linear-gradient(135deg, #4A90E2, #2563EB)",
      "linear-gradient(135deg, #38BDF8, #0284C7)",
      "linear-gradient(135deg, #60A5FA, #3B82F6)",
      "linear-gradient(135deg, #6366F1, #4338CA)",
      "linear-gradient(135deg, #2DD4BF, #0D9488)",
      "linear-gradient(135deg, #4C6EF5, #364FC7)",
      "linear-gradient(135deg, #0CA678, #087F5B)",
      "linear-gradient(135deg, #818CF8, #4F46E5)"
    ];

    function getInitials(fullName) {
      const clean = stripNameRoleSuffix(fullName || "");
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function getAvatarGradient(name) {
      const s = String(name || "");
      let hash = 0;
      for (let i = 0; i < s.length; i++) {
        hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
      }
      return AVATAR_GRADIENTS[hash % AVATAR_GRADIENTS.length];
    }

    function normalizePhotoSrc(photoBase64) {
      if (!photoBase64 || typeof photoBase64 !== "string" || !photoBase64.trim()) return "";
      const s = photoBase64.trim();
      if (s.startsWith("data:") || s.startsWith("http") || s.startsWith("blob:")) return s;
      return `data:image/jpeg;base64,${s}`;
    }

    function renderPersonAvatarHtml(name, photoOverride = null, sizePx = 36) {
      let rawPhoto = photoOverride;
      if (rawPhoto === null && Array.isArray(state.persons)) {
        const found = state.persons.find(p => p.name === name && p.photoBase64);
        if (found) rawPhoto = found.photoBase64;
      }
      const src = normalizePhotoSrc(rawPhoto);
      const sizeStyle = sizePx !== 36 ? `width:${sizePx}px; height:${sizePx}px; font-size:${Math.round(sizePx * 0.36)}px;` : "";
      if (src) {
        return `<div class="person-avatar" style="${sizeStyle} background:var(--btn-bg); overflow:hidden; padding:0;"><img src="${escapeHtml(src)}" alt="${escapeHtml(name)}" style="width:100%; height:100%; object-fit:cover; display:block; border-radius:50%;" /></div>`;
      }
      const initials = escapeHtml(getInitials(name));
      const bg = getAvatarGradient(name);
      return `<div class="person-avatar" style="${sizeStyle} background:${bg};">${initials}</div>`;
    }

    let pendingCongratsConfirm = null; // { personId, channel, existingRecord }

    function ensureBirthdayCongratsMap() {
      if (!state.birthdayCongratulated || typeof state.birthdayCongratulated !== "object") {
        state.birthdayCongratulated = {};
      }
      return state.birthdayCongratulated;
    }

    function isPersonOngoingBirthdayToday(person, today = todayIso()) {
      if (!person || !person.birthdayIso || !person.birthdayIso.trim()) return false;
      return ContactResolver.daysUntilNextBirthday(person.birthdayIso, today) === 0;
    }

    function getOngoingBirthdayCongrats(person, today = todayIso()) {
      if (!isPersonOngoingBirthdayToday(person, today)) return null;
      const map = ensureBirthdayCongratsMap();
      const rec = map[String(person.id)];
      if (!rec) return null;
      const year = Number(today.slice(0, 4));
      if (rec.year !== year) return null;
      return rec;
    }

    function markBirthdayCongratulated(personId, channel = "Nachricht", today = todayIso()) {
      const person = state.persons.find(p => p.id === personId);
      if (!person) return null;
      const map = ensureBirthdayCongratsMap();
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      const rec = {
        personId: person.id,
        year: Number(today.slice(0, 4)),
        dateIso: today,
        channel: String(channel || "Nachricht").trim() || "Nachricht",
        timestampIso: `${today} ${timeStr}`
      };
      map[String(person.id)] = rec;
      person.lastContactedIso = today;
      addLog(`✅ Geburtstags-Gratulation für ${person.name} bestätigt (${rec.channel}, ${timeStr} Uhr).`);
      return rec;
    }

    function clearBirthdayCongratulated(personId) {
      const map = ensureBirthdayCongratsMap();
      delete map[String(personId)];
      const person = state.persons.find(p => p.id === personId);
      if (person) addLog(`↺ Gratulations-Status für ${person.name} zurückgesetzt.`);
      saveState();
    }

    function cancelDuplicateCongrats() {
      pendingCongratsConfirm = null;
      renderModals();
    }

    function confirmDuplicateCongrats() {
      if (!pendingCongratsConfirm) return;
      const { channel } = pendingCongratsConfirm;
      pendingCongratsConfirm = null;
      if (channel === "App-Direkt") {
        sendDirectOrFallback(true);
      } else {
        dispatchChannel(channel, true);
      }
    }

    function renderBirthdayCountdownPill(birthdayIso, isPastMode = false, personId = null) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const person = personId !== null ? state.persons.find(p => p.id === personId) : null;
      const congrats = person ? getOngoingBirthdayCongrats(person) : null;
      if (isPastMode) {
        const neg = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
        if (neg === null) return "";
        if (neg === 0 && congrats) {
          return `<span class="countdown-pill" style="background:rgba(22,163,74,0.16); color:#15803D; font-weight:800;">✅ Gratuliert</span>`;
        }
        const label = neg === 0 ? "🎉 Heute!" : `🎂 vor ${Math.abs(neg)}T`;
        return `<span class="countdown-pill ${neg === 0 ? 'today' : ''}">${label}</span>`;
      }
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      if (days === null) return "";
      if (days === 0) {
        if (congrats) {
          return `<span class="countdown-pill" style="background:rgba(22,163,74,0.16); color:#15803D; font-weight:800;">✅ Gratuliert</span>`;
        }
        return `<span class="countdown-pill" style="background:rgba(245,158,11,0.22); color:#B45309; border:1px solid #F59E0B; font-weight:800;">🎉 Heute!</span>`;
      }
      if (days === 1) return `<span class="countdown-pill soon">🎂 Morgen!</span>`;
      if (days <= 7) return `<span class="countdown-pill soon">🎂 in ${days}T</span>`;
      return `<span class="countdown-pill">🎂 in ${days}T</span>`;
    }

      const order = APP_THEME_SPECS.map(t => t.id);

      const idx = order.indexOf(current);
      state.themeMode = order[(idx + 1) % order.length];
      const spec = APP_THEME_SPECS.find(t => t.id === state.themeMode) || APP_THEME_SPECS[0];
      addLog(`Design-Theme gewechselt auf: ${spec.icon} ${spec.shortLabel}`);

      if (mode === "dark") mode = "cozy-dark";
      if (mode === "light") mode = "warm";

    function getRelationsForPerson(personId) {
      return state.relations
        .filter(r => r.fromPersonId === personId)
        .map(rel => {
          const target = state.persons.find(p => p.id === rel.toPersonId);
          return target ? { rel, target } : null;
        })
        .filter(Boolean);
    }

    function openPopupForPerson(personId, reason = "Erinnerung") {
      const person = state.persons.find(p => p.id === personId);
      if (!person) return;
      const relPairs = getRelationsForPerson(person.id);
      const resolved = ContactResolver.resolveTarget(person, relPairs);
      const firstName = resolved.targetPersonName.split(" ")[0];
      const isPast = String(reason || "").toLowerCase().includes("nachträglich");
      popupState = {
        personId: person.id,
        reason,
        quickMessageText: pickRandomBirthdayGreeting(firstName, isPast)
      };
      renderAll();
    }

    function sendDirectOrFallback(forceSend = false) {
      if (!popupState) return;
      const person = state.persons.find(p => p.id === popupState.personId);
      if (!person) return;
      const existingCongrats = getOngoingBirthdayCongrats(person);
      if (existingCongrats && !forceSend) {
        pendingCongratsConfirm = { personId: person.id, channel: "App-Direkt", existingRecord: existingCongrats };
        renderModals();
        return;
      }
      const resolved = ContactResolver.resolveTarget(person, getRelationsForPerson(person.id));
      const text = (popupState.quickMessageText || "").trim() || "Herzliche Grüße!";
      const nowStr = new Date().toISOString().slice(0, 16).replace("T", " ");

      if (resolved.hasAppDirect) {
        state.directMessages.push({
          id: state.nextId++,
          personId: person.id,
          targetPeerId: resolved.appPeerId,
          senderDisplayName: "Ich",
          direction: "OUTGOING",
          text,
          timestampIso: nowStr,
          isRead: true
        });
        person.lastContactedIso = todayIso();
        if (isPersonOngoingBirthdayToday(person)) markBirthdayCongratulated(person.id, "App-Direkt");
        addLog(`App-Direkt gesendet an ${resolved.targetPersonName} (${resolved.appPeerId}): "${text}"`);
      } else if (resolved.phone) {
        if (isPersonOngoingBirthdayToday(person)) markBirthdayCongratulated(person.id, "WhatsApp");
        addLog(`Fallback auf WhatsApp an ${resolved.targetPersonName} (${resolved.phone}): "${text}"`);
        window.open(`https://wa.me/${resolved.phone.replace(/[^0-9]/g, "")}?text=${encodeURIComponent(text)}`, "_blank");
      }
      popupState = null;
      saveState();
    }

    function dispatchChannel(channel, forceSend = false) {
      if (!popupState) return;
      const person = state.persons.find(p => p.id === popupState.personId);
      if (!person) return;
      const existingCongrats = getOngoingBirthdayCongrats(person);
      if (existingCongrats && !forceSend) {
        pendingCongratsConfirm = { personId: person.id, channel, existingRecord: existingCongrats };
        renderModals();
        return;
      }
      const resolved = ContactResolver.resolveTarget(person, getRelationsForPerson(person.id));
      const text = popupState.quickMessageText || "";
      const cleanPhone = (resolved.phone || "").replace(/[^0-9+]/g, "");

      if (channel === "Kopiert") {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        person.lastContactedIso = todayIso();
        if (isPersonOngoingBirthdayToday(person)) markBirthdayCongratulated(person.id, "Kopiert");
        addLog(`📋 Grußtext kopiert für ${resolved.targetPersonName}`);
        saveState();
        return;
      }

      if (channel === "Teilen") {
        if (navigator.share) {
          navigator.share({ title: popupState.reason || "Geburtstagsgruß", text }).catch(() => {});
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        person.lastContactedIso = todayIso();
        if (isPersonOngoingBirthdayToday(person)) markBirthdayCongratulated(person.id, "Teilen");
        addLog(`📤 Teilen geöffnet für ${resolved.targetPersonName}`);
        saveState();
        return;
      }

      if (channel === "Mail") {
        if (!resolved.email) return;
        person.lastContactedIso = todayIso();
        if (isPersonOngoingBirthdayToday(person)) markBirthdayCongratulated(person.id, "Mail");
        addLog(`Mail an ${resolved.email}`);
        saveState();
        window.location.href = `mailto:${resolved.email}?subject=${encodeURIComponent(popupState.reason)}&body=${encodeURIComponent(text)}`;
        return;
      }
      if (!cleanPhone) {
        addLog(`Keine Telefonnummer für ${resolved.targetPersonName} hinterlegt!`);
        return;
      }
      person.lastContactedIso = todayIso();
      if (isPersonOngoingBirthdayToday(person)) markBirthdayCongratulated(person.id, channel);
      addLog(`${channel} geöffnet für ${resolved.targetPersonName} (${cleanPhone})`);
      saveState();
      if (channel === "WhatsApp") {
        window.open(`https://wa.me/${cleanPhone.replace(/^\+/, "")}?text=${encodeURIComponent(text)}`, "_blank");
      } else if (channel === "SMS") {
        window.location.href = `sms:${cleanPhone}?body=${encodeURIComponent(text)}`;
      } else if (channel === "Anruf") {
        window.location.href = `tel:${cleanPhone}`;
      }
    }

    function markPersonContacted(personId, channel = "Persönlich") {

    const WEEKDAY_NAMES_DE = {
      1: "Montag",
      2: "Dienstag",
      3: "Mittwoch",
      4: "Donnerstag",
      5: "Freitag",
      6: "Samstag",
      7: "Sonntag"
    };

    function isWeeklyDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("WEEKLY:");
    }

    function isRepeatDateSpec(dateIso) {
      return typeof dateIso === "string" && dateIso.startsWith("REPEAT:");
    }

    function addIntervalToIsoDate(baseIso, count, unit) {
      const n = Math.max(1, parseInt(count, 10) || 1);
      const d = new Date((baseIso || todayIso()) + "T00:00:00");
      switch ((unit || "DAYS").toUpperCase()) {
        case "WEEKS": d.setDate(d.getDate() + n * 7); break;
        case "MONTHS": d.setMonth(d.getMonth() + n); break;
        case "YEARS": d.setFullYear(d.getFullYear() + n); break;
        default: d.setDate(d.getDate() + n); break;
      }
      return d.toISOString().slice(0, 10);
    }

    function formatRhythmTextDe(count, unit) {
      const n = Math.max(1, parseInt(count, 10) || 1);
      const u = (unit || "DAYS").toUpperCase();
      if (u === "WEEKS") return n === 1 ? "1 Woche" : `${n} Wochen`;
      if (u === "MONTHS") return n === 1 ? "1 Monat" : `${n} Monate`;
      if (u === "YEARS") return n === 1 ? "1 Jahr" : `${n} Jahre`;
      return n === 1 ? "1 Tag" : `${n} Tage`;
    }

    function parseRepeatDateSpec(dateIso, today = todayIso()) {
      if (!isRepeatDateSpec(dateIso)) return null;
      const parts = dateIso.split(":");
      const count = Math.max(1, parseInt(parts[1], 10) || 1);
      const unit = (parts[2] || "DAYS").toUpperCase();
      let nextIso = parts[3] || addIntervalToIsoDate(today, count, unit);
      let guard = 0;
      while (nextIso < today && guard < 1000) {
        nextIso = addIntervalToIsoDate(nextIso, count, unit);
        guard++;
      }
      return { count, unit, nextIso };
    }

    function getWeeklyDayNumber(dateIso) {
      if (!isWeeklyDateSpec(dateIso)) return null;
      const num = parseInt(dateIso.split(":")[1], 10);
      return (num >= 1 && num <= 7) ? num : null;
    }

    function daysUntilWeeklyDay(weekday1To7, today = todayIso()) {
      const d = new Date(today + "T00:00:00");
      const jsDay = d.getDay(); // 0=Sun..6=Sat
      const isoDay = jsDay === 0 ? 7 : jsDay; // 1=Mon..7=Sun
      return (weekday1To7 - isoDay + 7) % 7;
    }

    function daysUntilEventSpec(dateIso, today = todayIso()) {
      if (isRepeatDateSpec(dateIso)) {
        const rep = parseRepeatDateSpec(dateIso, today);
        return rep ? daysBetween(today, rep.nextIso) : 999;
      }
      if (isWeeklyDateSpec(dateIso)) {
        const wd = getWeeklyDayNumber(dateIso);
        return wd ? daysUntilWeeklyDay(wd, today) : 999;
      }
      return daysBetween(today, dateIso);
    }

    function formatEventBadgeText(ev, today = todayIso()) {
      if (isRepeatDateSpec(ev.dateIso)) {
        const rep = parseRepeatDateSpec(ev.dateIso, today);
        const rhythmStr = formatRhythmTextDe(rep.count, rep.unit);
        const nextStr = formatIsoToDdMmYyyy(rep.nextIso);
        const diff = daysBetween(today, rep.nextIso);
        if (diff === 0) return `🔔 Heute: ${ev.title} (alle ${rhythmStr})`;
        return `🔁 Alle ${rhythmStr}: ${ev.title} (${nextStr})`;
      }
      if (isWeeklyDateSpec(ev.dateIso)) {
        const wd = getWeeklyDayNumber(ev.dateIso);
        const dayName = WEEKDAY_NAMES_DE[wd] || "Wöchentlich";
        const diff = daysUntilWeeklyDay(wd, today);
        if (diff === 0) return `🔔 Heute (${dayName}): ${ev.title}`;
        if (diff === 1) return `🔁 Jeden ${dayName}: ${ev.title} (morgen)`;
        return `🔁 Jeden ${dayName}: ${ev.title} (in ${diff}T)`;
      }
      return `${ev.title} (${formatIsoToDdMmYyyy(ev.dateIso)})`;
    }

    function formatIsoToDdMmYyyy(iso) {
      if (!iso || !iso.trim()) return "";
      const clean = iso.trim();
      if (isRepeatDateSpec(clean)) {
        const rep = parseRepeatDateSpec(clean);
        const dParts = rep.nextIso.split("-");
        const nextFormatted = dParts.length === 3 ? `${dParts[2].padStart(2, "0")}.${dParts[1].padStart(2, "0")}.${dParts[0]}` : rep.nextIso;
        return `🔁 Alle ${formatRhythmTextDe(rep.count, rep.unit)} • Nächster: ${nextFormatted}`;
      }
      if (isWeeklyDateSpec(clean)) {
        const wd = getWeeklyDayNumber(clean);
        return `🔁 Jeden ${WEEKDAY_NAMES_DE[wd] || "Wochentag"}`;
      }
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(clean)) return clean;
      if (clean.startsWith("--")) {
        const parts = clean.slice(2).split("-");
        if (parts.length === 2) return `${parts[1].padStart(2, "0")}.${parts[0].padStart(2, "0")}.`;
      }
      const parts = clean.split("-");
      return parts.length === 3 ? `${parts[2].padStart(2, "0")}.${parts[1].padStart(2, "0")}.${parts[0]}` : clean;
    }

    function normalizeDateInputToIso(input) {
      const clean = (input || "").trim();
      if (!clean) return "";
      if (isWeeklyDateSpec(clean) || isRepeatDateSpec(clean)) return clean;
      const dotParts = clean.split(".");
      if (dotParts.length === 3 && dotParts[2].length === 4) {
        return `${dotParts[2]}-${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      if (dotParts.length >= 2 && (!dotParts[2] || dotParts[2] === "")) {
        return `--${dotParts[1].padStart(2, "0")}-${dotParts[0].padStart(2, "0")}`;
      }
      const slashParts = clean.split("/");
      if (slashParts.length === 3 && slashParts[2].length === 4) {
        return `${slashParts[2]}-${slashParts[1].padStart(2, "0")}-${slashParts[0].padStart(2, "0")}`;
      }
      return clean;
    }

    function formatCompactBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const ageStr = ContactResolver.formatUpcomingAge(birthdayIso);
      const days = ContactResolver.daysUntilNextBirthday(birthdayIso);
      const whenStr = days === null ? "" : (days === 0 ? "heute" : (days === 1 ? "in 1 Tag" : `in ${days} Tagen`));
      return [dateStr, `${ageStr} ${whenStr}`.trim()].filter(Boolean).join("  •  ");
    }

    let showPastDates = false;
    let contactSortMode = "lastname"; // Standardmäßig immer nach Nachnamen sortieren ("lastname" | "birthday" | "firstname")
    let tabSearchQuery = "";
    let tabSelectedLetter = "";
    const dropdownUiState = {}; // key -> { open, query, letter }

    function getDropdownState(key) {
      if (!dropdownUiState[key]) {
        dropdownUiState[key] = { open: false, query: "", letter: "" };
      }
      return dropdownUiState[key];
    }

    function stripNameRoleSuffix(fullName) {
      return (fullName || "").replace(/\s*\([^)]*\)\s*/g, " ").trim();
    }

    function extractFirstName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      if (!clean) return "";
      if (clean.includes(",")) {
        const afterComma = clean.split(",").slice(1).join(",").trim();
        if (afterComma) return afterComma;
      }
      const parts = clean.split(/\s+/).filter(Boolean);
      return parts.length > 1 ? parts.slice(0, -1).join(" ") : (parts[0] || clean);
    }

    const COMPANY_NAME_REGEX = /\b(gmbh|mbh|kg|ohg|gbr|ag|ug|e\.?v\.?|co\.|praxis|kanzlei|apotheke|autohaus|bäckerei|baeckerei|metzgerei|baugeschäft|baugeschaeft|hotel|restaurant|gasthof|schule|gemeinde|stadt|sparkasse|bank|versicherung|klinik|zentrum|verein)\b/i;
    const TRAILING_CONTACT_TAGS = new Set([
      "mobil", "handy", "privat", "arbeit", "büro", "buero", "festnetz", "tel", "tel.", "telefon", "zentrale", "home", "work"
    ]);

    function isLikelyOrganizationName(cleanName) {
      return COMPANY_NAME_REGEX.test(cleanName || "");
    }

    function extractLastName(fullName) {
      const clean = stripNameRoleSuffix(fullName);
      if (!clean) return "";
      if (clean.includes(",")) {
        const beforeComma = clean.split(",")[0].trim();
        if (beforeComma) return beforeComma;
      }
      if (isLikelyOrganizationName(clean)) return clean;
      const parts = clean.split(/\s+/).filter(Boolean);
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        parts.pop();
      }
      return parts.length > 1 ? parts[parts.length - 1] : (parts[0] || clean);
    }

    function formatLastNameFirst(fullName) {
      const raw = (fullName || "").trim();
      if (!raw || raw.includes(",")) return raw;
      const roleMatch = raw.match(/\([^)]*\)$/);
      const roleSuffix = roleMatch ? ` ${roleMatch[0]}` : "";
      const clean = stripNameRoleSuffix(raw);
      if (isLikelyOrganizationName(clean)) return raw;
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return raw;
      const trailingTags = [];
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        trailingTags.unshift(parts.pop());
      }
      const last = parts[parts.length - 1];
      const first = parts.slice(0, -1).join(" ");
      const extraTagSuffix = trailingTags.length > 0 ? ` (${trailingTags.join(" ")})` : "";
      return `${last}, ${first}${extraTagSuffix}${roleSuffix}`;
    }

    function splitFullNameIntoFirstAndLast(fullName) {
      const raw = String(fullName || "").trim();
      if (!raw) return { firstName: "", lastName: "" };
      if (raw.includes(",")) {
        const idx = raw.indexOf(",");
        return {
          firstName: raw.slice(idx + 1).trim(),
          lastName: raw.slice(0, idx).trim()
        };
      }
      const roleMatch = raw.match(/\([^)]*\)$/);
      const roleSuffix = roleMatch ? roleMatch[0].trim() : "";
      const clean = stripNameRoleSuffix(raw);
      if (isLikelyOrganizationName(clean)) {
        return { firstName: "", lastName: raw };
      }
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 0) return { firstName: "", lastName: "" };
      if (parts.length === 1) {
        return { firstName: roleSuffix ? `${parts[0]} ${roleSuffix}` : parts[0], lastName: "" };
      }
      const trailingTags = [];
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        trailingTags.unshift(parts.pop());
      }
      const last = parts[parts.length - 1];
      const firstBase = parts.slice(0, -1).join(" ");
      let extra = "";
      if (trailingTags.length > 0) extra += ` (${trailingTags.join(" ")})`;
      if (roleSuffix) extra += ` ${roleSuffix}`;
      return { firstName: `${firstBase}${extra}`.trim(), lastName: last };
    }

    function combineFirstAndLastName(firstName, lastName) {
      const f = String(firstName || "").replace(/,/g, " ").trim().replace(/\s+/g, " ");
      const l = String(lastName || "").replace(/,/g, " ").trim().replace(/\s+/g, " ");
      if (l && f) return `${l}, ${f}`;
      if (f) return f;
      if (l) return l;
      return "";
    }

    function normalizeLetterInitial(ch) {
      const u = String(ch || "").toUpperCase();
      if (u === "Ä") return "A";
      if (u === "Ö" || u === "Ø") return "O";
      if (u === "Ü") return "U";
      if (u === "ß") return "S";
      if (u === "Ł") return "L";
      if (u === "Đ") return "D";
      if (/^[A-Z]$/.test(u)) return u;
      const decomp = u.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const m = decomp.match(/[A-Z]/);
      return m ? m[0] : "#";
    }

    function normalizeSearchKey(str) {
      return String(str || "")
        .trim()
        .toLowerCase()
        .replace(/ä/g, "ae")
        .replace(/ö/g, "oe")
        .replace(/ü/g, "ue")
        .replace(/ß/g, "ss")
        .replace(/ł/g, "l")
        .replace(/đ/g, "d")
        .replace(/ø/g, "o")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function extractLastNameInitial(fullName) {
      const last = extractLastName(fullName).trim() || String(fullName || "").trim();
      const m = last.match(/[\p{L}\p{N}]/u);
      if (!m) return "#";
      return /\p{L}/u.test(m[0]) ? normalizeLetterInitial(m[0]) : "#";
    }

    function extractTextInitial(text) {
      const m = String(text || "").trim().match(/[\p{L}\p{N}]/u);
      if (!m) return "#";
      return /\p{L}/u.test(m[0]) ? normalizeLetterInitial(m[0]) : "#";
    }

    function comparePersonsByLastName(a, b) {
      const cmp = normalizeSearchKey(extractLastName(a.name)).localeCompare(normalizeSearchKey(extractLastName(b.name)), "de", { sensitivity: "base" });
      if (cmp !== 0) return cmp;
      return normalizeSearchKey(extractFirstName(a.name)).localeCompare(normalizeSearchKey(extractFirstName(b.name)), "de", { sensitivity: "base" });
    }

    function sortPersonsByLastName(arr) {
      return [...(arr || [])].sort(comparePersonsByLastName);
    }

    function matchesPersonSearchAndLetter(person, query, letter) {
      const l = String(letter || "").trim().toUpperCase();
      if (l && extractLastNameInitial(person.name) !== l) return false;
      const q = String(query || "").trim().toLowerCase();
      if (!q) return true;
      const fullLower = (person.name || "").toLowerCase();
      const formatted = formatLastNameFirst(person.name).toLowerCase();
      const phoneLower = (person.phone || "").toLowerCase();
      if (fullLower.includes(q) || formatted.includes(q) || phoneLower.includes(q)) return true;

      const haystackNorm = normalizeSearchKey(`${person.name || ""} ${formatLastNameFirst(person.name)} ${person.phone || ""}`);
      const tokens = q.split(/[\s,]+/).filter(Boolean);
      return tokens.every(tok => {
        const tokNorm = normalizeSearchKey(tok);
        return fullLower.includes(tok) || formatted.includes(tok) || phoneLower.includes(tok) || (tokNorm && haystackNorm.includes(tokNorm));
      });
    }

    const ALPHABET_ROW_1 = ["A","B","C","D","E","F","G","H","I","J","K","L","M"];

    function cycleContactSortMode() {
      if (contactSortMode === "lastname") contactSortMode = "birthday";
      else if (contactSortMode === "birthday") contactSortMode = "firstname";
      else contactSortMode = "lastname";

    function getSortModeButtonLabel() {

      if (contactSortMode === "birthday") return "⇅ Geburtstag";
      return "⇅ Nachname";
    }

    function formatPassedBirthdayLine(birthdayIso) {
      if (!birthdayIso || !birthdayIso.trim()) return "";
      const dateStr = formatIsoToDdMmYyyy(birthdayIso);
      const passedAgeStr = ContactResolver.formatPassedAge(birthdayIso);
      const negDays = ContactResolver.negativeDaysSinceLastBirthday(birthdayIso);
      if (negDays === null) return dateStr;
      const negLabel = negDays === 0 ? "0 Tage (heute)" : (negDays === -1 ? "-1 Tag" : `${negDays} Tage`);
      return `${dateStr}  •  ${passedAgeStr} (${negLabel})`;
    }

    let allContactsFilter = "all"; // "all" | "hidden"
    let mergeContactsModalState = null;

    function cleanMergeWhitespace(raw) {
      return String(raw || "").trim().replace(/\s+/g, " ");
    }

    function canonicalPhoneKey(raw) {
      const trimmed = String(raw || "").trim();
      if (!trimmed) return "";
      let cleaned = "";
      for (let i = 0; i < trimmed.length; i++) {
        const ch = trimmed[i];
        if (ch >= "0" && ch <= "9") cleaned += ch;
        else if (ch === "+" && cleaned === "" && i === 0) cleaned += "+";
      }
      const digitsOnly = cleaned.replace(/[^0-9]/g, "");
      if (digitsOnly.length < 3) return "";
      const intl = (cleaned.startsWith("00") && digitsOnly.length >= 5)
        ? "+" + cleaned.slice(2)
        : cleaned;
      if (intl.startsWith("+49")) {
        const sub = intl.slice(3).replace(/^0+/, "");
        return sub ? `DE:${sub}` : "DE:0";
      }
      if (intl.startsWith("+43")) return `AT:${intl.slice(3).replace(/^0+/, "")}`;
      if (intl.startsWith("+41")) return `CH:${intl.slice(3).replace(/^0+/, "")}`;
      if (intl.startsWith("+")) return intl;
      if (intl.startsWith("0")) {
        const sub = intl.replace(/^0+/, "");
        return sub ? `DE:${sub}` : `RAW:${digitsOnly}`;
      }
      return `RAW:${digitsOnly}`;
    }

    function isPhoneLike(raw) {
      const t = String(raw || "").trim();
      if (!t || t.includes("@") || /\p{L}/u.test(t)) return false;
      if (/^\d{1,2}\.\d{1,2}\.(\d{2,4})?$/.test(t) || /^\d{4}-\d{2}-\d{2}$/.test(t)) return false;
      return (t.match(/\d/g) || []).length >= 4;
    }

    function canonicalEmailKey(raw) {
      const cleaned = String(raw || "")
        .trim()
        .replace(/^mailto:/i, "")
        .trim()
        .replace(/^<|>$/g, "")
        .replace(/\s+/g, "")
        .toLowerCase();
      return (cleaned.includes("@") && cleaned.split("@")[1].includes(".")) ? cleaned : "";
    }

    function isEmailLike(raw) {
      return Boolean(canonicalEmailKey(raw));
    }

    function isAddressLabel(label) {
      const l = String(label || "").trim().toLowerCase();
      return l.includes("adresse") || l.includes("anschrift") || l.includes("wohnort") || l.includes("straße") || l.includes("strasse") || l.includes("post");
    }

    function canonicalTextKey(raw) {
      return normalizeSearchKey(
        String(raw || "")
          .trim()
          .toLowerCase()
          .replace(/straße/g, "str ")
          .replace(/strasse/g, "str ")
          .replace(/str\./g, "str ")
      ).replace(/[\s,.;:/\-–_•|]+/g, " ").trim();
    }

    function canonicalPersonNameForMerge(fullName) {
      let clean = stripNameRoleSuffix(fullName).trim();
      clean = clean.replace(/\s*\((mobil|handy|privat|arbeit|festnetz|büro|buero|home|work|tel|telefon|alt|neu)\)\s*$/i, "").trim();
      const parts = clean.split(/\s+/).filter(Boolean);
      while (parts.length > 2 && TRAILING_CONTACT_TAGS.has(parts[parts.length - 1].toLowerCase())) {
        parts.pop();
      }
      const reassembled = clean.includes(",") ? clean : parts.join(" ");
      return canonicalTextKey(formatLastNameFirst(reassembled));
    }

    function makeDismissedMergePairKey(idA, idB) {
      const a = Number(idA);
      const b = Number(idB);
      return a < b ? `${a}:${b}` : `${b}:${a}`;
    }

    function buildDismissedMergePairKeysForGroup(ids) {
      const distinct = [...new Set((ids || []).map(Number).filter(n => !Number.isNaN(n)))].sort((a, b) => a - b);
      const out = [];
      for (let i = 0; i < distinct.length; i++) {
        for (let j = i + 1; j < distinct.length; j++) {
          out.push(makeDismissedMergePairKey(distinct[i], distinct[j]));
        }
      }
      return out;
    }

    function getDismissedMergePairsSet() {
      return new Set(Array.isArray(state.dismissedMergePairs) ? state.dismissedMergePairs : []);
    }

    function dismissMergeCombinationByIds(ids) {
      const newPairs = buildDismissedMergePairKeysForGroup(ids);
      if (newPairs.length === 0) return;
      const set = getDismissedMergePairsSet();
      newPairs.forEach(p => set.add(p));
      state.dismissedMergePairs = [...set];
      addLog(`🚫 Kombination wird nicht mehr zum Zusammenführen vorgeschlagen.`);
      saveState();
    }

    function dismissDuplicateSuggestionGroup(groupKey) {
      const grp = findDuplicateSuggestionGroups(state.persons).find(g => g.key === groupKey);
      if (!grp) return;
      dismissMergeCombinationByIds(grp.members.map(m => m.id));
      if (mergeContactsModalState) {
        mergeContactsModalState.notice = "🚫 Kombination wird nicht mehr vorgeschlagen.";
      }
      renderPhoneApp();
      renderModals();
    }

    function dismissSelectedMergeContactsModal() {
      if (!mergeContactsModalState) return;
      const ids = mergeContactsModalState.selectedIds || [];
      if (ids.length < 2) return;
      dismissMergeCombinationByIds(ids);
      const remaining = findDuplicateSuggestionGroups(state.persons);
      if (remaining.length > 0) {
        mergeContactsModalState.selectedIds = [];
        mergeContactsModalState.primaryId = -1;
        mergeContactsModalState.tab = "suggestions";
        mergeContactsModalState.notice = "🚫 Kombination wird nicht mehr vorgeschlagen.";
      } else {
        mergeContactsModalState = null;
      }
      renderPhoneApp();
      renderModals();
    }

    function resetDismissedMergeCombinations() {
      state.dismissedMergePairs = [];
      if (mergeContactsModalState) {
        mergeContactsModalState.notice = "✓ Abgelehnte Vorschläge wurden wieder eingeblendet.";
      }
      addLog("✓ Abgelehnte Zusammenführungs-Vorschläge zurückgesetzt.");
      saveState();
      renderModals();
    }

    function splitCandidateBucketExcludingDismissedJs(rawGroup, dismissedSet) {
      const byId = new Map();
      (rawGroup || []).forEach(p => byId.set(p.id, p));
      const distinct = [...byId.values()];
      if (distinct.length < 2) return [];
      if (!dismissedSet || dismissedSet.size === 0) {
        return [sortPersonsByLastName(distinct)];
      }
      const remaining = distinct.filter(m =>
        distinct.some(o => o.id !== m.id && !dismissedSet.has(makeDismissedMergePairKey(m.id, o.id)))
      );
      if (remaining.length < 2) return [];
      const nameCounts = new Map();
      remaining.forEach(p => {
        const nk = canonicalPersonNameForMerge(p.name);
        nameCounts.set(nk, (nameCounts.get(nk) || 0) + 1);
      });
      const ordered = [...remaining].sort((a, b) => {
        const ca = nameCounts.get(canonicalPersonNameForMerge(a.name)) || 0;
        const cb = nameCounts.get(canonicalPersonNameForMerge(b.name)) || 0;
        if (cb !== ca) return cb - ca;
        return comparePersonsByLastName(a, b);
      });
      const clusters = [];
      for (const person of ordered) {
        const pnk = canonicalPersonNameForMerge(person.name);
        const compatible = clusters.filter(cl =>
          cl.every(ex => !dismissedSet.has(makeDismissedMergePairKey(ex.id, person.id)))
        );
        const best = compatible.find(cl => canonicalPersonNameForMerge(cl[0].name) === pnk) || compatible[0];
        if (best) best.push(person);
        else clusters.push([person]);
      }
      return clusters.filter(cl => cl.length >= 2).map(cl => sortPersonsByLastName(cl));
    }

    function findDuplicateSuggestionGroups(personsList) {
      const list = Array.isArray(personsList) ? personsList : [];
      if (list.length < 2) return [];
      const dismissedSet = getDismissedMergePairsSet();
      const result = [];
      const seenSets = new Set();

      const addGroup = (baseKey, reasonBadge, priority, members) => {
        const subGroups = splitCandidateBucketExcludingDismissedJs(members, dismissedSet);
        subGroups.forEach((sortedMembers, idx) => {
          const sig = sortedMembers.map(m => m.id).sort((a, b) => a - b).join(",");
          if (!seenSets.has(sig)) {
            seenSets.add(sig);
            result.push({ key: `${baseKey}:${idx}:${sig}`, reasonBadge, priority, members: sortedMembers });
          }
        });
      };

      const byName = new Map();
      list.forEach(p => {
        const nk = canonicalPersonNameForMerge(p.name);
        if (!nk) return;
        if (!byName.has(nk)) byName.set(nk, []);
        byName.get(nk).push(p);
      });
      byName.forEach((grp, nk) => {
        if (grp.length >= 2) addGroup(`name:${nk}`, "👤 Gleicher Name", 1, grp);
      });

      const byEmail = new Map();
      list.forEach(p => {
        const ek = canonicalEmailKey(p.email);
        if (!ek) return;
        if (!byEmail.has(ek)) byEmail.set(ek, []);
        byEmail.get(ek).push(p);
      });
      byEmail.forEach((grp, ek) => {
        if (grp.length >= 2) addGroup(`mail:${ek}`, "✉️ Gleiche E-Mail", 2, grp);
      });

      const byPhone = new Map();
      list.forEach(p => {
        const pk = canonicalPhoneKey(p.phone);
        if (!pk) return;
        if (!byPhone.has(pk)) byPhone.set(pk, []);
        byPhone.get(pk).push(p);
      });
      byPhone.forEach((grp, pk) => {
        if (grp.length >= 2) addGroup(`phone:${pk}`, "📞 Gleiche Nummer", 3, grp);
      });

      return result.sort((a, b) => a.priority !== b.priority ? a.priority - b.priority : comparePersonsByLastName(a.members[0], b.members[0]));
    }

    function buildMergedContactPreview(selectedPersons, primaryId, customName) {
      if (!Array.isArray(selectedPersons) || selectedPersons.length < 2) return null;
      const primary = selectedPersons.find(p => p.id === primaryId) || selectedPersons[0];
      const ordered = [primary, ...selectedPersons.filter(p => p.id !== primary.id)];
      let removedDuplicatesCount = 0;

      const seenPhones = new Set();
      const mergedPhones = [];
      const seenEmails = new Set();
      const mergedEmails = [];
      const seenTexts = new Set();
      const mergedOtherExtras = [];
      const rawNoteBlocks = [];

      ordered.forEach(p => {
        const extras = Array.isArray(p.extraInfos) ? p.extraInfos : [];

        const tryAddPhone = (lbl, val) => {
          const clean = cleanMergeWhitespace(val);
          if (!clean) return;
          const pk = canonicalPhoneKey(clean);
          if (!pk) return;
          if (!seenPhones.has(pk)) {
            seenPhones.add(pk);
            mergedPhones.push({ label: lbl || "Telefon", value: clean });
          } else {
            removedDuplicatesCount++;
          }
        };
        if (p.phone) tryAddPhone("Telefon", p.phone);
        extras.filter(x => isPhoneLike(x.value)).forEach(x => tryAddPhone(x.label, x.value));

        const tryAddEmail = (lbl, val) => {
          const clean = String(val || "").trim();
          const ek = canonicalEmailKey(clean);
          if (!ek) return;
          if (!seenEmails.has(ek)) {
            seenEmails.add(ek);
            mergedEmails.push({ label: lbl || "E-Mail", value: clean });
          } else {
            removedDuplicatesCount++;
          }
        };
        if (p.email) tryAddEmail("E-Mail", p.email);
        extras.filter(x => isEmailLike(x.value)).forEach(x => tryAddEmail(x.label, x.value));

        extras.filter(x => !isPhoneLike(x.value) && !isEmailLike(x.value)).forEach(x => {
          const clean = cleanMergeWhitespace(x.value);
          const tk = canonicalTextKey(clean);
          if (!tk) return;
          if (!seenTexts.has(tk)) {
            seenTexts.add(tk);
            mergedOtherExtras.push({ label: (x.label || "Info").trim() || "Info", value: clean });
          } else {
            removedDuplicatesCount++;
          }
        });

        if (p.notes && p.notes.trim()) rawNoteBlocks.push(p.notes);
      });

      const rawBirthdays = ordered.map(p => (p.birthdayIso || "").trim()).filter(Boolean);
      let mergedBirthdayIso = rawBirthdays[0] || "";
      if (mergedBirthdayIso.startsWith("--")) {
        const md = mergedBirthdayIso.slice(2);
        const fullMatch = rawBirthdays.find(b => !b.startsWith("--") && b.endsWith(`-${md}`));
        if (fullMatch) mergedBirthdayIso = fullMatch;
      }
      rawBirthdays.slice(1).forEach(otherB => {
        const mainMd = mergedBirthdayIso.replace(/^--/, "").slice(-5);
        const otherMd = otherB.replace(/^--/, "").slice(-5);
        if (otherB === mergedBirthdayIso || (mainMd && mainMd === otherMd)) {
          removedDuplicatesCount++;
        } else {
          const fmt = formatIsoToDdMmYyyy(otherB);
          const tk = canonicalTextKey(fmt);
          if (tk && !seenTexts.has(tk)) {
            seenTexts.add(tk);
            mergedOtherExtras.push({ label: "Weiteres Datum", value: fmt });
          }
        }
      });

      const seenNotes = new Set(seenTexts);
      const noteLines = [];
      rawNoteBlocks.forEach(block => {
        String(block).split(/\r?\n/).forEach(rawLine => {
          const line = cleanMergeWhitespace(rawLine);
          if (!line) return;
          if (isEmailLike(line) && seenEmails.has(canonicalEmailKey(line))) { removedDuplicatesCount++; return; }
          if (isPhoneLike(line) && seenPhones.has(canonicalPhoneKey(line))) { removedDuplicatesCount++; return; }
          const tk = canonicalTextKey(line);
          if (tk) {
            if (!seenNotes.has(tk)) {
              seenNotes.add(tk);
              noteLines.push(line);
            } else {
              removedDuplicatesCount++;
            }
          }
        });
      });

      const deduplicatedExtraInfos = [];
      mergedPhones.slice(1).forEach((item, idx) => {
        const lbl = (!item.label || item.label === "Telefon" || item.label === "2. Telefon") ? `${idx + 2}. Telefon` : item.label;
        deduplicatedExtraInfos.push({ label: lbl, value: item.value });
      });
      mergedEmails.slice(1).forEach((item, idx) => {
        const lbl = (!item.label || item.label === "E-Mail") ? `${idx + 2}. E-Mail` : item.label;
        deduplicatedExtraInfos.push({ label: lbl, value: item.value });
      });
      mergedOtherExtras.forEach(item => deduplicatedExtraInfos.push(item));

      const timerSource = primary.timerEnabled ? primary : (ordered.find(x => x.timerEnabled) || primary);
      const latestContact = ordered.map(x => x.lastContactedIso || "").filter(Boolean).sort().pop() || "";
      const primaryPhone = mergedPhones[0] ? mergedPhones[0].value : "";
      const primaryEmail = mergedEmails[0] ? mergedEmails[0].value : "";

      return {
        primaryPerson: primary,
        finalName: String(customName || "").trim() || primary.name,
        birthdayIso: mergedBirthdayIso,
        primaryPhone,
        primaryEmail,
        hasNoOwnPhone: !primaryPhone && ordered.every(x => x.hasNoOwnPhone),
        timerEnabled: ordered.some(x => x.timerEnabled),
        timerInterval: timerSource.timerInterval || 14,
        timerUnit: timerSource.timerUnit || "DAYS",
        lastContactedIso: latestContact,
        photoBase64: primary.photoBase64 || (ordered.find(x => x.photoBase64) || {}).photoBase64 || "",
        notes: noteLines.join("\n"),
        deduplicatedExtraInfos,
        removedDuplicatesCount
      };
    }

    function executeMergeContactsModal() {
      if (!mergeContactsModalState) return;
      const selected = sortPersonsByLastName(
        state.persons.filter(p => (mergeContactsModalState.selectedIds || []).includes(p.id))
      );
      if (selected.length < 2) return;
      const preview = buildMergedContactPreview(
        selected,
        mergeContactsModalState.primaryId,
        mergeContactsModalState.customName
      );
      if (!preview) return;
      const target = preview.primaryPerson;
      const secondaryIds = new Set(selected.filter(p => p.id !== target.id).map(p => p.id));
      const allHidden = selected.every(p => p.isHidden);

      target.name = preview.finalName;
      target.birthdayIso = preview.birthdayIso;
      target.hasNoOwnPhone = preview.hasNoOwnPhone;
      target.phone = preview.primaryPhone;
      target.email = preview.primaryEmail;
      target.notes = preview.notes;
      target.extraInfos = preview.deduplicatedExtraInfos;
      target.timerEnabled = preview.timerEnabled;
      target.timerInterval = preview.timerInterval;
      target.timerUnit = preview.timerUnit;
      target.lastContactedIso = preview.lastContactedIso;
      target.photoBase64 = preview.photoBase64;
      target.isHidden = allHidden;

      // Beziehungen dedupliziert umhängen
      const seenRelKeys = new Set();
      const nextRels = [];
      (state.relations || []).forEach(r => {
        const nf = secondaryIds.has(r.fromPersonId) ? target.id : r.fromPersonId;
        const nt = secondaryIds.has(r.toPersonId) ? target.id : r.toPersonId;
        if (nf === nt) return;
        const rk = `${nf}:${nt}:${String(r.relationLabel || "").trim().toLowerCase()}`;
        if (!seenRelKeys.has(rk)) {
          seenRelKeys.add(rk);
          nextRels.push({ ...r, fromPersonId: nf, toPersonId: nt });
        }
      });
      state.relations = nextRels;

      // Erinnerungen dedupliziert umhängen
      const seenEvKeys = new Set();
      const nextEvs = [];
      (state.specialEvents || []).forEach(ev => {
        const np = secondaryIds.has(ev.personId) ? target.id : ev.personId;
        const ek = `${np}:${String(ev.title || "").trim().toLowerCase()}:${String(ev.dateIso || "").trim()}`;
        if (!seenEvKeys.has(ek)) {
          seenEvKeys.add(ek);
          nextEvs.push({ ...ev, personId: np });
        }
      });
      state.specialEvents = nextEvs;

      // Direktnachrichten & Wichteln umhängen
      (state.directMessages || []).forEach(dm => {
        if (secondaryIds.has(dm.personId)) dm.personId = target.id;
      });
      (state.wichtelGroups || []).forEach(g => {
        const seenPid = new Set();
        g.participants = (g.participants || []).filter(part => {
          if (part.personId && secondaryIds.has(part.personId)) {
            part.personId = target.id;
            part.name = target.name;
            if (!part.phone) part.phone = target.phone;
          }
          if (!g.isDrawn && part.personId) {
            if (seenPid.has(part.personId)) return false;
            seenPid.add(part.personId);
          }
          return true;
        });
      });

      if (Array.isArray(state.dismissedMergePairs) && state.dismissedMergePairs.length > 0) {
        const remappedDismissed = new Set();
        state.dismissedMergePairs.forEach(raw => {
          const [aStr, bStr] = String(raw || "").split(":");
          const a = Number(aStr);
          const b = Number(bStr);
          if (Number.isNaN(a) || Number.isNaN(b)) return;
          const na = secondaryIds.has(a) ? target.id : a;
          const nb = secondaryIds.has(b) ? target.id : b;
          if (na !== nb) remappedDismissed.add(makeDismissedMergePairKey(na, nb));
        });
        state.dismissedMergePairs = [...remappedDismissed];
      }

      state.persons = state.persons.filter(p => !secondaryIds.has(p.id));
      if (selectedTreeRootId && secondaryIds.has(selectedTreeRootId)) {
        selectedTreeRootId = target.id;
      }

      addLog(`🔗 ${selected.length} Kontakte intelligent zu "${target.name}" zusammengeführt (${preview.removedDuplicatesCount} doppelte Nummern/Mails/Einträge bereinigt).`);
      const remainingGroups = findDuplicateSuggestionGroups(state.persons);
      if (remainingGroups.length > 0) {
        mergeContactsModalState.selectedIds = [];
        mergeContactsModalState.primaryId = -1;
        mergeContactsModalState.tab = "suggestions";
        mergeContactsModalState.notice = `✓ ${selected.length} Kontakte erfolgreich zu „${target.name}“ zusammengeführt!`;
      } else {
        mergeContactsModalState = null;
      }
      saveState();
    }

    function sortPersonsArray(arr) {
      return [...arr].sort((a, b) => {
        if (contactSortMode === "firstname") {
          const cmp = extractFirstName(a.name).localeCompare(extractFirstName(b.name), "de", { sensitivity: "base" });
          return cmp !== 0 ? cmp : comparePersonsByLastName(a, b);
        }
        if (contactSortMode === "lastname") {
          return comparePersonsByLastName(a, b);
        }
        if (!showPastDates) {
          const da = ContactResolver.daysUntilNextBirthday(a.birthdayIso) ?? 999999;
          const db = ContactResolver.daysUntilNextBirthday(b.birthdayIso) ?? 999999;
          return da !== db ? da - db : comparePersonsByLastName(a, b);
        } else {
          const na = ContactResolver.negativeDaysSinceLastBirthday(a.birthdayIso) ?? -999999;
          const nb = ContactResolver.negativeDaysSinceLastBirthday(b.birthdayIso) ?? -999999;
          return na !== nb ? nb - na : comparePersonsByLastName(a, b);
        }
      });
    }
