          ${statusBanner}

          <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">
            <button class="compact-btn primary" style="flex:1; font-weight:700;" onclick="rollWichtelGroup(${group.id})">
              🎲 ${group.isDrawn ? "Neu würfeln" : "Jetzt auslosen!"}
            </button>
            <button class="compact-btn" onclick="openWichtelParticipantModal('add', ${group.id})">
              ☑️ Teilnehmer (${group.participants.length})
            </button>
            <button class="compact-btn" onclick="sendWichtelDeadlineReminder(${group.id})" title="Geschenk-Besorgungs-Wecker an alle senden">
              ⏰ Wecker
            </button>
            ${group.isDrawn ? `
              <button class="compact-btn" onclick="toggleWichtelForceReveal(${group.id})" title="Auflösung nach Fristablauf simulieren">
                ${revealed ? "🔒 Verbergen" : "🔓 Frist-Ablauf"}
              </button>
              <button class="compact-btn" onclick="archiveAndShareWichtelGroup(${group.id})" title="Wichtelperiode abschließen, in Historie speichern & an alle Teilnehmer senden">
                📜 In Historie abschließen
              </button>
            ` : ""}
          </div>
        </div>
      `;

      const participantsHtml = group.participants.map(part => {
        const target = group.participants.find(x => x.id === part.drawnTargetId);
        const lastYearTarget = group.participants.find(x => x.id === part.lastYearTargetId);
        const pastHistoryTargets = getHistoricalTargetsForParticipant(part);
        const partnerPerson = getCouplePartnerForPerson(part.personId);
        const partnerInGroup = partnerPerson ? group.participants.find(x => x.personId === partnerPerson.id) : null;
        const allUrls = [part.wishlistUrl, ...(Array.isArray(part.extraWishUrls) ? part.extraWishUrls : [])].filter(u => u && u.trim());

        const secretLine = !group.isDrawn
          ? `<span style="color:var(--text-muted);">Noch nicht ausgelost</span>`
          : (revealed && target
            ? `<span style="color:var(--warn-amber); font-weight:700;">🎁 Hat gezogen: ${escapeHtml(target.name)}</span>`
            : `<span style="color:var(--tree-green); font-weight:600;">🎲 Zugelost • 🔒 Geheim bis ${escapeHtml(revealDateFormatted)}</span>`);

        const historyExclusionBadges = [];
        if (lastYearTarget && !pastHistoryTargets.some(h => h.receiverName === lastYearTarget.name)) {
          historyExclusionBadges.push(`≠ ${lastYearTarget.name.split(" ")[0]}`);
        }
        pastHistoryTargets.forEach(h => {
          const shortR = (h.receiverName || "").split(" ")[0];
          const label = h.year ? `≠ ${shortR} (${h.year})` : `≠ ${shortR}`;
          if (!historyExclusionBadges.includes(label)) historyExclusionBadges.push(label);
        });

        return `
          <div class="card" style="padding:10px 12px; ${partnerInGroup && group.excludeCouples ? 'border-left: 3px solid var(--partner-rose);' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              ${renderPersonAvatarHtml(part.name)}
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span style="font-size:14px; font-weight:600; color:var(--text-primary);">${escapeHtml(part.name)}</span>
                  ${part.name === group.adminName ? `<span class="badge-app">👑 Admin</span>` : ""}
                  ${partnerInGroup && group.excludeCouples ? `<span style="font-size:10.5px; padding:1px 6px; border-radius:4px; background:rgba(244,63,94,0.16); color:var(--partner-rose); font-weight:700;">💑 Paar mit ${escapeHtml(partnerInGroup.name.split(" ")[0])} (gesperrt füreinander)</span>` : ""}
                  ${part.notifiedVia ? `<span style="font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(16,185,129,0.16); color:var(--tree-green); font-weight:600;">✓ ${escapeHtml(part.notifiedVia)}</span>` : ""}
                </div>
                <div style="font-size:11.5px; margin-top:3px;">
                  ${secretLine}
                </div>
                ${group.excludeLastYear !== false && historyExclusionBadges.length > 0 ? `
                  <div style="font-size:10.5px; color:var(--accent-steel); margin-top:2px;">
                    📜 <b>Keine Wiederholung (Historie):</b> ${escapeHtml(historyExclusionBadges.join(", "))}
                  </div>
                ` : ""}
                ${part.wishText ? `
                  <div style="font-size:11.5px; color:var(--text-secondary); margin-top:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                    <span>🎁 <b>Wunsch:</b> ${escapeHtml(part.wishText)}</span>
                    <a href="https://www.amazon.de/s?k=${encodeURIComponent(part.wishText)}" target="_blank" rel="noopener" style="font-size:10.5px; color:var(--accent-steel); text-decoration:none; background:rgba(56,189,248,0.12); padding:1px 6px; border-radius:4px; font-weight:600;">🔎 Amazon-Suche ↗</a>
                  </div>
                ` : ""}
                ${part.noGos ? `<div style="font-size:11px; color:var(--warn-amber); margin-top:3px;">🚫 <b>Bitte NICHT / Hinweis:</b> ${escapeHtml(part.noGos)}</div>` : ""}
                ${part.address ? `<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">📦 <b>Adresse:</b> ${escapeHtml(part.address)}</div>` : ""}
                ${allUrls.length > 0 ? `
                  <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
                    ${allUrls.map((u, idx) => `
                      <a href="${escapeHtml(u)}" target="_blank" rel="noopener" style="font-size:11px; color:var(--accent-steel); text-decoration:none; font-weight:600;">
                        🛒 ${idx === 0 ? 'Amazon-Wunschliste' : `Wunsch-Link ${idx + 1}`} ↗
                      </a>
                    `).join(" • ")}
                  </div>
                ` : ""}
              </div>
              <div style="display:flex; gap:4px; align-items:center;">

    function renderWidget() {
      const container = document.getElementById("widget-rows");
      const today = todayIso();
      const items = [];
      for (const p of state.persons.filter(x => !x.isHidden)) {
        const bdayDays = ContactResolver.daysUntilNextBirthday(p.birthdayIso, today);
        if (bdayDays !== null && bdayDays <= 60) {
          items.push({ sortKey: bdayDays, personId: p.id, name: p.name, subtitle: `Geburtstag (${ContactResolver.formatUpcomingAge(p.birthdayIso, today)})`, badge: bdayDays === 0 ? "Heute" : `in ${bdayDays}T` });
        }
      }
      for (const ev of state.specialEvents) {
        const diff = daysUntilEventSpec(ev.dateIso, today);
        if (diff >= 0 && diff <= 45) {
          const person = state.persons.find(p => p.id === ev.personId && !p.isHidden);
          const isWeekly = isWeeklyDateSpec(ev.dateIso) || isRepeatDateSpec(ev.dateIso);
          if (person) items.push({ sortKey: diff, personId: person.id, name: person.name, subtitle: isWeekly ? `${formatIsoToDdMmYyyy(ev.dateIso)}: ${ev.title}` : `Erinnerung: ${ev.title}`, badge: diff === 0 ? "Heute" : `in ${diff}T` });
        }
      }
      items.sort((a, b) => a.sortKey - b.sortKey);
      container.innerHTML = items.slice(0, 5).map(item => `
        <div class="widget-row" onclick="openPopupForPerson(${item.personId}, '${escapeHtml(item.subtitle)}')">
          <div>
            <div class="widget-row-name">${escapeHtml(item.name)}</div>
            <div class="widget-row-sub">${escapeHtml(item.subtitle)}</div>
          </div>
          <div class="widget-row-badge">${escapeHtml(item.badge)}</div>
        </div>
      `).join("");
    }

              visitedIds.add(p.id);

              visitedIds.add(p.id);
              orderedContacts.push({ type: "single", person: p });

                    <input type="checkbox" ${c2 ? 'checked' : ''} onchange="toggleWichtelChecklistPerson(${p2.id}, this.checked)" />

                    <span style="font-size:10px; color:var(--partner-rose);">💑 Paar mit ${escapeHtml(p1.name.split(' ')[0])}</span>

    function handleContactPhotoFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 256;
          let w = img.width || maxDim;
          let h = img.height || maxDim;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
          if (photoPickerTargetMode === "create") {
            createDraft.photoBase64 = dataUrl;
          } else {
            detailDraftPhotoBase64 = dataUrl;
            const dp = state.persons.find(p => p.id === detailPersonId);
            if (dp) dp.photoRemovedByUser = false;
          }
          addLog(`📷 Kontaktfoto ("${file.name}") geladen & auf ${w}×${h}px optimiert.`);
          renderModals();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function arePersonsCoupleInTree(personIdA, personIdB) {
      if (!personIdA || !personIdB) return false;
      const partnerA = getCouplePartnerForPerson(personIdA);
      return !!(partnerA && partnerA.id === personIdB);
    }

    let wichtelSecretCodeModalState = null;

    function solveWichtelMatchingBacktrack(parts, isAllowedEdge) {
      const n = parts.length;
      const givers = [...parts].sort(() => Math.random() - 0.5);
      const usedReceiverIds = new Set();
      const assignment = new Map();

      function backtrack(idx) {
        if (idx === n) return true;
        const giver = givers[idx];
        const candidates = [...parts].sort(() => Math.random() - 0.5);
        for (const receiver of candidates) {
          if (giver.id === receiver.id) continue;
          if (usedReceiverIds.has(receiver.id)) continue;
          if (!isAllowedEdge(giver, receiver)) continue;
          usedReceiverIds.add(receiver.id);
          assignment.set(giver.id, receiver.id);
          if (backtrack(idx + 1)) return true;
          usedReceiverIds.delete(receiver.id);
          assignment.delete(giver.id);
        }
        return false;
      }

      return backtrack(0) ? assignment : null;
    }

    function rollWichtelGroup(groupId) {
      const g = (state.wichtelGroups || []).find(x => x.id === groupId);
      if (!g) return;
      const parts = g.participants;
      if (parts.length < 2) {
        addLog("Mindestens 2 Teilnehmer werden zum Wichtel-Würfeln benötigt!");
        return;
      }

      // Speichere vorherige Zulosung als Vorjahres-/Letzt-Historie, falls schon ausgelost war
      parts.forEach(p => {
        if (p.drawnTargetId) {
          p.lastYearTargetId = p.drawnTargetId;
        }
      });

      // Mathematisch garantierter Backtracking-Solver (Stufe 1: Paar-Sperre + komplette Historie, Stufe 2: Paar-Sperre, Stufe 3: Reines Derangement)
      let bestAssignment = solveWichtelMatchingBacktrack(parts, (giver, receiver) => {
        if (g.excludeCouples && parts.length > 2 && arePersonsCoupleInTree(giver.personId, receiver.personId)) return false;
        if (g.excludeLastYear !== false && parts.length > 2) {
          if (giver.lastYearTargetId && giver.lastYearTargetId === receiver.id) return false;
          if (hasDrawnTargetInHistory(giver, receiver)) return false;
        }
        return true;
      });

      if (!bestAssignment && g.excludeCouples && parts.length > 2) {
        bestAssignment = solveWichtelMatchingBacktrack(parts, (giver, receiver) => {
          return !arePersonsCoupleInTree(giver.personId, receiver.personId);
        });
      }

      if (!bestAssignment) {
        bestAssignment = solveWichtelMatchingBacktrack(parts, () => true);
      }

      parts.forEach(p => {
        p.drawnTargetId = bestAssignment ? (bestAssignment.get(p.id) || null) : null;
        p.notifiedVia = "";
      });
      g.isDrawn = true;
      g.forceRevealed = false;
      g.drawnAt = new Date().toLocaleTimeString("de-DE");
      addLog(`🎲 Wichtelrunde "${g.groupName}" (${g.motto || 'Klassisch'}) per Backtracking-Solver geheim ausgelost! Paare & Historie garantiert berücksichtigt.`);
      saveState();
    }

    function encodeWichtelBlindCode(group, giver, target) {
      const payload = {
        groupName: group.groupName,
        motto: group.motto || "🎁 Klassisches Wichteln",
        budget: group.budget || "",
        revealDate: formatIsoToDdMmYyyy(group.revealDateIso) || "24.12.",
        giverName: giver.name,
        targetName: target.name,
        wishText: target.wishText || "",
        noGos: target.noGos || "",
        address: target.address || "",
        wishlistUrl: target.wishlistUrl || ""
      };
      const json = JSON.stringify(payload);
      const b64 = btoa(unescape(encodeURIComponent(json)));
      return `WICHTEL_SECRET:${b64}`;
    }

    function decodeWichtelBlindCode(rawText) {
      const str = String(rawText || "").trim();
      const idx = str.indexOf("WICHTEL_SECRET:");
      const b64Part = (idx >= 0 ? str.slice(idx + "WICHTEL_SECRET:".length) : str).trim().split(/\s+/)[0];
      const json = decodeURIComponent(escape(atob(b64Part)));
      return JSON.parse(json);
    }

      wichtelSecretCodeModalState.raw = raw;
      try {

        addLog(`🔓 Geheimer Wichtel-Los-Code für "${wichtelSecretCodeModalState.decoded.giverName}" entschlüsselt.`);
      } catch (e) {
        addLog("⚠️ Ungültiger WICHTEL_SECRET-Code. Bitte den vollständigen Code einfügen.");

      msg += `🎭 Motto: ${group.motto || "🎁 Klassisches Wichteln"}\n`;
      msg += `🎁 Du beschenkst: *${target.name}*!\n`;
      if (group.budget) msg += `💶 Budget: ${group.budget}\n`;
      if (target.wishText) msg += `📝 Wunschzettel: ${target.wishText}\n`;
      if (target.noGos) msg += `🚫 Bitte NICHT / Hinweis: ${target.noGos}\n`;
      if (target.address) msg += `📦 Post-Adresse: ${target.address}\n`;
      allUrls.forEach((u, idx) => {

    function saveWichtelGroupToHistory(g, notifyAll = false) {
      if (!g || !g.isDrawn) return null;
      if (!Array.isArray(state.wichtelHistory)) state.wichtelHistory = [];
      const yearNum = parseInt((g.revealDateIso || todayIso()).slice(0, 4), 10) || new Date().getFullYear();
      const pairings = g.participants.map(p => {
        const target = g.participants.find(x => x.id === p.drawnTargetId);
        return {
          giverName: p.name,
          giverPersonId: p.personId || null,
          giverPhone: p.phone || "",
          receiverName: target ? target.name : "?",
          receiverPersonId: target ? (target.personId || null) : null,
          wishText: p.wishText || "",
          noGos: p.noGos || "",
          address: p.address || "",
          wishlistUrl: p.wishlistUrl || ""
        };
      });
      let existing = state.wichtelHistory.find(h => h.groupName === g.groupName && h.year === yearNum);
      if (existing) {
        existing.adminName = g.adminName;
        existing.motto = g.motto;
        existing.budget = g.budget;
        existing.completedDateIso = g.revealDateIso || todayIso();
        existing.pairings = pairings;
      } else {
        existing = {
          id: state.nextId++,
          year: yearNum,
          groupName: g.groupName,
          adminName: g.adminName,
          motto: g.motto || "🎁 Klassisches Wichteln",
          budget: g.budget || "",
          completedDateIso: g.revealDateIso || todayIso(),
          pairings
        };
        state.wichtelHistory.unshift(existing);
      }
      if (notifyAll) {
        shareWichtelHistoryToParticipants(existing.id, "In-App");
      }
      return existing;
    }

          personId: contact ? contact.id : (pair.giverPersonId || null),

          phone: contact ? (contact.phone || pair.giverPhone || "") : (pair.giverPhone || ""),

          ? raw.substring(raw.indexOf("WICHTEL_HISTORY_JSON:") + "WICHTEL_HISTORY_JSON:".length).trim()

          year: parsed.year || new Date().getFullYear(),
          groupName: parsed.groupName || "Importierte Wichtelrunde",
          adminName: parsed.adminName || "Admin",
          motto: parsed.motto || "🎁 Klassisches Wichteln",
          budget: parsed.budget || "25 €",
          completedDateIso: parsed.completedDateIso || todayIso(),
          pairings: parsed.pairings
        });
        wichtelHistoryImportModalOpen = false;
        addLog(`📥 Wichtel-Historie "${parsed.groupName}" erfolgreich importiert! Du kannst sie jetzt einsehen, löschen oder als Admin wiederverwenden.`);
        saveState();
      } catch (e) {
        addLog("⚠️ Konnte Wichtel-Historie nicht lesen. Bitte den vollständigen WICHTEL_HISTORY_JSON-Text einfügen.");
      }
    }

    function setThemeMode(mode) {
      if (mode === "light") mode = "warm";
      if (mode === "dark") mode = "cozy-dark";
      const valid = ["warm", "cozy-dark", "xmas", "classic"];
      state.themeMode = valid.includes(mode) ? mode : "warm";
      saveState();
    }

    function toggleDetailRelations() {
      syncDetailDraftBeforeRerender();
      detailRelationsExpanded = !detailRelationsExpanded;
      renderModals();
    }

    function askDeleteConfirm(message, onConfirm) {
      syncDetailDraftBeforeRerender();
      pendingDeleteConfirm = { message, onConfirm };
      renderModals();
    }

    function executeDeleteConfirm() {
      if (pendingDeleteConfirm && typeof pendingDeleteConfirm.onConfirm === "function") {
        const fn = pendingDeleteConfirm.onConfirm;
        pendingDeleteConfirm = null;
        fn();
      } else {
        pendingDeleteConfirm = null;
        renderModals();
      }
    }

    function cancelDeleteConfirm() {
      pendingDeleteConfirm = null;
      renderModals();
    }

    function openCreateModal() {
      showCreateDialog = true;
      createRelationsExpanded = false;
      createExtraInfos = [];
      createDraft = {
        name: "",
        bday: formatIsoToDdMmYyyy(todayIso()),
        noPhone: false,
        saveInDevice: true,
        phone: "",
        email: "",
        timer: "14",
        notes: "",
        photoBase64: ""
      };
      renderModals();
    }

    function openDetailModal(id) {
      detailPersonId = id;
      detailRelationsExpanded = false;
      const dp = state.persons.find(p => p.id === id);
      detailDraftPhotoBase64 = dp ? (dp.photoBase64 || "") : "";
      detailExtraInfos = dp && Array.isArray(dp.extraInfos)
        ? dp.extraInfos.map(x => ({ label: x.label || "", value: x.value || "" }))
        : [];
      renderModals();
    }

    function addCreateExtraInfoRow() {
      const nextLabel = createExtraInfos.length === 0 ? "2. Telefon" : "Weitere Info";
      createExtraInfos.push({ label: nextLabel, value: "" });
      renderModals();
    }

    function removeCreateExtraInfoRow(idx) {
      askDeleteConfirm("Zusätzliche Info-Zeile wirklich löschen?", () => {
        createExtraInfos.splice(idx, 1);
        renderModals();
      });
    }

    function syncDetailDraftBeforeRerender() {
      if (detailPersonId === null) return;
      const dp = state.persons.find(p => p.id === detailPersonId);
      if (!dp) return;
      const nEl = document.getElementById("d-name");
      const bEl = document.getElementById("d-bday");
      const pEl = document.getElementById("d-phone");
      const eEl = document.getElementById("d-email");
      const noEl = document.getElementById("d-notes");
      if (nEl) dp.name = nEl.value;
      if (bEl) dp.birthdayIso = normalizeDateInputToIso(bEl.value);
      if (pEl) dp.phone = pEl.value;
      if (eEl) dp.email = eEl.value;
      if (noEl) dp.notes = noEl.value;
    }

    function addDetailExtraInfoRow() {
      syncDetailDraftBeforeRerender();
      const nextLabel = detailExtraInfos.length === 0 ? "2. Telefon" : "Weitere Info";
      detailExtraInfos.push({ label: nextLabel, value: "" });
      renderModals();
    }

    function removeDetailExtraInfoRow(idx) {
      askDeleteConfirm("Zusätzliche Info-Zeile wirklich löschen?", () => {
        detailExtraInfos.splice(idx, 1);
        renderModals();
      });
    }

    function toggleExtraMessenger(name) {
      if (!state.enabledMessengers) state.enabledMessengers = [];
      const idx = state.enabledMessengers.indexOf(name);
      if (idx >= 0) {
        state.enabledMessengers.splice(idx, 1);
      } else {
        state.enabledMessengers.push(name);
      }
      saveState();
    }

    function closeModals(e) {
      if (e.target.classList.contains("modal-backdrop")) {
        if (pendingDeleteConfirm) {
          pendingDeleteConfirm = null;
          renderModals();
          return;
        }
        showOptionsDialog = false;
        showCreateDialog = false;
        detailPersonId = null;
        popupState = null;
        wichtelGroupModalState = null;
        wichtelParticipantModalState = null;
        wichtelSecretPeekState = null;
        wichtelAnonQuestionState = null;
        wichtelSecretCodeModalState = null;
        renderModals();
      }
    }

    function addRelationFromDetail(fromId) {
      const label = document.getElementById("d-rellabel").value;
      const targetId = parseInt(document.getElementById("d-reltarget").value, 10);
      addBidirectionalRelation(fromId, targetId, label);
      addLog(`Beziehung "${label}" gespeichert.`);
      saveState();
    }

    function removeRelation(relId) {
      askDeleteConfirm("Beziehung wirklich löschen?", () => {
        state.relations = state.relations.filter(r => r.id !== relId);
        saveState();
      });
    }

    function removeEvent(evId) {
      askDeleteConfirm("Erinnerung wirklich löschen?", () => {
        state.specialEvents = state.specialEvents.filter(e => e.id !== evId);
        saveState();
      });
    }

    function saveNewPerson() {
      const name = document.getElementById("c-name").value.trim();
      if (!name) return;
      const bday = normalizeDateInputToIso(document.getElementById("c-bday").value.trim());
      const noPhone = document.getElementById("c-nophone").checked;
      const savePhoneEl = document.getElementById("c-savephone");
      const saveInDevice = savePhoneEl ? savePhoneEl.checked : true;
      const phone = document.getElementById("c-phone").value.trim();
      const email = document.getElementById("c-email").value.trim();
      const timerInterval = parseInt(document.getElementById("c-timer").value, 10) || 14;
      const notes = document.getElementById("c-notes").value.trim();

      const newId = state.nextId++;
      state.persons.push({
        id: newId,
        name,
        birthdayIso: bday,
        hasNoOwnPhone: noPhone,
        savedInDeviceContacts: saveInDevice,
        phone,
        email,
        appPeerId: "",
        notes,
        photoBase64: createDraft.photoBase64 || "",
        extraInfos: createExtraInfos.filter(x => (x.label && x.label.trim()) || (x.value && x.value.trim())),
        timerEnabled: true,
        timerInterval,
        timerUnit: "DAYS",
        lastContactedIso: todayIso()
      });

      const relTargetEl = document.getElementById("c-reltarget");
      const relLabelEl = document.getElementById("c-rellabel");
      if (relTargetEl && relLabelEl) {
        const targetId = parseInt(relTargetEl.value, 10);
        const relLabel = relLabelEl.value.trim();
        if (targetId > 0 && relLabel) {
          addBidirectionalRelation(newId, targetId, relLabel);
        }
      }

      selectedTreeRootId = newId;
      showCreateDialog = false;
      addLog(saveInDevice ? `Kontakt "${name}" in App & Handykontakten angelegt.` : `Kontakt "${name}" angelegt.`);
      saveState();
    }

    function updateDetailReminderPreview() {
      const countEl = document.getElementById("d-evcount");
      const unitEl = document.getElementById("d-evunit");
      const repEl = document.getElementById("d-evrepeat-chk");
      const previewEl = document.getElementById("d-evnext-preview");
      if (!countEl || !unitEl || !previewEl) return;
      const count = Math.max(1, parseInt(countEl.value, 10) || 1);
      const unit = unitEl.value || "DAYS";
      const isRep = repEl ? repEl.checked : false;
      const nextIso = addIntervalToIsoDate(todayIso(), count, unit);
      const nextFormatted = formatIsoToDdMmYyyy(nextIso);
      previewEl.innerHTML = isRep
        ? `📅 Nächster Termin: <b>${nextFormatted}</b> <span style="color:var(--tree-green);">(🔁 Alle ${formatRhythmTextDe(count, unit)})</span>`
        : `📅 Nächster Termin: <b>${nextFormatted}</b> <span style="color:var(--text-muted);">(Einmalig)</span>`;
    }

    function saveDetailPerson(id) {
      const dp = state.persons.find(p => p.id === id);
      if (!dp) return;
      dp.name = document.getElementById("d-name").value.trim() || dp.name;
      dp.birthdayIso = normalizeDateInputToIso(document.getElementById("d-bday").value.trim());
      dp.phone = document.getElementById("d-phone").value.trim();
      dp.email = document.getElementById("d-email").value.trim();
      dp.notes = document.getElementById("d-notes").value.trim();
      dp.photoBase64 = detailDraftPhotoBase64 || "";
      const savePhoneEl = document.getElementById("d-savephone");
      dp.savedInDeviceContacts = savePhoneEl ? savePhoneEl.checked : true;
      const hiddenEl = document.getElementById("d-hidden");
      if (hiddenEl) dp.isHidden = hiddenEl.checked;
      dp.extraInfos = detailExtraInfos.filter(x => (x.label && x.label.trim()) || (x.value && x.value.trim()));

      const evTitle = document.getElementById("d-evtitle").value.trim();
      const evCountEl = document.getElementById("d-evcount");
      const evUnitEl = document.getElementById("d-evunit");
      const evRepeatChk = document.getElementById("d-evrepeat-chk");
      const evCount = Math.max(1, parseInt(evCountEl ? evCountEl.value : "1", 10) || 1);
      const evUnit = evUnitEl ? evUnitEl.value : "DAYS";
      const isRepeating = evRepeatChk ? evRepeatChk.checked : false;
      const nextDateIso = addIntervalToIsoDate(todayIso(), evCount, evUnit);
      const evDateSpec = isRepeating ? `REPEAT:${evCount}:${evUnit}:${nextDateIso}` : nextDateIso;
      if (evTitle) {
        state.specialEvents.push({
          id: state.nextId++,
          personId: dp.id,
          title: evTitle,
          dateIso: evDateSpec,
          leadDays: 1,
          note: ""
        });
        addLog(`Erinnerung "${evTitle}" (${formatIsoToDdMmYyyy(evDateSpec)}) für ${dp.name} eingetragen.`);
      } else {
        addLog(dp.savedInDeviceContacts ? `Kontakt "${dp.name}" in App & Handykontakten aktualisiert.` : `Details von ${dp.name} aktualisiert.`);
      }
      detailPersonId = null;
      saveState();
    }

    function deletePerson(id) {
      const dp = state.persons.find(p => p.id === id);
      const name = dp ? dp.name : "Kontakt";
      askDeleteConfirm(`Kontakt „${name}" wirklich unwiderruflich löschen?`, () => {
        state.persons = state.persons.filter(p => p.id !== id);
        state.relations = state.relations.filter(r => r.fromPersonId !== id && r.toPersonId !== id);
        state.specialEvents = state.specialEvents.filter(e => e.personId !== id);
        state.directMessages = state.directMessages.filter(m => m.personId !== id);
        detailPersonId = null;
        if (dp) addLog(`Kontakt "${dp.name}" gelöscht.`);
        saveState();
      });
    }

    let calendarPickerState = null;
    const MONTH_NAMES_DE = [
      "Januar", "Februar", "März", "April", "Mai", "Juni",
      "Juli", "August", "September", "Oktober", "November", "Dezember"
    ];

    function openCalendarPicker(inputId) {
      const el = document.getElementById(inputId);
      const rawVal = el ? el.value : "";
      const iso = normalizeDateInputToIso(rawVal) || todayIso();
      const parts = iso.replace(/^--/, "2000-").split("-").map(Number);
      const tParts = todayIso().split("-").map(Number);
      const year = (parts.length === 3 && parts[0] >= 1900 && parts[0] <= 2100) ? parts[0] : tParts[0];
      const month = (parts.length === 3 && parts[1] >= 1 && parts[1] <= 12) ? (parts[1] - 1) : (tParts[1] - 1);
      const day = (parts.length === 3 && parts[2] >= 1 && parts[2] <= 31) ? parts[2] : tParts[2];
      calendarPickerState = { inputId, year, month, selectedDay: day };
      renderCalendarPopup();
    }

    function closeCalendarPicker() {
      calendarPickerState = null;
      const calRoot = document.getElementById("calendar-root");
      if (calRoot) calRoot.innerHTML = "";
    }

    function changeCalendarMonth(delta) {
      if (!calendarPickerState) return;
      let m = calendarPickerState.month + delta;
      let y = calendarPickerState.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      calendarPickerState.month = m;
      calendarPickerState.year = y;
      renderCalendarPopup();
    }

    function setCalendarYear(yearStr) {
      if (!calendarPickerState) return;
      calendarPickerState.year = parseInt(yearStr, 10) || calendarPickerState.year;
      renderCalendarPopup();
    }

    function setCalendarMonth(monthStr) {
      if (!calendarPickerState) return;
      calendarPickerState.month = parseInt(monthStr, 10) || 0;
      renderCalendarPopup();
    }

    function selectCalendarDay(day) {
      if (!calendarPickerState) return;
      const pad = n => String(n).padStart(2, "0");
      const formatted = `${pad(day)}.${pad(calendarPickerState.month + 1)}.${calendarPickerState.year}`;
      const el = document.getElementById(calendarPickerState.inputId);
      if (el) {
        el.value = formatted;
        if (calendarPickerState.inputId === "c-bday") {
          createDraft.bday = formatted;
        }
        if (calendarPickerState.inputId === "wg-reveal" && wichtelGroupModalState) {
          wichtelGroupModalState.revealDate = formatted;
        }
      }
      closeCalendarPicker();
    }

    function selectCalendarToday() {
      const tParts = todayIso().split("-").map(Number);
      if (!calendarPickerState) return;
      calendarPickerState.year = tParts[0];
      calendarPickerState.month = tParts[1] - 1;
      selectCalendarDay(tParts[2]);
    }

    function renderCalendarPopup() {
      const calRoot = document.getElementById("calendar-root");
      if (!calRoot) return;
      if (!calendarPickerState) {
        calRoot.innerHTML = "";
        return;
      }
      const { year, month, selectedDay } = calendarPickerState;
      const firstDayJs = new Date(year, month, 1).getDay(); // 0=Sun..6=Sat
      const startOffset = (firstDayJs + 6) % 7; // Monday=0..Sunday=6
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const yearOptions = [];
      for (let y = 2035; y >= 1920; y--) {
        yearOptions.push(`<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`);
      }
      const monthOptions = MONTH_NAMES_DE.map((name, idx) =>
        `<option value="${idx}" ${idx === month ? "selected" : ""}>${name}</option>`
      ).join("");

      const cells = [];
      for (let i = 0; i < startOffset; i++) {
        cells.push(`<div></div>`);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const isSel = d === selectedDay;
        cells.push(`
          <button class="compact-btn ${isSel ? 'primary' : ''}" style="padding:6px 0; font-size:12px; font-weight:${isSel ? '700' : '500'}; text-align:center;" onclick="selectCalendarDay(${d})">
            ${d}
          </button>
        `);
      }

      calRoot.innerHTML = `
        <div class="modal-backdrop" style="z-index:200;" onclick="if(event.target===this) closeCalendarPicker()">
          <div class="modal" style="max-width:310px;" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:4px;">
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(-1)">◀</button>
              <select class="field-select" style="flex:1.1;" onchange="setCalendarMonth(this.value)">${monthOptions}</select>
              <select class="field-select" style="flex:0.9;" onchange="setCalendarYear(this.value)">${yearOptions.join("")}</select>
              <button class="compact-btn" style="padding:4px 8px;" onclick="changeCalendarMonth(1)">▶</button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; font-size:11px; color:var(--text-muted); font-weight:600; margin-top:4px;">
              <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;">
              ${cells.join("")}
            </div>
            <div class="modal-footer" style="justify-content:space-between;">
              <button class="compact-btn" onclick="selectCalendarToday()">Heute</button>
              <button class="compact-btn" onclick="closeCalendarPicker()">Schließen</button>
            </div>
          </div>
        </div>
      `;
    }

    async function copyBackupJsonToClipboard() {
      const dateStr = formatIsoToDdMmYyyy(todayIso());
      const backupPayload = {
        app: "Remember Me",
        version: "1.0.18",
        createdAt: dateStr,
        state
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      try {
        await navigator.clipboard.writeText(jsonStr);
        addLog(`📋 Vollständiges JSON-Backup (${state.persons.length} Kontakte, ${(state.wichtelGroups || []).length} Wichtelrunden, ${(state.wichtelHistory || []).length} Historie) in Zwischenablage kopiert.`);
      } catch (e) {
        addLog("⚠️ Zwischenablage nicht verfügbar – nutze den .json Download.");
      }
    }

    async function sendBackupViaEmail() {
      const dateStr = formatIsoToDdMmYyyy(todayIso());
      const fileName = `Remember-Me-Sicherung-${dateStr}.json`;
      const backupPayload = {
        app: "Remember Me",
        version: "1.0.18",
        createdAt: dateStr,
        state
      };
      const jsonStr = JSON.stringify(backupPayload, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });

      // Sicherungsdatei herunterladen
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);

      // Falls Web Share API mit Dateien verfügbar ist (Mobilbrowser)
      try {
        const file = new File([blob], fileName, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: `Remember Me Sicherung (${dateStr})`,
            text: `Sicherungsdatei (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen)`,
            files: [file]
          });
          addLog(`Sicherungsdatei "${fileName}" geteilt.`);
          return;
        }
      } catch (e) {}

      // Mail-Programm öffnen
      const recipient = (state.backupEmail || "").trim();
      const subject = `Remember Me – Sicherung vom ${dateStr}`;
      const body = `Hallo,\n\nanbei die Remember Me Sicherung vom ${dateStr} (${state.persons.length} Kontakte, ${state.relations.length} Beziehungen).\nDie Datei "${fileName}" wurde heruntergeladen und kann dieser E-Mail angehängt werden.\n\n--- Sicherungsdaten (JSON) ---\n${jsonStr}`;
      window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      addLog(`Sicherungsdatei "${fileName}" erstellt und Mail-Versand geöffnet.`);
      saveState();
    }

    function importBackupFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedState = parsed.state || parsed;
          if (importedState && Array.isArray(importedState.persons)) {
            state = importedState;
            selectedTreeRootId = state.persons[0] ? state.persons[0].id : null;
            showOptionsDialog = false;
            addLog(`Sicherung aus "${file.name}" erfolgreich wiederhergestellt (${state.persons.length} Kontakte).`);
            saveState();
          }
        } catch (err) {
          addLog("Fehler beim Laden der Sicherungsdatei.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (state.persons.length === 0) {
      seedSampleData();
    } else {
      selectedTreeRootId = state.persons[0].id;
      addLog("Remember Me v1.0.18 gestartet.");
      renderAll();
    }
  </script>
